    const n = (cles(t, k) || []).length;
    const ouvert = ANIM_OUVERTS.has(k);
    return '<div><label>' + etiq + (extra || '') +
      '<button class="fleche ' + (ouvert ? 'on' : '') + '" data-anim="' + k +
      '" title="keyframes">' + (ouvert ? '▾' : '▸') + '</button>' +
      (n ? '<i class="nbcle">◆' + n + '</i>' : '') + '</label>' +
      '<div class="rang"><input type="range" id="' + id + '" min="' + A.min +
      '" max="' + A.max + '" step="' + A.pas + '" value="' + v + '">' +
      '<span class="val">' + fmtVal(k, v) + '</span>' +
      boutonsCV(k) + '</div>' +
      (ouvert ? panneauAnim(k, t) : '') + '</div>';
  };

  const rangeeVolume = () => {
    if (cibleSon.length) {
      const ou = [...new Set(cibleSon.map(x => x.piste))].join(' ');
      return rangee('gain', 'Block volume', 'rGain',
        estV ? ' <span style="color:var(--or)">' + ou + '</span>' : '');
    }
    return '<div><label>Block volume</label>' +
      '<div class="mono" style="font-size:11px;color:var(--sourd)">' +
      (estV ? 'no audio linked to this block' : 'track without audio') +
      '</div></div>';
  };
  const rangeeVitesse = () => {
    const sv = vSignee(c);
    return '<div><label>Speed</label><div class="rang">' +
      '<input type="range" id="rVit" min="-4" max="4" step="0.05" value="' +
      sv.toFixed(2) + '"><span class="val">×' + sv.toFixed(2) + '</span>' +
      boutonsCV('vitesse') + '</div>' +
      '<label style="display:flex;align-items:center;gap:6px;margin-top:5px;' +
      'font-size:11px;color:var(--sourd);cursor:pointer;user-select:none">' +
      '<input type="checkbox" id="cRev"' + (c.rev ? ' checked' : '') + '>' +
      'Reverse — plays backwards</label></div>';
  };

  if (estV) {
    const ONG = [['tr', 'Transform'], ['fx', 'Effects'], ['sh', 'Anim']];
    if (!ONG.some(o => o[0] === REG_ONGLET)) REG_ONGLET = 'tr';
    h += '<div class="ongletsReg">' + ONG.map(o =>
      '<button data-onglet="' + o[0] + '" class="' +
      (REG_ONGLET === o[0] ? 'on' : '') + '">' + o[1] + '</button>').join('') +
      '</div>';
    if (REG_ONGLET === 'tr')
      h += rangee('ech', 'Scale', 'rEch') +
           rangee('dx', 'Position X', 'rDx') +
           rangee('dy', 'Position Y', 'rDy');
    else if (REG_ONGLET === 'fx')
      h += rangee('opac', 'Opacity', 'rOpac') + rangeeVitesse() + rangeeVolume();
    else
      h += rangeeSecousse(c);
  } else {
    // Un bloc son n a que deux reglages : des onglets pour si peu seraient
    // un clic de plus pour rien.
    h += rangeeVolume() + rangeeVitesse();
  }
  // Couleur, cadrage, liaison, remise a zero et suppression sont au clic droit
  // sur le bloc : ce sont des actions, pas des reglages qu on ajuste a l oeil.
  h += '<div><label>Source · fades</label>' +
    '<div class="mono" style="font-size:11px;color:var(--sourd)">' +
    c.e.toFixed(2) + 's → ' + c.o.toFixed(2) + 's<br>duration ' + dur(c).toFixed(2) + 's' +
    '<br>fades ' + fonduIn(c).toFixed(2) + 's / ' + fonduOut(c).toFixed(2) + 's' +
    ((c._xIn > 0.02 || c._xOut > 0.02) ? ' (crossfade on the overlap)'
     : (fonduIn(c) > 0.02 || fonduOut(c) > 0.02) ? '' : ' (none)') +
    '</div></div>';
  r.innerHTML = h;

  r.querySelectorAll('[data-onglet]').forEach(b => b.onclick = () => {
    REG_ONGLET = b.dataset.onglet;
    rendreReglages();
  });

  const lier = (sl, cle, pct, prefixe, liste) => {
    const el = r.querySelector(sl);
    if (!el) return;
    const quoi = liste || sel;
    el.oninput = () => {
      const v = parseFloat(el.value);
      quoi.forEach(x => {
        // Paramètre animé et tête de lecture sur le bloc : on déplace la clé
        // de cet instant au lieu d écraser la valeur fixe.
        if (ANIMABLES[cle] && anime(x, cle) &&
            tLect >= x.t0 - 0.001 && tLect <= fin(x) + 0.001)
          poserCle(x, cle, tLect, v);
        else x[cle] = v;
      });
      el.nextElementSibling.textContent = pct ? Math.round(v * 100) + '%'
        : (prefixe || '') + (prefixe ? v.toFixed(2) : v);
      if (cle === 'vitesse') { recalculerFondus(); rendreLanes(); majMinimap(); }
      modifie = true;
      if (cle === 'gain' || cle === 'vitesse') resynchroniser(true); else dessiner();
    };
    el.onchange = () => {
      if (cle === 'vitesse') rendreTimeline();
      else if (ANIM_OUVERTS.has(cle)) rendreReglages();
    };
  };
  // ---- secousse : une pile de couches ------------------------------------
  // Chaque modification recopie la liste avant de l ecrire : deux blocs
  // pourraient sinon partager le meme tableau apres un copier-coller.
  const surVideo = x => piste(x.piste) && piste(x.piste).type === 'v';
  const majCouches = (x, f) => {
    const l = couchesShk(x).map(p => Object.assign({}, p));
    f(l);
    couchesEcrire(x, l);
  };
  const cocheShk = r.querySelector('#rShk');
  if (cocheShk) cocheShk.onchange = () => {
    memoriser();
    sel.forEach(x => {
      if (!surVideo(x)) return;
      x.shk = cocheShk.checked;
      if (cocheShk.checked && !couchesShk(x).length)
        couchesEcrire(x, [coucheNeuve()]);
    });
    modifie = true; rendreReglages(); dessiner();
  };
  const addShk = r.querySelector('[data-shkadd]');
  if (addShk) addShk.onclick = () => {
    memoriser();
    sel.forEach(x => {
      if (!surVideo(x)) return;
      x.shk = true;
      majCouches(x, l => l.push(l.length
        // La deuxieme couche arrive lente et ample : c est le MELANGE qui fait
        // le geste, pas deux fois la meme vibration.
        ? {f: 1.8, a: 3, r: 1.2, i: 0, o: 0}
        : coucheNeuve()));
    });
    SHK_PLI = -1;
    modifie = true; rendreReglages(); dessiner();
    dire('shake layer added');
  };
  const moinsShk = r.querySelector('[data-shkmoins]');
  if (moinsShk) moinsShk.onclick = () => {
    memoriser();
    sel.forEach(x => {
      if (surVideo(x)) majCouches(x, l => { if (l.length > 1) l.pop(); });
    });
    SHK_PLI = -1;
    modifie = true; rendreReglages(); dessiner();
    dire('last shake removed');
  };
  // La coche d une couche : ses valeurs restent, seul l effet s arrete.
  r.querySelectorAll('[data-shkon]').forEach(b => b.onchange = () => {
    const k = +b.dataset.shkon, v = b.checked;
    memoriser();
    sel.forEach(x => {
      if (surVideo(x)) majCouches(x, l => { if (l[k]) l[k].on = v; });
    });
    modifie = true; rendreReglages(); dessiner();
  });
  r.querySelectorAll('[data-shkdel]').forEach(b => b.onclick = () => {
    const k = +b.dataset.shkdel;
    memoriser();
    sel.forEach(x => { if (surVideo(x)) majCouches(x, l => l.splice(k, 1)); });
    SHK_PLI = -1;
    modifie = true; rendreReglages(); dessiner();
  });
  r.querySelectorAll('[data-shkpli]').forEach(b => b.onclick = () => {
    const k = +b.dataset.shkpli;
    SHK_PLI = (SHK_PLI === k) ? -1 : k;
    rendreReglages();
  });
  const curseurCouche = (prefixe, champ, unite, dec) => {
    r.querySelectorAll('[id^="' + prefixe + '"]').forEach(el => {
      const k = parseInt(el.id.slice(prefixe.length), 10);
      if (!(k >= 0)) return;
      el.oninput = () => {
        const v = parseFloat(el.value);
        sel.forEach(x => {
          if (surVideo(x)) majCouches(x, l => { if (l[k]) l[k][champ] = v; });
        });
        el.nextElementSibling.textContent = v.toFixed(dec) + unite;
        modifie = true; dessiner();
      };
    });
  };
  curseurCouche('rShkF', 'f', ' Hz', 1);
  curseurCouche('rShkA', 'a', '%', 1);
  curseurCouche('rShkR', 'r', '\u00b0', 1);
  curseurCouche('rShkIn', 'i', 's', 2);
  curseurCouche('rShkOut', 'o', 's', 2);

  // ---- prereglages, un par couche ---------------------------------------
  // Un prereglage enregistre UNE couche : c est le geste qu on retrouve, pas
  // la pile entiere. Les anciens, qui gardaient plusieurs couches, sont
  // toujours lisibles : ils remplacent alors toute la pile.
  // Le nom d origine reste sur la couche, jamais dans le prereglage.
  const valeursCouche = p => ({f: p.f === undefined ? SHK_F : p.f,
                               a: p.a === undefined ? SHK_A : p.a,
                               r: p.r === undefined ? SHK_R : p.r,
                               i: p.i || 0, o: p.o || 0, on: true});
  r.querySelectorAll('[data-pre-sel]').forEach(el => el.onchange = () => {
    const k = +el.dataset.preSel;
    const p = lireSecoussePresets()[el.value];
    if (!p) return;
    const pile = Array.isArray(p.l) ? p.l : null;
    memoriser();
    if (pile && pile.length > 1) {
      sel.forEach(x => {
        if (!surVideo(x)) return;
        x.shk = true;
        couchesEcrire(x, pile.map(q => Object.assign({on: true}, q,
          {pre: el.value})));
      });
      SHK_PLI = -1;
      modifie = true; rendreReglages(); dessiner();
      dire('preset “' + el.value + '” applied · ' + pile.length + ' shakes');
      return;
    }
    const v = valeursCouche(pile ? pile[0] : p);
    sel.forEach(x => {
      if (!surVideo(x)) return;
      x.shk = true;
      majCouches(x, l => {
        while (l.length <= k) l.push(coucheNeuve());
        l[k] = Object.assign({}, v, {pre: el.value});
      });
    });
    modifie = true; rendreReglages(); dessiner();
    dire('preset “' + el.value + '” applied to shake ' + (k + 1));
  });
  r.querySelectorAll('[data-pre-add]').forEach(b => b.onclick = () => {
    const k = +b.dataset.preAdd;
    const p = couchesShk(c)[k];
    if (!p) { dire('nothing to save here'); return; }
    const nom = (prompt('Name this shake preset:', '') || '').trim().slice(0, 40);
    if (!nom) return;
    const v = valeursCouche(p);
    sel.forEach(x => {
      if (surVideo(x)) majCouches(x, l => { if (l[k]) l[k].pre = nom; });
    });
    enregistrerPreset(nom, v);
  });
  r.querySelectorAll('[data-pre-del]').forEach(b => b.onclick = () => {
    const k = +b.dataset.preDel;
    const s2 = r.querySelector('[data-pre-sel="' + k + '"]');
    if (!s2 || !s2.value) { dire('choose a preset first'); return; }
    const nom = s2.value;
    if (!confirm('Delete the shake preset “' + nom + '” ?')) return;
    oublierPreset(nom);
    dire('preset “' + nom + '” removed');
  });

  lier('#rEch', 'ech', true); lier('#rDx', 'dx'); lier('#rDy', 'dy');
  lier('#rGain', 'gain', true, null, cibleSon);
  lier('#rOpac', 'opac', true);
  // La vitesse est le seul reglage signe. Le curseur va de -4 a 4 et la case
  // « Reverse » n est qu une autre facon d en changer le signe : les deux
  // ecrivent la meme chose. En memoire « vitesse » reste POSITIVE et « rev »
  // porte le sens — c est ce qui permet aux durees, au rognage, a setpts et a
  // atempo de continuer a calculer avec un facteur.
  (() => {
    const sl = r.querySelector('#rVit');
    if (!sl) return;
    const cb = r.querySelector('#cRev');
    const ecrire = (signee, refaire) => {
      const arriere = signee < 0;
      const m = Math.min(4, Math.max(0.25, Math.abs(signee) || 1));
      sel.forEach(x => { x.vitesse = m; x.rev = arriere; });
      const aff = (arriere ? -m : m).toFixed(2);
      sl.value = aff;
      sl.nextElementSibling.textContent = '×' + aff;
      if (cb) cb.checked = arriere;
      modifie = true;
      recalculerFondus(); rendreLanes(); majMinimap(); resynchroniser(true);
      if (refaire) rendreTimeline();
    };
    sl.oninput = () => {
      let v = parseFloat(sl.value);
      // Une zone morte autour de zero : sous le quart de vitesse une image
      // durerait plus de quatre secondes, et a zero le plan serait infini.
      if (!(Math.abs(v) >= 0.25)) v = v < 0 ? -0.25 : 0.25;
      ecrire(v, false);
    };
    sl.onchange = () => rendreTimeline();
    if (cb) cb.onchange = () => ecrire(
      (cb.checked ? -1 : 1) * Math.abs(parseFloat(sl.value) || 1), true);
  })();

  // ---- panneau d animation ---------------------------------------------
  r.querySelectorAll('[data-anim]').forEach(b => b.onclick = () => {
    const k = b.dataset.anim;
    ANIM_OUVERTS.has(k) ? ANIM_OUVERTS.delete(k) : ANIM_OUVERTS.add(k);
    rendreReglages();
  });
  r.querySelectorAll('[data-cle]').forEach(b => b.onclick = () => {
    const k = b.dataset.cle;
    memoriser();
    tousDe(k).forEach(x => {
      if (tLect >= x.t0 - 0.001 && tLect <= fin(x) + 0.001)
        basculerCle(x, k, tLect);
    });
    rendreReglages(); rendreLanes(); dessiner(); resynchroniser(true);
  });
  const allerA = (k, sens) => {
    const t = cibleDe(k), l = cles(t, k);
    if (!l || !l.length) return;
    const x = tLect - t.t0;
    const c2 = sens > 0 ? l.find(p => p.t > x + 0.008)
                        : [...l].reverse().find(p => p.t < x - 0.008);
    if (!c2) { dire(sens > 0 ? 'last key' : 'first key'); return; }
    allerAuTemps(t.t0 + c2.t);
  };
  r.querySelectorAll('[data-cle-prec]').forEach(b =>
    b.onclick = () => allerA(b.dataset.clePrec, -1));
  r.querySelectorAll('[data-cle-suiv]').forEach(b =>
    b.onclick = () => allerA(b.dataset.cleSuiv, 1));
  r.querySelectorAll('[data-aller-cle]').forEach(b => b.onclick = e => {
    if (e.target.dataset.oteCle) return;
    const [k, i] = b.dataset.allerCle.split(':');
    const t = cibleDe(k), l = cles(t, k);
    if (l && l[+i]) allerAuTemps(t.t0 + l[+i].t);
  });
  r.querySelectorAll('[data-ote-cle]').forEach(b => b.onclick = e => {
    e.stopPropagation();
    const [k, i] = b.dataset.oteCle.split(':');
    memoriser();
    oterCle(cibleDe(k), k, +i);
    rendreReglages(); rendreLanes(); dessiner(); resynchroniser(true);
  });
  const valeurDe = (x, k) => ANIMABLES[k]
    ? valAnim(x, k, tLect)
    : (x[k] === undefined ? (k === 'vitesse' ? 1 : 0) : x[k]);
  r.querySelectorAll('[data-copie-val]').forEach(b => b.onclick = () => {
    const k = b.dataset.copieVal, x = cibleDe(k);
    if (!x) return;
    const l = ANIMABLES[k] ? (cles(x, k) || []) : [];
    PRESSE_PARAM[k] = {v: valeurDe(x, k), cles: l.map(p => ({t: p.t, v: p.v}))};
    rendreReglages();
    dire(fmtVal(k, PRESSE_PARAM[k].v) + ' copied' +
      (l.length ? ' with its ' + l.length + ' key(s)' : ''));
  });
  r.querySelectorAll('[data-colle-val]').forEach(b => b.onclick = () => {
    const k = b.dataset.colleVal, p = PRESSE_PARAM[k];
    if (!p) return;
    memoriser();
    let n = 0;
    tousDe(k).forEach(x => {
      if (p.cles.length) {
        x.anim = x.anim || {};
        // Une cle posee au-dela de la duree du bloc revient a sa fin.
        x.anim[k] = p.cles.map(q => ({t: Math.min(q.t, dur(x)), v: q.v}));
      } else {
        if (ANIMABLES[k]) viderAnim(x, k);
        x[k] = p.v;
      }
      n++;
    });
    rendreReglages(); rendreLanes(); dessiner(); resynchroniser(true);
    dire(fmtVal(k, p.v) + ' pasted onto ' + n + ' block(s)');
  });
  r.querySelectorAll('[data-copie-anim]').forEach(b => b.onclick = () => {
    const k = b.dataset.copieAnim, t = cibleDe(k), l = cles(t, k);
    if (!l || !l.length) { dire('nothing to copy on this parameter'); return; }
    presseAnim = {cle: k, liste: l.map(p => ({t: p.t, v: p.v}))};
    rendreReglages();
    dire(l.length + ' key(s) copied — select another block and paste');
  });
  r.querySelectorAll('[data-colle-anim]').forEach(b => b.onclick = () => {
    const k = b.dataset.colleAnim;
    if (!presseAnim || presseAnim.cle !== k) return;
    memoriser();
    let n = 0;
    tousDe(k).forEach(x => {
      x.anim = x.anim || {};
      // Une clé posée au-delà de la durée du bloc est ramenée à sa fin :
      // coller sur un bloc plus court ne doit pas perdre le mouvement.
      x.anim[k] = presseAnim.liste.map(p =>
        ({t: Math.min(p.t, dur(x)), v: p.v}));
      n++;
    });
    rendreReglages(); rendreLanes(); dessiner(); resynchroniser(true);
    dire('animation pasted onto ' + n + ' block(s)');
  });
  r.querySelectorAll('[data-vide-anim]').forEach(b => b.onclick = () => {
    const k = b.dataset.videAnim;
    memoriser();
    tousDe(k).forEach(x => viderAnim(x, k));
    rendreReglages(); rendreLanes(); dessiner(); resynchroniser(true);
    dire('animation cleared');
  });

}

// Remise a zero d un bloc, appelee depuis le menu du clic droit.
function reinitSelection() {
  const sel = CLIPS.filter(x => clipsSel.has(x.uid));
  if (!sel.length) return;
  memoriser();
  const son = [];
  sel.forEach(x => {
    if (x.lien) groupeLie(x).forEach(y => {
      if (piste(y.piste) && piste(y.piste).type === 'a' && son.indexOf(y) < 0) son.push(y);
    });
    x.ech = 1; x.dx = 0; x.dy = 0; x.mode = 'contain';
    x.gain = 1; x.opac = 1; x.vitesse = 1; x.rev = false;
    x.couleur = 0; x.fi = 0; x.fo = 0;
    x.shk = false; delete x.shks; delete x.shkF; delete x.shkA;
    delete x.shkR; delete x.shkIn; delete x.shkOut; delete x.anim;
  });
  son.forEach(x => { x.gain = 1; delete x.anim; });
  rendreTimeline(); rendreReglages(); dessiner(); resynchroniser(true);
  dire('settings reset on ' + sel.length + ' block(s)');
}

// Le panneau déplié sous un curseur : poser une clé, naviguer, copier, vider.
function panneauAnim(k, t) {
  const l = cles(t, k) || [];
  const dedans = tLect >= t.t0 - 0.001 && tLect <= fin(t) + 0.001;
  const x = +(tLect - t.t0).toFixed(3);
  const i = l.findIndex(p => Math.abs(p.t - x) < 0.008);
  const collable = presseAnim && presseAnim.cle === k;
  return '<div class="animPan"><div class="animBar">' +
    '<button data-cle="' + k + '" class="' + (i >= 0 ? 'on' : '') + '"' +
    (dedans ? '' : ' disabled') +
    ' title="add or remove a key at the playhead">◆</button>' +
    '<button data-cle-prec="' + k + '" title="previous key">◂</button>' +
    '<button data-cle-suiv="' + k + '" title="next key">▸</button>' +
    '<span style="flex:1"></span>' +
    '<button data-copie-anim="' + k + '"' + (l.length ? '' : ' disabled') +
    ' title="copy this animation">⧉</button>' +
    '<button data-colle-anim="' + k + '"' + (collable ? '' : ' disabled') +
    ' title="paste the copied animation onto the selection">⎘</button>' +
    '<button data-vide-anim="' + k + '"' + (l.length ? '' : ' disabled') +
    ' title="clear the animation">✕</button></div>' +
    (l.length
      ? '<div class="animCles">' + l.map((p, j) =>
          '<span class="cle' + (Math.abs(p.t - x) < 0.008 ? ' ici' : '') +
          '" data-aller-cle="' + k + ':' + j + '" title="go to this key">' +
          p.t.toFixed(2) + 's · ' + fmtVal(k, p.v) +
          '<b data-ote-cle="' + k + ':' + j + '" title="remove">×</b></span>')
          .join('') + '</div>'
      : '<div class="animVide">no keyframe' +
        (dedans ? ' — click ◆ to add one here'
                : ' — put the playhead on the block') + '</div>');
}

// Les curseurs suivent la tête de lecture quand le paramètre est animé, sans
// redessiner le panneau : on y tire parfois un curseur.
let REG = null;
function majValeursAnim() {
  if (!REG || !REG.c) return;
  const r = $('#reglages');
  [['ech', '#rEch'], ['dx', '#rDx'], ['dy', '#rDy'], ['opac', '#rOpac'],
   ['gain', '#rGain']].forEach(([k, sl]) => {
    const t = k === 'gain' ? REG.son[0] : REG.c;
    if (!t || !anime(t, k)) return;
    const el = r.querySelector(sl);
    if (!el || el === document.activeElement) return;
    const v = valAnim(t, k, tLect);
    el.value = v;
    if (el.nextElementSibling) el.nextElementSibling.textContent = fmtVal(k, v);
  });
}

// ===========================================================================
//  Lecture avec fondus
// ===========================================================================
const moni = $('#moni'), ctx = moni.getContext('2d');
const POOL = new Map();
let horloge0 = 0, t0Lect = 0;

const actifs = t => CLIPS.filter(c => t >= c.t0 - 0.001 && t < fin(c) - 0.001);

// Les images fixes, une par fiche : rien a decoder, rien a synchroniser,
// et deux blocs de la meme image partagent la meme balise.
const IMAGES = new Map();
function imageDe(c) {
  const f = PAR_ID[c.film];
  if (!f) return null;
  let im = IMAGES.get(c.film);
  if (!im) {
    im = new Image();
    im.decoding = 'async';
    // Chargee, elle se montre sans attendre le prochain mouvement.
    im.onload = () => { try { dessiner(); } catch (e) {} };
    im.src = urlMedia(f);
    IMAGES.set(c.film, im);
  }
  return im;
}

function media(c) {
  // Un calque, un texte ou une image fixe n a rien a lire : ils sont
  // dessines a chaque image, sans lecteur ni synchronisation.
  if (estSynth(c) || estImage(c)) return null;
  let v = POOL.get(c.uid);
  if (!v) {
    const f = PAR_ID[c.film];
    if (!f) return null;
    v = document.createElement('video');
    v.preload = 'auto'; v.playsInline = true;
    v.src = urlMedia(f);
    v.load();
    POOL.set(c.uid, v);
  }
  return v;
}
// Combien de temps a l avance un plan est prepare, et combien de lecteurs on
// garde sous la main.
//
// C est ici qu etait la saute. L ancien menage ne gardait que les plans
// presents a l instant et deux secondes plus loin : sur une sequence de plus
// de douze blocs, il DETRUISAIT tout le reste a chaque image. Le plan suivant
// etait donc recree de zero 0,4 s avant la coupe — a charger, a decoder, a
// positionner. Quand le disque suivait, on ne voyait rien ; quand il ne
// suivait pas, la coupe arrivait sur un lecteur vide, donc sur du noir.
const HORIZON = 2.5;     // on prepare un plan 2,5 s avant son entree
const AMORCE = 0.4;      // on le lance en sourdine 0,4 s avant
const MAX_POOL = 16;

// Les plans dont l intervalle croise la fenetre autour de la tete de lecture.
function prochesDuCurseur(avant, apres) {
  const a = tLect - avant, b = tLect + apres;
  return CLIPS.filter(c => !estSynth(c) && fin(c) > a && c.t0 < b);
}

function menage() {
  if (POOL.size <= MAX_POOL) return;
  const garder = new Set(prochesDuCurseur(1, HORIZON + 1).map(c => c.uid));
  // Distance du plan a la tete de lecture : on jette les plus loin d abord.
  const loin = u => {
    const c = parUid(u);
    if (!c) return 1e9;
    return tLect < c.t0 ? c.t0 - tLect : (tLect > fin(c) ? tLect - fin(c) : 0);
  };
  const jetables = [...POOL.keys()].filter(u => !garder.has(u))
    .sort((x, y) => loin(y) - loin(x));
  for (const uid of jetables) {
    if (POOL.size <= MAX_POOL) break;
    const v = POOL.get(uid);
    v.pause(); v.removeAttribute('src'); v.load(); POOL.delete(uid);
  }
}

function resynchroniser(force) {
  const vivants = new Set();
  for (const c of actifs(tLect)) {
    const p = piste(c.piste);
    if (!p) continue;
    // Quand l image vient du cache, les lecteurs des pistes video n ont plus
    // rien a fournir — ils sont muets de toute facon. On les laisse en pause :
    // plus une seule image decodee pendant la lecture, seul le son tourne.
    if (p.type === 'v' && CACHE.pret && !CACHE.occupe && imageCache(tLect)) {
      const w = POOL.get(c.uid);
      if (w && !w.paused) w.pause();
      vivants.add(c.uid);
      continue;
    }
    const v = media(c);
    if (!v) continue;
    vivants.add(c.uid);
    const vit = vAbs(c);
    const rev = estRev(c);
    const cible = srcA(c, tLect);
    // On n ecrit une propriete que si elle change : ces affectations passent
    // par le moteur media a chaque fois, et la boucle tourne a chaque image.
    if (!rev && v.playbackRate !== vit) {
      try { v.playbackRate = vit; } catch (e) {}
    }
    if (p.type === 'v' || rev) {
      if (!v.muted) v.muted = true;
    } else {
      const muet = !audible(p);
      if (v.muted !== muet) v.muted = muet;
      // Le navigateur plafonne volume a 1 : au-dela de 100 % le gain ne
      // s entend qu au rendu ffmpeg, qui lui sait amplifier.
      const vol = Math.max(0, Math.min(1,
        valAnim(c, 'gain', tLect) * volPiste(p) * alpha(c, tLect)));
      if (Math.abs(v.volume - vol) > 0.004) v.volume = vol;
    }
    // Un <video> refuse une vitesse negative : playbackRate doit rester
    // positif, c est une regle du navigateur et non un reglage. Un plan
    // inverse ne se LIT donc jamais — il se deplace, image par image, a
    // chaque tour de boucle. C est plus saccade qu une lecture normale et
    // c est muet. Le bouton Cache et le rendu ffmpeg, eux, le restituent
    // parfaitement, son compris.
    if (rev) {
      if (!v.paused) v.pause();
      if (force || Math.abs(v.currentTime - cible) > 0.015) {
        try { v.currentTime = Math.max(0, cible); } catch (e) {}
      }
      v._prep = 1;
      continue;
    }
    if (force || Math.abs(v.currentTime - cible) > 0.28) {
      try { v.currentTime = Math.max(0, cible); } catch (e) {}
      v._prep = 1;
    }
    if (enLecture) {
      // Ne pas relancer play() a chaque image : tant qu il n a pas abouti,
      // le rappeler ne fait qu empiler des promesses et bloquer le demarrage.
      const t = performance.now();
      if (v.paused && t - (v._essaiLecture || 0) > 250) {
        v._essaiLecture = t;
        v.play().catch(() => {});
      }
    } else if (!v.paused) v.pause();
  }
  for (const [uid, v] of POOL) if (!vivants.has(uid) && !v.paused) v.pause();
  // AMORCE — le plan suivant est pose sur son point d entree bien avant la
  // coupe, puis lance en sourdine juste avant : un lecteur en pause met
  // quelques dizaines de millisecondes a repartir, et ces millisecondes-la
  // tombent pile sur la coupe. Il la traverse donc sans jamais s arreter,
  // deja a la bonne image. Si le plan entre trop pres du debut de son
  // fichier, l amorce se raccourcit — on ne recule jamais avant la premiere
  // image.
  // On ne prepare que les quatre prochains : au-dela, quatre decodages
  // simultanes couteraient plus cher que la coupe qu ils evitent.
  const aVenir = CLIPS
    .filter(c => !vivants.has(c.uid) && !estSynth(c) &&
                 c.t0 > tLect && c.t0 - tLect <= HORIZON)
    .sort((a, b) => a.t0 - b.t0)
    .slice(0, 4);
  for (const c of aVenir) {
    const v = media(c);
    if (!v) continue;
    const vit = vAbs(c);
    // Un plan inverse commence par sa DERNIERE image et ne se lance jamais :
    // il n y a rien a amorcer, seulement a se placer au bon endroit.
    const rev = estRev(c);
    const av = rev ? 0 : Math.min(AMORCE, c.e / vit);
    const poser = rev ? c.o : Math.max(0, c.e - av * vit);
    const lance = !rev && enLecture && tLect >= c.t0 - av;
    // « _prep » etait un drapeau : une fois leve, il le restait a vie. Le plan
    // avait donc beau avoir deja ete joué et s etre arrete a sa sortie, on ne
    // le remettait plus jamais a son entree — et a la lecture suivante le
    // lecteur principal decouvrait un ecart de plusieurs secondes et sautait
    // pour le rattraper, pile sur la coupe. On compare des POSITIONS.
    if (!lance && !v.seeking && Math.abs(v.currentTime - poser) > 0.08) {
      const t = performance.now();
      if (t - (v._essaiPose || 0) > 200) {
        v._essaiPose = t;
        try { v.currentTime = poser; } catch (e) {}
      }
    }
    if (lance) {
      if (!v.muted) v.muted = true;              // l amorce ne s entend jamais
      if (v.playbackRate !== vit) { try { v.playbackRate = vit; } catch (e) {} }
      const t = performance.now();
      if (v.paused && t - (v._essaiLecture || 0) > 250) {
        v._essaiLecture = t;
        v.play().catch(() => {});
      }
    }
  }
  menage();
}

// ===========================================================================
//  Cache de lecture
// ===========================================================================
// Monter, c est juger un rythme. Une image qui accroche au cut fausse ce
// jugement. Le cache fabrique une fois pour toutes chaque image de la plage,
// et la lecture n a plus qu a les poser : plus aucun decodage video, donc plus
// aucune saute possible. Le son, lui, continue de venir des lecteurs.
const CACHE = {a: 0, b: 0, fps: 24, img: [], pret: false, signe: '',
               occupe: false, annule: false};

// Signature du montage : si elle change, le cache ment et doit partir. On la
// calcule rarement — a la construction, et au demarrage de chaque lecture.
function signeMontage() {
  const p = [PROJET.w, PROJET.h, PROJET.fps,
             PISTES.map(x => x.id + x.type + (x.mute ? 'm' : '') +
               (x.solo ? 's' : '') + (x.vol === undefined ? '' : x.vol)).join()];
  for (const c of CLIPS)
    p.push([c.uid, c.piste, c.film || '', c.genre || '', c.t0.toFixed(3),
            c.e.toFixed(3), c.o.toFixed(3), c.vitesse || 1, c.ech || 1,
            c.dx || 0, c.dy || 0, c.opac === undefined ? 1 : c.opac,
            c.fi || 0, c.fo || 0, c.mode || '', c.couleur || 0,
            c.shk ? 1 : 0, JSON.stringify(couchesShk(c)),
            c.fond || '', c.txt || '', c.police || '', c.taille || 0,
            c.teinte || '', c.ombre === false ? 0 : 1,
            c.anim ? JSON.stringify(c.anim) : ''].join(':'));
  return p.join('|');
}

function viderCache(msg) {
  for (const b of CACHE.img) { try { b.close(); } catch (e) {} }
  CACHE.img = []; CACHE.pret = false; CACHE.signe = '';
  majBoutonCache();
  if (msg) dire(msg);
}

function imageCache(t) {
  if (!CACHE.pret || t < CACHE.a - 1e-4 || t > CACHE.b + 1e-4) return null;
  const i = Math.round((t - CACHE.a) * CACHE.fps);
  return (i >= 0 && i < CACHE.img.length) ? CACHE.img[i] : null;
}

function majBoutonCache(part) {
  const b = $('#bCache');
  if (!b) return;
  const j = b.querySelector('.jauge'), x = b.querySelector('.txt');
  b.classList.toggle('encours', part !== null && part !== undefined);
  b.classList.toggle('pret', CACHE.pret && part === undefined);
  if (part !== null && part !== undefined) {
    j.style.width = Math.round(part * 100) + '%';
    x.textContent = '⚡ ' + Math.round(part * 100) + '%';
  } else if (CACHE.pret) {
    j.style.width = '100%';
    x.textContent = '⚡ ' + (CACHE.img.length / CACHE.fps).toFixed(1) + 's';
  } else {
    j.style.width = '0';
    x.textContent = '⚡ Cache';
  }
}

// On ne capture une image que lorsque les lecteurs sont VRAIMENT arrives a
// leur position : sinon on graverait l image precedente dans le cache.
function attendrePlaces() {
  const l = [];
  for (const c of actifs(tLect)) {
    if (estSynth(c)) continue;
    const v = POOL.get(c.uid);
    if (!v) continue;
    const cible = srcA(c, tLect);
    if (v.readyState >= 2 && Math.abs(v.currentTime - cible) < 0.02) continue;
    l.push(new Promise(res => {
      let fait = false;
      const ok = () => { if (fait) return; fait = true;
        v.removeEventListener('seeked', ok); res(); };
      v.addEventListener('seeked', ok);
      setTimeout(ok, 260);       // un fichier recalcitrant ne bloque pas tout
    }));
  }
  return Promise.all(l);
}

async function fabriquerCache() {
  if (CACHE.occupe) { CACHE.annule = true; return; }
  if (!CLIPS.length) { dire('the timeline is empty'); return; }
  const a = tIn !== null ? tIn : 0;
  const b = tOut !== null ? tOut : dureeTotale();
  if (b - a < 0.1) { dire('range too short'); return; }
  pause();
  viderCache();
  CACHE.occupe = true; CACHE.annule = false;
  const fps = PROJET.fps || 24;
  // Deux plafonds : le nombre d images, et la memoire. Une image de moniteur
  // en 1280x720 pese 3,5 Mo — mille images font deja 3,5 Go.
  const parImage = Math.max(1, moni.width * moni.height * 4);
  const plafond = Math.min(1800, Math.max(24,
    Math.floor(700 * 1024 * 1024 / parImage)));
  const total = Math.min(Math.ceil((b - a) * fps), plafond);
  const tSauve = tLect;
  const img = [];
  majBoutonCache(0);
  try {
    for (let i = 0; i < total; i++) {
      if (CACHE.annule) break;
      tLect = a + i / fps;
      resynchroniser(true);
      await attendrePlaces();
      dessiner();
      img.push(await createImageBitmap(moni));
      if (i % 4 === 0) {
        majBoutonCache(i / total);
        await new Promise(r => setTimeout(r, 0));   // on rend la main a l ecran
      }
    }
  } catch (err) {
    dire('cache failed — ' + err.message, true);
  } finally {
    CACHE.occupe = false;
    if (img.length > 1) {
      CACHE.a = a; CACHE.fps = fps; CACHE.img = img;
      CACHE.b = a + (img.length - 1) / fps;
      CACHE.pret = true; CACHE.signe = signeMontage();
    } else {
      for (const x of img) { try { x.close(); } catch (e) {} }
    }
    tLect = tSauve;
    resynchroniser(true); majTete(); majBoutonCache(); dessiner();
    const voulu = Math.ceil((b - a) * fps);
    if (CACHE.pret)
      // Un cache interrompu garde ce qu il a : cette partie-la se lit sans
      // accroc, le reste se compose comme avant.
      dire((CACHE.annule ? 'cache stopped at ' : 'cached ') +
        (img.length / fps).toFixed(1) + 's · ' + img.length + ' frames' +
        (!CACHE.annule && img.length < voulu
          ? ' (capped — the range is longer than memory allows)' : ''));
    else if (CACHE.annule) dire('cache cancelled');
  }
}

$('#bCache').onclick = e => {
  if (e.shiftKey) { viderCache('cache released'); return; }
  if (CACHE.occupe) { CACHE.annule = true; return; }
  if (cacheAJour()) { viderCache('cache released'); return; }
  fabriquerCache();
};
const cacheAJour = () => CACHE.pret && CACHE.signe === signeMontage();

// Depuis quand le moniteur attend un lecteur qui n est pas pret, et QUI il
// attend. Sans le « qui », une premiere attente expiree laissait le compteur
// en place : la coupe suivante, elle, n aurait plus ete protegee du tout.
const GEL = {depuis: 0, qui: ''};

function dessiner() {
  // Image en cache : on la pose telle quelle, rien d autre a faire.
  const bmp = imageCache(tLect);
  if (bmp) {
    ctx.globalAlpha = 1;
    ctx.drawImage(bmp, 0, 0, moni.width, moni.height);
    return;
  }
  const pv = pistesOrdonnees().filter(p => p.type === 'v' && visible(p));
  const aDessiner = [];
  for (let i = pv.length - 1; i >= 0; i--) {
    actifs(tLect).filter(c => c.piste === pv[i].id)
      .sort((a, b) => a.t0 - b.t0).forEach(c => aDessiner.push(c));
  }
  // Un plan attendu dont le lecteur n est pas encore pret : l ancien code
  // effacait quand meme la toile et ne dessinait rien — un eclair noir en
  // plein milieu de la coupe. Deux images gelees se voient mille fois moins.
  // Au-dela d un quart de seconde on repeint quand meme : un fichier
  // introuvable ne doit pas figer le moniteur pour toujours.
  const pasPret = aDessiner.filter(c => {
    if (estSynth(c)) return false;
    if (estImage(c)) {
      const im = imageDe(c);
      return !im || !im.naturalWidth;
    }
    const v = POOL.get(c.uid);
    return !v || !v.videoWidth || v.readyState < 2;
  }).map(c => c.uid);
  const t = performance.now();
  if (pasPret.length) {
    const qui = pasPret.join(',');
    if (!GEL.depuis || GEL.qui !== qui) { GEL.depuis = t; GEL.qui = qui; }
    if (t - GEL.depuis < 250) return;
  } else { GEL.depuis = 0; GEL.qui = ''; }
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, moni.width, moni.height);
  const cw = moni.width, ch = moni.height;
  aDessiner.forEach(c => {
    if (estSynth(c)) { dessinerSynth(c, cw, ch); return; }
    const v = estImage(c) ? imageDe(c) : POOL.get(c.uid);
    if (!v) return;
    // Une balise image donne « naturalWidth », un lecteur « videoWidth » :
    // tout le reste du dessin est identique.
    const vw = v.videoWidth || v.naturalWidth,
          vh = v.videoHeight || v.naturalHeight;
    if (!vw || !vh) return;
    const a = alpha(c, tLect) * valAnim(c, 'opac', tLect);
    if (a <= 0.005) return;
    ctx.globalAlpha = a;
    const base = c.mode === 'cover' ? Math.max(cw / vw, ch / vh)
                                    : Math.min(cw / vw, ch / vh);
    const [sx, sy] = secousse(c, tLect);
    const rot = rotationSecousse(c, tLect);
    const k = base * valAnim(c, 'ech', tLect) * margeSecousse(c),
          w = vw * k, h = vh * k;
    const px = (cw - w) / 2 + valAnim(c, 'dx', tLect) * cw / 200 + sx * cw / 100;
    const py = (ch - h) / 2 + valAnim(c, 'dy', tLect) * ch / 200 + sy * ch / 100;
    if (rot) {
      // Comme ffmpeg : on tourne le cadre autour de SON centre, pas autour du
      // coin du plan.
      ctx.save();
      ctx.translate(cw / 2, ch / 2);
      ctx.rotate(rot * Math.PI / 180);
      ctx.translate(-cw / 2, -ch / 2);
      ctx.drawImage(v, px, py, w, h);
      ctx.restore();
    } else {
      ctx.drawImage(v, px, py, w, h);
    }
  });
  ctx.globalAlpha = 1;
}

// Calque de couleur et texte : dessines directement sur la toile, avec les
// memes valeurs animees que les rushes — transparence, echelle et position
// marchent donc pareil, images-cles comprises.
// Rouvre la boite du bloc synthetique selectionne. Le double-clic sur le
// bloc y mene aussi : c est le geste qu on essaie d instinct.
function modifierSynth() {
  const c = CLIPS.find(x => clipsSel.has(x.uid) && estSynth(x));
  if (!c) { dire('select a layer or a text'); return; }
  if (c.genre === 'texte') { boiteTexte(c); return; }
  const neuf = prompt('Layer colour (e.g. #1a2b3c):', c.fond || '#000000');
  if (!neuf) return;
  const v = neuf.trim();
  if (!/^#[0-9a-fA-F]{6}$/.test(v)) { dire('invalid colour — #rrggbb format', true); return; }
  memoriser();
  c.fond = v.toLowerCase();
  rendreTimeline(); dessiner();
  dire('layer ' + c.fond);
}

$('#lanes').addEventListener('dblclick', e => {
  const el = e.target.closest('.clip');
  if (!el) return;
  const c = parUid(+el.dataset.uid);
  if (!c || !estSynth(c)) return;
  e.preventDefault();
  clipsSel = new Set([c.uid]);
  rendreLanes(); rendreReglages();
  modifierSynth();
});

function dessinerSynth(c, cw, ch) {
  const a = alpha(c, tLect) * valAnim(c, 'opac', tLect);
  if (a <= 0.005) return;
  const [sx, sy] = secousse(c, tLect);
  const rotS = rotationSecousse(c, tLect);
  // Le calque de couleur est agrandi comme un rush ; le texte, lui, n a pas
  // de bord a decouvrir : il se contente de bouger.
  const k = valAnim(c, 'ech', tLect) *
            (c.genre === 'couleur' ? margeSecousse(c) : 1);
  const ox = valAnim(c, 'dx', tLect) * cw / 200 + sx * cw / 100;
  const oy = valAnim(c, 'dy', tLect) * ch / 200 + sy * ch / 100;
  ctx.save();
  if (rotS) {
    ctx.translate(cw / 2, ch / 2);
    ctx.rotate(rotS * Math.PI / 180);
    ctx.translate(-cw / 2, -ch / 2);
  }
  ctx.globalAlpha = a;
  if (c.genre === 'couleur') {
    const w = cw * k, h = ch * k;
    ctx.fillStyle = c.fond || '#000000';
    ctx.fillRect((cw - w) / 2 + ox, (ch - h) / 2 + oy, w, h);
  } else if (c.genre === 'texte') {
    const pol = POLICES[c.police] || POLICES[POLICE_DEFAUT];
    const taille = Math.max(5, ch * (c.taille || 9) / 100 * k);
    ctx.font = taille + 'px ' + pol.css;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const lignes = String(c.txt === undefined ? '' : c.txt).split('\n');
    const inter = taille * 1.2;
    const y0 = ch / 2 + oy - (lignes.length - 1) * inter / 2;
    lignes.forEach((L, i) => {
      const y = y0 + i * inter;
      if (c.ombre !== false) {
        ctx.fillStyle = 'rgba(0,0,0,.6)';
        ctx.fillText(L, cw / 2 + ox + taille * 0.045, y + taille * 0.045);
      }
      ctx.fillStyle = c.teinte || '#ffffff';
      ctx.fillText(L, cw / 2 + ox, y);
    });
  }
  ctx.restore();
}

// Points de coupe : debuts et fins de blocs, plus les reperes I et O.
function pointsDeCoupe() {
  const t = new Set([0]);
  CLIPS.forEach(c => { t.add(+c.t0.toFixed(3)); t.add(+fin(c).toFixed(3)); });
  if (tIn !== null) t.add(+tIn.toFixed(3));
  if (tOut !== null) t.add(+tOut.toFixed(3));
  return [...t].sort((a, b) => a - b);
}
function plagePrecedente() {
  const l = pointsDeCoupe().filter(x => x < tLect - 0.03);
  return l.length ? l[l.length - 1] : 0;
}
function plageSuivante() {
  const l = pointsDeCoupe().filter(x => x > tLect + 0.03);
  return l.length ? l[0] : dureeTotale();
}

let boucleIO = false;

function lire() {
  if (!CLIPS.length) { dire('the timeline is empty'); return; }
  // Des qu un repere est pose, la lecture se joue dans son intervalle. La
  // lecture s arrete sur la sortie : la tete y reste collee, et rappuyer sur
  // play ne ferait rien. On revient donc a l entree — que la boucle soit
  // active ou non, c est ce qu on attend d un point d entree.
  const a = tIn !== null ? tIn : 0;
  const b = tOut !== null ? tOut : dureeTotale();
  if (tIn !== null || tOut !== null) {
    if (tLect >= b - 0.02 || tLect < a - 0.001) tLect = a;
  } else if (tLect >= dureeTotale() - 0.05) tLect = 0;
  if (CACHE.pret && !cacheAJour())
    viderCache('cache released — the sequence changed');
  enLecture = true; t0Lect = tLect; horloge0 = performance.now();
  $('#bPlay').classList.add('on');
  resynchroniser(true);
}
function pause() {
  enLecture = false;
  $('#bPlay').classList.remove('on');
  for (const [, v] of POOL) v.pause();
}
$('#bPlay').onclick = lire;
$('#bPause').onclick = pause;
$('#bStop').onclick = () => {
  pause();
  tLect = (tIn !== null ? tIn : 0);
  majTete();
  $('#tlDefile').scrollLeft = Math.max(0, tLect * PPS - 60);
  majVue(); resynchroniser(true);
};
$('#bPrec').onclick = () => allerAuTemps(plagePrecedente());
$('#bSuiv').onclick = () => allerAuTemps(plageSuivante());
function poserUnite(u) {
  unite = u;
  $('#bUnite').textContent = (u === 'img' ? 'IMG' : 'SEC');
  $('#bUnite').classList.toggle('on', u === 'img');
  pref.ecrire('unite', u);
  majTete();
  const n = CLIPS.length;
  majEtatSauve();
}
$('#bUnite').onclick = () => poserUnite(unite === 'sec' ? 'img' : 'sec');

$('#bBoucle').onclick = () => {
  boucleIO = !boucleIO;
  $('#bBoucle').classList.toggle('on', boucleIO);
  dire(boucleIO
    ? ((tIn === null && tOut === null)
        ? 'loop on — set the I and O points'
        : 'loop between ' + tc(tIn === null ? 0 : tIn) + ' and ' +
          tc(tOut === null ? dureeTotale() : tOut))
    : 'loop off');
};
$('#bPlein').onclick = () => {
  const m = $('#moniteur');
  if (document.fullscreenElement) document.exitFullscreen();
  else m.requestFullscreen().catch(err => dire('fullscreen refused: ' + err.message, true));
};
document.addEventListener('fullscreenchange', () => {
  $('#bPlein').classList.toggle('on', !!document.fullscreenElement);
});

function boucle() {
  if (enLecture) {
    tLect = t0Lect + (performance.now() - horloge0) / 1000;
    const fi = tOut !== null ? tOut : dureeTotale();
    if (boucleIO && tIn !== null && tOut !== null && tLect >= tOut) {
      tLect = tIn; t0Lect = tIn; horloge0 = performance.now();
      resynchroniser(true);
    } else if (tLect >= fi) { tLect = fi; pause(); }
    majTete(); resynchroniser(false);
  }
  dessiner();
  requestAnimationFrame(boucle);
}
</script>
<style>
.zoneIO{position:absolute;top:0;height:21px;background:#e8b93a2e;
 border-left:2px solid var(--or);border-right:2px solid var(--or);
 z-index:2;pointer-events:none}
.horsIO{position:absolute;top:21px;bottom:0;background:#0000005c;
 z-index:4;pointer-events:none}
.marqueIO{position:absolute;top:0;height:21px;width:12px;z-index:6;
 cursor:ew-resize;background:var(--or);color:#1a1917;
 font:bold 10px/21px ui-monospace,monospace;text-align:center}
.marqueIO.in{border-radius:3px 0 0 3px}
.marqueIO.out{border-radius:0 3px 3px 0}
/* La poignee du milieu : elle emmene l entree ET la sortie, d un bloc. */
.marqueIO.duo{width:20px;border-radius:3px;cursor:grab;font-size:11px}
.marqueIO.duo:active{cursor:grabbing}
.marqueIO:hover{box-shadow:0 0 7px #e8b93a}
</style>
<script>
// ===========================================================================
//  Points d'entrée / sortie de séquence  (I et O)
// ===========================================================================
let tIn = null, tOut = null;

function majIO() {
  $$('.zoneIO,.horsIO,.marqueIO').forEach(e => e.remove());
  const cont = $('#tlContenu');
  if (tIn === null && tOut === null) return;
  const a = tIn === null ? 0 : tIn;
  const b = tOut === null ? dureeTotale() : tOut;
  const z = document.createElement('div');
  z.className = 'zoneIO';
  z.style.left = (a * PPS) + 'px';
  z.style.width = Math.max(2, (b - a) * PPS) + 'px';
  cont.appendChild(z);
  if (a > 0) {
    const g = document.createElement('div');
    g.className = 'horsIO';
    g.style.left = '0px'; g.style.width = (a * PPS) + 'px';
    cont.appendChild(g);
  }
  const totalPx = parseFloat(cont.style.width) || 0;
  if (b * PPS < totalPx) {
    const d = document.createElement('div');
    d.className = 'horsIO';
    d.style.left = (b * PPS) + 'px';
    d.style.width = (totalPx - b * PPS) + 'px';
    cont.appendChild(d);
  }
  // Reperes saisissables : une fois poses, on les deplace a la souris.
  const marque = (quel, t, dec) => {
    const m = document.createElement('div');
    m.className = 'marqueIO ' + quel;
    m.dataset.io = quel;
    m.textContent = quel === 'in' ? 'I' : 'O';
    m.title = (quel === 'in' ? 'in point' : 'out point') +
      ' — drag to move it';
    m.style.left = (t * PPS - dec) + 'px';
    cont.appendChild(m);
  };
  if (tIn !== null) marque('in', tIn, 0);
  if (tOut !== null) marque('out', tOut, 12);
  // Les deux points poses : une poignee au milieu les deplace ensemble.
  if (tIn !== null && tOut !== null) {
    const d = document.createElement('div');
    d.className = 'marqueIO duo';
    d.dataset.io = 'duo';
    d.textContent = '↔';
    d.title = 'in and out — drag to move both, keeping the same length (' +
      (tOut - tIn).toFixed(2) + 's)';
    d.style.left = ((a + b) / 2 * PPS - 10) + 'px';
    cont.appendChild(d);
  }
}

$('#tlContenu').addEventListener('pointerdown', e => {
  const m = e.target.closest('[data-io]');
  if (!m || e.button === 2) return;
  e.preventDefault(); e.stopPropagation();
  const quel = m.dataset.io;
  const duo = quel === 'duo';
  const r = $('#tlContenu').getBoundingClientRect();
  // La poignee du milieu garde l ecart entre les deux points : on la suit
  // par son centre, et l ecart ne change pas d un pixel.
  const demi = duo ? (tOut - tIn) / 2 : 0;
  const repere = duo ? (tIn + tOut) / 2 : (quel === 'in' ? tIn : tOut);
  // on garde l ecart entre le point de saisie et le repere, sinon il saute
  const dec = (e.clientX - r.left) - repere * PPS;
  const bouger = ev => {
    const t = Math.max(0, Math.min(etendue(), (ev.clientX - r.left - dec) / PPS));
    if (duo) {
      const centre = Math.max(demi, Math.min(etendue() - demi, t));
      tIn = centre - demi;
      tOut = centre + demi;
    } else if (quel === 'in') tIn = (tOut !== null) ? Math.min(t, tOut - 0.1) : t;
    else tOut = (tIn !== null) ? Math.max(t, tIn + 0.1) : t;
    majIO();
  };
  const lacher = () => {
    window.removeEventListener('pointermove', bouger);
    window.removeEventListener('pointerup', lacher);
    dire('in ' + tc(tIn === null ? 0 : tIn) + '   sortie ' +
      tc(tOut === null ? dureeTotale() : tOut));
  };
  window.addEventListener('pointermove', bouger);
  window.addEventListener('pointerup', lacher);
}, true);
// Clic droit sur le repère jaune : le retirer, ou l amener sous la tête.
// Sa propre référence à #menu, pour ne pas dépendre de l ordre d évaluation
// des blocs <script> — c est le même nœud.
const ioMenu = $('#menu');
$('#tlContenu').addEventListener('contextmenu', e => {
  const m = e.target.closest('[data-io]');
  if (!m) return;
  e.preventDefault(); e.stopPropagation();
  const quel = m.dataset.io;
  const deux = tIn !== null && tOut !== null;
  ioMenu.innerHTML = '<div class="lbl">' +
    (quel === 'duo'
      ? 'in ' + tc(tIn) + ' → out ' + tc(tOut) +
        ' · ' + (tOut - tIn).toFixed(2) + 's'
      : quel === 'in' ? 'Enter · ' + tc(tIn) : 'Output · ' + tc(tOut)) +
    '</div>' +
    (quel === 'duo' ? ''
      : '<div class="it" data-io-ote="' + quel + '">✕ Remove this point</div>') +
    (deux ? '<div class="it" data-io-ote="tout">✕ Remove both</div>' : '') +
    '<div class="sep"></div>' +
    '<div class="it" data-io-tete="' + quel + '">↦ ' +
    (quel === 'duo' ? 'Bring the range to playhead' : 'Bring to playhead') +
    '</div>';
  ioMenu.className = 'on';
  const r = ioMenu.getBoundingClientRect();
  ioMenu.style.left = Math.min(e.clientX, innerWidth - r.width - 8) + 'px';
  ioMenu.style.top = Math.min(e.clientY, innerHeight - r.height - 8) + 'px';
}, true);

ioMenu.addEventListener('click', e => {
  const ote = e.target.closest('[data-io-ote]');
  const tete = e.target.closest('[data-io-tete]');
  if (!ote && !tete) return;
  ioMenu.className = '';
  if (tete) {
    const q = tete.dataset.ioTete;
    if (q === 'duo') {
      // La zone entiere vient se poser sous la tete de lecture, longueur
      // inchangee.
      const ecart = tOut - tIn;
      tIn = Math.max(0, tLect);
      tOut = tIn + ecart;
      majIO();
      dire('in ' + tc(tIn) + '   out ' + tc(tOut));
    } else if (q === 'in') poserIn();
    else poserOut();
    return;
  }
  const q = ote.dataset.ioOte;
  if (q === 'tout') { tIn = null; tOut = null; dire('I/O points removed'); }
  else if (q === 'in') { tIn = null; dire('in point removed'); }
  else { tOut = null; dire('out point removed'); }
  majIO();
});

// M comme marqueur. Un bloc selectionne sous la tete de lecture ? Le
// marqueur lui appartient et le suivra. Sinon il appartient a la sequence.
function poserMarqueur() {
  const sel = CLIPS.filter(c => clipsSel.has(c.uid));
  const sous = sel.filter(c => tLect >= c.t0 - 1e-6 && tLect < fin(c));
  if (sel.length && !sous.length) {
    dire('the playhead is not over the selected block', true);
    return;
  }
  memoriser();
  if (sous.length) {
    let n = 0;
    sous.forEach(c => {
      const x = +mqSource(c, tLect).toFixed(4);
      if (!Array.isArray(c.mq)) c.mq = [];
      if (c.mq.some(y => Math.abs(y - x) < 0.004)) return;
      c.mq.push(x); c.mq.sort((a, b) => a - b); n++;
    });
    rendreLanes(); modifie = true;
    dire(n ? 'marker on ' + (n > 1 ? n + ' blocks' : 'the block') + ' at ' + tc(tLect)
           : 'there is already a marker there');
    return;
  }
  const t = +tLect.toFixed(4);
  if (MARQUEURS.some(y => Math.abs(y - t) < 0.004)) {
    HISTO.pop(); dire('there is already a marker there'); return;
  }
  MARQUEURS.push(t); MARQUEURS.sort((a, b) => a - b);
  majMarqueurs(); modifie = true;
  dire('marker at ' + tc(t));
}

// Glisser un marqueur de sequence. Maj enfoncee, il se colle aux bords de bloc
// et aux autres marqueurs, comme tout le reste.
$('#tlContenu').addEventListener('pointerdown', e => {
  const m = e.target.closest('.marque');
  if (!m || e.button === 2) return;
  e.preventDefault(); e.stopPropagation();
  let i = +m.dataset.mq;
  const r = $('#tlContenu').getBoundingClientRect();
  const dec = (e.clientX - r.left) - MARQUEURS[i] * PPS;
  let bouge = false;
  const bouger = ev => {
    if (!bouge) { memoriser(); bouge = true; }
    const t = Math.max(0, (ev.clientX - r.left - dec) / PPS);
    // On se retire de la liste avant de calculer l aimant : sinon le marqueur
    // se collerait a lui-meme et ne bougerait plus d un pouce.
    const garde = MARQUEURS.splice(i, 1)[0];
    const neuf = +aimanter(t, new Set(), ev.shiftKey).toFixed(4);
    MARQUEURS.splice(i, 0, isNaN(neuf) ? garde : neuf);
    majMarqueurs();
  };
  const lacher = () => {
    window.removeEventListener('pointermove', bouger);
    window.removeEventListener('pointerup', lacher);
    if (!bouge) return;
    const t = MARQUEURS[i];
    MARQUEURS.sort((a, b) => a - b);
    majMarqueurs(); modifie = true;
    dire('marker at ' + tc(t));
  };
  window.addEventListener('pointermove', bouger);
  window.addEventListener('pointerup', lacher);
}, true);

$('#tlContenu').addEventListener('dblclick', e => {
  const m = e.target.closest('.marque');
  if (!m) return;
  e.preventDefault(); e.stopPropagation();
  memoriser();
  const t = MARQUEURS[+m.dataset.mq];
  MARQUEURS.splice(+m.dataset.mq, 1);
  majMarqueurs(); modifie = true;
  dire('marker ' + tc(t) + ' removed');
}, true);

// Les marqueurs d un bloc : meme geste, mais en phase de capture, sinon le
// bloc partirait avec la souris avant que le marqueur ait vu le clic.
$('#lanes').addEventListener('pointerdown', e => {
  const el = e.target.closest('.mqb');
  if (!el || e.button === 2) return;
  const bloc = el.closest('.clip');
  const c = bloc && parUid(+bloc.dataset.uid);
  if (!c) return;
  e.preventDefault(); e.stopPropagation();
  const depart = parseFloat(el.dataset.mqb);
  const i = mqBloc(c).findIndex(x => Math.abs(x - depart) < 1e-4);
  if (i < 0) return;
  const r = $('#tlContenu').getBoundingClientRect();
  const dec = (e.clientX - r.left) - mqTemps(c, depart) * PPS;
  let bouge = false;
  const bouger = ev => {
    if (!bouge) { memoriser(); bouge = true; }
    const t = (ev.clientX - r.left - dec) / PPS;
    const x = Math.max(c.e, Math.min(c.o,
      mqSource(c, aimanter(t, new Set([c.uid]), ev.shiftKey))));
    c.mq[i] = +x.toFixed(4);
    el.style.left = ((mqTemps(c, c.mq[i]) - c.t0) * PPS) + 'px';
  };
  const lacher = () => {
    window.removeEventListener('pointermove', bouger);
    window.removeEventListener('pointerup', lacher);
    if (!bouge) return;
    c.mq.sort((a, b) => a - b);
    rendreLanes(); modifie = true;
    dire('block marker at ' + tc(mqTemps(c, c.mq[i])));
  };
  window.addEventListener('pointermove', bouger);
  window.addEventListener('pointerup', lacher);
}, true);

$('#lanes').addEventListener('dblclick', e => {
  const el = e.target.closest('.mqb');
  if (!el) return;
  const bloc = el.closest('.clip');
  const c = bloc && parUid(+bloc.dataset.uid);
  if (!c) return;
  e.preventDefault(); e.stopPropagation();
  const depart = parseFloat(el.dataset.mqb);
  const i = mqBloc(c).findIndex(x => Math.abs(x - depart) < 1e-4);
  if (i < 0) return;
  memoriser();
  c.mq.splice(i, 1);
  rendreLanes(); modifie = true;
  dire('block marker removed');
}, true);

function poserIn() {
  tIn = tLect;
  if (tOut !== null && tOut <= tIn) tOut = null;
  majIO(); dire('in point at ' + tc(tIn));
}
function poserOut() {
  tOut = tLect;
  if (tIn !== null && tIn >= tOut) tIn = null;
  majIO(); dire('out point at ' + tc(tOut));
}
function effacerIO() { tIn = null; tOut = null; majIO(); dire('I/O points cleared'); }
const bornes = () => ({a: tIn === null ? 0 : tIn,
                       b: tOut === null ? dureeTotale() : tOut});

// ===========================================================================
//  Clavier
// ===========================================================================
// Ce qui avale vraiment une frappe. Un curseur (volume de piste, tete de
// lecture, taille des vignettes) est un INPUT, mais il garde le focus apres le
// clic : le garde-fou d origine rendait la barre d espace muette des qu on
// avait touche un volume. Il garde en revanche ses fleches, qui lui servent.
const SANS_SAISIE = new Set(['range', 'checkbox', 'radio', 'button', 'submit',
                             'reset', 'file', 'color', 'image']);
const FLECHES = new Set(['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown',
                         'Home', 'End', 'PageUp', 'PageDown']);
function saisieActive(el) {
  if (!el || !el.tagName) return false;
  if (el.isContentEditable) return true;
  const n = el.tagName;
  if (n === 'TEXTAREA' || n === 'SELECT') return true;
  if (n !== 'INPUT') return false;
  return !SANS_SAISIE.has((el.type || 'text').toLowerCase());
}

document.addEventListener('keydown', e => {
  const t = e.target || {};
  // Échap passe toujours : c est la sortie de secours, y compris depuis un
  // champ de saisie (elle referme la boîte ouverte).
  if (e.key !== 'Escape') {
    // « textarea » manquait ici : dans la boîte Texte, la barre d espace
    // lançait la lecture et Suppr effaçait des blocs pendant qu on écrivait.
    if (saisieActive(t)) return;
    // Un curseur n avale que ses propres touches : les fleches. L espace,
    // Suppr et les lettres continuent de piloter le montage.
    if (t.tagName === 'INPUT' && FLECHES.has(e.key)) return;
    // Et tant qu une boîte est ouverte, les raccourcis du montage se taisent,
    // même si le focus n est sur aucun champ : un clic à côté du champ ne doit
    // pas rendre la barre d espace dangereuse.
    const vl = $('#voile');
    if (vl && vl.className === 'on') return;
  }
  const k = e.key.toLowerCase();
  const ctrl = e.ctrlKey || e.metaKey;
  if (ctrl && k === 'z') { e.preventDefault(); annulerMontage(); return; }
  if (ctrl && k === 'c') { e.preventDefault(); copierBlocs(); return; }
  if (ctrl && k === 'v') { e.preventDefault(); collerBlocs(); return; }
  // Ctrl+D : dupliquer la selection juste derriere elle. Sans preventDefault,
  // le navigateur ouvrirait sa fenetre de favoris.
  if (ctrl && k === 'd') { e.preventDefault(); dupliquerBlocs(); return; }
  // L enregistrement est continu, mais Ctrl+S reste un reflexe : il force
  // l ecriture immediate et le confirme.
  if (ctrl && k === 's') {
    e.preventDefault();
    if (!CLIPS.length) dire('the timeline is empty');
    else if (!modifie) dire('“' + (projetNom || PROJET.nom) + '” already saved');
    else assurerSauvegarde(false);
    return;
  }
  if (ctrl && k === 'a') {
    e.preventDefault();
    clipsSel = new Set(CLIPS.map(c => c.uid));
    rendreLanes(); rendreReglages();
    return;
  }
  if (ctrl) return;
  if (e.code === 'Space') { e.preventDefault(); enLecture ? pause() : lire(); return; }
  if (k === 'v') { setOutil('V'); return; }
  if (k === 'c') { setOutil('C'); return; }
  if (k === 'a') { setOutil('A'); return; }
  if (k === 'i') { poserIn(); return; }
  if (k === 'o') { poserOut(); return; }
  if (k === 'm') { poserMarqueur(); return; }
  if (e.key === 'Delete' || e.key === 'Backspace') {
    e.preventDefault(); retirerSelection(); return;
  }
  if (e.key === 'Home') { pause(); tLect = 0; majTete(); resynchroniser(true); return; }
  if (e.key === 'ArrowUp') { e.preventDefault(); allerAuTemps(plagePrecedente()); return; }
  if (e.key === 'ArrowDown') { e.preventDefault(); allerAuTemps(plageSuivante()); return; }
  if (k === 'l') { $('#bBoucle').click(); return; }
  if (k === 'u') { $('#bUnite').click(); return; }
  if (k === 'f') { $('#bPlein').click(); return; }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
    e.preventDefault();
    const pas = e.shiftKey ? 1 : 1 / 24;
    tLect = Math.max(0, Math.min(etendue(),
      tLect + (e.key === 'ArrowRight' ? pas : -pas)));
    pause(); majTete(); resynchroniser(true);
    return;
  }
  if (e.key === 'Escape') {
    fermerMenu(); $('#voile').className = '';
    if (reduire()) return;
    selection.clear(); clipsSel.clear(); rendreGrille(); rendreTimeline();
  }
});

// ===========================================================================
//  Projets : sauver / ouvrir
// ===========================================================================
// Le projet d accueil : celui ou le montage s enregistre. On prend celui
// deja choisi, sinon celui du premier plan, sinon le projet courant.
// Le projet d accueil d un montage n est JAMAIS une bibliotheque : une
// bibliotheque est une reserve partagee, pas un lieu de travail. Sans ce
// garde-fou, ouvrir la musique avant les projets suffisait a y enregistrer
// les montages.
function hoteMontage() {
  const bon = n => n && projetOuvert(n) && !estBibli(n);
  if (bon(PROJET.pj)) return PROJET.pj;
  // Le premier plan qui vient d un vrai projet, la musique mise a part.
  const c = CLIPS.find(x => {
    const pj = (PAR_ID[x.film] || {}).pj;
    return pj && !estBibli(pj);
  });
  if (c) return PAR_ID[c.film].pj;
  const cour = projetCourant();
  if (bon(cour)) return cour;
  const p = OUVERTS.find(x => !estBibli(x.nom));
  return p ? p.nom : '';
}

function objetProjet() {
  return {
    version: 5, genere: new Date().toISOString(),
    projet: {nom: PROJET.nom, w: PROJET.w, h: PROJET.h, fps: PROJET.fps},
    hote: hoteMontage(),
    // De quels projets ce montage a besoin pour se recharger entier : a la
    // reouverture, ceux qui manquent sont rouverts tout seuls.
    projets: [...new Set(CLIPS.map(c => (PAR_ID[c.film] || {}).pj || c.pj)
                              .filter(Boolean))],
    fps: PROJET.fps, format: {w: PROJET.w, h: PROJET.h},
    tIn: tIn, tOut: tOut, PPS: PPS,
    marqueurs: MARQUEURS,
    pistes: PISTES,
    clips: CLIPS.map(c => {
      const n = {};
      for (const k in c) if (k[0] !== '_') n[k] = c[k];
      const f = PAR_ID[c.film] || {};
      n.pj = f.pj || c.pj || '';
      n.fichier = f.rel || c.fichier || '';
      return n;
    })
  };
}

// Liste tous les montages de tous les projets ouverts.
async function listerMontages() {
  const out = [];
  for (const p of OUVERTS) {
    try {
      const d = await api('/api/montages?projet=' + encodeURIComponent(p.nom));
      (d.montages || []).forEach(m => out.push(m));
    } catch (err) {}
  }
  out.sort((a, b) => (b.maj || '').localeCompare(a.maj || ''));
  return out;
}

async function chargerProjet(p, nom, hote) {
  if (!p || !p.clips) { dire('unreadable sequence', true); return; }
  // Un montage se souvient des projets dont il a besoin : on les rouvre avant
  // de replacer les plans, sinon la moitie du montage arriverait vide.
  const besoins = [...new Set((p.projets || [])
    .concat(p.clips.map(c => c.pj))
    .concat([p.hote, hote]).filter(Boolean))];
  const absents = [];
  for (const x of besoins) {
    if (projetOuvert(x)) continue;
    try { await ouvrirProjetDisque(x, true); }
    catch (err) { absents.push(x); }
  }
  memoriser();
  const parRel = {};
  FILMS.forEach(f => parRel[f.pj + '|' + f.rel] = f.id);
  let perdus = 0;
  MARQUEURS = Array.isArray(p.marqueurs) ? p.marqueurs.slice() : [];
  PISTES = p.pistes && p.pistes.length ? p.pistes
    : [{id: 'V1', type: 'v', mute: false, solo: false},
       {id: 'A1', type: 'a', mute: false, solo: false},
       {id: 'M1', type: 'm', mute: false, solo: false}];
  assurerPistes();
  CLIPS = [];
  let maxUid = 0;
  p.clips.forEach(c => {
    let film = c.film;
    if (!PAR_ID[film]) {
      // retrouve par chemin, dans son propre projet
      film = parRel[(c.pj || p.hote || hote || '') + '|' + c.fichier] || null;
    }
    const n = {};
    for (const k in c) if (k[0] !== '_') n[k] = c[k];
    n.film = film;
    // Un plan dont le projet est absent reste sur la timeline, marque « ? » :
    // on ne mutile pas un montage parce qu un dossier n est pas la.
    // Un calque ou un texte n a pas de film : ce n est pas un plan perdu.
    if (!film && !n.genre) perdus++;
    n.vitesse = n.vitesse || 1;
    if (n.vitesse < 0) { n.rev = !n.rev; n.vitesse = -n.vitesse; }
    n.rev = !!n.rev;
    n.couleur = n.couleur || 0;
    n.opac = n.opac === undefined ? 1 : n.opac;
    n.fi = n.fi || 0; n.fo = n.fo || 0;
    maxUid = Math.max(maxUid, n.uid || 0);
    CLIPS.push(n);
  });
  uidSuivant = maxUid + 1;
  // Le numero de lien doit depasser tous ceux deja en place : se fier au
  // nombre de blocs ne suffit pas, un montage elague peut garder un « L7 »
  // avec seulement deux blocs, et le lien suivant retomberait dessus — la
  // copie se retrouverait appariee a l original.
  lienSuivant = CLIPS.reduce((m, c) =>
    Math.max(m, 1 + (parseInt(String(c.lien || '').slice(1), 10) || 0)), 1);
  PROJET.pj = (hote || p.hote || PROJET.pj || '');
  if (p.projet) {
    PROJET.nom = p.projet.nom || '';
    PROJET.w = p.projet.w || 1280;
    PROJET.h = p.projet.h || 720;
    PROJET.fps = p.projet.fps || 24;
    appliquerSpecs();
  }
  tIn = p.tIn === undefined ? null : p.tIn;
  tOut = p.tOut === undefined ? null : p.tOut;
  if (p.PPS) PPS = p.PPS;
  projetNom = nom || '';
  PROJET.nom = projetNom;
  clipsSel.clear(); tLect = 0;
  modifie = false;
  rendreTimeline(); majIO(); resynchroniser(true);
  rafraichirProjets();
  dire('sequence “' + projetNom + '” loaded: ' + CLIPS.length + ' blocks' +
    (perdus ? ' — ' + perdus + ' shot(s) not found' : '') +
    (absents.length ? ', project ' + absents.join(' and ') + ' missing from disk'
                    : ''), perdus > 0);
}

// La toile ne sert qu a regarder : la dimensionner a la taille du projet
// (souvent 1920x1080) revient a composer huit fois plus de pixels que
// l ecran n en affiche. Avec deux calques superposes, c est ce qui fait
// tomber la lecture. On la cale sur la taille reellement affichee, au
// rapport du projet. Le rendu ffmpeg, lui, reste en pleine definition.
// En mode Montage le canvas etait laisse en « width:auto » : un canvas prend
// alors sa taille INTRINSEQUE, c est-a-dire l attribut width qu on venait de
// lui donner. Et cet attribut se calculait a partir de... sa largeur affichee.
// La boucle se refermait sur elle-meme : une fois petit, le moniteur restait
// petit pour toujours, quelle que soit la place disponible (mesure chez David :
// 612 x 344 dans un panneau de 2322 x 775). On mesure donc le CONTENANT, et on
// pose la taille d affichage nous-memes.
function dimensionnerMoniteur() {
  const boite = moni.parentElement;
  if (document.body.classList.contains('edit') && boite) {
    const dw = boite.clientWidth, dh = boite.clientHeight;
    if (dw > 20 && dh > 20) {
      const k = Math.min(dw / PROJET.w, dh / PROJET.h);
      const lw = Math.max(80, Math.floor(PROJET.w * k));
      const lh = Math.max(45, Math.floor(PROJET.h * k));
      if (moni.style.width !== lw + 'px') moni.style.width = lw + 'px';
      if (moni.style.height !== lh + 'px') moni.style.height = lh + 'px';
    }
  } else if (moni.style.width) {
    // En bibliotheque le CSS suffit (largeur 100 % du panneau) : on rend la
    // main, sinon la taille du montage resterait collee.
    moni.style.width = '';
    moni.style.height = '';
  }
  const large = Math.max(160, Math.round(moni.clientWidth ||
    (boite && boite.clientWidth) || 640));
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const w = Math.min(PROJET.w, Math.round(large * dpr));
  const h = Math.max(2, Math.round(w * PROJET.h / PROJET.w));
  if (moni.width !== w || moni.height !== h) {
    moni.width = w;
    moni.height = h;
  }
}

// Un seul mecanisme plutot que d aller rappeler dimensionnerMoniteur a chaque
// endroit qui bouge : changement de mode, poignees de panneaux, fenetre. Le
// canvas n influe pas sur la taille de son contenant, donc pas de boucle.
if (window.ResizeObserver) {
  new ResizeObserver(() => {
    dimensionnerMoniteur();
    dessiner();
  }).observe(moni.parentElement);
}

function appliquerSpecs() {
  moni.style.aspectRatio = PROJET.w + ' / ' + PROJET.h;
  dimensionnerMoniteur();
  dessiner();
  majTete();
}

const TAILLES = [
  ['1920 × 1080  ·  HD 16:9', 1920, 1080],
  ['1280 × 720  ·  HD 16:9', 1280, 720],
  ['1440 × 1080  ·  4:3', 1440, 1080],
  ['1920 × 1440  ·  4:3', 1920, 1440],
  ['3840 × 2160  ·  UHD', 3840, 2160],
  ['1080 × 1920  ·  vertical', 1080, 1920],
  ['1080 × 1080  ·  square', 1080, 1080],
  ['2048 × 858  ·  scope', 2048, 858]
];

// Ou ce rush a-t-il deja servi ? Le serveur ouvre tous les montages de tous
// les projets et compte les blocs portant cet identifiant. On ne le fait qu a
// la demande : c est de la lecture de fichiers, pas une information a tenir a
// jour en permanence.
async function boiteUsages(film) {
  const f = PAR_ID[film] || {};
  const b = $('#boite');
  b.innerHTML = '<h3>' + echapHtml((f.nom || 'shot').slice(0, 40)) + '</h3>' +
    '<div style="font-size:12px;color:var(--sourd)">searching…</div>';
  $('#voile').className = 'on';
  let u = [];
  try {
    u = (await api('/api/usages?id=' + encodeURIComponent(film))).usages || [];
  } catch (err) {
    b.innerHTML = '<h3>' + echapHtml((f.nom || 'shot').slice(0, 40)) + '</h3>' +
      '<div style="font-size:12px;color:var(--rouge)">' +
      echapHtml(err.message) + '</div>' +
      '<div style="margin-top:16px;text-align:right">' +
      '<button id="uFerme" class="on">Close</button></div>';
    $('#uFerme').onclick = () => $('#voile').className = '';
    return;
  }
  b.innerHTML = '<h3>' + echapHtml((f.nom || 'shot').slice(0, 40)) + '</h3>' +
    '<div style="font-size:12px;color:var(--sourd);margin-bottom:10px">' +
    (u.length
      ? 'used in ' + u.length + ' sequence' + (u.length > 1 ? 's' : '') +
        ' — click one to open it'
      : 'this shot is in no saved sequence') + '</div>' +
    u.map(x => '<div class="ligne" data-u="' + echapHtml(x.projet) + '|' +
      echapHtml(x.nom) + '"><span><b>' + echapHtml(x.nom) + '</b><br>' +
      '<span style="color:var(--sourd);font-size:11px">' + echapHtml(x.projet) +
      ' · ' + echapHtml(x.maj) + '</span></span><i>' + x.blocs + ' block' +
      (x.blocs > 1 ? 's' : '') + '</i></div>').join('') +
    '<div style="margin-top:16px;text-align:right">' +
    '<button id="uFerme" class="on">Close</button></div>';
  $('#uFerme').onclick = () => $('#voile').className = '';
  b.querySelectorAll('[data-u]').forEach(el => el.onclick = async () => {
    const [pj, nom] = el.dataset.u.split('|');
    $('#voile').className = '';
    await ouvrirMontage(pj, nom);
  });
}

function boiteProjet() {
  const b = $('#boite');
  b.innerHTML = '<h3>Current sequence</h3>' +
    '<div style="display:flex;flex-direction:column;gap:12px">' +
    '<div><label style="font-size:11px;color:var(--sourd)">Name</label><br>' +
    '<input id="pNom" style="width:100%" value="' +
      (PROJET.nom || '').replace(/"/g, '&quot;') + '" placeholder="untitled"></div>' +
    '<div><label style="font-size:11px;color:var(--sourd)">Saved in ' +
    'project</label><br><select id="pHote" style="width:100%">' +
      (OUVERTS.length ? OUVERTS.map(p => '<option value="' + p.nom + '"' +
        (p.nom === hoteMontage() ? ' selected' : '') + '>' + p.nom +
        '</option>').join('')
        : '<option value="">no project open</option>') + '</select></div>' +
    '<div><label style="font-size:11px;color:var(--sourd)">Format</label><br>' +
    '<select id="pTaille" style="width:100%">' +
      TAILLES.map(t => '<option value="' + t[1] + 'x' + t[2] + '"' +
        (PROJET.w === t[1] && PROJET.h === t[2] ? ' selected' : '') + '>' + t[0] +
        '</option>').join('') +
      '<option value="libre">custom size…</option></select></div>' +
    '<div id="pLibre" style="display:none;gap:8px">' +
    '<input id="pW" type="number" min="64" max="7680" step="2" value="' + PROJET.w +
      '" style="width:88px"> × <input id="pH" type="number" min="64" max="4320" ' +
      'step="2" value="' + PROJET.h + '" style="width:88px"> px</div>' +
    '<div><label style="font-size:11px;color:var(--sourd)">Frame rate</label><br>' +
    '<select id="pFps" style="width:100%">' +
      [23.976, 24, 25, 29.97, 30, 50, 60].map(f => '<option value="' + f + '"' +
        (Math.abs(PROJET.fps - f) < 0.01 ? ' selected' : '') + '>' + f +
        ' fps</option>').join('') + '</select></div>' +
    '<div style="font-size:11px;color:var(--sourd)">Shots already placed keep ' +
    'their duration in seconds. The format applies to the monitor, the render and the XML export.</div>' +
    '<div style="display:flex;gap:8px;justify-content:space-between;margin-top:6px">' +
    '<button id="pNouveau">New sequence…</button>' +
    '<span><button id="pAnnule">Cancel</button> ' +
    '<button id="pOk" class="on">Apply</button></span></div></div>';
  $('#voile').className = 'on';
  const maj = () => {
    $('#pLibre').style.display =
      $('#pTaille').value === 'libre' ? 'flex' : 'none';
  };
  $('#pTaille').onchange = maj; maj();
  $('#pAnnule').onclick = () => $('#voile').className = '';
  $('#pOk').onclick = () => {
    PROJET.nom = $('#pNom').value.trim();
    projetNom = PROJET.nom;
    PROJET.pj = $('#pHote').value || PROJET.pj;
    if ($('#pTaille').value === 'libre') {
      PROJET.w = Math.max(64, Math.min(7680, parseInt($('#pW').value, 10) || 1280));
      PROJET.h = Math.max(64, Math.min(4320, parseInt($('#pH').value, 10) || 720));
    } else {
      const [w, h] = $('#pTaille').value.split('x').map(Number);
      PROJET.w = w; PROJET.h = h;
    }
    PROJET.w -= PROJET.w % 2; PROJET.h -= PROJET.h % 2;
    PROJET.fps = parseFloat($('#pFps').value) || 24;
    appliquerSpecs(); rendreTimeline();
    $('#voile').className = '';
    dire((PROJET.nom || 'untitled') + ' — ' + PROJET.w + '×' + PROJET.h +
      ' at ' + PROJET.fps + ' i/s');
  };
  $('#pNouveau').onclick = async () => {
    const bt = $('#pNouveau');
    bt.disabled = true;
    try {
      await assurerSauvegarde();
      memoriser();
      CLIPS = []; clipsSel.clear(); tIn = null; tOut = null; tLect = 0;
      MARQUEURS = [];
      PISTES = [{id: 'V1', type: 'v', mute: false, solo: false},
                {id: 'A1', type: 'a', mute: false, solo: false}];
      assurerPistes();          // la piste musique revient avec les autres
      const hote = $('#pHote').value || hoteMontage() || PROJET.pj;
      // Jamais le nom d une sequence deja presente dans ce projet : « creer »
      // ne doit pas pouvoir ecraser un montage existant.
      const base = ($('#pNom').value.trim() || 'untitled');
      const pris = x => (typeof MONTAGES !== 'undefined' ? MONTAGES : [])
        .some(m => m.projet === hote && m.nom === x);
      let nom = base, k = 1;
      while (pris(nom) && k < 200) { k++; nom = base + '-' + k; }
      PROJET.nom = nom; projetNom = nom; PROJET.pj = hote;
      modifie = false;
      // On l ECRIT tout de suite. La sauvegarde continue refuse un montage
      // sans bloc — c est voulu, elle ne doit pas semer des brouillons vides —
      // donc une sequence neuve n arrivait jamais sur le disque et
      // n apparaissait dans aucun onglet.
      if (hote) {
        try {
          await api('/api/montage',
            {projet: hote, nom: nom, montage: objetProjet()});
          noterDernier(hote, nom);
        } catch (err) {
          dire('new sequence not saved — ' + err.message, true);
        }
      }
      rendreTimeline(); majIO(); resynchroniser(true);
      await rafraichirProjets();
      dire('new sequence: ' + nom + (hote ? ' · ' + hote : ''));
    } finally {
      $('#voile').className = '';
      bt.disabled = false;
    }
  };
}
// Avant de quitter un montage, on l enregistre sans rien demander : changer
// de projet ne doit jamais coûter une boîte de dialogue ni du travail perdu.
// L enregistrement est CONTINU : il n y a plus de bouton « Save ». Le montage
// part sur le disque quelques secondes apres la derniere modification, a
// chaque changement de montage, et une derniere fois quand on ferme l onglet.
// « modifie » reste le seul drapeau, « sauveEnEchec » retient le seul cas ou
// il reste vraiment quelque chose a perdre.
let sauveEnCours = false, sauveEnEchec = false;

async function assurerSauvegarde(silencieux) {
  if (!modifie || !CLIPS.length) return true;
  if (sauveEnCours) return true;
  const nom = projetNom || PROJET.nom || ('brouillon-' + horodate());
  const hote = hoteMontage();
  if (!hote) return false;
  sauveEnCours = true;
  try {
    PROJET.pj = hote;
    await api('/api/montage',
      {projet: hote, nom: nom, montage: objetProjet()});
    const neuf = projetNom !== nom;
    projetNom = nom; PROJET.nom = nom; modifie = false; sauveEnEchec = false;
    noterDernier(hote, nom);
    majEtatSauve();
    // Un montage sans nom vient de s en donner un : la bande et la colonne
    // doivent le montrer.
    if (neuf) { rafraichirProjets(); }
    if (!silencieux) dire('“' + nom + '” saved');
    return true;
  } catch (err) {
    sauveEnEchec = true;
    majEtatSauve();
    dire('autosave failed — ' + err.message, true);
    return false;
  } finally {
    sauveEnCours = false;
  }
}

// Un point à côté du nom tant que le disque n est pas à jour. Discret : c est
// une information, pas une alerte — l enregistrement se fait tout seul.
function majEtatSauve() {
  const n = CLIPS.length;
  const e = $('#mDuree');
  if (!e) return;
  e.textContent = (n ? fmt(dureeTotale()) + ' · ' + n + 'p' : 'empty') +
    (projetNom ? ' · ' + projetNom : '') +
    (modifie ? (sauveEnEchec ? ' · NOT SAVED' : ' ·') : '');
  e.style.color = sauveEnEchec ? 'var(--rouge)' : 'var(--sourd)';
}

// Toutes les 4 s, et seulement s il y a quelque chose a ecrire.
setInterval(() => { if (modifie && CLIPS.length) assurerSauvegarde(true); }, 4000);

// A la fermeture, « keepalive » fait survivre la requete a la page. On part
// avant l adieu au serveur, qui lui ne quitte qu apres cinq secondes.
function sauverAvantDeFermer() {
  if (!modifie || !CLIPS.length) return;
  const hote = hoteMontage();
  if (!hote) return;
  const nom = projetNom || PROJET.nom || ('brouillon-' + horodate());
  try {
    fetch('/api/montage', {method: 'POST', keepalive: true,
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({projet: hote, nom: nom, montage: objetProjet()})
    }).catch(() => {});
    modifie = false;
  } catch (e) {}
}

// ---- bande horizontale des montages des projets ouverts ----------------
// Fermer un onglet le retire de la bande, rien de plus : le fichier reste
// dans <projet>/_projet/_montages/ et « Ouvrir » le retrouve. La liste des
// onglets fermes est memorisee d une session a l autre.
let MONTAGES = [];
const clefMontage = m => m.projet + '|' + m.nom;
let FERMES = new Set();
function chargerFermes() {
  FERMES = new Set((pref.lire('montagesFermes', '') || '')
    .split('\t').filter(Boolean));
}
function noterFermes() {
  pref.ecrire('montagesFermes', [...FERMES].join('\t'));
}
async function rafraichirProjets() {
  const b = $('#barreProjets');
  if (!OUVERTS.length) {
    b.innerHTML = '<span class="et">Sequences</span>' +
      '<span style="color:var(--sourd);font-size:11px">no project open</span>';
    return;
  }
  MONTAGES = await listerMontages();
  chargerFermes();
  MONT_OUVERTS = new Set((pref.lire('montOuverts', '') || '')
    .split('\t').filter(Boolean));
  rendreDossiers();
  const actif = m => m.nom === projetNom && m.projet === PROJET.pj;
  // Le montage ouvert reste toujours visible, meme si son onglet a ete ferme.
  const visibles = MONTAGES.filter(m => actif(m) || !FERMES.has(clefMontage(m)));
  const caches = MONTAGES.length - visibles.length;
  b.innerHTML = '<span class="et">Sequences</span>' +
    (visibles.length ? visibles.map(m =>
      '<span class="pu ' + (actif(m) ? 'on' : '') + '" data-p="' +
      m.nom.replace(/"/g, '&quot;') + '" data-pj="' + m.projet +
      '" title="' + m.projet + ' · modified on ' + m.maj + '">' +
      m.projet + ' / ' + m.nom +
      '<b class="x" data-fermerm="' + clefMontage(m).replace(/"/g, '&quot;') +
      '" title="close this tab — the file stays on disk">×</b>' +
      '</span>').join('')
      : '<span style="color:var(--sourd);font-size:11px">no sequence open</span>') +
    (caches ? '<span class="pu rouvrir" data-rouvrir="1" title="click: reopen all ' +
      '— right-click: choose">⟲ ' + caches + ' closed' +
      (caches > 1 ? 's' : '') + '</span>' : '') +
    '<span class="pu neuf" data-nouveau="1">+ new</span>' +
    '<span class="pu neuf" data-recharger="1" title="refresh the list">↻</span>';
}

// ---- clic droit sur la bande : gerer les onglets en lot -----------------
// Le chip « N fermés » ouvre ce menu, mais la bande entiere y repond : sans
// ca « fermer tous les autres » serait injoignable tant qu aucun onglet n est
// ferme, puisque le chip n existe pas encore.
const echap = x => String(x === undefined || x === null ? '' : x)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
const estActif = m => m.nom === projetNom && m.projet === PROJET.pj;
const ongletsFermes = () =>
  MONTAGES.filter(m => !estActif(m) && FERMES.has(clefMontage(m)));

$('#barreProjets').addEventListener('contextmenu', e => {
  const nf = ongletsFermes().length;
  // Rien de fermé : rien à proposer, on laisse le menu du navigateur.
  if (!nf) return;
  e.preventDefault();
  const m = $('#menu');
  m.innerHTML = '<div class="lbl">Closed tabs</div>' +
    '<div class="it" data-bar="tout">⟲ ' + (nf > 1
      ? 'Reopen the ' + nf + ' closed' : 'Reopen the closed tab') + '</div>' +
    '<div class="it" data-bar="choisir">☑ Choose which to reopen…</div>';
  m.className = 'on';
  const r = m.getBoundingClientRect();
  m.style.left = Math.min(e.clientX, innerWidth - r.width - 8) + 'px';
  m.style.top = Math.min(e.clientY, innerHeight - r.height - 8) + 'px';
});

// Les entrees portent « data-bar » et non « data-act » : le menu est partage
// avec celui des blocs, dont le gestionnaire ne cherche que « data-act » et
// ne verra donc rien ici.
$('#menu').addEventListener('click', e => {
