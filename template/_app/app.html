   [[0, 0, 0, 0, 0, 0, 0, 0, 1], -d]].forEach(([m, dx]) => {
    g2.filter = filtreCouleur([{m: m}]);
    g2.drawImage(t1, dx, 0);
  });
  g2.filter = 'none'; g2.globalCompositeOperation = 'source-over';
  const g1 = t1.getContext('2d');
  g1.clearRect(0, 0, w, h);
  g1.drawImage(t2, 0, 0);
}

function appliquerFx(t1, fx, w, h) {
  const g1 = t1.getContext('2d');
  for (const x of fx) {
    g1.setTransform(1, 0, 0, 1, 0, 0);
    g1.globalAlpha = 1; g1.globalCompositeOperation = 'source-over'; g1.filter = 'none';
    if (x.t === 'etal' || x.t === 'nb') {
      const etapes = etapesCouleur(x);
      if (!etapes.length) continue;
      const t2 = toileFx(2, w, h), g2 = t2.getContext('2d');
      g2.clearRect(0, 0, w, h);
      g2.filter = filtreCouleur(etapes);
      g2.drawImage(t1, 0, 0);
      g2.filter = 'none';
      g1.clearRect(0, 0, w, h);
      g1.drawImage(t2, 0, 0);
    } else if (x.t === 'flou') flouFx(t1, x, w, h);
    else if (x.t === 'vignette') vignetteFx(g1, w, h, fxNum(x, 'force', 40));
    else if (x.t === 'grain') grainFx(g1, w, h, fxNum(x, 'force', 25));
    else if (x.t === 'halation') halationFx(t1, x, w, h);
    else if (x.t === 'aberration') aberrationFx(t1, x, w, h);
  }
}

// Le calque d effet : sa pile s applique a TOUT ce qui est deja dessine
// dessous, pendant sa duree. Sa transparence dose l effet — 0 %, rien ; 100 %,
// l effet entier ; les fondus l amenent et le retirent en douceur.
function reglageSur(c, cw, ch) {
  const fx = fxA(c, tLect);
  if (!fx.length) return;
  const a = alpha(c, tLect) * valAnim(c, 'opac', tLect);
  if (a <= 0.005) return;
  const t1 = toileFx(1, cw, ch), g = t1.getContext('2d');
  g.clearRect(0, 0, cw, ch);
  g.drawImage(moni, 0, 0);
  appliquerFx(t1, fx, cw, ch);
  appliquerMasque(t1, c, cw, ch);
  ctx.globalAlpha = a;
  ctx.drawImage(t1, 0, 0);
  ctx.globalAlpha = 1;
}

// ---- prereglages ------------------------------------------------------------
// Ceux de la maison, puis ceux de la bibliotheque — rangés comme ceux de la
// secousse, sous le genre « fx ». Le « 16 mm » ajoute a un rush un leger
// flottement de couloir, avec la secousse existante.
const FX_MAISON = {
  '16 mm': {fx: [{t: 'etal', on: true, expo: 0, contraste: 12, satu: -12, temp: 18},
                 {t: 'halation', on: true, force: 45, seuil: 72, taille: 1.1,
                  teinte: '#ff5a1e'},
                 {t: 'vignette', on: true, force: 32},
                 {t: 'grain', on: true, force: 38}],
            couloir: {f: 1.2, a: 0.12, r: 0}}
};
let FX_PRESETS = {};
async function chargerPresetsFx() {
  try {
    const d = await api('api/presets?genre=fx');
    FX_PRESETS = (d && d.presets) || {};
  } catch (e) { FX_PRESETS = {}; }
}

// Ce qui part au rendu : les effets allumes, en nombres.
function fxRendu(c) {
  const l = fxActifs(c);
  return l.length ? JSON.parse(JSON.stringify(l)) : null;
}

// ---- le panneau ------------------------------------------------------------
const fmtFx = (v, pas, u) =>
  (pas < 0.1 ? v.toFixed(2) : pas < 1 ? v.toFixed(1) : String(Math.round(v))) + (u || '');

function rackFx(c, sel) {
  if (!c || (estSynth(c) && !estReglage(c)) || !piste(c.piste) ||
      piste(c.piste).type !== 'v') return '';
  const l = Array.isArray(c.fx) ? c.fx : [];
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;')
    .replace(/</g, '&lt;');
  let h = '<div class="rack"><div class="rackTete"><label>Effects</label>' +
    '<select data-fx-ajout><option value="">+ add an effect…</option>' +
    Object.keys(FX).map(k => '<option value="' + k + '">' + FX[k].nom +
      '</option>').join('') + '</select></div>' +
    '<div class="rackPresets"><select data-fx-preset>' +
    '<option value="">Presets…</option>' +
    Object.keys(FX_MAISON).map(n => '<option value="m:' + esc(n) + '">★ ' +
      esc(n) + '</option>').join('') +
    Object.keys(FX_PRESETS).sort().map(n => '<option value="p:' + esc(n) + '">' +
      esc(n) + '</option>').join('') +
    (l.length ? '<option value="+">＋ save this rack as a preset…</option>' : '') +
    (Object.keys(FX_PRESETS).length
      ? '<option value="-">✕ delete a preset…</option>' : '') +
    '</select></div>';
  if (!l.length) h += '<div class="rackVide">no effect on this block</div>';
  l.forEach((x, i) => {
    if (!FX[x.t]) return;
    const on = x.on !== false;
    h += '<div class="fxCarte' + (on ? '' : ' eteint') + '">' +
      '<div class="fxTete"><button class="fxOn' + (on ? ' on' : '') +
      '" data-fx-on="' + i + '" title="switch on / off">' + (on ? '●' : '○') +
      '</button><b>' + FX[x.t].nom + '</b><span class="pousse"></span>' +
      (i > 0 ? '<button class="fxPetit" data-fx-monte="' + i +
        '" title="apply earlier">↑</button>' : '') +
      (i < l.length - 1 ? '<button class="fxPetit" data-fx-descend="' + i +
        '" title="apply later">↓</button>' : '') +
      '<button class="fxPetit" data-fx-x="' + i + '" title="remove">✕</button></div>';
    const modes = x.t === 'flou'
      ? [['gauss', 'Gaussian'], ['dir', 'Directional'], ['tilt', 'Tilt-shift']]
      : x.t === 'nb' ? [['nb', 'B&W'], ['sepia', 'Sepia'], ['virage', 'Tint']] : null;
    if (x.t === 'halation')
      h += '<div class="fxCouleur">Glow colour <input type="color" data-fx-couleur="' +
        i + '" value="' + (x.teinte || '#ff5a1e') + '"></div>';
    const mode = x.mode || (modes ? modes[0][0] : '');
    if (modes) h += '<div class="fxModes">' + modes.map(m =>
      '<button data-fx-mode="' + m[0] + '" data-fx-i="' + i + '" class="' +
      (mode === m[0] ? 'on' : '') + '">' + m[1] + '</button>').join('') + '</div>';
    if (x.t === 'nb' && mode === 'virage')
      h += '<div class="fxCouleur">Tint colour <input type="color" data-fx-couleur="' +
        i + '" value="' + (x.teinte || '#d9a066') + '"></div>';
    const regl = x.t === 'flou' ? FX_REGLAGES.flou[mode] : FX_REGLAGES[x.t];
    const def = FX[x.t].neuf();
    regl.forEach(([k, et, mn, mx, pas, u]) => {
      const v = valFx(c, x, k, tLect);
      const l = clesFx(x, k) || [];
      const id = i + ':' + k;
      const ouvert = FX_ANIM_OUVERTS.has(id);
      h += '<div><label>' + et +
        '<button class="fleche ' + (ouvert ? 'on' : '') + '" data-fx-anim="' + id +
        '" title="keyframes">' + (ouvert ? '▾' : '▸') + '</button>' +
        (l.length ? '<i class="nbcle" style="color:' + couleurCle(x.t) + '">◆' +
          l.length + '</i>' : '') + '</label>' +
        '<div class="rang">' +
        '<input type="range" data-fx-p="' + k + '" data-fx-i="' + i +
        '" data-fx-u="' + u + '" min="' + mn + '" max="' + mx + '" step="' + pas +
        '" value="' + v + '"><span class="val">' + fmtFx(v, pas, u) +
        '</span></div>' + (ouvert ? panneauFx(c, x, i, k, pas, u) : '') + '</div>';
    });
    h += '</div>';
  });
  const autres = sel.filter(x => x !== c && (!estSynth(x) || estReglage(x)) &&
                             piste(x.piste) && piste(x.piste).type === 'v');
  if (autres.length)
    h += '<button class="fxAppliquer" data-fx-partout>Copy this rack to the ' +
      autres.length + ' other selected block' + (autres.length > 1 ? 's' : '') +
      '</button>';
  return h + '</div>';
}

// Les reglages d effet dont le panneau de cles est deplie, par « index:reglage ».
const FX_ANIM_OUVERTS = new Set();

// Le panneau de cles d un reglage d effet : le meme que celui des reglages de
// cadre (panneauAnim), pose sous le curseur.
function panneauFx(c, x, i, k, pas, u) {
  const l = clesFx(x, k) || [];
  const dedans = tLect >= c.t0 - 0.001 && tLect <= fin(c) + 0.001;
  const ici = +(tLect - c.t0).toFixed(3);
  const j = l.findIndex(p => Math.abs(p.t - ici) < 0.008);
  const id = i + ':' + k;
  return '<div class="animPan" style="--kc:' + couleurCle(x.t) + '"><div class="animBar">' +
    '<button data-fx-cle="' + id + '" class="' + (j >= 0 ? 'on' : '') + '"' +
    (dedans ? '' : ' disabled') + ' title="add or remove a key at the playhead">◆</button>' +
    '<button data-fx-cle-prec="' + id + '" title="previous key">◂</button>' +
    '<button data-fx-cle-suiv="' + id + '" title="next key">▸</button>' +
    '<span style="flex:1"></span>' +
    '<button data-fx-vide="' + id + '"' + (l.length ? '' : ' disabled') +
    ' title="clear the animation">✕</button></div>' +
    (l.length
      ? '<div class="animCles">' + l.map((p, q) =>
          '<span class="cle' + (Math.abs(p.t - ici) < 0.008 ? ' ici' : '') +
          '" data-fx-aller="' + id + ':' + q + '" title="go to this key">' +
          p.t.toFixed(2) + 's · ' + fmtFx(p.v, pas, u) +
          '<b data-fx-ote="' + id + ':' + q + '" title="remove">×</b></span>').join('') +
        '</div>'
      : '<div class="animVide">no keyframe' +
        (dedans ? ' — click ◆ to add one here' : ' — put the playhead on the block') +
        '</div>');
}

// Pose (ou remplace) une cle d effet a l instant t.
function poserCleFx(c, x, k, t, v) {
  x.anim = x.anim || {};
  const l = x.anim[k] = x.anim[k] || [];
  const ici = +Math.max(0, Math.min(dur(c), t - c.t0)).toFixed(3);
  const j = l.findIndex(p => Math.abs(p.t - ici) < 0.008);
  if (j >= 0) l[j].v = v; else l.push({t: ici, v: v});
  l.sort((p, q) => p.t - q.t);
}
function viderCleFx(x, k) {
  if (!x.anim) return;
  delete x.anim[k];
  if (!Object.keys(x.anim).length) delete x.anim;
}

function lierRackFx(r, c, sel) {
  const rack = r.querySelector('.rack');
  if (!rack) return;
  const liste = () => (Array.isArray(c.fx) ? c.fx : (c.fx = []));
  const fini = refaire => {
    modifie = true;
    dessiner();
    if (refaire) rendreReglages();
  };
  let glisse = false;
  // ---- les cles des reglages d effet ----
  rack.addEventListener('click', e => {
    const b = e.target.closest('[data-fx-anim],[data-fx-cle],[data-fx-cle-prec],' +
      '[data-fx-cle-suiv],[data-fx-vide],[data-fx-aller],[data-fx-ote]');
    if (!b || b.disabled) return;
    e.stopPropagation();
    const d = b.dataset;
    const id = d.fxAnim || d.fxCle || d.fxClePrec || d.fxCleSuiv || d.fxVide ||
               d.fxAller || d.fxOte;
    const [i, k, q] = id.split(':');
    const x = liste()[+i];
    if (!x) return;
    if (d.fxAnim) {
      FX_ANIM_OUVERTS.has(i + ':' + k) ? FX_ANIM_OUVERTS.delete(i + ':' + k)
                                       : FX_ANIM_OUVERTS.add(i + ':' + k);
      rendreReglages(); return;
    }
    const l = clesFx(x, k) || [];
    if (d.fxClePrec || d.fxCleSuiv) {
      const ici = tLect - c.t0, sens = d.fxCleSuiv ? 1 : -1;
      const c2 = sens > 0 ? l.find(p => p.t > ici + 0.008)
                          : [...l].reverse().find(p => p.t < ici - 0.008);
      if (!c2) { dire(sens > 0 ? 'last key' : 'first key'); return; }
      allerAuTemps(c.t0 + c2.t); rendreReglages(); return;
    }
    if (d.fxAller && !e.target.dataset.fxOte) {
      if (l[+q]) { allerAuTemps(c.t0 + l[+q].t); rendreReglages(); }
      return;
    }
    memoriser();
    if (d.fxCle) {
      const ici = +(tLect - c.t0).toFixed(3);
      const j = l.findIndex(p => Math.abs(p.t - ici) < 0.008);
      // Une cle posee prend la valeur effective a cet instant : la premiere
      // fige la valeur fixe, la deuxieme cree le mouvement.
      if (j >= 0) { l.splice(j, 1); if (!l.length) viderCleFx(x, k); }
      else poserCleFx(c, x, k, tLect, valFx(c, x, k, tLect));
    } else if (d.fxVide) {
      // On garde comme valeur fixe celle qui est a l ecran.
      x[k] = valFx(c, x, k, tLect);
      viderCleFx(x, k);
    } else if (d.fxOte) {
      l.splice(+q, 1); if (!l.length) viderCleFx(x, k);
    }
    modifie = true;
    rendreReglages(); rendreLanes(); dessiner();
  }, true);
  rack.oninput = e => {
    const s = e.target.closest('input[type=range][data-fx-p]');
    if (s) {
      if (!glisse) { memoriser(); glisse = true; }
      const v = parseFloat(s.value);
      const x = liste()[+s.dataset.fxI];
      // Un reglage anime : le curseur pose (ou corrige) la cle a la tete de
      // lecture, comme pour le cadre. Sinon il change la valeur fixe.
      if (clesFx(x, s.dataset.fxP) && tLect >= c.t0 - 0.001 && tLect <= fin(c) + 0.001)
        poserCleFx(c, x, s.dataset.fxP, tLect, v);
      else x[s.dataset.fxP] = v;
      s.nextElementSibling.textContent =
        fmtFx(v, +(s.dataset.pas || s.step), s.dataset.fxU);
      fini(false);
      return;
    }
    const co = e.target.closest('input[type=color][data-fx-couleur]');
    if (co) {
      if (!glisse) { memoriser(); glisse = true; }
      liste()[+co.dataset.fxCouleur].teinte = co.value;
      fini(false);
    }
  };
  rack.onchange = async e => {
    glisse = false;
    const aj = e.target.closest('select[data-fx-ajout]');
    if (aj && aj.value && FX[aj.value]) {
      memoriser();
      liste().push(Object.assign({t: aj.value, on: true}, FX[aj.value].neuf()));
      fini(true);
      return;
    }
    const pr = e.target.closest('select[data-fx-preset]');
    if (!pr || !pr.value) return;
    const v = pr.value;
    pr.value = '';
    if (v === '+') {
      const nom = (prompt('Name of the preset:') || '').trim();
      if (!nom) return;
      try {
        const d = await api('api/presets',
          {genre: 'fx', nom: nom, valeur: {fx: JSON.parse(JSON.stringify(liste()))}});
        FX_PRESETS = d.presets || FX_PRESETS;
        dire('preset “' + nom + '” saved');
        rendreReglages();
      } catch (err) { dire('preset not saved — ' + err.message, true); }
      return;
    }
    if (v === '-') {
      const noms = Object.keys(FX_PRESETS).sort();
      const nom = (prompt('Preset to delete:\n' + noms.join('\n')) || '').trim();
      if (!nom) return;
      try {
        const d = await api('api/presets', {genre: 'fx', nom: nom, effacer: true});
        FX_PRESETS = d.presets || {};
        dire('preset “' + nom + '” deleted');
        rendreReglages();
      } catch (err) { dire('not deleted — ' + err.message, true); }
      return;
    }
    const maison = v.slice(0, 2) === 'm:';
    const p = maison ? FX_MAISON[v.slice(2)] : FX_PRESETS[v.slice(2)];
    if (!p || !Array.isArray(p.fx)) return;
    memoriser();
    c.fx = JSON.parse(JSON.stringify(p.fx));
    // Le flottement de couloir : sur un rush seulement, un calque d effet
    // n a pas de cadre a faire bouger.
    if (p.couloir && !estReglage(c)) {
      const q = Object.assign(coucheNeuve(), p.couloir);
      c.shk = true;
      couchesEcrire(c, [q]);
    }
    dire('preset “' + v.slice(2) + '” applied');
    fini(true);
  };
  rack.onclick = e => {
    const b = e.target.closest('button');
    if (!b) return;
    const L = liste(), d = b.dataset;
    if (d.fxOn !== undefined) {
      memoriser(); const x = L[+d.fxOn]; x.on = x.on === false; fini(true);
    } else if (d.fxX !== undefined) {
      memoriser(); L.splice(+d.fxX, 1); if (!L.length) delete c.fx; fini(true);
    } else if (d.fxMonte !== undefined) {
      memoriser(); const k = +d.fxMonte; [L[k - 1], L[k]] = [L[k], L[k - 1]]; fini(true);
    } else if (d.fxDescend !== undefined) {
      memoriser(); const k = +d.fxDescend; [L[k + 1], L[k]] = [L[k], L[k + 1]]; fini(true);
    } else if (d.fxMode !== undefined) {
      memoriser(); L[+d.fxI].mode = d.fxMode; fini(true);
    } else if (d.fxPartout !== undefined) {
      memoriser();
      const cibles = sel.filter(x => x !== c && (!estSynth(x) || estReglage(x)) &&
                                piste(x.piste) && piste(x.piste).type === 'v');
      cibles.forEach(x => {
        if (L.length) x.fx = JSON.parse(JSON.stringify(L)); else delete x.fx;
      });
      dire('rack copied to ' + cibles.length + ' block' + (cibles.length > 1 ? 's' : ''));
      fini(false);
    }
  };
}

function dessiner() {
  // Image en cache : on la pose telle quelle, rien d autre a faire.
  const bmp = imageCache(tLect);
  if (bmp) {
    ctx.globalAlpha = 1;
    ctx.drawImage(bmp, 0, 0, moni.width, moni.height);
    return;
  }
  const pv = pistesOrdonnees().filter(p => p.type === 'v' && visible(p));
  const aDessiner = [];
  for (let i = pv.length - 1; i >= 0; i--) {
    actifs(tLect).filter(c => c.piste === pv[i].id)
      .sort((a, b) => a.t0 - b.t0).forEach(c => aDessiner.push(c));
  }
  // Un plan attendu dont le lecteur n est pas encore pret : l ancien code
  // effacait quand meme la toile et ne dessinait rien — un eclair noir en
  // plein milieu de la coupe. Deux images gelees se voient mille fois moins.
  // Au-dela d un quart de seconde on repeint quand meme : un fichier
  // introuvable ne doit pas figer le moniteur pour toujours.
  const pasPret = aDessiner.filter(c => {
    if (estSynth(c)) return false;
    if (estImage(c)) {
      const im = imageDe(c);
      return !im || !im.naturalWidth;
    }
    const v = POOL.get(c.uid);
    return !v || !v.videoWidth || v.readyState < 2;
  }).map(c => c.uid);
  const t = performance.now();
  if (pasPret.length) {
    const qui = pasPret.join(',');
    if (!GEL.depuis || GEL.qui !== qui) { GEL.depuis = t; GEL.qui = qui; }
    if (t - GEL.depuis < 250) return;
  } else { GEL.depuis = 0; GEL.qui = ''; }
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, moni.width, moni.height);
  const cw = moni.width, ch = moni.height;
  aDessiner.forEach(c => {
    if (estReglage(c)) { reglageSur(c, cw, ch); return; }
    if (estSynth(c)) {
      // Un calque ou un texte masque : pose seul sur une toile, masque,
      // puis pose sur l image.
      if (masqueActif(c)) {
        const tl = toileFx(1, cw, ch), g = tl.getContext('2d');
        g.clearRect(0, 0, cw, ch);
        dessinerSynth(c, cw, ch, g);
        appliquerMasque(tl, c, cw, ch);
        ctx.globalAlpha = 1;
        ctx.drawImage(tl, 0, 0);
      } else dessinerSynth(c, cw, ch);
      return;
    }
    const v = estImage(c) ? imageDe(c) : POOL.get(c.uid);
    if (!v) return;
    // Une balise image donne « naturalWidth », un lecteur « videoWidth » :
    // tout le reste du dessin est identique.
    const vw = v.videoWidth || v.naturalWidth,
          vh = v.videoHeight || v.naturalHeight;
    if (!vw || !vh) return;
    const a = alpha(c, tLect) * valAnim(c, 'opac', tLect);
    if (a <= 0.005) return;
    const base = c.mode === 'cover' ? Math.max(cw / vw, ch / vh)
                                    : Math.min(cw / vw, ch / vh);
    const [sx, sy] = secousse(c, tLect);
    const rot = rotationSecousse(c, tLect);
    const k = base * valAnim(c, 'ech', tLect) * margeSecousse(c),
          w = vw * k, h = vh * k;
    const px = (cw - w) / 2 + valAnim(c, 'dx', tLect) * cw / 200 + sx * cw / 100;
    const py = (ch - h) / 2 + valAnim(c, 'dy', tLect) * ch / 200 + sy * ch / 100;
    // Un plan avec effets se dessine d abord seul, sur une toile a part, a sa
    // place dans le cadre ; on lui applique ses effets, puis on le pose avec
    // sa transparence — l ordre du rendu. Sans effet, rien ne change.
    const fx = fxA(c, tLect);
    const toile = (fx.length || masqueActif(c)) ? toileFx(1, cw, ch) : null;
    const g = toile ? toile.getContext('2d') : ctx;
    if (toile) g.clearRect(0, 0, cw, ch); else ctx.globalAlpha = a;
    if (rot) {
      // Comme ffmpeg : on tourne le cadre autour de SON centre, pas autour du
      // coin du plan.
      g.save();
      g.translate(cw / 2, ch / 2);
      g.rotate(rot * Math.PI / 180);
      g.translate(-cw / 2, -ch / 2);
      g.drawImage(v, px, py, w, h);
      g.restore();
    } else {
      g.drawImage(v, px, py, w, h);
    }
    if (toile) {
      if (fx.length) appliquerFx(toile, fx, cw, ch);
      appliquerMasque(toile, c, cw, ch);
      ctx.globalAlpha = a;
      ctx.drawImage(toile, 0, 0);
    }
  });
  ctx.globalAlpha = 1;
  majContourMasque();
}

// Calque de couleur et texte : dessines directement sur la toile, avec les
// memes valeurs animees que les rushes — transparence, echelle et position
// marchent donc pareil, images-cles comprises.
// Rouvre la boite du bloc synthetique selectionne. Le double-clic sur le
// bloc y mene aussi : c est le geste qu on essaie d instinct.
function modifierSynth() {
  const c = CLIPS.find(x => clipsSel.has(x.uid) && estSynth(x));
  if (!c) { dire('select a layer or a text'); return; }
  if (estReglage(c)) { REG_ONGLET = 'fx'; rendreReglages(); return; }
  if (c.genre === 'texte') { boiteTexte(c); return; }
  const neuf = prompt('Layer colour (e.g. #1a2b3c):', c.fond || '#000000');
  if (!neuf) return;
  const v = neuf.trim();
  if (!/^#[0-9a-fA-F]{6}$/.test(v)) { dire('invalid colour — #rrggbb format', true); return; }
  memoriser();
  c.fond = v.toLowerCase();
  rendreTimeline(); dessiner();
  dire('layer ' + c.fond);
}

$('#lanes').addEventListener('dblclick', e => {
  const el = e.target.closest('.clip');
  if (!el) return;
  const c = parUid(+el.dataset.uid);
  if (!c || !estSynth(c)) return;
  e.preventDefault();
  clipsSel = new Set([c.uid]);
  rendreLanes(); rendreReglages();
  modifierSynth();
});

function dessinerSynth(c, cw, ch, g) {
  g = g || ctx;
  const a = alpha(c, tLect) * valAnim(c, 'opac', tLect);
  if (a <= 0.005) return;
  const [sx, sy] = secousse(c, tLect);
  const rotS = rotationSecousse(c, tLect);
  // Le calque de couleur est agrandi comme un rush ; le texte, lui, n a pas
  // de bord a decouvrir : il se contente de bouger.
  const k = valAnim(c, 'ech', tLect) *
            (c.genre === 'couleur' ? margeSecousse(c) : 1);
  const ox = valAnim(c, 'dx', tLect) * cw / 200 + sx * cw / 100;
  const oy = valAnim(c, 'dy', tLect) * ch / 200 + sy * ch / 100;
  g.save();
  if (rotS) {
    g.translate(cw / 2, ch / 2);
    g.rotate(rotS * Math.PI / 180);
    g.translate(-cw / 2, -ch / 2);
  }
  g.globalAlpha = a;
  if (c.genre === 'couleur') {
    const w = cw * k, h = ch * k;
    g.fillStyle = c.fond || '#000000';
    g.fillRect((cw - w) / 2 + ox, (ch - h) / 2 + oy, w, h);
  } else if (c.genre === 'texte') {
    const pol = POLICES[c.police] || POLICES[POLICE_DEFAUT];
    const taille = Math.max(5, ch * (c.taille || 9) / 100 * k);
    g.font = taille + 'px ' + pol.css;
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    const lignes = String(c.txt === undefined ? '' : c.txt).split('\n');
    const inter = taille * 1.2;
    const y0 = ch / 2 + oy - (lignes.length - 1) * inter / 2;
    lignes.forEach((L, i) => {
      const y = y0 + i * inter;
      if (c.ombre !== false) {
        g.fillStyle = 'rgba(0,0,0,.6)';
        g.fillText(L, cw / 2 + ox + taille * 0.045, y + taille * 0.045);
      }
      g.fillStyle = c.teinte || '#ffffff';
      g.fillText(L, cw / 2 + ox, y);
    });
  }
  g.restore();
}

// Points de coupe : debuts et fins de blocs, plus les reperes I et O.
function pointsDeCoupe() {
  const t = new Set([0]);
  CLIPS.forEach(c => { t.add(+c.t0.toFixed(3)); t.add(+fin(c).toFixed(3)); });
  if (tIn !== null) t.add(+tIn.toFixed(3));
  if (tOut !== null) t.add(+tOut.toFixed(3));
  return [...t].sort((a, b) => a - b);
}
// Ce sur quoi la tete de lecture s aimante (Shift) : les coupes, et aussi les
// images-cles de tous les blocs — cadre et effets — et les marqueurs (David,
// 07/10). Les fleches haut/bas, elles, restent de coupe en coupe.
function pointsTete() {
  const s = new Set(pointsDeCoupe());
  CLIPS.forEach(c => clesDuBloc(c).forEach(k => {
    if (k.t >= -0.001 && k.t <= dur(c) + 0.001) s.add(+(c.t0 + k.t).toFixed(3));
  }));
  (MARQUEURS || []).forEach(x => s.add(+(+x).toFixed(3)));
  return [...s].sort((a, b) => a - b);
}
function plagePrecedente() {
  const l = pointsDeCoupe().filter(x => x < tLect - 0.03);
  return l.length ? l[l.length - 1] : 0;
}
function plageSuivante() {
  const l = pointsDeCoupe().filter(x => x > tLect + 0.03);
  return l.length ? l[0] : dureeTotale();
}

let boucleIO = false;

function lire() {
  if (!CLIPS.length) { dire('the timeline is empty'); return; }
  // Des qu un repere est pose, la lecture se joue dans son intervalle. La
  // lecture s arrete sur la sortie : la tete y reste collee, et rappuyer sur
  // play ne ferait rien. On revient donc a l entree — que la boucle soit
  // active ou non, c est ce qu on attend d un point d entree.
  const a = tIn !== null ? tIn : 0;
  const b = tOut !== null ? tOut : dureeTotale();
  if (tIn !== null || tOut !== null) {
    if (tLect >= b - 0.02 || tLect < a - 0.001) tLect = a;
  } else if (tLect >= dureeTotale() - 0.05) tLect = 0;
  if (CACHE.pret && !cacheAJour())
    viderCache('cache released — the sequence changed');
  enLecture = true; t0Lect = tLect; horloge0 = performance.now();
  $('#bPlay').classList.add('on');
  resynchroniser(true);
}
function pause() {
  enLecture = false;
  $('#bPlay').classList.remove('on');
  for (const [, v] of POOL) v.pause();
}
$('#bPlay').onclick = lire;
$('#bPause').onclick = pause;
$('#bStop').onclick = () => {
  pause();
  tLect = (tIn !== null ? tIn : 0);
  majTete();
  $('#tlDefile').scrollLeft = Math.max(0, tLect * PPS - 60);
  majVue(); resynchroniser(true);
};
$('#bPrec').onclick = () => allerAuTemps(plagePrecedente());
$('#bSuiv').onclick = () => allerAuTemps(plageSuivante());
function poserUnite(u) {
  unite = u;
  $('#bUnite').textContent = (u === 'img' ? 'IMG' : 'SEC');
  $('#bUnite').classList.toggle('on', u === 'img');
  pref.ecrire('unite', u);
  majTete();
  const n = CLIPS.length;
  majEtatSauve();
}
$('#bUnite').onclick = () => poserUnite(unite === 'sec' ? 'img' : 'sec');

$('#bBoucle').onclick = () => {
  boucleIO = !boucleIO;
  $('#bBoucle').classList.toggle('on', boucleIO);
  dire(boucleIO
    ? ((tIn === null && tOut === null)
        ? 'loop on — set the I and O points'
        : 'loop between ' + tc(tIn === null ? 0 : tIn) + ' and ' +
          tc(tOut === null ? dureeTotale() : tOut))
    : 'loop off');
};
$('#bPlein').onclick = () => {
  const m = $('#moniteur');
  if (document.fullscreenElement) document.exitFullscreen();
  else m.requestFullscreen().catch(err => dire('fullscreen refused: ' + err.message, true));
};
document.addEventListener('fullscreenchange', () => {
  $('#bPlein').classList.toggle('on', !!document.fullscreenElement);
});

function boucle() {
  if (enLecture) {
    tLect = t0Lect + (performance.now() - horloge0) / 1000;
    const fi = tOut !== null ? tOut : dureeTotale();
    if (boucleIO && tIn !== null && tOut !== null && tLect >= tOut) {
      tLect = tIn; t0Lect = tIn; horloge0 = performance.now();
      resynchroniser(true);
    } else if (tLect >= fi) { tLect = fi; pause(); }
    majTete(); resynchroniser(false);
  }
  dessiner();
  requestAnimationFrame(boucle);
}
</script>
<style>
.zoneIO{position:absolute;top:0;height:21px;background:#e8b93a2e;
 border-left:2px solid var(--or);border-right:2px solid var(--or);
 z-index:2;pointer-events:none}
.horsIO{position:absolute;top:21px;bottom:0;background:#0000005c;
 z-index:4;pointer-events:none}
.marqueIO{position:absolute;top:0;height:21px;width:12px;z-index:6;
 cursor:ew-resize;background:var(--or);color:#1a1917;
 font:bold 10px/21px ui-monospace,monospace;text-align:center}
.marqueIO.in{border-radius:3px 0 0 3px}
.marqueIO.out{border-radius:0 3px 3px 0}
/* La poignee du milieu : elle emmene l entree ET la sortie, d un bloc. */
.marqueIO.duo{width:20px;border-radius:3px;cursor:grab;font-size:11px}
.marqueIO.duo:active{cursor:grabbing}
.marqueIO:hover{box-shadow:0 0 7px #e8b93a}
</style>
<script>
// ===========================================================================
//  Points d'entrée / sortie de séquence  (I et O)
// ===========================================================================
let tIn = null, tOut = null;

function majIO() {
  $$('.zoneIO,.horsIO,.marqueIO').forEach(e => e.remove());
  const cont = $('#tlContenu');
  if (tIn === null && tOut === null) return;
  const a = tIn === null ? 0 : tIn;
  const b = tOut === null ? dureeTotale() : tOut;
  const z = document.createElement('div');
  z.className = 'zoneIO';
  z.style.left = (a * PPS) + 'px';
  z.style.width = Math.max(2, (b - a) * PPS) + 'px';
  cont.appendChild(z);
  if (a > 0) {
    const g = document.createElement('div');
    g.className = 'horsIO';
    g.style.left = '0px'; g.style.width = (a * PPS) + 'px';
    cont.appendChild(g);
  }
  const totalPx = parseFloat(cont.style.width) || 0;
  if (b * PPS < totalPx) {
    const d = document.createElement('div');
    d.className = 'horsIO';
    d.style.left = (b * PPS) + 'px';
    d.style.width = (totalPx - b * PPS) + 'px';
    cont.appendChild(d);
  }
  // Reperes saisissables : une fois poses, on les deplace a la souris.
  const marque = (quel, t, dec) => {
    const m = document.createElement('div');
    m.className = 'marqueIO ' + quel;
    m.dataset.io = quel;
    m.textContent = quel === 'in' ? 'I' : 'O';
    m.title = (quel === 'in' ? 'in point' : 'out point') +
      ' — drag to move it';
    m.style.left = (t * PPS - dec) + 'px';
    cont.appendChild(m);
  };
  if (tIn !== null) marque('in', tIn, 0);
  if (tOut !== null) marque('out', tOut, 12);
  // Les deux points poses : une poignee au milieu les deplace ensemble.
  if (tIn !== null && tOut !== null) {
    const d = document.createElement('div');
    d.className = 'marqueIO duo';
    d.dataset.io = 'duo';
    d.textContent = '↔';
    d.title = 'in and out — drag to move both, keeping the same length (' +
      (tOut - tIn).toFixed(2) + 's)';
    d.style.left = ((a + b) / 2 * PPS - 10) + 'px';
    cont.appendChild(d);
  }
}

$('#tlContenu').addEventListener('pointerdown', e => {
  const m = e.target.closest('[data-io]');
  if (!m || e.button === 2) return;
  e.preventDefault(); e.stopPropagation();
  const quel = m.dataset.io;
  const duo = quel === 'duo';
  const r = $('#tlContenu').getBoundingClientRect();
  // La poignee du milieu garde l ecart entre les deux points : on la suit
  // par son centre, et l ecart ne change pas d un pixel.
  const demi = duo ? (tOut - tIn) / 2 : 0;
  const repere = duo ? (tIn + tOut) / 2 : (quel === 'in' ? tIn : tOut);
  // on garde l ecart entre le point de saisie et le repere, sinon il saute
  const dec = (e.clientX - r.left) - repere * PPS;
  const bouger = ev => {
    const t = Math.max(0, Math.min(etendue(), (ev.clientX - r.left - dec) / PPS));
    if (duo) {
      const centre = Math.max(demi, Math.min(etendue() - demi, t));
      tIn = centre - demi;
      tOut = centre + demi;
    } else if (quel === 'in') tIn = (tOut !== null) ? Math.min(t, tOut - 0.1) : t;
    else tOut = (tIn !== null) ? Math.max(t, tIn + 0.1) : t;
    majIO();
  };
  const lacher = () => {
    window.removeEventListener('pointermove', bouger);
    window.removeEventListener('pointerup', lacher);
    dire('in ' + tc(tIn === null ? 0 : tIn) + '   sortie ' +
      tc(tOut === null ? dureeTotale() : tOut));
  };
  window.addEventListener('pointermove', bouger);
  window.addEventListener('pointerup', lacher);
}, true);
// Clic droit sur le repère jaune : le retirer, ou l amener sous la tête.
// Sa propre référence à #menu, pour ne pas dépendre de l ordre d évaluation
// des blocs <script> — c est le même nœud.
const ioMenu = $('#menu');
$('#tlContenu').addEventListener('contextmenu', e => {
  const m = e.target.closest('[data-io]');
  if (!m) return;
  e.preventDefault(); e.stopPropagation();
  const quel = m.dataset.io;
  const deux = tIn !== null && tOut !== null;
  ioMenu.innerHTML = '<div class="lbl">' +
    (quel === 'duo'
      ? 'in ' + tc(tIn) + ' → out ' + tc(tOut) +
        ' · ' + (tOut - tIn).toFixed(2) + 's'
      : quel === 'in' ? 'Enter · ' + tc(tIn) : 'Output · ' + tc(tOut)) +
    '</div>' +
    (quel === 'duo' ? ''
      : '<div class="it" data-io-ote="' + quel + '">✕ Remove this point</div>') +
    (deux ? '<div class="it" data-io-ote="tout">✕ Remove both</div>' : '') +
    '<div class="sep"></div>' +
    '<div class="it" data-io-tete="' + quel + '">↦ ' +
    (quel === 'duo' ? 'Bring the range to playhead' : 'Bring to playhead') +
    '</div>';
  ioMenu.className = 'on';
  const r = ioMenu.getBoundingClientRect();
  ioMenu.style.left = Math.min(e.clientX, innerWidth - r.width - 8) + 'px';
  ioMenu.style.top = Math.min(e.clientY, innerHeight - r.height - 8) + 'px';
}, true);

ioMenu.addEventListener('click', e => {
  const ote = e.target.closest('[data-io-ote]');
  const tete = e.target.closest('[data-io-tete]');
  if (!ote && !tete) return;
  ioMenu.className = '';
  if (tete) {
    const q = tete.dataset.ioTete;
    if (q === 'duo') {
      // La zone entiere vient se poser sous la tete de lecture, longueur
      // inchangee.
      const ecart = tOut - tIn;
      tIn = Math.max(0, tLect);
      tOut = tIn + ecart;
      majIO();
      dire('in ' + tc(tIn) + '   out ' + tc(tOut));
    } else if (q === 'in') poserIn();
    else poserOut();
    return;
  }
  const q = ote.dataset.ioOte;
  if (q === 'tout') { tIn = null; tOut = null; dire('I/O points removed'); }
  else if (q === 'in') { tIn = null; dire('in point removed'); }
  else { tOut = null; dire('out point removed'); }
  majIO();
});

// M comme marqueur. Un bloc selectionne sous la tete de lecture ? Le
// marqueur lui appartient et le suivra. Sinon il appartient a la sequence.
function poserMarqueur() {
  const sel = CLIPS.filter(c => clipsSel.has(c.uid));
  const sous = sel.filter(c => tLect >= c.t0 - 1e-6 && tLect < fin(c));
  if (sel.length && !sous.length) {
    dire('the playhead is not over the selected block', true);
    return;
  }
  memoriser();
  if (sous.length) {
    let n = 0;
    sous.forEach(c => {
      const x = +mqSource(c, tLect).toFixed(4);
      if (!Array.isArray(c.mq)) c.mq = [];
      if (c.mq.some(y => Math.abs(y - x) < 0.004)) return;
      c.mq.push(x); c.mq.sort((a, b) => a - b); n++;
    });
    rendreLanes(); modifie = true;
    dire(n ? 'marker on ' + (n > 1 ? n + ' blocks' : 'the block') + ' at ' + tc(tLect)
           : 'there is already a marker there');
    return;
  }
  const t = +tLect.toFixed(4);
  if (MARQUEURS.some(y => Math.abs(y - t) < 0.004)) {
    HISTO.pop(); dire('there is already a marker there'); return;
  }
  MARQUEURS.push(t); MARQUEURS.sort((a, b) => a - b);
  majMarqueurs(); modifie = true;
  dire('marker at ' + tc(t));
}

// Glisser un marqueur de sequence. Maj enfoncee, il se colle aux bords de bloc
// et aux autres marqueurs, comme tout le reste.
$('#tlContenu').addEventListener('pointerdown', e => {
  const m = e.target.closest('.marque');
  if (!m || e.button === 2) return;
  e.preventDefault(); e.stopPropagation();
  let i = +m.dataset.mq;
  const r = $('#tlContenu').getBoundingClientRect();
  const dec = (e.clientX - r.left) - MARQUEURS[i] * PPS;
  let bouge = false;
  const bouger = ev => {
    if (!bouge) { memoriser(); bouge = true; }
    const t = Math.max(0, (ev.clientX - r.left - dec) / PPS);
    // On se retire de la liste avant de calculer l aimant : sinon le marqueur
    // se collerait a lui-meme et ne bougerait plus d un pouce.
    const garde = MARQUEURS.splice(i, 1)[0];
    const neuf = +aimanter(t, new Set(), ev.shiftKey).toFixed(4);
    MARQUEURS.splice(i, 0, isNaN(neuf) ? garde : neuf);
    majMarqueurs();
  };
  const lacher = () => {
    window.removeEventListener('pointermove', bouger);
    window.removeEventListener('pointerup', lacher);
    if (!bouge) return;
    const t = MARQUEURS[i];
    MARQUEURS.sort((a, b) => a - b);
    majMarqueurs(); modifie = true;
    dire('marker at ' + tc(t));
  };
  window.addEventListener('pointermove', bouger);
  window.addEventListener('pointerup', lacher);
}, true);

$('#tlContenu').addEventListener('dblclick', e => {
  const m = e.target.closest('.marque');
  if (!m) return;
  e.preventDefault(); e.stopPropagation();
  memoriser();
  const t = MARQUEURS[+m.dataset.mq];
  MARQUEURS.splice(+m.dataset.mq, 1);
  majMarqueurs(); modifie = true;
  dire('marker ' + tc(t) + ' removed');
}, true);

// Les marqueurs d un bloc : meme geste, mais en phase de capture, sinon le
// bloc partirait avec la souris avant que le marqueur ait vu le clic.
$('#lanes').addEventListener('pointerdown', e => {
  const el = e.target.closest('.mqb');
  if (!el || e.button === 2) return;
  const bloc = el.closest('.clip');
  const c = bloc && parUid(+bloc.dataset.uid);
  if (!c) return;
  e.preventDefault(); e.stopPropagation();
  const depart = parseFloat(el.dataset.mqb);
  const i = mqBloc(c).findIndex(x => Math.abs(x - depart) < 1e-4);
  if (i < 0) return;
  const r = $('#tlContenu').getBoundingClientRect();
  const dec = (e.clientX - r.left) - mqTemps(c, depart) * PPS;
  let bouge = false;
  const bouger = ev => {
    if (!bouge) { memoriser(); bouge = true; }
    const t = (ev.clientX - r.left - dec) / PPS;
    const x = Math.max(c.e, Math.min(c.o,
      mqSource(c, aimanter(t, new Set([c.uid]), ev.shiftKey))));
    c.mq[i] = +x.toFixed(4);
    el.style.left = ((mqTemps(c, c.mq[i]) - c.t0) * PPS) + 'px';
  };
  const lacher = () => {
    window.removeEventListener('pointermove', bouger);
    window.removeEventListener('pointerup', lacher);
    if (!bouge) return;
    c.mq.sort((a, b) => a - b);
    rendreLanes(); modifie = true;
    dire('block marker at ' + tc(mqTemps(c, c.mq[i])));
  };
  window.addEventListener('pointermove', bouger);
  window.addEventListener('pointerup', lacher);
}, true);

$('#lanes').addEventListener('dblclick', e => {
  const el = e.target.closest('.mqb');
  if (!el) return;
  const bloc = el.closest('.clip');
  const c = bloc && parUid(+bloc.dataset.uid);
  if (!c) return;
  e.preventDefault(); e.stopPropagation();
  const depart = parseFloat(el.dataset.mqb);
  const i = mqBloc(c).findIndex(x => Math.abs(x - depart) < 1e-4);
  if (i < 0) return;
  memoriser();
  c.mq.splice(i, 1);
  rendreLanes(); modifie = true;
  dire('block marker removed');
}, true);

function poserIn() {
  tIn = tLect;
  if (tOut !== null && tOut <= tIn) tOut = null;
  majIO(); dire('in point at ' + tc(tIn));
}
function poserOut() {
  tOut = tLect;
  if (tIn !== null && tIn >= tOut) tIn = null;
  majIO(); dire('out point at ' + tc(tOut));
}
function effacerIO() { tIn = null; tOut = null; majIO(); dire('I/O points cleared'); }
const bornes = () => ({a: tIn === null ? 0 : tIn,
                       b: tOut === null ? dureeTotale() : tOut});

// ===========================================================================
//  Clavier
// ===========================================================================
// Ce qui avale vraiment une frappe. Un curseur (volume de piste, tete de
// lecture, taille des vignettes) est un INPUT, mais il garde le focus apres le
// clic : le garde-fou d origine rendait la barre d espace muette des qu on
// avait touche un volume. Il garde en revanche ses fleches, qui lui servent.
const SANS_SAISIE = new Set(['range', 'checkbox', 'radio', 'button', 'submit',
                             'reset', 'file', 'color', 'image']);
const FLECHES = new Set(['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown',
                         'Home', 'End', 'PageUp', 'PageDown']);
function saisieActive(el) {
  if (!el || !el.tagName) return false;
  if (el.isContentEditable) return true;
  const n = el.tagName;
  if (n === 'TEXTAREA' || n === 'SELECT') return true;
  if (n !== 'INPUT') return false;
  return !SANS_SAISIE.has((el.type || 'text').toLowerCase());
}

// ===========================================================================
//  Taper une valeur : double-clic sur le chiffre d un curseur
// ===========================================================================
// Le chiffre affiche a cote d un curseur devient un petit champ : on tape au
// pave numerique, Entree valide, Echap renonce, cliquer ailleurs valide. La
// valeur passe par le curseur lui-meme — on la pose, puis on emet ses
// evenements —, pour que son code reste le seul a ecrire dans le montage :
// images-cles, selection multiple, bloc son lie, zone morte de la vitesse.
function curseurDeValeur(el) {
  if (el.classList.contains('pVal'))
    return el.parentElement.querySelector('input.vol');
  const s = el.previousElementSibling;
  return s && s.matches('input[type=range]') ? s : null;
}

function poserValeurTapee(sl, txt, pct) {
  const n = parseFloat(String(txt).replace(',', '.').replace(/[^0-9.+-]/g, ''));
  if (!isFinite(n)) { dire('not a number — nothing changed'); return; }
  const voulu = pct ? n / 100 : n;
  const mn = parseFloat(sl.min), mx = parseFloat(sl.max);
  const v = Math.min(mx, Math.max(mn, voulu));
  const aff = x => pct ? Math.round(x * 100) + '%' : String(+x.toFixed(3));
  if (Math.abs(v - voulu) > 1e-9)
    dire('kept within ' + aff(mn) + ' – ' + aff(mx) + ' : ' + aff(v));
  // Le rack garde lui-meme sa trace dans l historique, au premier mouvement.
  if (!sl.closest('.rack')) memoriser();
  // Au pas du curseur, une valeur tapee serait arrondie (x1.23 → x1.25) :
  // on le leve le temps de la poser. « data-pas » garde le pas d origine
  // pour ceux qui s en servent pour l affichage.
  const pas = sl.getAttribute('step');
  sl.dataset.pas = pas || '';
  sl.step = 'any';
  sl.value = String(v);
  sl.dispatchEvent(new Event('input', {bubbles: true}));
  sl.dispatchEvent(new Event('change', {bubbles: true}));
  delete sl.dataset.pas;
  if (pas === null) sl.removeAttribute('step'); else sl.setAttribute('step', pas);
}

function ouvrirSaisie(el) {
  const sl = curseurDeValeur(el);
  if (!sl || sl.disabled) return;
  const suivant = el.nextElementSibling;
  if (suivant && suivant.classList.contains('saisieVal')) return;
  const pct = sl.dataset.pct === '1';
  const m = String(el.textContent).match(/-?\d+(?:[.,]\d+)?/);
  const ch = document.createElement('input');
  ch.type = 'text';
  ch.inputMode = 'decimal';
  ch.className = 'saisieVal';
  ch.autocomplete = 'off';
  ch.spellcheck = false;
  ch.value = m ? m[0].replace(',', '.')
               : String(pct ? Math.round(parseFloat(sl.value) * 100)
                            : parseFloat(sl.value));
  ch.style.width = Math.max(el.classList.contains('pVal') ? 30 : 44,
                            el.offsetWidth + 6) + 'px';
  el.style.display = 'none';
  el.after(ch);
  let fini = false;
  const fermer = garder => {
    if (fini) return;
    fini = true;
    const txt = ch.value;
    ch.remove();
    el.style.display = '';
    if (garder && txt.trim() !== ch.defaultValue) poserValeurTapee(sl, txt, pct);
  };
  ch.defaultValue = ch.value;
  // Les frappes restent dans le champ : ni Entree ni Echap ne doivent
  // atteindre les raccourcis du montage.
  ch.addEventListener('keydown', e => {
    e.stopPropagation();
    if (e.key === 'Enter') { e.preventDefault(); fermer(true); }
    else if (e.key === 'Escape') { e.preventDefault(); fermer(false); }
  });
  ['input', 'change'].forEach(ev =>
    ch.addEventListener(ev, e => e.stopPropagation()));
  ch.addEventListener('blur', () => fermer(true));
  ch.focus();
  ch.select();
}

document.addEventListener('dblclick', e => {
  const el = e.target.closest('.rang .val, .pEntete .pVal');
  if (!el) return;
  e.preventDefault();
  ouvrirSaisie(el);
});

// Tab maintenue : les reglages du bloc selectionne sortent en pop-up, et y
// restent tant qu on tient la touche. On ne deplace rien dans le DOM — c est
// la meme colonne qui devient flottante —, donc les curseurs, les onglets et
// les images-cles continuent de repondre a la souris.
//
// Un appui BREF le laisse ouvert (« collant ») : on lache Tab pour regler a la
// souris sans qu il se referme (David, 07/10). Un nouvel appui sur Tab, ou
// Echap, le referme. Tenu, il se referme au relachement, comme avant.
let regPop = false, regCollant = false, regT0 = 0;
function popReglages(on) {
  on = !!on && clipsSel.size > 0;
  if (!on) regCollant = false;
  if (on === regPop) return;
  regPop = on;
  document.body.classList.toggle('regPop', on);
}
// Alt+Tab, un clic dans une autre fenetre : la touche ne sera jamais relachee
// ici. Sans cela, le pop-up resterait ouvert pour de bon. Un pop-up collant,
// lui, reste : la liste d un menu deroulant fait aussi perdre le focus.
addEventListener('blur', () => { if (!regCollant) popReglages(false); });
document.addEventListener('keyup', e => {
  if (e.key !== 'Tab' || !regPop || regCollant) return;
  if (performance.now() - regT0 < 350) regCollant = true;
  else popReglages(false);
});
// Le second appui sur Tab referme, meme depuis un curseur ou un champ du
// pop-up (que le gestionnaire general laisse passer).
document.addEventListener('keydown', e => {
  if (e.key === 'Tab' && regCollant && !e.repeat && !e.ctrlKey && !e.altKey) {
    e.preventDefault(); e.stopPropagation();
    popReglages(false);
  }
}, true);

document.addEventListener('keydown', e => {
  const t = e.target || {};
  // Échap passe toujours : c est la sortie de secours, y compris depuis un
  // champ de saisie (elle referme la boîte ouverte).
  if (e.key !== 'Escape') {
    // « textarea » manquait ici : dans la boîte Texte, la barre d espace
    // lançait la lecture et Suppr effaçait des blocs pendant qu on écrivait.
    if (saisieActive(t)) return;
    // Un curseur n avale que ses propres touches : les fleches. L espace,
    // Suppr et les lettres continuent de piloter le montage.
    if (t.tagName === 'INPUT' && FLECHES.has(e.key)) return;
    // Et tant qu une boîte est ouverte, les raccourcis du montage se taisent,
    // même si le focus n est sur aucun champ : un clic à côté du champ ne doit
    // pas rendre la barre d espace dangereuse.
    const vl = $('#voile');
    if (vl && vl.className === 'on') return;
  }
  const k = e.key.toLowerCase();
  const ctrl = e.ctrlKey || e.metaKey;
  // Tab maintenue sur une selection : le panneau de reglages sort en pop-up.
  // Sans selection, la touche garde son role habituel (passer d un champ a
  // l autre) : on ne la confisque que lorsqu elle a quelque chose a montrer.
  if (e.key === 'Tab' && !ctrl && !e.altKey && clipsSel.size) {
    e.preventDefault();
    if (!e.repeat && !regPop) { popReglages(true); regT0 = performance.now(); }
    return;
  }
  if (ctrl && k === 'z') { e.preventDefault(); annulerMontage(); return; }
  if (ctrl && k === 'c') { e.preventDefault(); copierBlocs(); return; }
  if (ctrl && k === 'v') { e.preventDefault(); collerBlocs(); return; }
  // Ctrl+D : dupliquer la selection juste derriere elle. Sans preventDefault,
  // le navigateur ouvrirait sa fenetre de favoris.
  if (ctrl && k === 'd') { e.preventDefault(); dupliquerBlocs(); return; }
  // L enregistrement est continu, mais Ctrl+S reste un reflexe : il force
  // l ecriture immediate et le confirme.
  if (ctrl && k === 's') {
    e.preventDefault();
    if (!CLIPS.length) dire('the timeline is empty');
    else if (!modifie) dire('“' + (projetNom || PROJET.nom) + '” already saved');
    else assurerSauvegarde(false);
    return;
  }
  if (ctrl && k === 'a') {
    e.preventDefault();
    clipsSel = new Set(CLIPS.map(c => c.uid));
    rendreLanes(); rendreReglages();
    return;
  }
  if (ctrl) return;
  if (e.code === 'Space') { e.preventDefault(); enLecture ? pause() : lire(); return; }
  if (k === 'v') { setOutil('V'); return; }
  if (k === 'c') { setOutil('C'); return; }
  if (k === 'a') { setOutil('A'); return; }
  if (k === 'i') { poserIn(); return; }
  if (k === 'o') { poserOut(); return; }
  if (k === 'm') { poserMarqueur(); return; }
  if (e.key === 'Delete' || e.key === 'Backspace') {
    e.preventDefault(); retirerSelection(); return;
  }
  if (e.key === 'Home') { pause(); tLect = 0; majTete(); resynchroniser(true); return; }
  if (e.key === 'ArrowUp') { e.preventDefault(); allerAuTemps(plagePrecedente()); return; }
  if (e.key === 'ArrowDown') { e.preventDefault(); allerAuTemps(plageSuivante()); return; }
  if (k === 'l') { $('#bBoucle').click(); return; }
  if (k === 'u') { $('#bUnite').click(); return; }
  if (k === 'f') { $('#bPlein').click(); return; }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
    e.preventDefault();
    const pas = e.shiftKey ? 1 : 1 / 24;
    tLect = Math.max(0, Math.min(etendue(),
      tLect + (e.key === 'ArrowRight' ? pas : -pas)));
    pause(); majTete(); resynchroniser(true);
    return;
  }
  if (e.key === 'Escape') {
    fermerMenu(); $('#voile').className = ''; popReglages(false);
    if (reduire()) return;
    selection.clear(); clipsSel.clear(); rendreGrille(); rendreTimeline();
  }
});

// ===========================================================================
//  Projets : sauver / ouvrir
// ===========================================================================
// Le projet d accueil : celui ou le montage s enregistre. On prend celui
// deja choisi, sinon celui du premier plan, sinon le projet courant.
// Le projet d accueil d un montage n est JAMAIS une bibliotheque : une
// bibliotheque est une reserve partagee, pas un lieu de travail. Sans ce
// garde-fou, ouvrir la musique avant les projets suffisait a y enregistrer
// les montages.
function hoteMontage() {
  // Les sequences vont dans le dossier des rushes video : « Vids » quand il
  // est ouvert (convention de David), sinon un projet qui a de la video —
  // jamais un kit d images ni un dossier de son, meme si le premier bloc en
  // vient (David, 07/10 : une sequence rangee sous kit-graphique).
  const vids = OUVERTS.find(x => /^vids$/i.test(x.nom));
  if (vids) return vids.nom;
  const video = n => ((projetOuvert(n) || {}).films || [])
    .some(f => !f.absent && !f.son_seul && !f.image);
  const bon = n => n && projetOuvert(n) && !estBibli(n) && !estCaptures(n);
  if (bon(PROJET.pj) && video(PROJET.pj)) return PROJET.pj;
  // Le premier plan qui vient d un vrai projet video, la musique et les
  // captures mises a part.
  const c = CLIPS.find(x => {
    const pj = (PAR_ID[x.film] || {}).pj;
    return pj && !estBibli(pj) && !estCaptures(pj) && video(pj);
  });
  if (c) return PAR_ID[c.film].pj;
  if (bon(PROJET.pj)) return PROJET.pj;
  const cour = projetCourant();
  if (bon(cour)) return cour;
  const p = OUVERTS.find(x => !estBibli(x.nom) && !estCaptures(x.nom));
  return p ? p.nom : '';
}

// Ce qu attend le moteur de rendu, joint a chaque enregistrement (1.3.20) :
// l export de bureau rend une sequence montee en ligne sans rouvrir la page.
// Au-dela de 2,5 Mo (beaucoup de masques), on le garde sans les images de
// masque plutot que de risquer le refus de l enregistrement.
function renduJoint() {
  if (!CLIPS.length) return null;
  try {
    let r = objetMontage(true);
    if (JSON.stringify(r).length > 2500000) r = objetMontage(false);
    return r;
  } catch (e) { return null; }
}

function objetProjet() {
  return {
    version: 5, genere: new Date().toISOString(),
    projet: {nom: PROJET.nom, w: PROJET.w, h: PROJET.h, fps: PROJET.fps},
    hote: hoteMontage(),
    // De quels projets ce montage a besoin pour se recharger entier : a la
    // reouverture, ceux qui manquent sont rouverts tout seuls.
    projets: [...new Set(CLIPS.map(c => (PAR_ID[c.film] || {}).pj || c.pj)
                              .filter(Boolean))],
    fps: PROJET.fps, format: {w: PROJET.w, h: PROJET.h},
    tIn: tIn, tOut: tOut, PPS: PPS,
    marqueurs: MARQUEURS,
    pistes: PISTES,
    rendu: renduJoint(),
    clips: CLIPS.map(c => {
      const n = {};
      for (const k in c) if (k[0] !== '_') n[k] = c[k];
      const f = PAR_ID[c.film] || {};
      n.pj = f.pj || c.pj || '';
      n.fichier = f.rel || c.fichier || '';
      return n;
    })
  };
}

// Liste tous les montages de tous les projets ouverts.
async function listerMontages() {
  const out = [];
  for (const p of OUVERTS) {
    try {
      const d = await api('api/montages?projet=' + encodeURIComponent(p.nom));
      (d.montages || []).forEach(m => out.push(m));
    } catch (err) {}
  }
  out.sort((a, b) => (b.maj || '').localeCompare(a.maj || ''));
  return out;
}

async function chargerProjet(p, nom, hote) {
  if (!p || !p.clips) { dire('unreadable sequence', true); return; }
  // On change de sequence : les lecteurs en place appartiennent a l ancienne,
  // et leurs numeros de bloc vont etre repris par d autres plans.
  if (typeof viderPool === 'function') viderPool();
  // Un montage se souvient des projets dont il a besoin : on les rouvre avant
  // de replacer les plans, sinon la moitie du montage arriverait vide.
  const besoins = [...new Set((p.projets || [])
    .concat(p.clips.map(c => c.pj))
    .concat([p.hote, hote]).filter(Boolean))];
  const absents = [];
  for (const x of besoins) {
    if (projetOuvert(x)) continue;
    try { await ouvrirProjetDisque(x, true); }
    catch (err) { absents.push(x); }
  }
  memoriser();
  const parRel = {};
  FILMS.forEach(f => parRel[f.pj + '|' + f.rel] = f.id);
  let perdus = 0;
  MARQUEURS = Array.isArray(p.marqueurs) ? p.marqueurs.slice() : [];
  PISTES = p.pistes && p.pistes.length ? p.pistes
    : [{id: 'V1', type: 'v', mute: false, solo: false},
       {id: 'A1', type: 'a', mute: false, solo: false},
       {id: 'M1', type: 'm', mute: false, solo: false}];
  assurerPistes();
  CLIPS = [];
  let maxUid = 0;
  p.clips.forEach(c => {
    let film = c.film;
    if (!PAR_ID[film]) {
      // retrouve par chemin, dans son propre projet
      film = parRel[(c.pj || p.hote || hote || '') + '|' + c.fichier] || null;
    }
    const n = {};
    for (const k in c) if (k[0] !== '_') n[k] = c[k];
    n.film = film;
    // Un plan dont le projet est absent reste sur la timeline, marque « ? » :
    // on ne mutile pas un montage parce qu un dossier n est pas la.
    // Un calque ou un texte n a pas de film : ce n est pas un plan perdu.
    if (!film && !n.genre) perdus++;
    n.vitesse = n.vitesse || 1;
    if (n.vitesse < 0) { n.rev = !n.rev; n.vitesse = -n.vitesse; }
    n.rev = !!n.rev;
    n.couleur = n.couleur || 0;
    n.opac = n.opac === undefined ? 1 : n.opac;
    n.fi = n.fi || 0; n.fo = n.fo || 0;
    maxUid = Math.max(maxUid, n.uid || 0);
    CLIPS.push(n);
  });
  uidSuivant = maxUid + 1;
  // Le numero de lien doit depasser tous ceux deja en place : se fier au
  // nombre de blocs ne suffit pas, un montage elague peut garder un « L7 »
  // avec seulement deux blocs, et le lien suivant retomberait dessus — la
  // copie se retrouverait appariee a l original.
  lienSuivant = CLIPS.reduce((m, c) =>
    Math.max(m, 1 + (parseInt(String(c.lien || '').slice(1), 10) || 0)), 1);
  PROJET.pj = (hote || p.hote || PROJET.pj || '');
  if (p.projet) {
    PROJET.nom = p.projet.nom || '';
    PROJET.w = p.projet.w || 1280;
    PROJET.h = p.projet.h || 720;
    PROJET.fps = p.projet.fps || 24;
    appliquerSpecs();
  }
  tIn = p.tIn === undefined ? null : p.tIn;
  tOut = p.tOut === undefined ? null : p.tOut;
  if (p.PPS) PPS = p.PPS;
  projetNom = nom || '';
  PROJET.nom = projetNom;
  clipsSel.clear(); tLect = 0;
  modifie = false;
  rendreTimeline(); majIO(); resynchroniser(true);
  rafraichirProjets();
  dire('sequence “' + projetNom + '” loaded: ' + CLIPS.length + ' blocks' +
    (perdus ? ' — ' + perdus + ' shot(s) not found' : '') +
    (absents.length ? ', project ' + absents.join(' and ') + ' missing from disk'
                    : ''), perdus > 0);
}

// La toile ne sert qu a regarder : la dimensionner a la taille du projet
// (souvent 1920x1080) revient a composer huit fois plus de pixels que
// l ecran n en affiche. Avec deux calques superposes, c est ce qui fait
// tomber la lecture. On la cale sur la taille reellement affichee, au
// rapport du projet. Le rendu ffmpeg, lui, reste en pleine definition.
// En mode Montage le canvas etait laisse en « width:auto » : un canvas prend
// alors sa taille INTRINSEQUE, c est-a-dire l attribut width qu on venait de
// lui donner. Et cet attribut se calculait a partir de... sa largeur affichee.
// La boucle se refermait sur elle-meme : une fois petit, le moniteur restait
// petit pour toujours, quelle que soit la place disponible (mesure chez David :
// 612 x 344 dans un panneau de 2322 x 775). On mesure donc le CONTENANT, et on
// pose la taille d affichage nous-memes.
function dimensionnerMoniteur() {
  const boite = moni.parentElement;
  if (document.body.classList.contains('edit') && boite) {
    const dw = boite.clientWidth, dh = boite.clientHeight;
    if (dw > 20 && dh > 20) {
      const k = Math.min(dw / PROJET.w, dh / PROJET.h);
      const lw = Math.max(80, Math.floor(PROJET.w * k));
      const lh = Math.max(45, Math.floor(PROJET.h * k));
      if (moni.style.width !== lw + 'px') moni.style.width = lw + 'px';
      if (moni.style.height !== lh + 'px') moni.style.height = lh + 'px';
    }
  } else if (moni.style.width) {
    // En bibliotheque le CSS suffit (largeur 100 % du panneau) : on rend la
    // main, sinon la taille du montage resterait collee.
    moni.style.width = '';
    moni.style.height = '';
  }
  const large = Math.max(160, Math.round(moni.clientWidth ||
    (boite && boite.clientWidth) || 640));
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const w = EXPORT_W || Math.min(PROJET.w, Math.round(large * dpr));
  const h = Math.max(2, Math.round(w * PROJET.h / PROJET.w));
  if (moni.width !== w || moni.height !== h) {
    moni.width = w;
    moni.height = h;
  }
}

// Un seul mecanisme plutot que d aller rappeler dimensionnerMoniteur a chaque
// endroit qui bouge : changement de mode, poignees de panneaux, fenetre. Le
// canvas n influe pas sur la taille de son contenant, donc pas de boucle.
if (window.ResizeObserver) {
  new ResizeObserver(() => {
    dimensionnerMoniteur();
    dessiner();
  }).observe(moni.parentElement);
}

function appliquerSpecs() {
  moni.style.aspectRatio = PROJET.w + ' / ' + PROJET.h;
  dimensionnerMoniteur();
  dessiner();
  majTete();
}

const TAILLES = [
  ['1920 × 1080  ·  HD 16:9', 1920, 1080],
  ['1280 × 720  ·  HD 16:9', 1280, 720],
  ['1440 × 1080  ·  4:3', 1440, 1080],
  ['1920 × 1440  ·  4:3', 1920, 1440],
  ['3840 × 2160  ·  UHD', 3840, 2160],
  ['1080 × 1920  ·  vertical', 1080, 1920],
  ['1080 × 1080  ·  square', 1080, 1080],
  ['2048 × 858  ·  scope', 2048, 858]
];

// Ou ce rush a-t-il deja servi ? Le serveur ouvre tous les montages de tous
// les projets et compte les blocs portant cet identifiant. On ne le fait qu a

async function boiteUsages(film) {
  const f = PAR_ID[film] || {};

  try {
    u = (await api('api/usages?id=' + encodeURIComponent(film))).usages || [];
  } catch (err) {
    b.innerHTML = '<h3>' + echapHtml((f.nom || 'shot').slice(0, 40)) + '</h3>' +
      '<div style="font-size:12px;color:var(--rouge)">' +
      echapHtml(err.message) + '</div>' +
      '<div style="margin-top:16px;text-align:right">' +
      '<button id="uFerme" class="on">Close</button></div>';
    $('#uFerme').onclick = () => $('#voile').className = '';

  }
  b.innerHTML = '<h3>' + echapHtml((f.nom || 'shot').slice(0, 40)) + '</h3>' +

    (u.length
      ? 'used in ' + u.length + ' sequence' + (u.length > 1 ? 's' : '') +
        ' — click one to open it'
      : 'this shot is in no saved sequence') + '</div>' +
    u.map(x => '<div class="ligne" data-u="' + echapHtml(x.projet) + '|' +
      echapHtml(x.nom) + '"><span><b>' + echapHtml(x.nom) + '</b><br>' +
      '<span style="color:var(--sourd);font-size:11px">' + echapHtml(x.projet) +
      ' · ' + echapHtml(x.maj) + '</span></span><i>' + x.blocs + ' block' +

    '<div style="margin-top:16px;text-align:right">' +
    '<button id="uFerme" class="on">Close</button></div>';
  $('#uFerme').onclick = () => $('#voile').className = '';
  b.querySelectorAll('[data-u]').forEach(el => el.onclick = async () => {
    const [pj, nom] = el.dataset.u.split('|');
    $('#voile').className = '';
    await ouvrirMontage(pj, nom);
  });
}
