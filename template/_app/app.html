<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>library &amp; edit table</title>
<style>
:root{--fond:#1a1917;--carte:#232220;--haut:#2c2a27;--encre:#e9e4da;
 --sourd:#8c877e;--orange:#d9532b;--trait:#34322e;--vert:#6a9b4a;--or:#e8b93a;
 --rouge:#a8302f;
 --c0:#4a4843;--c1:#a8302f;--c2:#c98a2b;--c3:#6a9b4a;--c4:#4a7fa8;--c5:#7a5a9b;
 --wMoni:430px;--wRegl:236px;--hFooter:270px;--wDeck:250px;--wAside:196px;
 --vign:206px}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--fond);color:var(--encre);overflow:hidden;
 font:13px/1.5 "Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;
 user-select:none}
button,input,select{font:inherit;color:var(--encre);background:var(--carte);
 border:1px solid var(--trait);border-radius:4px;padding:5px 10px}
button{cursor:pointer}button:hover{border-color:var(--sourd)}
button.on{background:var(--orange);border-color:var(--orange);color:#fff}
button:disabled{opacity:.4;cursor:default}
input{min-width:120px}
select{padding:4px 6px}
.mono{font-family:ui-monospace,Consolas,monospace}
.pousse{margin-left:auto}

/* poignées de redimensionnement */
.rz{flex:0 0 8px;background:transparent;position:relative;z-index:8}
.rz:hover,.rz.actif{background:var(--orange)}
.rz::after{content:"";position:absolute;background:var(--trait);border-radius:2px}
.rz.vert::after{top:50%;left:3px;width:2px;height:28px;margin-top:-14px}
.rz.horiz::after{left:50%;top:3px;height:2px;width:28px;margin-left:-14px}
.rz:hover::after,.rz.actif::after{background:#fff}
.rz.vert{cursor:col-resize}
.rz.horiz{flex:0 0 8px;height:8px;width:100%;cursor:row-resize}

header{flex:0 0 auto;border-bottom:1px solid var(--trait);
 padding:8px 13px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
h1{margin:0;font-size:13px;letter-spacing:.14em;text-transform:uppercase;
 white-space:nowrap}
h1 small{color:var(--sourd);letter-spacing:.05em;font-weight:400;
 text-transform:none;margin-left:7px;font-size:11px}
/* Le nom de la bibliotheque — le dossier ou elle a ete creee — au-dessus des
   projets ouverts : on sait toujours dans quelle bibliotheque on travaille. */
#biblio{display:block;font-size:11px;letter-spacing:.18em;color:var(--or);
 margin-bottom:2px}
#biblio:empty{display:none}
.modes{display:flex;border:1px solid var(--trait);border-radius:5px;overflow:hidden}
.modes button{border:0;border-radius:0;padding:5px 13px}
#selDossier{display:none;max-width:190px}
body.edit #selDossier{display:inline-block}
body.edit .rushOnly{display:none}
#tailleVign{min-width:74px;width:74px}
#selEpisode{max-width:240px;border-color:var(--or)}
/* Les couleurs de rangement : une pastille et son nom. Un clic filtre, un
   double-clic ou un clic droit l edite. */
#cats{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
#cats .cat{display:inline-flex;align-items:center;gap:5px;padding:2px 8px 2px 4px;
 border-radius:11px;font-size:11px;line-height:16px;color:var(--sourd);
 background:none;border:1px solid var(--trait);cursor:pointer;max-width:140px}
#cats .cat.vide{padding-right:4px}
#cats .cat i{flex:0 0 auto;width:13px;height:13px;border-radius:50%;
 background:var(--cc);box-shadow:inset 0 0 0 1px #0005}
#cats .cat span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#cats .cat:hover{border-color:var(--sourd);color:var(--encre)}
#cats .cat.on{border-color:var(--cc);color:var(--encre);
 box-shadow:0 0 0 1px var(--cc)}
#catPlus{padding:0 7px;border-radius:11px;font-size:13px;line-height:18px}

main{flex:1 1 auto;display:flex;min-height:0}
aside{flex:0 0 var(--wAside);border-right:1px solid var(--trait);overflow-y:auto;
 padding:9px 7px 24px;min-width:120px}
body.edit aside{display:none}
body.edit [data-rz="aside"]{display:none}
.dos{padding:5px 9px;border-radius:4px;cursor:pointer;display:flex;
 justify-content:space-between;gap:8px;align-items:center;margin-bottom:1px}
.dos:hover{background:var(--carte)}
.dos.on{background:var(--orange);color:#fff}
.dos.survol{outline:2px dashed var(--orange);outline-offset:-2px;background:var(--carte)}
.dos b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dos i{font-style:normal;color:var(--sourd);font-size:11px;flex:0 0 auto}
.dos.on i{color:#fff9}
/* Colonne a deux niveaux : l en-tete d un projet ouvert, puis ses dossiers. */
.pjt .chev{flex:0 0 auto;width:13px;text-align:center;font-size:9px;
 color:var(--sourd);cursor:pointer;user-select:none;line-height:1}
.pjt .chev:hover{color:var(--encre)}
.pjt.on .chev{color:#fff9}
.pjt.on .chev:hover{color:#fff}
.pjt{display:flex;gap:6px;align-items:center;padding:6px 9px;margin-top:9px;
 border-radius:4px;cursor:pointer;border:1px solid var(--trait);background:#22242a}
.pjt:hover{border-color:var(--orange)}
.pjt.on{background:var(--orange);border-color:var(--orange);color:#fff}
.pjt b{flex:1;font-weight:600;font-size:12px;overflow:hidden;
 text-overflow:ellipsis;white-space:nowrap}
.pjt i{font-style:normal;color:var(--sourd);font-size:11px;flex:0 0 auto}
.pjt.on i{color:#fff9}
.pjt .x,.pjt .plus{background:none;border:0;color:var(--sourd);cursor:pointer;
 font-size:15px;line-height:1;padding:0 1px;flex:0 0 auto}
.pjt .x:hover{color:var(--rouge)}
.pjt.on .x{color:#fff9}
.pjt.on .x:hover{color:#fff}
/* Le « + » du projet : un dossier DANS ce projet-la. Sur le disque en vue
   Source, virtuel en vue « My folders » — il n apparait donc que quand l un
   ou l autre est possible, aux memes conditions que les anciens boutons du
   bas de colonne, qui ont disparu. */
.pjt .plus{display:none;font-size:16px}
body:not(.enligne):not(.lectureseule):not(.rangement) .pjt .plus,
body.rangement.enligne .pjt .plus,
body.rangement.rangeable .pjt .plus,
body.rangeable.enligne .pjt .plus,
body.rangeable.lectureseule .pjt .plus{display:block}
.pjt .plus:hover{color:var(--vert)}
.pjt.on .plus{color:#fff9}
.pjt.on .plus:hover{color:#fff}
.pjt.survol{outline:2px dashed var(--orange);outline-offset:-2px}
.dos{margin-left:12px}
/* La poignee a gauche du titre : on l attrape pour changer l ordre des
   projets et de leurs dossiers (David, 05/10). */
.poignee{flex:0 0 auto;width:9px;margin-left:-4px;color:var(--sourd);cursor:grab;
 font-size:12px;line-height:1;user-select:none;opacity:.4;letter-spacing:-3px}
.dos:hover .poignee,.pjt:hover .poignee{opacity:1}
.poignee:hover{color:var(--encre)}
.pjt.on .poignee,.dos.on .poignee{color:#fffb}
.dos .poignee + b{flex:1}
.dos.avant,.pjt.avant{box-shadow:inset 0 3px 0 var(--orange)}
.dos.apres,.pjt.apres{box-shadow:inset 0 -3px 0 var(--orange)}
.glisse{opacity:.35}
/* Les montages du projet : premiere ligne sous l en-tete, couleur a part. */
.dos.montages{margin-top:5px;background:#2b2118;border:1px solid #6b5322;
 color:var(--or)}
.dos.montages:hover{background:#362a1e;border-color:var(--or)}
.dos.montages b{color:var(--or);font-weight:600}
.dos.montages i{color:var(--or);opacity:.8}
.dos.montages .chev{flex:0 0 auto;width:12px;text-align:center;font-size:9px;
 line-height:1}
.dos.mont{margin-left:26px;font-size:11px}
/* La section « Sequences », au niveau des projets. */
.pjt.sequences{background:#2b2118;border-color:#6b5322}
.pjt.sequences:hover{border-color:var(--or)}
.pjt.sequences b{color:var(--or)}
.pjt.sequences i{color:var(--or);opacity:.8}
.dos.mont.seq{margin-left:12px}
.dos.mont b{font-weight:400}
.dos.mont.on{background:var(--or);color:#1a1917}
.dos.mont.on b{color:#1a1917}
.dosVide{padding:2px 9px 6px 26px;font-size:10px;color:var(--sourd)}
.aScan{padding:3px 9px 6px 21px;font-size:11px;color:var(--sourd);
 display:flex;gap:6px;align-items:center}
.aScan button{font-size:11px;padding:2px 7px}
.addPj{width:100%;margin-top:11px}
.titre-col{font-size:10px;letter-spacing:.14em;text-transform:uppercase;
 color:var(--sourd);margin:3px 0 6px;padding:0 9px}
/* « Consult source » : on travaille toujours dans « My folders » ; ce bouton
   montre un instant les vrais dossiers, et un second clic y ramene (David,
   06/10 : les deux onglets Source / My folders preetaient a confusion). */
.titreProjets{display:flex;align-items:center;justify-content:space-between;gap:6px}
#bSource{display:none;align-items:center;gap:5px;background:none;border:0;
 padding:0;margin:0;cursor:pointer;color:var(--sourd);font-size:10px;
 letter-spacing:.06em;text-transform:lowercase;flex:0 0 auto;min-width:0}
#bSource:hover{color:var(--encre)}
#bSource .piste{position:relative;width:20px;height:11px;border-radius:6px;
 background:var(--trait);transition:background .15s}
#bSource .piste i{position:absolute;top:2px;left:2px;width:7px;height:7px;
 border-radius:50%;background:var(--sourd);transition:left .15s,background .15s}
body.rangeable #bSource{display:inline-flex}
body.rangeable:not(.rangement) #bSource{color:var(--orange)}
body.rangeable:not(.rangement) #bSource .piste{background:var(--orange)}
body.rangeable:not(.rangement) #bSource .piste i{left:11px;background:#fff}

#grille{flex:1 1 auto;overflow-y:auto;padding:11px 12px 30px;display:grid;
 grid-template-columns:repeat(auto-fill,var(--vign));gap:9px;
 align-content:start;align-items:start;justify-content:start}
body.edit #grille{flex:0 0 var(--wDeck);border-right:1px solid var(--trait)}
/* Surtout PAS overflow:hidden ici : un element de grille dont le debordement
   est masque voit sa contribution de hauteur s effondrer, la ligne se calcule
   a quelques pixels et les cartes se chevauchent en bandes ecrasees.
   Le rognage se fait sur .media, qui a une hauteur explicite. */
.c{background:var(--carte);border:1px solid var(--trait);border-radius:5px;
 position:relative}
.c:hover{border-color:var(--sourd)}
.c.sel{border-color:var(--orange);box-shadow:0 0 0 1px var(--orange)}
.c.absent{opacity:.4}
/* « Show in project » : la carte rejointe bat trois fois, sinon on ne sait
   pas laquelle des cent vignettes on vient de montrer. */
@keyframes visee{0%,100%{box-shadow:0 0 0 1px var(--orange)}
 50%{box-shadow:0 0 0 5px var(--orange)}}
.c.visee{border-color:var(--orange);animation:visee .55s ease-in-out 3}
#bMaj.dispo{background:var(--orange);border-color:var(--orange);color:#fff}
/* Hauteur en pixels, jamais en aspect-ratio : dans une grille, une hauteur
   deduite d un ratio ne participe pas au calcul de la ligne tant que l image
   n est pas chargee, et la carte s ecrase a une dizaine de pixels. */
.c .media{position:relative;background:#000;height:calc(var(--vign)*9/16);
 cursor:grab;overflow:hidden;border-radius:4px 4px 0 0}
.c .etiq{position:absolute;left:0;right:0;bottom:0;height:5px;z-index:2;
 box-shadow:0 -1px 3px #0008}
.c .media img,.c .media video{width:100%;height:100%;display:block;
 object-fit:cover;background:#000}
body.forme-carre .c .media{height:var(--vign)}
body.forme-rond{--rayon:50%}
body.forme-rond .c{background:none;border:0;text-align:center}
body.forme-rond .c .media{height:var(--vign);border-radius:50%;overflow:hidden;
 border:1px solid var(--trait)}
body.forme-carre .c .media{border-radius:4px 4px 0 0}
body.forme-rond .c.sel .media{border-color:var(--orange);
 box-shadow:0 0 0 2px var(--orange)}
body.forme-rond .c .nom{text-align:center}
/* Double-clic sur une vignette : la carte passe au double, sur deux colonnes,
   et le clip demarre. Hauteur en calc(), jamais en aspect-ratio — meme regle
   que plus haut : un ratio ne participe pas au calcul de la ligne. La largeur
   double vaut 2 colonnes plus la gouttiere, d ou le « + 5px » qui garde le
   16:9 (2V+9)*9/16 = V*9/8 + 5,06. */
/* Loupe : le rush SIX FOIS la vignette, par-dessus la bibliotheque
   assombrie, qui ne bouge pas d un pixel. Deux essais ont ete faits avant :
   la carte qui double sur place (elle redessinait les 349 vignettes et
   reorganisait la grille) et la carte qui prend trois colonnes (instantanee,
   mais elle pousse ses voisines — « la case se fait de la place parmi les
   autres, j aime pas »). C est un pop-up, et rien d autre ne bouge. */
#loupe{position:fixed;inset:0;z-index:88;background:#000000dc;display:none;
 align-items:center;justify-content:center;padding:24px}
#loupe.on{display:flex}
#loupe .cadre{display:flex;flex-direction:column;gap:9px;max-width:100%;
 max-height:100%;align-items:stretch}
/* La taille vient du RAPPORT du rush, pas de la taille intrinseque du
   lecteur : un <video> en width:auto prend celle de son poster (480x270 ici)
   tant que la video n est pas chargee, puis saute. On calcule donc la boite :
   largeur = min(92vw, 80vh x rapport), hauteur deduite. Aucun saut, aucune
   deformation, et c est bon des la premiere image. */
#loupe .scene{width:min(calc(var(--vign)*6), 92vw,
 calc(80vh * var(--arn,1.7778)));
 aspect-ratio:var(--ar,16/9);margin:0 auto;background:#000;border-radius:6px}
#loupe .scene video,#loupe .scene img{width:100%;height:100%;
 object-fit:contain;display:block;border-radius:6px;background:#000}
#loupe audio{width:100%}
#loupe .pochette{width:min(460px,72vw);height:min(460px,72vw);
 border-radius:6px;margin:0 auto}
/* « loupeTete » et pas « tete » : .tete est DEJA la tete de lecture de la
   timeline — position absolue, fond orange. Mon bandeau en heritait et
   repeignait la moitie de l ecran en orange. */
#loupe .loupeTete{display:flex;align-items:center;gap:11px;color:var(--encre);
 font-size:13px;width:100%}
#loupe .loupeTete b{font-weight:500;overflow:hidden;text-overflow:ellipsis;
 white-space:nowrap}
#loupe .loupeTete .sp{flex:1 1 auto}
.c .reduire{position:absolute;top:5px;right:5px;z-index:3;background:#000a;
 border:1px solid #fff3;color:#fff;border-radius:4px;padding:1px 6px;
 font-size:11px;line-height:1.5;cursor:pointer}
.c .reduire:hover{background:var(--orange);border-color:var(--orange)}
.c .lire{position:absolute;inset:auto 5px 5px auto;background:#000a;
 border:1px solid #fff3;color:#fff;border-radius:4px;padding:1px 6px;
 font-size:11px;opacity:0}
.c:hover .lire{opacity:1}
.etoile{position:absolute;top:2px;left:3px;font-size:15px;line-height:1;
 color:#fff6;text-shadow:0 1px 3px #000;cursor:pointer;z-index:2;
 padding:2px 3px;background:none;border:0}
.etoile:hover,.etoile.on{color:var(--or)}
.c .bas{padding:4px 6px}
.c .nom{font-size:12px;font-weight:500;overflow:hidden;text-overflow:ellipsis;
 white-space:nowrap;cursor:text;border-radius:3px;padding:1px 3px;margin:-1px -3px}
.c .nom:hover{background:var(--haut)}
.c input.nom{width:100%;font-size:12px;padding:1px 3px}
.c .meta{margin-top:3px;display:flex;gap:3px;flex-wrap:wrap}
body.petit .c .meta,body.forme-rond .c .meta{display:none}
body.petit .c .nom,body.forme-rond .c .nom{font-size:10px}
.b{font:10px/1.6 ui-monospace,monospace;letter-spacing:.05em;padding:0 5px;
 border-radius:3px;background:#4a4843;color:#c9c4bb}
.b.fmt{background:#ffb347;color:#1a1917}
.b.vert{background:#66d9e8;color:#1a1917}
.b.carre{background:#c8a882;color:#1a1917}
.b.muet{background:#5a3a3a;color:#f0c8c8}
.b.abs{background:var(--rouge);color:#fff}
.vide{grid-column:1/-1;padding:50px 16px;color:var(--sourd);text-align:center}

.moniteur{padding:9px 11px;display:flex;flex-direction:column;gap:6px;
 flex:0 0 var(--wMoni);min-width:220px}
body.edit .moniteur{flex:1 1 auto;padding:5px 12px;align-items:center}
.cadreMoni{width:100%;display:flex;align-items:center;justify-content:center;
 min-height:0}
body.edit .cadreMoni{flex:1 1 auto}
.moniteur canvas{width:100%;aspect-ratio:16/9;background:#000;border-radius:4px;
 display:block}
body.edit .moniteur canvas{width:auto;max-width:100%;max-height:100%;
 object-fit:contain}
.transport{display:flex;gap:4px;align-items:center;width:100%;flex-wrap:wrap}
.transport .tr{padding:4px 8px;font-size:12px;min-width:30px;text-align:center}
.transport .tr.on{background:var(--vert);border-color:var(--vert);color:#fff}
.transport #bBoucle.on{background:var(--or);border-color:var(--or);color:#1a1917}
/* plein ecran : le moniteur prend tout, le reste s efface */
.moniteur:fullscreen{background:#000;padding:0;justify-content:center}
.moniteur:fullscreen .cadreMoni{flex:1 1 auto;width:100%}
.moniteur:fullscreen canvas{max-width:100vw;max-height:100vh;width:auto;height:auto}
.moniteur:fullscreen .transport{position:fixed;left:50%;bottom:18px;
 transform:translateX(-50%);width:auto;background:#1a1917e8;padding:7px 11px;
 border-radius:8px;border:1px solid var(--trait);opacity:.15;transition:opacity .2s}
.moniteur:fullscreen .transport:hover{opacity:1}
.transport .tc{font:12px/1 ui-monospace,monospace;color:var(--sourd);
 white-space:nowrap}
#curseur{flex:1 1 auto;min-width:50px;padding:0;background:none;border:0}

footer{flex:0 0 var(--hFooter);border-top:1px solid var(--trait);background:#151412;
 display:flex;flex-direction:column;min-height:150px}
.bandeau{padding:5px 11px;display:flex;gap:6px;align-items:center;
 border-bottom:1px solid var(--trait);flex-wrap:wrap}
.outil{padding:4px 8px;font-size:12px}
/* Rendre : vert au repos, rouge pendant le rendu, avec sa jauge en fond. */
.outil.rendre{position:relative;overflow:hidden;background:var(--vert);
 border-color:var(--vert);color:#0b1408;font-weight:600;min-width:104px}
.outil.rendre:hover{filter:brightness(1.12)}
.outil.rendre .txt{position:relative;z-index:2}
.outil.rendre .jauge{position:absolute;left:0;top:0;bottom:0;width:0;z-index:1;
 background:#0000003d;transition:width .25s linear}
.outil.rendre.encours{background:var(--rouge);border-color:var(--rouge);
 color:#fff;cursor:progress}
.outil.rendre.encours .jauge{background:#ffffff40}
/* Cache de lecture : meme jauge que le rendu, une autre couleur. Vert quand
   la sequence est en memoire. */
.outil.cache{position:relative;overflow:hidden;min-width:86px;
 background:#241f33;border-color:#6b5a92;color:#c9bce6}
.outil.cache:hover{background:#2e2742}
.outil.cache .txt{position:relative;z-index:2}
.outil.cache .jauge{position:absolute;left:0;top:0;bottom:0;width:0;z-index:1;
 background:#8f79c4;transition:width .2s linear}
.outil.cache.encours{cursor:progress}
.outil.cache.pret{background:var(--vert);border-color:var(--vert);color:#0b1408;
 font-weight:600}
.outil.cache.pret .jauge{background:#0003;width:100%}
.minimap{flex:1 1 130px;min-width:110px;height:24px;background:#100f0e;
 border:1px solid var(--trait);border-radius:3px;position:relative;
 overflow:hidden;cursor:ew-resize}
.minimap .mb{position:absolute;top:3px;height:7px;border-radius:1px;opacity:.85}
.minimap .mb.a{top:13px;height:6px}
.minimap .vue{position:absolute;top:0;bottom:0;border:1px solid var(--orange);
 background:#d9532b22;pointer-events:none}
.minimap .bulle{position:absolute;top:2px;z-index:7;background:#12110fee;
 border:1px solid var(--or);border-radius:3px;color:var(--or);
 font:9px/1.6 ui-monospace,monospace;padding:0 4px;white-space:nowrap;
 margin-left:5px;cursor:text}
.minimap input.duree{position:absolute;top:1px;bottom:1px;z-index:8;width:92px;
 min-width:0;padding:0 5px;font:10px/1 ui-monospace,monospace;background:#12110f;
 color:var(--or);border:1px solid var(--or);border-radius:3px}
.minimap .bulle.gauche{margin-left:0;transform:translateX(-100%) translateX(-5px)}
.minimap .mt{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;
 background:var(--or);box-shadow:0 0 4px #e8b93a99;pointer-events:none}
.minimap .mt::before{content:"";position:absolute;top:0;left:-3px;
 border:4px solid transparent;border-top-color:var(--or);border-bottom:0;height:0}
.atelier{display:flex;min-height:0;flex:1 1 auto}
.tl{flex:1 1 auto;display:flex;min-width:0;min-height:0}
.tl-entetes{flex:0 0 118px;border-right:1px solid var(--trait);overflow:hidden;
 background:#191816}
.tl-defile{flex:1 1 auto;overflow:auto;position:relative}
.tl-contenu{position:relative;min-width:100%}
.regle{height:21px;position:sticky;top:0;z-index:3;background:#1c1b19;
 border-bottom:1px solid var(--trait);cursor:pointer}
.regle .tick{position:absolute;top:0;bottom:0;border-left:1px solid #ffffff14;
 font:9px/21px ui-monospace,monospace;color:var(--sourd);padding-left:3px}
.hEntete{height:21px;border-bottom:1px solid var(--trait);background:#1c1b19}
/* La poignee de hauteur, au bas du nom de la piste (comme celles des panneaux). */
.pPoignee{position:absolute;left:0;right:0;bottom:-4px;height:9px;z-index:4;
 cursor:row-resize}
.pPoignee::after{content:"";position:absolute;left:50%;top:2px;width:34px;
 height:4px;margin-left:-17px;border-radius:3px;background:var(--pc,var(--or));
 opacity:.65;box-shadow:0 0 0 1px #0008}
.pEntete:hover .pPoignee::after,.pPoignee.tire::after{opacity:1}
.pPoignee:hover::after,.pPoignee.tire::after{height:5px}
.pEntete{position:relative;display:flex;align-items:center;gap:4px;padding:0 6px;
 border-bottom:1px solid var(--trait);font:11px/1 ui-monospace,monospace;
 flex-wrap:wrap;align-content:center;row-gap:4px}
.pEntete b{flex:1 1 auto;font-weight:600;letter-spacing:.05em}
.pEntete i{font-style:normal;font-size:9px;color:var(--or);flex:0 0 auto}
/* Le volume de piste s affiche meme a 100 % — sinon il n y aurait rien a
   double-cliquer —, mais en retrait : seul un volume change doit sauter aux
   yeux. */
.pEntete i.neutre{color:var(--sourd);opacity:.55}
.pEntete i.pVal,.rang .val{cursor:text}
/* Le chiffre qu on tape, a la place du chiffre affiche. */
.saisieVal{font:11px/1 ui-monospace,monospace;color:var(--encre);
 background:var(--fond);border:1px solid var(--or);border-radius:3px;
 padding:1px 3px;text-align:right;flex:0 0 auto;min-width:0;outline:none}
.pEntete .saisieVal{font-size:9px;padding:0 2px}
/* Volume general de la piste son : sa propre ligne dans l en-tete. */
.pEntete input.vol{-webkit-appearance:none;appearance:none;flex:1 0 100%;
 min-width:0;height:3px;margin:0;padding:0;border:0;border-radius:2px;
 background:var(--trait);cursor:pointer}
.pEntete input.vol::-webkit-slider-thumb{-webkit-appearance:none;width:9px;
 height:9px;border-radius:50%;background:var(--orange);border:0;cursor:pointer}
.pEntete input.vol::-moz-range-thumb{width:9px;height:9px;border-radius:50%;
 background:var(--orange);border:0;cursor:pointer}
.pEntete button{padding:1px 5px;font-size:10px;border-radius:3px;
 font-family:ui-monospace,monospace}
.pEntete button.m.on{background:var(--rouge);border-color:var(--rouge);color:#fff}
.pEntete button.s.on{background:var(--or);border-color:var(--or);color:#1a1917}
/* La piste visee par « Add » : un clic sur son en-tete, un liseré orange. */
.pEntete.active{background:#241f19;box-shadow:inset 3px 0 0 var(--orange)}
.lane{position:relative;border-bottom:1px solid var(--trait);
 background:repeating-linear-gradient(90deg,#00000000 0 39px,#ffffff08 39px 40px)}
.lane.va{background-color:#1d1c1a}
.lane.aa{background-color:#1a1c1d}
.lane.cible{background-color:#2a2320}
/* La couleur de la piste : un voile sur la piste, un liseré et le nom en
   couleur dans l en-tete. */
.lane::before{content:"";position:absolute;inset:0;background:var(--pc,transparent);
 opacity:.07;pointer-events:none}
.pEntete{box-shadow:inset 4px 0 0 var(--pc,transparent)}
.pEntete b{color:var(--pc,inherit)}
.clip{position:absolute;top:2px;bottom:2px;background:var(--carte);
 border:1px solid var(--c0);border-radius:3px;overflow:hidden;cursor:grab;
 min-width:6px}
.clip.sel{box-shadow:0 0 0 1px var(--orange);z-index:2}
.clip.sel{border-color:var(--orange)}
.clip .vign{position:absolute;inset:0;background-size:auto 100%;
 background-repeat:repeat-x;opacity:.5}
.clip .teinte{position:absolute;inset:0;opacity:.28}
/* L onde du son : dessinee dans le bloc, sous son nom et ses attaches. */
.clip canvas.onde{position:absolute;left:0;top:0;width:100%;height:100%;
 z-index:1;pointer-events:none}
.clip .nom{position:relative;font-size:10px;padding:2px 6px;white-space:nowrap;
 overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px #000}
.clip .info{position:absolute;right:4px;bottom:1px;font:9px/1.4 ui-monospace,monospace;
 opacity:.75;text-shadow:0 1px 2px #000}
.clip .poi{position:absolute;top:0;bottom:0;width:8px;z-index:3;
 background:linear-gradient(#d9532b66,#d9532b22)}
.clip .poi.g{left:0;cursor:w-resize}
.clip .poi.d{right:0;cursor:e-resize}
.clip .poi:hover{background:var(--orange)}
/* Un bord coupe ou rogne : le rush continue au-dela. Gris bleute, pour ne pas
   le prendre pour la vraie fin du rush (orange). */
.clip .poi.coupe{background:linear-gradient(#8fa6c266,#8fa6c222)}
.clip .poi.coupe:hover{background:#8fa6c2}
.clip .fondu{position:absolute;top:0;bottom:0;pointer-events:none;
 background:linear-gradient(90deg,#000c,#0000)}
/* Bande du haut : viser les carres de 9 px demandait trop de precision. Toute
   la largeur du bloc, sur ses 11 premiers pixels, attrape le fondu le plus
   proche ; en dessous, le bloc se deplace et se rogne comme avant. */
.clip .bande{position:absolute;left:0;right:0;top:0;height:11px;z-index:5;
 cursor:ew-resize}
.lane.aa .clip .bande,.lane.ma .clip .bande{height:8px}
.clip:hover .bande{background:#e8b93a1f}
.clip .att{position:absolute;top:1px;width:9px;height:9px;background:var(--or);
 border:1px solid #0009;border-radius:2px;z-index:4;cursor:ew-resize;opacity:.45;
 margin-left:-4px}
.clip:hover .att,.clip.sel .att{opacity:1}
.clip .fondu.d{background:linear-gradient(90deg,#0000,#000c)}
body.outilC .clip{cursor:crosshair}
body.outilC .clip .poi{display:none}
/* Sélection de piste vers l avant : le curseur montre le sens. */
body.outilA .clip{cursor:e-resize}
body.outilA .clip .poi,body.outilA .clip .att{display:none}
/* Ctrl pendant un deplacement : le bloc survole sera ejecte derriere. */
.clip.ejectable{outline:2px dashed var(--or);outline-offset:-2px}
.lasso{position:absolute;z-index:8;border:1px solid var(--orange);
 background:#d9532b26;pointer-events:none;border-radius:2px}
/* Marqueurs. La poignee tient dans la reglette, en haut ; le trait qui
   descend sur les pistes ne prend aucun clic, sinon il volerait 11 px de
   largeur a chaque bloc qu il traverse. */
.marque{position:absolute;top:0;bottom:0;width:11px;margin-left:-5px;z-index:6;
 pointer-events:none}
.marque::before{content:"";position:absolute;left:5px;top:21px;bottom:0;width:1px;
 background:#3fb6c8;opacity:.42}
.marque i{position:absolute;left:0;top:4px;width:11px;height:11px;display:block;
 background:#3fb6c8;border-radius:2px;transform:rotate(45deg);
 pointer-events:auto;cursor:ew-resize}
.marque i:hover{box-shadow:0 0 8px #3fb6c8}
.clip .mqb{position:absolute;bottom:0;height:58%;width:7px;margin-left:-3px;
 z-index:5;cursor:ew-resize}
.clip .mqb::before{content:"";position:absolute;left:3px;top:0;bottom:0;width:1px;
 background:#3fb6c8}
.clip .mqb::after{content:"";position:absolute;left:0;bottom:0;width:7px;height:7px;
 background:#3fb6c8;border-radius:1px}
.clip .mqb:hover::after{box-shadow:0 0 7px #3fb6c8}
.tete{position:absolute;top:0;bottom:0;width:1px;background:var(--orange);
 z-index:5;pointer-events:none}
.tete::before{content:"";position:absolute;top:0;left:-5px;border:5px solid transparent;
 border-top-color:var(--orange);border-bottom:0;height:0}
/* La case garde la largeur ; le panneau la remplit. En pop-up, le panneau
   s en detache et la case reste en place : la timeline ne bouge pas d un
   pixel pendant qu on tient Tab. */
.colReg{flex:0 0 var(--wRegl);min-width:150px;display:flex;min-height:0}
.reglages{flex:1 1 auto;min-width:0;border-left:1px solid var(--trait);
 padding:9px 10px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
/* Tab maintenue : les reglages du bloc sortent au milieu de l ecran, en
   grand. Le panneau reste le meme element : ses curseurs repondent toujours
   a la souris pendant qu on tient la touche. */
body.regPop .reglages{position:fixed;z-index:60;left:50%;top:50%;
 transform:translate(-50%,-50%);width:min(580px,92vw);max-height:84vh;
 background:var(--fond);border:1px solid var(--or);border-radius:10px;
 box-shadow:0 22px 70px #000c;padding:16px 18px;gap:10px;
 animation:regPop .12s ease-out}
@keyframes regPop{from{opacity:0;transform:translate(-50%,-50%) scale(.965)}
 to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
/* La case vide, le temps du pop-up : un cadre en pointilles dit d ou il
   vient, et qu il y retournera. */
body.regPop .colReg{border-left:1px dashed var(--trait)}
.reglages label{font-size:11px;color:var(--sourd);display:flex;
 align-items:center;gap:6px;margin-bottom:3px}
/* Images-clés : une flèche par curseur déplie son panneau d animation. */
.reglages .fleche{background:none;border:0;color:var(--sourd);cursor:pointer;
 font-size:9px;padding:0 3px;line-height:1;border-radius:3px}
.reglages .fleche:hover{color:var(--encre);background:var(--carte)}
.reglages .fleche.on{color:var(--or)}
.reglages .nbcle{font-style:normal;font-size:9px;color:var(--or)}
/* Trois onglets en tete du panneau de reglages : le bloc en avait une
   douzaine a la suite, il fallait faire defiler pour atteindre la vitesse. */
.ongletsReg{display:flex;gap:3px;padding-bottom:7px;
 border-bottom:1px solid var(--trait)}
.ongletsReg button{flex:1 1 0;padding:4px 2px;font-size:11px;border-radius:4px}
.ongletsReg button.on{background:var(--orange);border-color:var(--orange);
 color:#fff}
.animPan{margin:5px 0 2px;padding:6px;border:1px solid var(--trait);
 border-radius:5px;background:#1b1a18}
.animBar{display:flex;gap:4px;align-items:center;margin-bottom:5px}
.animBar button{padding:1px 6px;font-size:11px;line-height:1.6;border-radius:3px}
.animBar button.on{background:var(--kc,var(--or));border-color:var(--kc,var(--or));
 color:#1a1917}
.animBar button:disabled{opacity:.35;cursor:default}
.animCles{display:flex;flex-wrap:wrap;gap:4px}
.animCles .cle{display:inline-flex;align-items:center;gap:5px;font-size:10px;
 font-family:ui-monospace,monospace;background:var(--carte);cursor:pointer;
 border:1px solid var(--trait);border-radius:9px;padding:1px 7px}
.animCles .cle:hover{border-color:var(--or)}
.animCles .cle.ici{background:var(--kc,var(--or));border-color:var(--kc,var(--or));
 color:#1a1917}
.animCles .cle b{color:var(--sourd);font-weight:400}
.animCles .cle.ici b{color:#1a1917}
.animCles .cle b:hover{color:var(--rouge)}
.animVide{font-size:10px;color:var(--sourd);line-height:1.5}
/* Les images-cles sur le bloc : un losange par cle, a sa couleur. */
.clip .cles{position:absolute;inset:0;pointer-events:none;z-index:3}
.clip .cles i{position:absolute;width:9px;height:9px;margin-left:-4.5px;
 transform:rotate(45deg);border:1px solid #000;box-shadow:0 0 0 1px #fff8,0 0 3px #000;
 pointer-events:auto;cursor:default}
.clip .anim{position:absolute;left:3px;top:2px;z-index:3;font-size:9px;
 color:var(--or);text-shadow:0 1px 2px #000;pointer-events:none}
.reglages .rang{display:flex;gap:6px;align-items:center}
/* Le rack d effets : une carte par effet, dans l ordre ou ils s appliquent. */
.rack{display:flex;flex-direction:column;gap:7px;margin-top:6px;
 padding-top:8px;border-top:1px solid var(--trait)}
.rackTete{display:flex;align-items:center;gap:6px}
.rackTete label{margin:0;flex:0 0 auto}
.rackTete select{flex:1 1 auto;min-width:0;font-size:11px;padding:2px 4px}
.rackVide{font-size:11px;color:var(--sourd)}
.fxCarte{border:1px solid var(--trait);border-radius:5px;padding:6px 7px;
 display:flex;flex-direction:column;gap:5px;background:#1f1e1c}
.fxCarte.eteint{opacity:.5}
.fxTete{display:flex;align-items:center;gap:4px;font-size:12px}
.fxTete b{font-weight:600}
.fxOn{background:none;border:0;padding:0 2px;color:var(--sourd);font-size:13px;
 line-height:1;cursor:pointer}
.fxOn.on{color:var(--vert);background:none;border-color:transparent}
.fxOn.on:hover{background:none}
.rackPresets{display:flex;gap:5px}
.rackPresets select{flex:1 1 auto;min-width:0;font-size:11px;padding:2px 4px}
/* Un plan qui porte des effets le montre sur la timeline. */
.clip .fxBadge{position:absolute;top:1px;right:3px;font-size:9px;
 color:#c9a2ff;pointer-events:none;z-index:3;text-shadow:0 1px 2px #000}
.fxPetit{background:none;border:1px solid transparent;color:var(--sourd);
 padding:0 4px;font-size:11px;line-height:1.4;cursor:pointer}
.fxPetit:hover{border-color:var(--trait);color:var(--encre)}
.fxModes{display:flex;gap:3px}
.fxModes button{flex:1 1 0;padding:3px 2px;font-size:10.5px;border-radius:4px}
.fxModes button.on{background:var(--orange);border-color:var(--orange);color:#fff}
.fxCouleur{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--sourd)}
.fxCouleur input{width:34px;height:20px;padding:0;border:1px solid var(--trait)}
.fxAppliquer{font-size:11px;padding:4px 6px}
.reglages .val{font:11px/1 ui-monospace,monospace;color:var(--sourd);
 min-width:40px;text-align:right}
/* Les curseurs etaient laisses au navigateur : gros et bleu vif. Un rail fin
   dans le gris de l interface, une pastille ambre. Meme dessin partout —
   reglages, tete de lecture, taille des vignettes. */
input[type=range]{-webkit-appearance:none;appearance:none;background:none;
 border:0;padding:0;margin:0;height:12px;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:2px;border-radius:1px;
 background:var(--trait)}
input[type=range]::-moz-range-track{height:2px;border-radius:1px;
 background:var(--trait)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;
 width:10px;height:10px;margin-top:-4px;border-radius:50%;border:0;
 background:var(--or);transition:background .12s,transform .12s}
input[type=range]::-moz-range-thumb{width:10px;height:10px;border:0;
 border-radius:50%;background:var(--or)}
input[type=range]:hover::-webkit-slider-thumb{background:#f3d264;transform:scale(1.15)}
input[type=range]:active::-webkit-slider-thumb{background:var(--orange)}
input[type=range]:hover::-moz-range-thumb{background:#f3d264}
.reglages input[type=range]{flex:1;min-width:0}
/* C et V : reprendre un reglage d un bloc et le poser sur un autre. */
.reglages .cv{background:none;border:1px solid var(--trait);color:var(--sourd);
 font:9px/1 ui-monospace,monospace;padding:2px 4px;border-radius:3px;
 cursor:pointer;flex:0 0 auto}
.reglages .cv:hover:not(:disabled){color:var(--encre);border-color:var(--sourd);
 background:var(--carte)}
.reglages .cv:disabled{opacity:.3;cursor:default}
.reglages .cv.plein{color:var(--or);border-color:var(--or)}
.pileboutons{display:flex;gap:5px;flex-wrap:wrap}

#menu{position:fixed;z-index:70;background:var(--haut);border:1px solid var(--trait);
 border-radius:6px;padding:4px;display:none;min-width:186px;
 box-shadow:0 8px 26px #000a}
#menu.on{display:block}
#menu .it{padding:6px 10px;border-radius:4px;cursor:pointer;font-size:12px;
 display:flex;align-items:center;gap:8px}
#menu .it:hover{background:var(--orange);color:#fff}
#menu .sep{height:1px;background:var(--trait);margin:4px 2px}
#menu .it.mort{color:var(--sourd);cursor:default}
/* Les deux boutons qui posent un calque : distincts des outils de piste. */
.outil.calque{border-color:#4a7fa8;color:#9ec7e6}
/* La musique a sa couleur, pour se distinguer des bruitages d un coup d oeil. */
.outil.musique{border-color:#7a5a9b;color:#c3aada}
.outil.musique:hover{border-color:#a98fc6;color:#ded0ef;background:#251d30}
/* Le masque a sa couleur : bouton cerne tant que le bloc selectionne n a pas
   de masque actif, plein des qu il en a un. */
.outil.masque{border-color:#2fb5a5;color:#8fe0d4}
.outil.masque:hover{border-color:#5fd6c7;color:#d2f5f0;background:#16302c}
.outil.masque.plein{background:#2fb5a5;border-color:#2fb5a5;color:#08201c}
.outil.masque.plein:hover{background:#45c9b9;border-color:#45c9b9;color:#08201c}
/* Le contour du masque, par-dessus le moniteur. Il ne prend la souris que
   pendant un trace. */
.cadreMoni{position:relative}
#mqCalque{position:absolute;left:0;top:0;width:0;height:0;overflow:hidden;
 pointer-events:none;z-index:3}
body:not(.edit) #mqCalque{display:none}
body.mqDessin #mqCalque{pointer-events:auto;cursor:crosshair}
#mqCalque path{fill:none;stroke:#2fb5a5;stroke-width:1.6;
 vector-effect:non-scaling-stroke}
#mqCalque path.repos{stroke-dasharray:6 4}
/* Edition des points (1.3.29) : points, poignees de Bezier. */
body.mqEdit #mqCalque{pointer-events:auto;cursor:default}
#mqCalque circle.pt{fill:#101414;stroke:#2fb5a5;stroke-width:1.6;cursor:move}
#mqCalque circle.pt.sel{fill:#2fb5a5}
#mqCalque circle.an{fill:#e8b93a;stroke:#101414;stroke-width:1;cursor:pointer}
#mqCalque line.an{stroke:#e8b93a;stroke-width:1;opacity:.85}
#mqCalque path.edit{stroke-width:2;cursor:copy;pointer-events:stroke}
#mqCalque path.eteint{opacity:.35}
.clip .mqBadge{position:absolute;top:1px;right:14px;font-size:9px;
 color:#8fe0d4;pointer-events:none;z-index:3;text-shadow:0 1px 2px #000}
#menu .mqRang{display:flex;gap:7px;align-items:center;padding:2px 10px 6px}
#menu .mqRang input{flex:1 1 auto;min-width:0}
#menu .mqRang .val{font:11px/1 ui-monospace,monospace;color:var(--sourd);
 min-width:38px;text-align:right}
#menu label.it input{margin:0;min-width:0;width:auto;flex:0 0 auto}
/* « Clone » : un champ pour le nombre de copies, dans la ligne du menu. */
#menu .it.clone{gap:6px;cursor:default}
#menu .it.clone:hover{background:none;color:inherit}
#menu .it.clone input{width:54px;min-width:0;padding:1px 5px;font-size:12px}
#menu .it.clone button{padding:1px 9px;font-size:11px}
.lane.ma{background:#1d1826}
.outil.calque:hover{border-color:#79aed6;color:#d3e9fb;background:#1d2b38}
/* Vignette d un bloc sans rush : un aplat, pas une image. */
.clip .vign.synth{background-size:cover}
/* Nuancier des boîtes calque et texte. */
.nuancier{display:flex;flex-wrap:wrap;gap:6px}
.nuancier b{width:26px;height:26px;border-radius:5px;cursor:pointer;
 border:2px solid transparent;box-shadow:inset 0 0 0 1px #0006}
.nuancier b.on{border-color:var(--encre)}
.apercu{border:1px solid var(--trait);border-radius:5px;overflow:hidden;
 background:#000;display:flex;align-items:center;justify-content:center;
 height:104px;text-align:center;padding:6px}
#menu .it.mort:hover{background:none;color:var(--sourd)}
#menu .lbl{padding:4px 10px 2px;font-size:10px;letter-spacing:.11em;
 text-transform:uppercase;color:var(--sourd)}
#menu .couls{display:flex;gap:5px;padding:3px 10px 7px}
#menu .couls span{width:19px;height:19px;border-radius:4px;cursor:pointer;
 border:1px solid #0006}
#menu .couls span:hover{outline:2px solid var(--encre);outline-offset:1px}
#menu .couls{flex-wrap:wrap;max-width:230px}
#menu .couls span.aucune{background:none;border:1px dashed var(--sourd)}
/* Les couleurs de rangement dans un menu : la pastille ET son nom. */
#menu .chipsCat{display:flex;flex-wrap:wrap;gap:4px;padding:3px 10px 7px;
 max-width:250px}
#menu .chipsCat span{display:inline-flex;align-items:center;gap:4px;
 padding:1px 7px 1px 3px;border-radius:10px;border:1px solid var(--trait);
 font-size:11px;line-height:15px;cursor:pointer;color:var(--sourd)}
#menu .chipsCat span i{width:11px;height:11px;border-radius:50%;flex:0 0 auto;
 box-shadow:inset 0 0 0 1px #0006}
#menu .chipsCat span i.aucune{box-shadow:none;border:1px dashed var(--sourd)}
#menu .chipsCat span:hover{border-color:var(--sourd);color:var(--encre)}
#menu .chipsCat span.on{border-color:var(--encre);color:var(--encre)}
/* Le deroulant de la pastille, et l editeur d une couleur. */
#menu .it i.pt{flex:0 0 auto;width:12px;height:12px;border-radius:50%;
 box-shadow:inset 0 0 0 1px #0006}
#menu .it i.pt.aucune{box-shadow:none;border:1px dashed var(--sourd)}
#menu .it.choisi{background:#ffffff14}
#menu .edCat{display:flex;flex-direction:column;gap:7px;padding:4px 8px 6px;
 width:224px}
#menu .edCat .ligne{display:flex;gap:6px;align-items:center}
#menu .edCat input[type=color]{width:34px;min-width:0;height:26px;padding:0;
 border:1px solid var(--trait);flex:0 0 auto;cursor:pointer}
#menu .edCat input[type=text]{flex:1 1 auto;min-width:0;font-size:12px}

<script>
// ===========================================================================
//  État général
// ===========================================================================
// Plusieurs projets peuvent etre ouverts a la fois. Un projet, c est un
// dossier de Coulisses-Du-Cosmos-2026 ; ses donnees vivent dans
// <projet>/_projet/. FILMS est la reunion des projets ouverts, chaque fiche
// portant son projet dans « pj ». Les identifiants etant des UUID, PAR_ID
// reste un index plat valable a travers tous les projets ouverts.
let OUVERTS = [];
// Un dossier de premier niveau qui n est pas un projet mais une BIBLIOTHEQUE
// partagee : la musique. Toujours ouverte, jamais fermable, jamais dans la
// liste « ouvrir / creer ». Le serveur dit lesquels le sont.
let BIBLIS = [];
// Le projet des captures du moniteur, s il existe : toujours ouvert, tout en
// bas, sans sequences a lui.
let CAPTURES_NOM = '';
const estCaptures = nom => !!CAPTURES_NOM && nom === CAPTURES_NOM;
const estBibli = nom => BIBLIS.indexOf(nom) >= 0;
// Projets dont la liste de dossiers est repliee dans la colonne.
let REPLIES = new Set();
// Projets dont la liste de montages est depliee dans la colonne.
let MONT_OUVERTS = new Set();
let FILMS = [], DOSSIERS = [], PAR_ID = {};
let dossierActif = null, q = '', favSeul = false;
let selection = new Set();

// Carte agrandie par un double-clic : une seule a la fois, et elle garde son
// lecteur d une regeneration de la grille a l autre.
let agrandi = null;

const projetOuvert = n => OUVERTS.find(p => p.nom === n);
// ---- rangement virtuel (en ligne seulement) -----------------------------
// Des dossiers qui n existent sur AUCUN disque. Le catalogue n est jamais
// touche : « id » et « rel » restent ceux du poste de David, donc l export XML
// continue de designer les fichiers a leur emplacement d origine, quelle que
// soit l organisation que chacun s est faite ici. Deux vues du meme fonds :
// « source » montre les dossiers de tournage, « rangement » ceux qu on s est
// faits.
let VUE = 'source';
const RANGEMENTS = {};
let MOI = {identifiant: '', admin: false, comptes: -1};
// Vrai des qu un serveur sait ranger : l hebergeur, et le serveur de bureau
// d une bibliotheque qui l annonce. Un serveur plus ancien ne dit rien, et
// tout reste comme avant.
let RANGEABLE = false, LECTURE_SEULE = false, TITRE = '';
// Le serveur sait retirer les fiches manquantes (champ « purge » annonce par
// /api/projets). Absent — vieux serveur, version en ligne — : pas de bouton.
let PURGE = false;
// Le serveur sait-il fabriquer l onde d un son (/api/onde) ? Sans ce champ —
// ancien serveur, version en ligne — le menu ne la propose pas.
let ONDE_OK = false;
// Le serveur sait-il lister TOUS les dossiers (/api/dossiers) et en ouvrir un
// (/api/projet/ajouter) ? Sans ce champ, « Open project » s en tient aux
// projets declares, comme avant.
let DOSSIERS_OK = false;
// Le serveur sait-il montrer un fichier dans l explorateur du systeme
// (/api/reveler) ? En ligne il n y a pas d explorateur : pas d entree.
let REVELER_OK = false;
// Le serveur sait ajouter des rushes choisis un par un (champ « ajout »).
let AJOUT_OK = false;
// Le site ou cette bibliotheque est publiee (champ « synchro »), et le compte
// connecte depuis ce serveur. Vide : pas de bouton de synchro.
let SYNCHRO = '', SYNCHRO_QUI = '';
// Le serveur sait se mettre a jour depuis GitHub (champ « maj »).
let MAJ_DISPO = false;
// Le faux dossier qui recueille ce qui n a pas encore ete range. Il n est
// jamais enregistre : c est un affichage, pas un dossier.
const NONRANGE = '— not filed —';
const rangementDe = pj =>
  RANGEMENTS[pj] || (RANGEMENTS[pj] = {dossiers: [], ou: {}});

// L ordre de la colonne : chaque dossier sous son parent, et des freres dans
// l ordre de la liste — celui qu on choisit a la poignee (David, 05/10). Une
// liste triee, comme toutes celles d avant, donne l ordre alphabetique.
function ordreArbre(l) {
  const parent = d => d.lastIndexOf('/') < 0 ? '' : d.slice(0, d.lastIndexOf('/'));
  const enfants = new Map();
  l.forEach(d => {
    const p = parent(d);
    if (!enfants.has(p)) enfants.set(p, []);
    enfants.get(p).push(d);
  });
  const out = [], vus = new Set();
  const visiter = p => (enfants.get(p) || []).forEach(d => {
    if (vus.has(d)) return;
    vus.add(d); out.push(d); visiter(d);
  });
  visiter('');
  // Un dossier dont le parent manque a la liste ne doit pas disparaitre.
  l.forEach(d => { if (!vus.has(d)) { vus.add(d); out.push(d); visiter(d); } });
  return out;
}

// Vue Source : les vrais dossiers n ont pas de fichier de rangement, l ordre
// choisi est une preference de ce navigateur. Un dossier apparu depuis se
// range a la fin.
function ordreSource(pj, l) {
  let o = null;
  try { o = JSON.parse(pref.lire('ordreSrc', '{}'))[pj]; } catch (e) {}
  if (!Array.isArray(o)) return ordreArbre(l);
  const rang = new Map(o.map((d, i) => [d, i]));
  const cle = (d, i) => rang.has(d) ? rang.get(d) : 1e6 + i;
  return ordreArbre(l.map((d, i) => [d, cle(d, i)])
    .sort((a, b) => a[1] - b[1]).map(x => x[0]));
}

const clefDossier = f => VUE === 'rangement'
  ? f.pj + '/' + (rangementDe(f.pj).ou[f.id] || NONRANGE)
  : f.pj + (f.dossier ? '/' + f.dossier : '');
// Ou vivent les medias. Vides, on est sur le serveur de bureau et rien ne
// change. En ligne, le serveur annonce ses deux bases dans /api/projets : les
// proxys sont alors ailleurs (stockage objet ou sous-dossier), et chaque fiche
// porte le chemin de SON proxy, extension comprise — un .wav devient un .m4a,
// on ne peut pas le deviner.
let BASE_MEDIA = '', BASE_POSTERS = '', ENLIGNE = false;
const urlMedia = f => BASE_MEDIA
  ? BASE_MEDIA + encodeURIComponent(f.pj) + '/' + encodeURI(f.proxy || f.rel)
  : 'media/' + encodeURIComponent(f.pj) + '/' + encodeURI(f.rel);
const urlPoster = f => BASE_POSTERS
  ? BASE_POSTERS + encodeURIComponent(f.pj) + '/' + f.id + '.jpg'
  : 'posters/' + encodeURIComponent(f.pj) + '/' + f.id + '.jpg';
const posterDe = id => { const f = PAR_ID[id]; return f ? urlPoster(f) : ''; };

// Le projet « courant » sert aux actions qui ne visent pas une fiche precise :
// creer un dossier, rescanner, annuler. C est celui choisi dans la colonne,
// ou le seul ouvert s il n y en a qu un.
function projetCourant() {
  if (dossierActif) return dossierActif.split('/')[0];
  return OUVERTS.length === 1 ? OUVERTS[0].nom : null;
}

// Recompose les listes plates a partir des projets ouverts.
async function chargerRangement(pj) {
  if (!RANGEABLE) return;
  try {
    const d = await api('api/rangement?projet=' + encodeURIComponent(pj));
    RANGEMENTS[pj] = {dossiers: d.dossiers || [], ou: d.ou || {}};
  } catch (err) {
    RANGEMENTS[pj] = {dossiers: [], ou: {}};
  }
}

// On enregistre le rangement ENTIER a chaque changement : il pese quelques
// kilo-octets pour cinq cents rushes, et un envoi complet ne peut pas laisser
// le serveur dans un etat a moitie ecrit.
let _rangEnCours = null;
async function enregistrerRangement(pj) {
  const r = rangementDe(pj);
  try {
    _rangEnCours = api('api/rangement',
      {projet: pj, dossiers: r.dossiers, ou: r.ou});
    const d = await _rangEnCours;
    // Le serveur fait autorite : il cree les parents manquants et jette ce
    // qui pointe dans le vide. On reprend SA version, pas la notre.
    RANGEMENTS[pj] = {dossiers: d.dossiers || [], ou: d.ou || {}};
  } catch (err) {
    dire('arrangement not saved — ' + err.message, true);
  } finally {
    _rangEnCours = null;
  }
}

async function basculerVue(v) {
  if (VUE === v) return;
  // Un projet ouvert apres le demarrage n a pas encore son rangement.
  await Promise.all(OUVERTS.map(p =>
    RANGEMENTS[p.nom] ? null : chargerRangement(p.nom)));
  VUE = v;
  pref.ecrire('vue', VUE);
  dossierActif = null;
  document.body.classList.toggle('rangement', VUE === 'rangement');
  $$('[data-vue]').forEach(b => b.classList.toggle('on', b.dataset.vue === VUE));
  majBoutonSource();
  refondre(); rendre();
}

function majBoutonSource() {
  const b = $('#bSource');
  if (b) b.setAttribute('aria-checked', VUE === 'source' ? 'true' : 'false');
}

function refondre() {
  // Une bibliotheque passe TOUJOURS apres les projets — dans la colonne
  // comme dans la grille, et quel que soit l ordre d ouverture. Le tri est
  // stable, donc l ordre des projets entre eux ne bouge pas.
  const rang = n => estCaptures(n) ? 2 : estBibli(n) ? 1 : 0;
  OUVERTS.sort((a, b) => rang(a.nom) - rang(b.nom));
  FILMS = []; DOSSIERS = [];
  OUVERTS.forEach(p => {
    (p.films || []).forEach(f => { f.pj = p.nom; FILMS.push(f); });
    if (VUE === 'rangement') {
      const r = rangementDe(p.nom);
      const l = ordreArbre(r.dossiers);
      // « non range » n apparait que s il reste quelque chose dedans : une
      // ligne vide en permanence serait un reproche permanent.
      if ((p.films || []).some(f => !f.absent && !r.ou[f.id])) l.push(NONRANGE);
      l.forEach(d => DOSSIERS.push({pj: p.nom, d: d, clef: p.nom + '/' + d}));
    } else {
      ordreSource(p.nom, p.dossiers || []).forEach(d =>
        DOSSIERS.push({pj: p.nom, d: d, clef: p.nom + '/' + d}));
    }
  });
  indexer();
}

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

function dire(msg, mal) {
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'on' + (mal ? ' mal' : '');
  clearTimeout(dire._h);
  dire._h = setTimeout(() => t.className = '', mal ? 5200 : 2400);
}

function tc(v) {
  v = Math.max(0, v || 0);
  const m = Math.floor(v / 60), s = Math.floor(v % 60);
  const f = Math.floor((v - Math.floor(v)) * PROJET.fps);
  const d = n => String(n).padStart(2, '0');
  return d(m) + ':' + d(s) + ':' + d(f);
}

// Specifications du montage en cours. Tout ce qui parle de temps ou de
// cadre s y refere : moniteur, compteurs, export XML, rendu ffmpeg.
// « pj » : le projet dans lequel ce montage est enregistre. Les plans, eux,
// peuvent venir de n importe quel projet ouvert.
const PROJET = {nom: '', pj: '', w: 1280, h: 720, fps: 24};

// Une seule unite pour tous les affichages de temps : secondes ou images.
let unite = 'sec';
function fmt(v) {
  v = Math.max(0, v || 0);
  if (unite === 'img') return Math.round(v * PROJET.fps) + ' img';
  const m = Math.floor(v / 60), s = v % 60;
  return String(m).padStart(2, '0') + ':' +
    s.toFixed(2).padStart(5, '0') + ' s';
}

// Un appel qui ne revient jamais laissait la boite bloquee sur « running… »,
// sans aucune sortie. Toute requete a donc une limite de temps ; passer 0 en
// troisieme argument la leve, pour le scan qui dure legitimement des minutes.
const DELAI_API = 25000;
// Chemins RELATIFS (api/…, media/…) : sur le bureau la page est a la racine,
// mais en ligne une bibliotheque peut vivre dans un sous-dossier
// (ground-run.placenta.tv/ep-01/) ; un « /api/ » partait alors a la racine du
// domaine, la porte ne s ouvrait jamais (05/10).
async function api(route, corps, delai) {
  const ms = delai === undefined ? DELAI_API : delai;
  const ctrl = ms && window.AbortController ? new AbortController() : null;
  const minuteur = ctrl ? setTimeout(() => ctrl.abort(), ms) : null;
  let r;
  try {
    const opts = corps
      ? {method: 'POST', headers: {'Content-Type': 'application/json'},
         body: JSON.stringify(corps)}
      : {cache: 'no-store'};
    if (ctrl) opts.signal = ctrl.signal;
    r = await fetch(route, opts);
  } catch (e) {
    if (e && e.name === 'AbortError')
      throw new Error('no answer from the server after ' +
        Math.round(ms / 1000) + ' s — the operation may have gone through anyway');
    throw e;
  } finally {
    if (minuteur) clearTimeout(minuteur);
  }
  const d = await r.json().catch(() => ({erreur: 'unreadable answer'}));
  if (!r.ok || d.erreur) throw new Error(d.erreur || ('HTTP ' + r.status));
  return d;
}

// -- préférences d'affichage persistantes -----------------------------------
// En ligne, plusieurs bibliotheques peuvent partager une adresse
// (ground-run.placenta.tv/ep-01/, /ep-02/…) et donc un meme localStorage : la
// cle prend le chemin du dossier, sinon les projets ouverts d un episode
// etaient cherches dans l autre. A la racine (le bureau), rien ne change.
const PREF_NS = location.pathname.replace(/[^/]*$/, '');
const prefCle = c => 'gary_' + (PREF_NS === '/' ? '' : PREF_NS) + c;
const pref = {
  lire(c, d) { try { const v = localStorage.getItem(prefCle(c));
    return v === null ? d : v; } catch (e) { return d; } },
  ecrire(c, v) { try { localStorage.setItem(prefCle(c), v); } catch (e) {} }
};

// Trois vues, trois reglages de vignette : la planche complete veut de
// petites icones, un dossier veut des vignettes lisibles, le deck de montage
// veut le plus petit. Les deux controles agissent toujours sur la vue en cours.
const PROFILS = {
  tous:    {taille: 104, forme: 'carre'},
  dossier: {taille: 206, forme: '169'},
  deck:    {taille: 96,  forme: 'carre'}

function profilCourant() {

// -- poignées de redimensionnement ------------------------------------------
const RZ = {
  aside: {v: '--wAside', min: 120, max: 520, sens: 1},
  moni: {v: '--wMoni', min: 200, max: 900, sens: -1},
  regl: {v: '--wRegl', min: 150, max: 620, sens: -1},
  footer: {v: '--hFooter', min: 150, max: 900, sens: -1}
};
$$('.rz').forEach(el => {
  el.addEventListener('pointerdown', e => {
    let cfg = RZ[el.dataset.rz];
    if (!cfg) return;
    // En mode Montage, le moniteur est elastique et c est le deck qui a une
    // largeur fixe : la meme poignee doit donc piloter --wDeck, et dans l
    // autre sens puisque le deck est a gauche.
    let cle = el.dataset.rz;
    if (cle === 'moni' && document.body.classList.contains('edit')) {
      cfg = {v: '--wDeck', min: 120, max: 760, sens: 1};
      cle = 'deck';
    }
    e.preventDefault();
    el.classList.add('actif');
    const vertical = el.classList.contains('horiz');
    const dep = parseFloat(getComputedStyle(document.documentElement)
      .getPropertyValue(cfg.v)) || cfg.min;
    const p0 = vertical ? e.clientY : e.clientX;
    const bouger = ev => {
      const d = ((vertical ? ev.clientY : ev.clientX) - p0) * cfg.sens;
      const val = Math.min(cfg.max, Math.max(cfg.min, dep + d));
      RACINE_CSS.setProperty(cfg.v, val + 'px');
      if (cle === 'footer' || cle === 'regl') majMinimap();
      if (typeof dimensionnerMoniteur === 'function') {
        dimensionnerMoniteur();
        dessiner();
      }
    };
    const lacher = () => {
      el.classList.remove('actif');
      window.removeEventListener('pointermove', bouger);
      window.removeEventListener('pointerup', lacher);
      pref.ecrire(cle,
        getComputedStyle(document.documentElement).getPropertyValue(cfg.v).trim());
      majMinimap();
    };
    window.addEventListener('pointermove', bouger);
    window.addEventListener('pointerup', lacher);
  });
});

// Teinte stable tiree du nom : deux morceaux voisins ne se ressemblent pas.
function tonSon(nom) {
  let h = 0;
  const t = String(nom || '');
  for (let i = 0; i < t.length; i++) h = (h * 31 + t.charCodeAt(i)) % 360;
  return h;
}

function format(f) {
  if (f.son_seul || !f.w || !f.h) return null;
  const r = f.w / f.h;
  if (r > 2.1) return {code: 'SCOPE', cls: 'fmt'};
  if (r < 0.9) return {code: 'VERT', cls: 'vert'};
  if (r < 1.12) return {code: 'CARRE', cls: 'carre'};
  if (r < 1.6) return {code: '4:3', cls: 'fmt'};
  return null;
}

// Les couleurs de rangement : une couleur, un nom — une categorie. La
// palette appartient a la bibliotheque et vaut pour tous ses projets (elle
// vit avec les prereglages, genre « categories ») ; chaque rush garde la
// sienne dans son catalogue, champ « coul », le numero de la categorie,
// comme avant. Les cinq de depart sont les couleurs d etiquette d origine :
// un rush deja colore au clic droit tombe dans la categorie de sa couleur.
// Un numero n est jamais redonne (« suivant ») : un rush d un projet ferme
// qui portait une couleur effacee ne se retrouve pas dans une nouvelle.
const CAT_DEPART = [
  {id: 1, coul: '#a8302f', nom: ''}, {id: 2, coul: '#c98a2b', nom: ''},
  {id: 3, coul: '#6a9b4a', nom: ''}, {id: 4, coul: '#4a7fa8', nom: ''},
  {id: 5, coul: '#7a5a9b', nom: ''}];
// Les teintes proposees, et prises dans l ordre pour une couleur ajoutee.
const CAT_TEINTES = ['#3f9a94', '#c2577f', '#8f8a3a', '#d06a3a', '#5a67b8',
                     '#9a6b4a', '#4aa86a', '#b84a4a', '#7d8a99', '#c7b23a',
                     '#a8302f', '#c98a2b', '#6a9b4a', '#4a7fa8', '#7a5a9b'];
const CAT_MAX = 40;
let CATS = {suivant: 6, liste: CAT_DEPART.map(c => Object.assign({}, c))};
let FILTRE_CAT = 0;
const catDe = id => CATS.liste.find(c => c.id === +id) || null;
const couleurCat = id => { const c = id ? catDe(id) : null; return c ? c.coul : ''; };

function correspond(f) {
  if (dossierActif !== null &&
      dossierActif !== f.pj && dossierActif !== clefDossier(f)) return false;
  if (favSeul && !f.fav) return false;
  if (FILTRE_CAT && +f.coul !== FILTRE_CAT) return false;
  if (q && !f.nom.toLowerCase().includes(q)) return false;
  return true;
}

function rendreDossiers() {
  // un compteur par couple projet + dossier
  const n = {};
  FILMS.forEach(f => {
    if (f.absent) return;
    const c = clefDossier(f);
    // Un fichier a la racine du projet a pour clef le projet lui-meme : il
    // etait compte deux fois (4 rushes affichaient 8).
    if (c !== f.pj) n[c] = (n[c] || 0) + 1;
    n[f.pj] = (n[f.pj] || 0) + 1;
  });
  const vivants = FILMS.filter(f => !f.absent).length;
  const ech = x => String(x).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/"/g, '&quot;');

  let h = '';
  let o = '<option value="">All open projects (' + vivants + ')</option>';
  if (OUVERTS.length > 1)
    h += '<div class="dos ' + (dossierActif === null ? 'on' : '') +
      '" data-clef=""><b>All projects</b><i>' + vivants + '</i></div>';

  // Les sequences : UNE section a part, toutes les sequences de la
  // bibliotheque (de l episode), quel que soit le dossier ou elles sont
  // rangees (David, 07/10 : une ligne « Sequences » sous un projet etait
  // confuse). Repliee ou depliee, l etat est retenu.
  const toutes = (typeof MONTAGES !== 'undefined' ? MONTAGES : []);
  if (toutes.length || OUVERTS.some(p => !estBibli(p.nom) && !estCaptures(p.nom))) {
    const ouv = !MONT_OUVERTS.has('*replie');
    const plusieurs = new Set(toutes.map(x => x.projet)).size > 1;
    h += '<div class="pjt sequences" data-montages="*replie" title="all the ' +
      'sequences of this library">' +
      '<span class="chev">' + (ouv ? '▼' : '▶') + '</span>' +
      '<b>Sequences</b><i>' + toutes.length + '</i></div>';
    if (ouv) h += (toutes.length
      ? toutes.map(x => '<div class="dos mont seq' +
          (x.nom === projetNom && x.projet === PROJET.pj ? ' on' : '') +
          '" data-mont="1" data-pj="' + ech(x.projet) + '" data-mnom="' +
          ech(x.nom) + '" title="modified on ' + ech(x.maj) +
          ' — click to open, double-click to rename, right-click for the menu">' +
          '<b>' + ech(x.nom) + '</b>' +
          (plusieurs ? '<i>' + ech(x.projet) + '</i>' : '') + '</div>').join('')
      : '<div class="dosVide">no saved sequence yet</div>');
  }

  // OUVERTS est deja trie par refondre() : les bibliotheques en dernier.
  for (const p of OUVERTS) {
    const bibli = estBibli(p.nom);
    const plie = REPLIES.has(p.nom);
    const aPlier = (p.dossiers || []).length || p.besoinScan ||
      !(p.films || []).length;
    h += '<div class="pjt ' + (dossierActif === p.nom ? 'on' : '') +
      (bibli ? ' bibli' : '') +
      '" data-clef="' + ech(p.nom) + '" data-pj="' + ech(p.nom) +
      '" data-d="" title="' + ech(p.racine || p.nom) + '">' +
      // Bibliotheque et captures restent en bas : pas de poignee pour elles.
      (bibli || estCaptures(p.nom) ? ''
        : '<span class="poignee" draggable="true" data-ordre="pjt" ' +
          'title="drag to move this project">⋮⋮</span>') +
      (aPlier
        ? '<span class="chev" data-plier="' + ech(p.nom) + '" title="' +
          (plie ? 'expand' : 'replier') + ' the folders">' +
          (plie ? '▶' : '▼') + '</span>'
        : '<span class="chev" style="visibility:hidden">▼</span>') +
      '<b>' + (bibli ? '♪ ' : estCaptures(p.nom) ? '▣ ' : '') + ech(p.nom) +
      '</b><i>' + (n[p.nom] || 0) + '</i>' +
      (estCaptures(p.nom) ? ''
        : '<button class="plus" data-nouveau="' + ech(p.nom) +
          '" title="add a new folder">+</button>') +
      (bibli || estCaptures(p.nom) ? ''
        : '<button class="x" data-fermer="' + ech(p.nom) +
          '" title="close this project">×</button>') + '</div>';
    if (!plie && estCaptures(p.nom) && !(p.films || []).length)
      h += '<div class="dosVide">no screenshot yet — right-click the monitor</div>';
    else if (!plie && (p.besoinScan || !(p.films || []).length))
      h += '<div class="aScan">' +
        (p.aScanner ? p.aScanner + ' file(s) to scan'
                    : 'no rush found') +
        '<button class="bureauSeul" data-scanner="' + ech(p.nom) +
        '">Scan</button></div>';
    o += '<optgroup label="' + ech(p.nom) + '">' +
      '<option value="' + ech(p.nom) + '"' +
      (dossierActif === p.nom ? ' selected' : '') + '>all ' + ech(p.nom) +
      ' (' + (n[p.nom] || 0) + ')</option>';
    for (const d of DOSSIERS) {
      if (d.pj !== p.nom) continue;
      // Replie : la ligne n est pas rendue, mais reste dans le menu deroulant.
      if (!plie)
        h += '<div class="dos ' + (dossierActif === d.clef ? 'on' : '') +
          '" data-clef="' + ech(d.clef) + '" data-pj="' + ech(d.pj) +
          '" data-d="' + ech(d.d) + '" title="double-click to rename">' +
          (d.d === NONRANGE || (VUE === 'rangement' && !RANGEABLE) ? ''
            : '<span class="poignee" draggable="true" data-ordre="dos" ' +
              'title="drag to move this folder">⋮⋮</span>') + '<b>' +
          ech(d.d) + '</b><i>' + (n[d.clef] || 0) + '</i></div>';
      o += '<option value="' + ech(d.clef) + '"' +
        (dossierActif === d.clef ? ' selected' : '') + '>' + ech(d.d) +
        ' (' + (n[d.clef] || 0) + ')</option>';
    }
    o += '</optgroup>';
  }
  if (!OUVERTS.length)
    h += '<div style="padding:9px;color:var(--sourd);font-size:12px">' +
      'no project open</div>';
  $('#dossiers').innerHTML = h;
  $('#selDossier').innerHTML = o;
  majEntete();
}

// Bandeau de titre : ce que contiennent les projets ouverts.
function majEntete() {
  const vivants = FILMS.filter(f => !f.absent);
  // Une image n a pas de duree : elle ne compte pas dans celle du projet.
  const duree = vivants.reduce((s, f) => s + (f.image ? 0 : (f.s || 0)), 0);
  const poids = vivants.reduce((s, f) => s + (f.m || 0), 0);
  // Le nom de la bibliotheque vient de bibliotheque.json (le dossier ou
  // elle a ete creee) ; l onglet du navigateur le porte aussi.
  const bib = $('#biblio');
  if (bib) bib.textContent = TITRE || '';
  const voulu = TITRE ? TITRE + ' — library & edit table'
                      : 'library & edit table';
  if (document.title !== voulu) document.title = voulu;
  // Les captures ne sont pas un projet qu on a ouvert : pas dans le titre.
  const nomsTitre = OUVERTS.filter(p => !estCaptures(p.nom)).map(p => p.nom);
  $('#titre').textContent = nomsTitre.length
    ? nomsTitre.join(' + ') : 'no project open';
  $('#entete').textContent = OUVERTS.length
    ? (vivants.length + ' clips · ' + DOSSIERS.length + ' folders · ' +
       (duree / 60).toFixed(0) + ' min · ' + (poids / 1024).toFixed(1) + ' Go')
    : 'open a project in the left column';
  // Le bouton n apparait que s il y a des fiches MISSING a retirer.
  const manquantes = FILMS.length - vivants.length;
  const bp = $('#bPurge');
  if (bp && !bp.disabled) {
    bp.hidden = !(PURGE && manquantes);
    bp.textContent = 'Remove ' + manquantes + ' missing';
  }
}

function carte(f) {
  const fmt = format(f);
  const cls = ['c', selection.has(f.id) ? 'sel' : '',
               f.absent ? 'absent' : ''].filter(Boolean).join(' ');
  return '<div class="' + cls + '" data-id="' + f.id + '">' +
    '<button class="etoile ' + (f.fav ? 'on' : '') + '" data-fav="' + f.id +
    '" title="favourite">' + (f.fav ? '★' : '☆') + '</button>' +
    '<div class="media" draggable="true" data-media="' + f.id + '">' +
    (f.son_seul
        // Un fichier de son seul n a pas de poster : une pochette dessinee,
        // teintee par son nom pour que l oeil distingue les morceaux.
        ? '<div class="pochette" style="--t:' + (tonSon(f.nom) | 0) + 'deg">' +
          '<span>♪</span></div>' +
          '<button class="lire" data-lire="' + f.id + '">▶</button>'

    // Une etiquette de couleur, posee sur le bas de la vignette : elle se voit

    '</div>' +
    '<div class="bas"><div class="nom" data-nom="' + f.id +

    f.nom.replace(/</g, '&lt;') + '</div>' +
    '<div class="meta">' +
    (f.image ? '<span class="b">still</span>'
             : '<span class="b">' + (f.s || 0).toFixed(1) + 's</span>') +
    (fmt ? '<span class="b ' + fmt.cls + '">' + fmt.code + '</span>' : '') +
    (f.image ? '<span class="b son">IMAGE</span>'
             : f.son_seul ? '<span class="b son">SOUND</span>'

// La pastille en bas a droite d une carte : sa couleur, et au clic le

grille.addEventListener('error', e => {
