<script>
// ===========================================================================
//  Modèle de montage
// ===========================================================================
// La piste que « Add » vise : celle dont on a clique l en-tete. Nulle par
// defaut — l image va alors sur V1 et le son sur la premiere piste qui lui
// convient, comme avant.
let pisteActive = null;

let PISTES = [
  {id: 'V1', type: 'v', mute: false, solo: false},
  {id: 'A1', type: 'a', mute: false, solo: false},
  {id: 'M1', type: 'm', mute: false, solo: false}
];

// Image, son et musique : une de chaque, toujours. Un montage enregistre
// avant l arrivee de la piste musique en recoit une a l ouverture, sinon
// elle « bougerait » d un montage a l autre.
function assurerPistes() {
  ['v', 'a', 'm'].forEach(t => {
    if (!PISTES.some(p => p.type === t)) ajouterPiste(t);
  });
}
let CLIPS = [];
let PPS = 40, tLect = 0, enLecture = false, outil = 'V';
let clipsSel = new Set(), presse = [], uidSuivant = 1, lienSuivant = 1;
let projetNom = '';

const HV = 56, HA = 38, HM = 38;
// Zoom vertical : Alt + molette sur la timeline. Les pistes grandissent —
// une onde se lit bien mieux sur 100 px que sur 38 — et le reglage reste
// d une session a l autre.
const ZOOM_V_MIN = 0.7, ZOOM_V_MAX = 3;
let zoomV = Math.min(ZOOM_V_MAX, Math.max(ZOOM_V_MIN,
  parseFloat(pref.lire('zoomV', '1')) || 1));
// Trois familles de pistes : image, son et MUSIQUE. La musique est separee
// des bruitages pour de bon — un bloc ne passe jamais d une famille a l autre,
// et la musique se mixe au rendu sans etre liee a un plan.
const estSon = p => !!p && (p.type === 'a' || p.type === 'm');
const nomType = t => t === 'v' ? 'video' : t === 'm' ? 'music' : 'audio';
// « hk » : la hauteur propre de la piste, tiree a sa poignee (1.3.31), par-
// dessus le zoom commun (Alt + molette). Elle voyage avec la sequence.
const hauteurBase = p => (p.type === 'v' ? HV : (p.type === 'm' ? HM : HA)) * zoomV;
const hauteurPiste = p => Math.round(hauteurBase(p) * (+p.hk || 1));
const classePiste = p => p.type === 'v' ? 'va' : (p.type === 'm' ? 'ma' : 'aa');

// Echappement HTML, partage par tout ce qui compose du balisage a la main.
const echapHtml = x => String(x === undefined || x === null ? '' : x)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;');

// ---- blocs sans rush : calque de couleur et texte ------------------------
// Un bloc « synthetique » porte « genre » et n a pas de film derriere lui :
// il est dessine, pas lu. Tout le reste du modele s applique tel quel —
// duree, fondus, transparence, echelle, position, images-cles, duplication.
// Les polices sont celles livrees avec Windows : le navigateur les connait
// par leur nom CSS, ffmpeg par leur fichier, donc les deux existent sur la
// machine sans rien installer.
const POLICES = {
  sans:     {nom: 'Arial',           css: 'Arial, sans-serif',                 ttf: 'arial.ttf'},
  noir:     {nom: 'Arial Black',     css: '\"Arial Black\", Arial, sans-serif',  ttf: 'ariblk.ttf'},
  impact:   {nom: 'Impact',          css: 'Impact, \"Arial Black\", sans-serif', ttf: 'impact.ttf'},
  segoe:    {nom: 'Segoe UI',        css: '\"Segoe UI\", Arial, sans-serif',     ttf: 'segoeui.ttf'},
  verdana:  {nom: 'Verdana',         css: 'Verdana, sans-serif',               ttf: 'verdana.ttf'},
  tahoma:   {nom: 'Tahoma',          css: 'Tahoma, sans-serif',                ttf: 'tahoma.ttf'},
  trebuchet:{nom: 'Trebuchet MS',    css: '\"Trebuchet MS\", sans-serif',        ttf: 'trebuc.ttf'},
  serif:    {nom: 'Times New Roman', css: '\"Times New Roman\", serif',          ttf: 'times.ttf'},
  georgia:  {nom: 'Georgia',         css: 'Georgia, serif',                    ttf: 'georgia.ttf'},
  mono:     {nom: 'Courier New',     css: '\"Courier New\", monospace',          ttf: 'cour.ttf'}
};
const POLICE_DEFAUT = 'noir';

// Les typos chargees par l utilisateur vivent dans la BIBLIOTHEQUE
// (_biblio/_polices), pas dans un projet : une typo sert a tous les montages.
// On les enregistre aupres du navigateur pour que la toile sache les
// dessiner, et le montage retient leur nom de fichier pour que ffmpeg les
// retrouve au rendu.
const POLICES_LIB = new Set();
const famillePolice = nom => 'lib-' + nom.replace(/[^A-Za-z0-9]+/g, '-');

async function poserPolice(p) {
  const clef = p.nom;
  if (POLICES[clef]) return clef;
  const fam = famillePolice(p.nom);
  try {
    const f = new FontFace(fam,
      'url("polices/' + encodeURIComponent(p.nom) + '")');
    await f.load();
    document.fonts.add(f);
  } catch (e) {
    return null;
  }
  POLICES[clef] = {
    nom: p.nom.replace(/\.[^.]+$/, ''),
    css: '"' + fam + '", sans-serif',
    ttf: p.nom, lib: true, rendu: p.rendu !== false
  };
  POLICES_LIB.add(clef);
  return clef;
}

async function chargerPolices() {
  let d;
  try { d = await api('api/polices'); } catch (e) { return 0; }
  let n = 0;
  for (const p of (d.polices || [])) if (await poserPolice(p)) n++;
  return n;
}
// Teintes proposees pour un calque : la palette du montage, plus le noir et
// le blanc, qui servent tout le temps.
const TEINTES = ['#000000', '#ffffff', '#d9532b', '#e8b93a', '#6a9b4a',
                 '#4a7fa8', '#7a5a9b', '#a8302f', '#2c2a27', '#e9e4da'];
const estSynth = c => !!(c && c.genre);
// Une image fixe : une fiche comme les autres, mais sans duree propre. Elle
// se comporte comme un calque — on l etire autant qu on veut — avec une
// image dedans au lieu d une couleur.
const estImage = c => !!(c && !c.genre && PAR_ID[c.film] &&
                         PAR_ID[c.film].image);

// La piste ou poser un calque : la premiere piste video au-dessus de tout ce
// qui occupe deja cet instant, et libre elle-meme. On n empile donc pas une
// piste par calque : deux textes a deux endroits differents partagent la
// meme. S il n y en a pas, on en fabrique une.
function pisteCalque(t0, d) {
  const pv = PISTES.filter(x => x.type === 'v')
    .sort((a, b) => numPiste(a.id) - numPiste(b.id));
  const chevauche = c => t0 < fin(c) - 0.001 && t0 + d > c.t0 + 0.001;
  // Un calque est toujours au-dessus de l image, meme pose dans un trou :
  // on part de la piste la plus haute qui porte un rush, et jamais en
  // dessous de V1. Sinon un texte tombe dans un trou se retrouverait sur la
  // piste principale, et le rendu en ferait un carton plein cadre au lieu
  // d une incrustation.
  let haute = 1;
  CLIPS.forEach(c => {
    const x = piste(c.piste);
    if (!x || x.type !== 'v') return;
    if (!estSynth(c)) haute = Math.max(haute, numPiste(x.id));
    if (chevauche(c)) haute = Math.max(haute, numPiste(x.id));
  });
  for (const x of pv) {
    if (numPiste(x.id) <= haute) continue;
    if (!clipsDe(x.id).some(chevauche)) return x.id;
  }
  const id = 'V' + ((pv.length ? numPiste(pv[pv.length - 1].id) : 0) + 1);
  PISTES.push({id: id, type: 'v', mute: false, solo: false});
  return id;
}

// Fabrique le bloc et le pose. Renvoie le bloc, deja selectionne.
function poserSynth(champs, duree) {
  const d = Math.max(0.2, duree || 4);
  const t0 = Math.max(0, tLect);
  memoriser();
  const pid = pisteCalque(t0, d);
  const c = Object.assign({
    uid: uidSuivant++, piste: pid, film: '', t0: t0, e: 0, o: d,
    ech: 1, dx: 0, dy: 0, mode: 'contain', gain: 1, opac: 1, vitesse: 1,
    couleur: 0, fi: 0, fo: 0, lien: null
  }, champs);
  CLIPS.push(c);
  clipsSel = new Set([c.uid]);
  rendreTimeline(); resynchroniser(true); dessiner();
  return c;
}
const COULS = ['--c0', '--c1', '--c2', '--c3', '--c4', '--c5'];
// ---- vitesse et sens de lecture ----------------------------------------
// « vitesse » reste TOUJOURS positive : c est un facteur, et une douzaine de
// calculs s en servent — durees, rognage, decoupe, setpts, atempo. Un nombre
// negatif y produirait des durees negatives et des filtres refuses. Le sens
// vit donc a part, dans « rev », et DEUX fonctions seulement le connaissent :
// srcA et tlA. Le curseur, lui, montre une vitesse signee : c est une facon
// d ecrire, pas une facon de ranger.
const vAbs = c => Math.abs(c.vitesse || 1) || 1;
const estRev = c => !!c.rev;
// Un bloc fige (« Freeze frame ») garde son rush, sa duree et ses reglages,
// mais ne montre qu une image : celle de l instant « gel », en secondes de
// source. Au rendu elle vient du meme flux que la video — aucun ecart de
// couleur a la coupe, ce qu une image extraite puis reimportee donnerait.
const estGel = c => !!(c && !c.genre && typeof c.gel === 'number' &&
                       isFinite(c.gel));
const vSignee = c => (c.rev ? -1 : 1) * vAbs(c);
// Quelle image de la SOURCE montrer a un instant du montage.
const srcA = (c, t) => c.rev ? c.o - (t - c.t0) * vAbs(c)
                             : c.e + (t - c.t0) * vAbs(c);
// Et l inverse : a quel instant du montage tombe une image de la source.
const tlA = (c, s) => c.rev ? c.t0 + (c.o - s) / vAbs(c)
                            : c.t0 + (s - c.e) / vAbs(c);
const dur = c => Math.max(0.04, (c.o - c.e) / vAbs(c));
// Etendue de la regle : le montage plus une marge, pour pouvoir poser la tete
// de lecture et un point de sortie au-dela du dernier plan.
const etendue = () => Math.max(dureeTotale() + 10, 30);
const fin = c => c.t0 + dur(c);
const dureeTotale = () => CLIPS.reduce((m, c) => Math.max(m, fin(c)), 0);
const clipsDe = p => CLIPS.filter(c => c.piste === p);
const piste = id => PISTES.find(p => p.id === id);
const numPiste = id => parseInt(id.slice(1), 10) || 0;
const parUid = uid => CLIPS.find(c => c.uid === uid);
const groupeLie = c => c.lien ? CLIPS.filter(x => x.lien === c.lien) : [c];
const elClip = uid => $('#lanes').querySelector('[data-uid="' + uid + '"]');

function pistesOrdonnees() {
  const v = PISTES.filter(p => p.type === 'v')
    .sort((a, b) => numPiste(b.id) - numPiste(a.id));
  const a = PISTES.filter(p => p.type === 'a')
    .sort((x, y) => numPiste(x.id) - numPiste(y.id));
  const m = PISTES.filter(p => p.type === 'm')
    .sort((x, y) => numPiste(x.id) - numPiste(y.id));
  // La musique en bas : c est le lit sur lequel tout le reste se pose.
  return v.concat(a).concat(m);
}
// Volume general d une piste son. Absent des projets enregistres avant son
// arrivee : on lit donc toujours par cette fonction, jamais p.vol directement.
function volPiste(p) {
  if (!estSon(p)) return 1;
  return p.vol === undefined ? 1 : p.vol;
}

function audible(p) {
  // Le solo se joue entre pistes sonores, musique comprise : mettre une
  // musique en solo doit taire les bruitages, et l inverse.
  const s = PISTES.filter(x => x.solo && estSon(x));
  return s.length ? p.solo : !p.mute;
}
function visible(p) {
  const s = PISTES.filter(x => x.solo && x.type === 'v');
  return s.length ? p.solo : !p.mute;
}

// -- fondus ------------------------------------------------------------------
// DEUX choses distinctes, et il faut qu elles le restent :
//
//  _fIn / _fOut : les fondus EXPLICITES, regles a la main par les attaches
//    jaunes. Ce sont eux, et eux seuls, qui partent au rendu.
//  _xIn / _xOut : le fondu enchaine deduit du RECOUVREMENT de deux blocs.
//    Il ne sert qu a l ecran. Cote rendu, ffmpeg fabrique deja son xfade a
//    partir des positions des plans : les envoyer en plus ferait plonger la
//    transition deux fois.
//
// Le recouvrement avait disparu de ce calcul, et avec lui le fondu a l ecran,
// alors que le rendu, lui, le faisait toujours. D ou l impression que la
// fonction n existait plus.
function recalculerFondus() {
  CLIPS.forEach(c => {
    const d = dur(c);
    c._fIn = Math.min(Math.max(0, c.fi || 0), d);
    c._fOut = Math.min(Math.max(0, c.fo || 0), d - c._fIn);
    c._xIn = 0;
    c._xOut = 0;
  });
  const parPiste = {};
  CLIPS.forEach(c => {
    (parPiste[c.piste] = parPiste[c.piste] || []).push(c);
  });
  Object.keys(parPiste).forEach(k => {
    const l = parPiste[k].slice().sort((a, b) => a.t0 - b.t0);
    for (let i = 1; i < l.length; i++) {
      const a = l[i - 1], b = l[i];
      // Le recouvrement s arrete a la fin du plus court : un bloc entierement
      // couvert par le precedent se fond sur toute sa duree, pas davantage.
      const r = Math.min(fin(a), fin(b)) - b.t0;
      if (r > 0.02) {
        a._xOut = Math.max(a._xOut, Math.min(r, dur(a)));
        b._xIn = Math.max(b._xIn, Math.min(r, dur(b)));
      }
    }
  });
}
// Le fondu effectif d un bloc : le plus long des deux, jamais leur somme.
const fonduIn = c => Math.max(c._fIn || 0, c._xIn || 0);
const fonduOut = c => Math.max(c._fOut || 0, c._xOut || 0);
// -- secousse ----------------------------------------------------------------
// Trois scalaires a plat sur le bloc — shk, shkF, shkA — et non un objet :
// ils traversent ainsi l enregistrement JSON et la duplication sans traitement
// particulier, la ou un objet aurait ete partage entre l original et sa copie.
//
// Deux sinusoides de frequences incommensurables par axe : une seule donnerait
// un balancement regulier, reconnaissable ; leur somme ne se repete pas a l
// oreille de l oeil. La MEME formule est reprise telle quelle cote ffmpeg,
// sinon l apercu et le rendu ne secoueraient pas pareil.
const SHK_F = 6, SHK_A = 1.5, SHK_R = 0;   // Hz, % de largeur, degres

// La secousse est une PILE de couches : une lente qui berce, une rapide qui
// vibre, et le geste devient credible. Chaque couche a ses cinq valeurs.
// « shk » reste l interrupteur general : le decocher n efface pas les couches.
//
// Les blocs d avant n avaient qu un seul jeu de valeurs a plat (shkF, shkA…).
// On les lit comme une couche unique, sans rien reecrire sur le disque tant
// que David n y touche pas.
function couchesShk(c) {
  if (!c) return [];
  if (Array.isArray(c.shks)) return c.shks;
  if (c.shkF !== undefined || c.shkA !== undefined || c.shkR !== undefined ||
      c.shkIn || c.shkOut || c.shk)
    return [{f: c.shkF === undefined ? SHK_F : c.shkF,
             a: c.shkA === undefined ? SHK_A : c.shkA,
             r: c.shkR === undefined ? SHK_R : c.shkR,
             i: c.shkIn || 0, o: c.shkOut || 0, on: true}];
  return [];
}
// Une couche sans « on » est allumee : les piles d avant le 11/09 ne doivent
// pas s eteindre toutes seules.
const coucheActive = p => !!p && (p.on === undefined || !!p.on);
// Au premier geste sur un bloc, on fige la liste et on enleve les anciens
// champs : une seule verite a partir de la.
function couchesEcrire(c, l) {
  c.shks = l;
  delete c.shkF; delete c.shkA; delete c.shkR; delete c.shkIn; delete c.shkOut;
}
const coucheNeuve = () => ({f: SHK_F, a: SHK_A, r: SHK_R, i: 0, o: 0, on: true});

// Le facteur de montee et de descente d UNE couche.
function rampeCouche(p, c, t) {
  const fi = Math.max(0, p.i || 0), fo = Math.max(0, p.o || 0);
  if (fi < 0.01 && fo < 0.01) return 1;
  const u = t - c.t0, d = dur(c);
  let g = 1;
  if (fi >= 0.01) g = Math.min(g, u / fi);
  if (fo >= 0.01) g = Math.min(g, (d - u) / fo);
  return Math.max(0, Math.min(1, g));
}
// Une troisieme paire de frequences pour l angle : sans elle, la rotation
// suivrait exactement le deplacement horizontal et la secousse aurait l air
// mecanique. Une camera a l epaule ne tourne pas au rythme ou elle glisse.
function rotationSecousse(c, t) {
  if (!c || !c.shk) return 0;
  const l = couchesShk(c);
  const u = t - c.t0, P = 2 * Math.PI;
  let R = 0;
  for (let k = 0; k < l.length; k++) {
    const p = l[k];
    if (!coucheActive(p)) continue;
    const r = Math.max(0, p.r || 0) * rampeCouche(p, c, t);
    if (r <= 0) continue;
    const f = Math.max(0.1, p.f || SHK_F);
    R += r * (Math.sin(P * f * (1.3 + 0.17 * k) * u) +
              0.6 * Math.sin(P * f * (0.55 + 0.09 * k) * u)) / 1.6;
  }
  return R;
}
// Montee et descente de l effet, en secondes. L amplitude est multipliee par
// cette rampe : la secousse s installe et se retire au lieu d apparaitre d un
// coup. La MARGE, elle, reste calculee sur l amplitude pleine — sinon le
// grossissement respirerait avec la rampe, ce qui se verrait bien plus que la
// secousse elle-meme.
// Phases nulles partout : les axes partent exactement au repos au debut du
// bloc. Avec un dephasage, la secousse commencait par un saut de 1,3 %.
// Le « k » decale les harmoniques d une couche a l autre : deux couches reglees
// sur la meme cadence ne doivent pas se contenter de s additionner.
function secousse(c, t) {
  if (!c || !c.shk) return [0, 0];
  const l = couchesShk(c);
  if (!l.length) return [0, 0];
  const u = t - c.t0, P = 2 * Math.PI;
  let X = 0, Y = 0;
  for (let k = 0; k < l.length; k++) {
    const p = l[k];
    if (!coucheActive(p)) continue;
    const a = Math.max(0, p.a === undefined ? SHK_A : p.a) * rampeCouche(p, c, t);
    if (a <= 0) continue;
    const f = Math.max(0.1, p.f || SHK_F);
    X += a * (Math.sin(P * f * u) +
              0.6 * Math.sin(P * f * (1.7 + 0.23 * k) * u)) / 1.6;
    Y += a * (Math.sin(P * f * (0.83 + 0.07 * k) * u) +
              0.6 * Math.sin(P * f * (2.1 + 0.31 * k) * u)) / 1.6;
  }
  return [X, Y];
}
// L image est agrandie juste ce qu il faut pour que la secousse ne decouvre
// jamais de bord noir : l ecart maximal vaut exactement shkA % de la largeur.
// De combien agrandir pour qu une secousse ne decouvre aucun bord noir. Le
// deplacement demande 2 x shkA % ; la rotation, elle, coute bien plus cher :
// pour couvrir un cadre tourne de o, il faut cos(o) + (cote long / cote court)
// x sin(o). A 16:9 et 5 degres, cela fait deja 1,15.
function margeSecousse(c) {
  if (!c || !c.shk) return 1;
  // Le pire des cas, c est toutes les couches alignees : on somme.
  let a = 0, deg = 0;
  for (const p of couchesShk(c)) {
    if (!coucheActive(p)) continue;
    a += Math.max(0, p.a === undefined ? SHK_A : p.a);
    deg += Math.max(0, p.r || 0);
  }
  if (a <= 0 && deg <= 0) return 1;
  const r = deg * Math.PI / 180;
  const k = Math.max(PROJET.w / PROJET.h, PROJET.h / PROJET.w);
  const mr = r > 0 ? Math.cos(r) + k * Math.sin(r) : 1;
  return (1 + 2 * a / 100) * mr + 0.01;
}

function alpha(c, t) {
  let a = 1;
  const fi = fonduIn(c), fo = fonduOut(c);
  if (fi > 0.02) a = Math.min(a, (t - c.t0) / fi);
  if (fo > 0.02) a = Math.min(a, (fin(c) - t) / fo);
  return Math.max(0, Math.min(1, a));
}

// ===========================================================================
//  Rendu de la timeline
// ===========================================================================
// Une couleur par piste (David, 07/10) : un liseré sur son nom, un voile sur
// toute sa longueur. Vidéo dans les bleus et violets, son dans les verts,
// musique dans les ors : on reconnaît la famille, et chaque piste la sienne.
const COUL_PISTES = {
  v: ['#4fa3ff', '#a07bff', '#2ed3d3', '#6f86ff', '#d27bff', '#3fb8ff'],
  a: ['#57c27a', '#a6d65a', '#3fbf9f', '#7bd8a8', '#c2d84a', '#2fa36b'],
  m: ['#e8b93a', '#ff9f43', '#ffd166', '#e07b39']
};
function couleurPiste(p) {
  const l = COUL_PISTES[p.type] || COUL_PISTES.v;
  return l[(Math.max(1, numPiste(p.id)) - 1) % l.length];
}

function rendreEntetes() {
  $('#entetes').innerHTML = pistesOrdonnees().map(p => {
    const v = volPiste(p);
    return '<div class="pEntete' + (p.id === pisteActive ? ' active' : '') +
      '" data-piste="' + p.id + '" style="height:' + hauteurPiste(p) +
      'px;--pc:' + couleurPiste(p) + '" title="' + p.id + (p.id === pisteActive
        ? ' — target track for Add (click to release)'
        : ' — click to make it the target track for Add') + '">' +
      '<div class="pPoignee" data-hpiste="' + p.id + '" title="drag to make this ' +
      'track taller or shorter — double-click: back to normal"></div>' +
      '<b>' + p.id + '</b>' +
      (estSon(p) ? '<i class="pVal' + (v === 1 ? ' neutre' : '') +
        '" title="double-click to type the volume">' +
        Math.round(v * 100) + '%</i>' : '') +

      '" title="mute">M</button>' +
      '<button class="s ' + (p.solo ? 'on' : '') + '" data-solo="' + p.id +
      '" title="solo">S</button>' +
      (estSon(p)
        ? '<input class="vol" type="range" min="0" max="2" step="0.01" value="' +
          v + '" data-vol="' + p.id + '" data-pct="1" title="track volume — ' +
          Math.round(v * 100) + '% (double-click: 100%)">'
        : '') +
      '</div>';
  }).join('');
}

function rendreRegle() {
  const total = Math.max(dureeTotale() + 10, 30);
  $('#tlContenu').style.width = Math.ceil(total * PPS) + 'px';
  const pas = PPS >= 90 ? 1 : PPS >= 40 ? 2 : PPS >= 18 ? 5 : PPS >= 8 ? 10 : 30;
  let h = '';
  for (let t = 0; t <= total; t += pas)
    h += '<div class="tick" style="left:' + (t * PPS) + 'px">' +
      tc(t).slice(0, 5) + '</div>';
  $('#regle').innerHTML = h;
}

// Le bord d un bloc est-il la vraie fin du rush, ou une coupe ? Orange : le
// fichier commence ou finit la ; gris bleute : il continue au-dela (David,
// 07/10). A l envers, le bord gauche montre la fin de la source. Calques,
// textes et images fixes n ont pas de duree propre : toujours de vrais bords.
function bordCoupe(c, cote) {
  if (estSynth(c) || estImage(c)) return false;
  const f = PAR_ID[c.film];
  if (!f || !f.s) return false;
  const debut = c.e > 0.04, fin_ = c.o < f.s - 0.04;
  return (cote === 'g') !== !!c.rev ? debut : fin_;
}

function blocClip(c) {
  const f = PAR_ID[c.film];
  const p = piste(c.piste);
  const aud = estSon(p);
  const coul = 'var(' + (COULS[c.couleur || 0]) + ')';
  const vit = (vAbs(c) !== 1 || c.rev)
    ? ' ' + (c.rev ? '◀' : '') + '×' +
      vAbs(c).toFixed(2).replace(/0+$/, '').replace(/\.$/, '') : '';
  return '<div class="clip ' + (clipsSel.has(c.uid) ? 'sel' : '') +
    '" data-uid="' + c.uid + '" style="left:' + (c.t0 * PPS) + 'px;width:' +
    (dur(c) * PPS) + 'px;border-color:' + coul + '">' +
    (aud ? ''
         : estSynth(c)
           ? '<div class="vign synth" style="background:' +
             (c.genre === 'couleur' ? echapHtml(c.fond || '#000')
              : estReglage(c)
                ? 'repeating-linear-gradient(135deg,#3a2c52 0 6px,#2c2240 6px 12px)'
                : 'repeating-linear-gradient(135deg,#2f2d29 0 6px,#26241f 6px 12px)') +
             '"></div>'
           : '<div class="vign" style="background-image:url(' +
             posterDe(c.film) + ')"></div>') +
    '<div class="teinte" style="background:' + coul + '"></div>' +
    (aud && p.onde && !estSynth(c)
      ? '<canvas class="onde" data-onde="' + c.uid + '"></canvas>' : '') +
    (fonduIn(c) > 0.02 ? '<div class="fondu g" style="width:' +
      (fonduIn(c) * PPS) + 'px"></div>' : '') +
    (fonduOut(c) > 0.02 ? '<div class="fondu d" style="right:0;width:' +
      (fonduOut(c) * PPS) + 'px"></div>' : '') +
    (aDesAnims(c) ? '<div class="anim" title="animated block">◆</div>' +
      losangesCles(c) : '') +
    (fxActifs(c).length && !estReglage(c)
      ? '<div class="fxBadge" title="' + fxActifs(c).map(x => FX[x.t].nom).join(' · ') +
        '">✦</div>' : '') +
    (typeof masqueActif === 'function' && masqueActif(c)
      ? '<div class="mqBadge" title="masked">◐</div>' : '') +
    '<div class="bande" data-bande="1" title="drag here: fade in / fade out">' +
    '</div>' +
    '<div class="poi g' + (bordCoupe(c, 'g') ? ' coupe' : '') + '" data-poi="g"' +
      (bordCoupe(c, 'g') ? ' title="cut edge — the rush goes on before"' : '') + '></div>' +
    '<div class="att g" data-fade="g" title="fade in" style="left:' +
    (c._fIn * PPS) + 'px"></div>' +
    '<div class="att d" data-fade="d" title="fade out" style="left:' +
    (dur(c) * PPS - c._fOut * PPS) + 'px"></div>' +
    '<div class="nom">' + (c.lien ? '⛓ ' : '') +
      (c.genre === 'couleur' ? '▢ ' + echapHtml(c.fond || '')
       : estReglage(c)
         ? '✦ ' + (fxActifs(c).length
             ? fxActifs(c).map(x => FX[x.t].nom).join(' + ') : 'effect layer')
       : c.genre === 'texte'
         ? 'T ' + echapHtml(String(c.txt || '').split('\n')[0].slice(0, 24) ||
                            'text')
         : (estGel(c) ? '⏸ ' : '') + (f ? f.nom : '?')) + '</div>' +
    '<div class="info">' + dur(c).toFixed(1) + 's' + vit + '</div>' +
    mqBloc(c).filter(x => mqVisible(c, x)).map(x =>
      '<div class="mqb" data-mqb="' + x.toFixed(4) + '" style="left:' +
      ((mqTemps(c, x) - c.t0) * PPS) + 'px" title="block marker ' + tc(mqTemps(c, x)) +
      ' — drag to move, double-click to remove"></div>').join('') +
    '<div class="poi d' + (bordCoupe(c, 'd') ? ' coupe' : '') + '" data-poi="d"' +
      (bordCoupe(c, 'd') ? ' title="cut edge — the rush goes on after"' : '') + '></div></div>';
}

// Les marqueurs de sequence sont poses dans le contenu de la timeline, comme

function rendreLanes() {
  $('#lanes').style.position = 'relative';

// ---- l onde du son ---------------------------------------------------------
// Les pics d un media, fabriques par le serveur une fois pour toutes. Trois
// etats : absent (jamais demande), null (demande en cours), false (pas d onde
// pour ce fichier — pas de son, ou ffmpeg absent).
const ONDES = {};

function basculerOnde(id) {
  const p = piste(id);
  if (!p || !estSon(p)) return;
  p.onde = !p.onde;
  modifie = true;
  rendreTimeline();
  dire(p.onde ? 'waveform shown on ' + id : 'waveform hidden on ' + id);
}

async function chargerOnde(film) {
  const f = PAR_ID[film];
  if (!f || ONDES[film] !== undefined) return;
  ONDES[film] = null;
  try {
    const d = ENLIGNE ? await ondeNavigateur(f)
      : await api('api/onde?projet=' + encodeURIComponent(f.pj || PROJET.nom) +
                  '&id=' + encodeURIComponent(film), null, 600000);
    ONDES[film] = (d && d.pics && d.pics.length) ? d : false;
  } catch (e) {
    ONDES[film] = false;
  }
  if (ONDES[film]) dessinerOndes();
}

// En ligne il n y a pas de ffmpeg : le navigateur decode lui-meme le son du
// proxy et en tire les pics, au meme format que /api/onde (50 par seconde,
// 0 a 255), pour que la timeline les dessine pareil qu au bureau (1.3.19).
async function ondeNavigateur(f) {
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return false;
  const brut = await fetch(urlMedia(f)).then(r => {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.arrayBuffer();
  });
  const ctx = new Ctx();
  try {
    const buf = await ctx.decodeAudioData(brut);
    const n = buf.length, hz = buf.sampleRate, par = Math.max(1, Math.round(hz / 50));
    const canaux = [];
    for (let k = 0; k < buf.numberOfChannels; k++) canaux.push(buf.getChannelData(k));
    const pics = [];
    for (let i = 0; i < n; i += par) {
      let m = 0;
      const j2 = Math.min(n, i + par);
      for (const ch of canaux)
        for (let j = i; j < j2; j++) { const v = ch[j] < 0 ? -ch[j] : ch[j]; if (v > m) m = v; }
      pics.push(Math.min(255, Math.round(m * 255)));
    }
    return {id: f.id, pas: 1 / 50, pics: pics, s: n / hz};
  } finally {
    try { ctx.close(); } catch (e) {}
  }
}

function dessinerOndes() {
  $$('#lanes canvas.onde').forEach(cv => {
    const c = parUid(+cv.dataset.onde);
    if (!c) return;
    const d = ONDES[c.film];
    if (d === undefined) { chargerOnde(c.film); return; }
    if (!d) return;
    const L = Math.max(1, Math.round(dur(c) * PPS));
    const H = Math.max(6, cv.parentNode.clientHeight || 0);
    if (cv.width !== L || cv.height !== H) { cv.width = L; cv.height = H; }
    const ctx = cv.getContext('2d');
    ctx.clearRect(0, 0, L, H);
    ctx.fillStyle = '#f0e6c8bf';
    const mi = H / 2, amp = (H - 4) / 2;
    // Chaque colonne de pixels lit la source a l instant qu elle montre :
    // la vitesse et la lecture inversee suivent toutes seules (srcA).
    for (let x = 0; x < L; x++) {
      const s = srcA(c, c.t0 + x / PPS);
      const i = Math.round(s / d.pas);
      const v = (i >= 0 && i < d.pics.length) ? d.pics[i] / 255 : 0;
      // Echelle adoucie (racine) : un son a -18 dB reste lisible au lieu de
      // se reduire a un trait, sans que les forts saturent la piste.
      const h = Math.max(1, Math.sqrt(v) * amp);
      ctx.fillRect(x, mi - h, 1, h * 2);
    }
  });
}

function majTete() {
  $('#tete').style.left = (tLect * PPS) + 'px';
  // majValeursAnim vit dans un bloc <script> plus bas : au chargement il
  // n existe pas encore, et typeof est la seule facon de le tester sans
  // lever d erreur de zone morte.
  if (typeof majValeursAnim === 'function') majValeursAnim();
  const d = dureeTotale();
  $('#tc').textContent = fmt(tLect) + '  /  ' + fmt(d);
  const cur = $('#curseur');
  if (document.activeElement !== cur)
    cur.value = Math.round(tLect / etendue() * 1000);
  const mm = $('#minimap').clientWidth;
  const barre = $('#mt');
  if (barre) barre.style.left = (tLect / etendue() * mm) + 'px';
  const bu = $('#bulleMt');
  if (bu) {
    const x = tLect / etendue() * mm;
    bu.textContent = fmt(tLect);
    bu.style.left = x + 'px';
    bu.classList.toggle('gauche', x > mm - 66);
  }
  majVue();
}

function majVue() {
  const d = $('#tlDefile'), mm = $('#minimap').clientWidth;
  const total = etendue() * PPS;
  const v = $('#vue');
  v.style.left = (d.scrollLeft / total * mm) + 'px';
  v.style.width = Math.max(6, d.clientWidth / total * mm) + 'px';
}

function majMinimap() {
  const mm = $('#minimap');
  const total = etendue();
  const w = mm.clientWidth || 130;
  let h = '';
  CLIPS.forEach(c => {
    const p = piste(c.piste);
    h += '<div class="mb ' + (p ? (p.type === 'm' ? 'm' : (p.type === 'a' ? 'a' : '')) : '') +
      '" style="left:' +
      (c.t0 / total * w) + 'px;width:' + Math.max(1, dur(c) / total * w) +
      'px;background:var(' + COULS[c.couleur || 0] + ')"></div>';
  });
  mm.innerHTML = h + '<div class="vue" id="vue"></div><div class="mt" id="mt"></div>' +
    '<div class="bulle" id="bulleMt"></div>';
  majVue();
  $('#mt').style.left = (tLect / total * w) + 'px';
  $('#minimap').title = 'drag the yellow line to move through the sequence';
}

function rendreTimeline() {
  recalculerFondus();
  rendreEntetes(); rendreRegle(); rendreLanes(); majMinimap(); majTete();
  majIO(); majMarqueurs(); rendreReglages();
  if (typeof calerEntetes === 'function') calerEntetes();
  // majEtatSauve vit dans un bloc <script> plus bas : au chargement il
  // n existe pas encore.
  if (typeof majEtatSauve === 'function') majEtatSauve();
  else {
    const n = CLIPS.length;
    $('#mDuree').textContent =
      (n ? fmt(dureeTotale()) + ' · ' + n + 'p' : 'empty') +
      (projetNom ? ' · ' + projetNom : '');
  }
}

// -- zoom, navigation -------------------------------------------------------
function zoom(k, ancre) {
  const d = $('#tlDefile');
  const centre = ancre !== undefined ? ancre
    : (d.scrollLeft + d.clientWidth / 2) / PPS;
  PPS = Math.min(400, Math.max(2, PPS * k));
  rendreTimeline();
  d.scrollLeft = Math.max(0, centre * PPS - d.clientWidth / 2);
  majVue();
}
$('#bZoomP').onclick = () => zoom(1.5);
$('#bZoomM').onclick = () => zoom(1 / 1.5);
$('#bZoomT').onclick = () => {
  const d = $('#tlDefile'), t = dureeTotale();
  if (t > 0) { PPS = Math.max(2, (d.clientWidth - 20) / t); rendreTimeline(); d.scrollLeft = 0; }
};
$('#tlDefile').addEventListener('scroll', majVue, {passive: true});
// Les noms des pistes suivent le defilement vertical des blocs : sans ca, des
// qu on descendait dans la timeline, V1 n etait plus en face de V1 (David,
// 07/10). La regle du temps reste collee en haut, son vis-a-vis aussi.
function calerEntetes() {
  const e = $('#entetes');
  if (e) e.style.transform = 'translateY(' + (-$('#tlDefile').scrollTop) + 'px)';
}
$('#tlDefile').addEventListener('scroll', calerEntetes, {passive: true});
// La molette au-dessus des noms fait defiler les pistes (Alt et Ctrl gardent
// leurs roles : hauteur des pistes, zoom).
document.querySelector('.tl-entetes').addEventListener('wheel', e => {
  if (e.ctrlKey || e.altKey) return;
  e.preventDefault();
  $('#tlDefile').scrollTop += e.deltaY;
}, {passive: false});
$('#tlDefile').addEventListener('wheel', e => {
  // Alt : la hauteur des pistes. Ctrl : le temps. Rien : on defile.
  if (e.altKey) {
    e.preventDefault();
    const avant = zoomV;
    zoomV = Math.min(ZOOM_V_MAX, Math.max(ZOOM_V_MIN,
      zoomV * (e.deltaY < 0 ? 1.12 : 1 / 1.12)));
    if (Math.abs(zoomV - avant) < 0.0005) return;
    pref.ecrire('zoomV', zoomV.toFixed(3));
    rendreEntetes(); rendreLanes();
    dire('track height ' + Math.round(zoomV * 100) + '%');
    return;
  }
  if (!e.ctrlKey) return;
  e.preventDefault();
  const r = $('#tlContenu').getBoundingClientRect();
  zoom(e.deltaY < 0 ? 1.18 : 1 / 1.18, (e.clientX - r.left) / PPS);
}, {passive: false});

// Se placer dans le montage revient a poser la tete de lecture : on la deplace
// et la vue la suit si elle sort du cadre. La lecture, si elle tourne, reprend
// depuis la nouvelle position au lieu de sauter en arriere.
function allerAuTemps(t) {
  tLect = Math.max(0, Math.min(etendue(), t));
  if (enLecture) { t0Lect = tLect; horloge0 = performance.now(); }
  majTete();
  const d = $('#tlDefile'), x = tLect * PPS;
  if (x < d.scrollLeft + 30 || x > d.scrollLeft + d.clientWidth - 30)
    d.scrollLeft = Math.max(0, x - d.clientWidth / 2);
  majVue();
  resynchroniser(true);
}

// Double-clic sur la bulle jaune : on tape la duree exacte de la sequence
// (David, 07/10). Elle devient le point de sortie O, compte depuis le point
// d entree s il y en a un — l export et le Render s arretent la. Vide : le
// point de sortie est retire. Formats : 30, 30.5, 0:30, 01:02.50, 750f.
function lireDuree(s) {
  s = String(s || '').trim().toLowerCase().replace(',', '.').replace(/\s*(s|img)$/, '');
  if (!s) return null;
  const im = s.match(/^(\d+)\s*f$/);
  if (im) return +im[1] / (PROJET.fps || 25);
  if (unite === 'img' && /^\d+$/.test(s)) return +s / (PROJET.fps || 25);
  const p = s.split(':').map(Number);
  if (!p.length || p.length > 3 || p.some(x => isNaN(x) || x < 0)) return NaN;
  return p.reduce((a, x) => a * 60 + x, 0);
}

function saisirDuree() {
  const mm = $('#minimap');
  if (mm.querySelector('input.duree')) return;
  const a = tIn !== null ? tIn : 0;
  const actuelle = (tOut !== null ? tOut : dureeTotale()) - a;
  const inp = document.createElement('input');
  inp.className = 'duree';
  inp.value = fmt(Math.max(0, actuelle));
  inp.title = 'exact length of the sequence' + (tIn !== null ? ', from the in point' : '') +
    ' — Enter to set, Esc to cancel, empty to remove the out point';
  const bu = $('#bulleMt');
  const x = bu ? bu.offsetLeft : 0;
  inp.style.left = Math.max(0, Math.min(mm.clientWidth - 94, x)) + 'px';
  mm.appendChild(inp);
  inp.focus(); inp.select();
  let fini = false;
  const fermer = valider => {
    if (fini) return;
    fini = true;
    const v = lireDuree(inp.value);
    inp.remove();
    if (!valider) return;
    if (v !== null && (isNaN(v) || v <= 0.04)) {
      dire('length not understood — e.g. 30, 0:30, 01:02.50 or 750f', true); return;
    }
    memoriser();
    if (v === null) { tOut = null; majIO(); majTete(); dire('out point removed'); return; }
    tOut = a + v;
    majIO(); majTete();
    dire('sequence length ' + fmt(v) + ' — out point at ' + tc(tOut));
  };
  inp.addEventListener('keydown', e => {
    e.stopPropagation();
    if (e.key === 'Enter') fermer(true);
    if (e.key === 'Escape') fermer(false);
  });
  inp.addEventListener('pointerdown', e => e.stopPropagation());
  inp.addEventListener('blur', () => fermer(false));
}
$('#minimap').addEventListener('dblclick', e => {
  if (e.target.closest('#bulleMt')) { e.preventDefault(); saisirDuree(); }
});

$('#minimap').addEventListener('pointerdown', e => {
  // La bulle jaune se double-clique : elle ne deplace pas la tete.
  if (e.target.closest('#bulleMt') || e.target.closest('input.duree')) return;
  e.preventDefault();
  const mm = $('#minimap');
  const aller = ev => {
    const r = mm.getBoundingClientRect();
    const frac = Math.max(0, Math.min(1, (ev.clientX - r.left) / r.width));
    let t = frac * etendue();
    if (ev.shiftKey) t = accrocher(t, pointsTete(), 6 * (etendue() * PPS / r.width));
    allerAuTemps(t);
  };
  aller(e);
  const lacher = () => {
    window.removeEventListener('pointermove', aller);
    window.removeEventListener('pointerup', lacher);
  };
  window.addEventListener('pointermove', aller);
  window.addEventListener('pointerup', lacher);
});

// La tete de lecture circule sur toute l etendue de la regle, pas seulement
// jusqu au dernier plan : on peut se placer dans le vide et y laisser du noir.
function poserTete(x, colle) {
  let t = x / PPS;
  if (colle) t = accrocher(t, pointsTete());
  tLect = Math.max(0, Math.min(etendue(), t));
  if (enLecture) { t0Lect = tLect; horloge0 = performance.now(); }
  majTete(); resynchroniser(true);
}
$('#regle').addEventListener('pointerdown', e => {
  const r = $('#tlContenu').getBoundingClientRect();
  poserTete(e.clientX - r.left, e.shiftKey);
  const bouger = ev => poserTete(ev.clientX - r.left, ev.shiftKey);
  const lacher = () => {
    window.removeEventListener('pointermove', bouger);
    window.removeEventListener('pointerup', lacher);
  };
  window.addEventListener('pointermove', bouger);
  window.addEventListener('pointerup', lacher);
});
$('#curseur').addEventListener('input', e => {
  tLect = etendue() * (+e.target.value / 1000);
  majTete(); resynchroniser(true);
});

function boiteTexte(bloc) {

      'style="display:none">' +
      '<i id="txNotePol" style="font-style:normal;font-size:10px;' +

      TEINTES.map(t => '<b data-t="' + t + '" class="' +
        (t.toLowerCase() === teinte.toLowerCase() ? 'on' : '') +
        '" style="background:' + t + '"></b>').join('') +
      '</div></div>' +
      '<div style="display:flex;gap:10px;align-items:flex-end">' +
      '<div><label style="font-size:11px;color:var(--sourd)">Custom colour' +

          teinte: teinte, taille: taille, ombre: ombre}, duree);

  dessine();

  // Le curseur dans le champ, en fin de texte : on ouvre la boîte pour

// Fabrique une piste du type demande et la renvoie. Un seul endroit qui
// numerote, pour que V, A et M gardent des suites propres.
// Le numero se prend dans les trous, jamais « nombre + 1 » : apres avoir
// efface A2 parmi A1 A2 A3, compter aurait redonne A3 — deux pistes du meme
// nom, et les blocs de l une seraient passes sur l autre.
function ajouterPiste(type) {
  const lettre = type === 'v' ? 'V' : type === 'm' ? 'M' : 'A';
  let n = 1;
  while (PISTES.some(p => p.id === lettre + n)) n++;
  const p = {id: lettre + n, type: type, mute: false, solo: false};
  PISTES.push(p);
  return p;
}

};

// ---- retirer une piste ---------------------------------------------------
// Les blocs qu elle porte partent avec elle, d ou la demande de confirmation
// quand il y en a. memoriser() d abord : Ctrl+Z ramene la piste ET ses blocs.
function retirerPiste(id) {
  const p = piste(id);
  if (!p) return;
  const dedans = CLIPS.filter(c => c.piste === id);
  if (dedans.length && !confirm('Track ' + id + ' holds ' + dedans.length +
      ' block' + (dedans.length > 1 ? 's' : '') + '. Delete the track and ' +
      (dedans.length > 1 ? 'them' : 'it') + '?\n\nCtrl+Z undoes.')) return;
  memoriser();
  dedans.forEach(c => clipsSel.delete(c.uid));
  CLIPS = CLIPS.filter(c => c.piste !== id);
  PISTES = PISTES.filter(x => x.id !== id);
  if (pisteActive === id) pisteActive = null;
  // On ne laisse jamais une famille sans aucune piste : la derniere effacee
  // revient vide, sinon on ne pourrait plus rien deposer.
  assurerPistes();
  rendreTimeline(); dessiner(); majMinimap();
  dire('track ' + id + ' deleted' +
    (dedans.length ? ' with its ' + dedans.length + ' block' +
      (dedans.length > 1 ? 's' : '') : '') + ' — Ctrl+Z to undo');
}

// Clic droit sur l en-tete d une piste. On reutilise #menu, deja place et

    (ONDE_OK && estSon(p)
      ? '<div class="it" data-piste-act="onde">' +
        (p.onde ? '〰 Hide the waveform' : '〰 Show the waveform') + '</div>' +
        '<div class="sep"></div>'
      : '') +
    '<div class="it" data-piste-act="effacer">✕ Delete track</div>';

  const r = m.getBoundingClientRect();

  $('#menu').className = '';

});
// Pendant le geste on ne rend PAS les en-tetes : cela detruirait le curseur
// qu on est en train de tirer. On touche seulement la valeur et son affichage.
function poserVolPiste(el, val) {
  const p = piste(el.dataset.vol);
  if (!p) return;
  p.vol = Math.max(0, Math.min(2, val));
  el.value = p.vol;
  const i = el.parentElement.querySelector('i.pVal');
  if (i) {
    i.textContent = Math.round(p.vol * 100) + '%';
    i.classList.toggle('neutre', p.vol === 1);
  }
  el.title = 'track volume — ' + Math.round(p.vol * 100) +
    '% (double-click: 100%)';
  modifie = true;
  resynchroniser(true);
}
// Tirer la poignee : la piste suit en direct (nom et piste ensemble), sans
// redessiner les blocs a chaque pixel ; tout se redessine au lacher.
$('#entetes').addEventListener('pointerdown', e => {
  const g = e.target.closest('[data-hpiste]');
  if (!g || e.button !== 0) return;
  e.preventDefault(); e.stopPropagation();
  const p = piste(g.dataset.hpiste);
  if (!p) return;
  memoriser();
  const y0 = e.clientY, h0 = hauteurPiste(p), base = hauteurBase(p);
  const en = g.closest('.pEntete');
  const lane = document.querySelector('#lanes .lane[data-piste="' + p.id + '"]');
  g.classList.add('tire');
  const bouger = ev => {
    const h = Math.max(16, Math.min(420, h0 + ev.clientY - y0));
    p.hk = +(h / base).toFixed(3);
    if (en) en.style.height = h + 'px';
    if (lane) lane.style.height = h + 'px';
  };
  const lacher = () => {
    window.removeEventListener('pointermove', bouger);
    window.removeEventListener('pointerup', lacher);
    g.classList.remove('tire');
    if (Math.abs((+p.hk || 1) - 1) < 0.02) delete p.hk;
    rendreEntetes(); rendreLanes(); calerEntetes();
  };
  window.addEventListener('pointermove', bouger);
  window.addEventListener('pointerup', lacher);
}, true);

$('#entetes').addEventListener('input', e => {
  const el = e.target.closest('[data-vol]');
  if (el) poserVolPiste(el, parseFloat(el.value) || 0);
});
$('#entetes').addEventListener('dblclick', e => {
  const g = e.target.closest('[data-hpiste]');
  if (g) {
    const p = piste(g.dataset.hpiste);
    if (p && p.hk) { memoriser(); delete p.hk; rendreEntetes(); rendreLanes(); calerEntetes(); }
    return;
  }
  const el = e.target.closest('[data-vol]');
  if (el) poserVolPiste(el, 1);
});
$('#entetes').addEventListener('click', e => {
  if (e.target.closest('[data-vol], .pVal, .saisieVal, [data-hpiste]')) return;
  const m = e.target.closest('[data-mute]'), s = e.target.closest('[data-solo]');
  // Couper ou isoler une piste change le montage. Ces deux boutons ne le
  // disaient pas : l enregistrement automatique et celui du changement de
  // sequence ne partent que sur « modifie », et la piste revenait non coupee
  // au retour sur la sequence (signale par David le 29/09, sur Mode-Cringe).
  // memoriser() leve « modifie », vide le cache de lecture — une piste
  // coupee ne doit plus s y entendre — et rend le geste annulable.
  if (m) { memoriser(); const p = piste(m.dataset.mute); p.mute = !p.mute; }
  else if (s) { memoriser(); const p = piste(s.dataset.solo); p.solo = !p.solo; }
  else {
    // Cliquer l en-tete d une piste, c est dire « Add, c est ici ».
    const en = e.target.closest('.pEntete');
    if (!en) return;
    pisteActive = pisteActive === en.dataset.piste ? null : en.dataset.piste;
    rendreEntetes();
    dire(pisteActive ? 'target track: ' + pisteActive : 'no target track');
    return;
  }
  rendreEntetes(); resynchroniser(true);
  majEtatSauve();
});

<script>
// ===========================================================================
//  Historique — Ctrl+Z
// ===========================================================================
// Un numero de lien qui n est pas deja pris. Le compteur peut se retrouver
// en retard — montage charge, collage, import — et reutiliser un lien deja
// en place appairerait par accident deux blocs qui n ont rien a voir.
function lienLibre() {
  const pris = new Set(CLIPS.map(c => c.lien).filter(Boolean));
  let l;
  do { l = 'L' + lienSuivant; lienSuivant++; } while (pris.has(l));
  return l;
}

// ---- marqueurs ----------------------------------------------------------
// Deux familles. Ceux de la SEQUENCE sont des instants sur la timeline. Ceux
// d un BLOC voyagent avec lui, et sont gardes en temps SOURCE : rogner
// l entree du bloc ne les decolle pas de leur image.
let MARQUEURS = [];
const mqBloc = c => (c && Array.isArray(c.mq)) ? c.mq : [];
const mqTemps = (c, s) => tlA(c, s);
const mqSource = (c, t) => srcA(c, t);
const mqVisible = (c, s) => s >= c.e - 1e-6 && s <= c.o + 1e-6;

const HISTO = [];
function instantane() {
  return JSON.stringify({
    MARQUEURS: MARQUEURS,
    PISTES: PISTES,
    CLIPS: CLIPS.map(c => {
      const n = {};
      for (const k in c) if (k[0] !== '_') n[k] = c[k];
      return n;
    }),
    uidSuivant: uidSuivant, lienSuivant: lienSuivant
  });
}
let modifie = false;
function memoriser() {
  // Le montage va changer : le cache ne correspondrait plus.
  if (typeof viderCache === 'function' && CACHE.pret) viderCache();
  HISTO.push(instantane());
  if (HISTO.length > 80) HISTO.shift();
  modifie = true;
}
function annulerMontage() {
  if (!HISTO.length) { dire('nothing to undo in the sequence'); return; }
  const s = JSON.parse(HISTO.pop());
  PISTES = s.PISTES; CLIPS = s.CLIPS;
  MARQUEURS = Array.isArray(s.MARQUEURS) ? s.MARQUEURS : [];
  uidSuivant = s.uidSuivant; lienSuivant = s.lienSuivant;
  clipsSel.clear();
  rendreTimeline(); resynchroniser(true);
  dire('undone (' + HISTO.length + ' steps left)');
}

// ===========================================================================
//  Ajout, dépôt
// ===========================================================================
function finDe(p) { return clipsDe(p).reduce((m, c) => Math.max(m, fin(c)), 0); }

function nouveauClip(film, pisteId, t0) {
  const f = PAR_ID[film];
  return {uid: uidSuivant++, piste: pisteId, film: film, t0: t0, e: 0,
          o: f.s || 1, ech: 1, dx: 0, dy: 0, mode: 'contain', gain: 1,
          opac: 1, vitesse: 1, couleur: 0, fi: 0, fo: 0, lien: null};
}

function ajouterAuMontage(ids, pisteId, t0) {
  memoriser();
  // La piste visee : celle sur laquelle on depose, sinon celle dont l en-tete
  // est actif. C est elle qui decide — pas l origine du fichier : un son pose
  // sur une piste musique va sur cette piste musique, meme s il vient d un
  // dossier de rushes.
  const visee = (pisteId && piste(pisteId)) || (pisteActive && piste(pisteActive)) || null;
  const pv = (visee && visee.type === 'v') ? visee
    : (piste('V1') || PISTES.find(p => p.type === 'v') || PISTES[0]);
  let t = (t0 === undefined || t0 === null) ? finDe(pv.id) : Math.max(0, t0);
  const pa = PISTES.find(p => p.type === 'a');
  let n = 0;
  ids.forEach(id => {
    const f = PAR_ID[id];
    if (!f || f.absent) return;
    // Un fichier de son seul ne va jamais sur une piste image. A defaut de
    // piste visee : venu d une bibliotheque de musique il va sur une piste
    // musique, sinon sur une piste son — la distinction bruitage / musique.
    if (f.son_seul) {
      let cible = (visee && estSon(visee)) ? visee : null;
      if (!cible) {
        const musique = estBibli(f.pj);
        cible = PISTES.find(x => x.type === (musique ? 'm' : 'a')) ||
                PISTES.find(x => estSon(x));
        if (!cible) cible = ajouterPiste(musique ? 'm' : 'a');
      }
      const cs = nouveauClip(id, cible.id, (t0 === undefined || t0 === null)
        ? finDe(cible.id) : Math.max(0, t0));
      CLIPS.push(cs);
      n++;
      return;
    }
    const c = nouveauClip(id, pv.id, t);
    if (pv.type === 'v' && f.a && pa) {
      const lien = lienLibre();
      c.lien = lien;
      const a = nouveauClip(id, pa.id, t);
      a.lien = lien;
      CLIPS.push(a);
    }
    CLIPS.push(c);
    t += dur(c);
    n++;
  });
  rendreTimeline();
  return n;
}

// « Add » pose les rushes choisis a la tete de lecture (David, 07/10), comme
// un depot a la souris, puis avance la tete a la fin de ce qui vient d etre
// pose : deux « Add » de suite mettent les plans bout a bout.
$('#bAjouter').onclick = () => {
  const avant = new Set(CLIPS.map(c => c.uid));
  const n = ajouterAuMontage([...selection], null, tLect);
  if (!n) return;
  const neufs = CLIPS.filter(c => !avant.has(c.uid));
  if (neufs.length) {
    tLect = Math.max(...neufs.map(fin));
    majTete();
    const d = $('#tlDefile'), x = tLect * PPS;
    if (x > d.scrollLeft + d.clientWidth - 30) d.scrollLeft = Math.max(0, x - d.clientWidth / 2);
    resynchroniser(true);
  }
  dire(n + (n > 1 ? ' shots added' : ' shot added') + ' at the playhead');
};

$('#lanes').addEventListener('dragover', e => {
  const l = e.target.closest('.lane');
  if (!l) return;
  e.preventDefault();
  $$('.lane').forEach(x => x.classList.toggle('cible', x === l));
});
$('#lanes').addEventListener('dragleave', e => {
  if (!$('#lanes').contains(e.relatedTarget))
    $$('.lane').forEach(x => x.classList.remove('cible'));
});
$('#lanes').addEventListener('drop', e => {
  const l = e.target.closest('.lane');
  $$('.lane').forEach(x => x.classList.remove('cible'));
  if (!l) return;
  e.preventDefault();
  let d;
  try { d = JSON.parse(e.dataTransfer.getData('text/plain')); } catch (err) { return; }
  if (d.type !== 'films') return;
  const r = $('#tlContenu').getBoundingClientRect();
  ajouterAuMontage(d.ids, l.dataset.piste, Math.max(0, (e.clientX - r.left) / PPS));
});

// ===========================================================================
//  Aimant, déplacement, rognage, coupe
// ===========================================================================
// Le collage ne s active que Maj enfoncee : sans Maj le placement est libre.
function accrocher(t, cibles, seuilPx) {
  const seuil = (seuilPx || 11) / PPS;
  let best = t, d = seuil;
  for (const x of cibles) if (Math.abs(x - t) < d) { d = Math.abs(x - t); best = x; }
  return Math.max(0, best);
}
function aimanter(t, ignorer, actif) {
  if (!actif) return Math.max(0, t);
  const cibles = [0, tLect];
  if (tIn !== null) cibles.push(tIn);
  if (tOut !== null) cibles.push(tOut);
  // Les marqueurs servent justement a caler dessus : ils entrent dans
  // l aimant, au meme titre que les bords de bloc.
  MARQUEURS.forEach(x => cibles.push(x));
  CLIPS.forEach(c => {
    if (ignorer.has(c.uid)) return;
    cibles.push(c.t0); cibles.push(fin(c));
    mqBloc(c).forEach(x => { if (mqVisible(c, x)) cibles.push(mqTemps(c, x)); });
  });
  return accrocher(t, cibles);
}

$('#lanes').addEventListener('pointerdown', e => {
  if (e.button === 2) return;
  fermerMenu();
  const el = e.target.closest('.clip');

  // ---- lasso : cliquer-glisser sur le vide pour selectionner ------------
  if (!el) {
    if (outil !== 'V') return;
    e.preventDefault();
    const lanes = $('#lanes');
    const rl = lanes.getBoundingClientRect();
    const ax = e.clientX - rl.left + lanes.scrollLeft;
    const ay = e.clientY - rl.top;
    const garder = e.shiftKey ? new Set(clipsSel) : new Set();
    let boite = null, tire = false;

    const touches = (bx, by) => {
      const x1 = Math.min(ax, bx), x2 = Math.max(ax, bx);
      const y1 = Math.min(ay, by), y2 = Math.max(ay, by);
      const t1 = x1 / PPS, t2 = x2 / PPS;
      const dedans = new Set(garder);
      $$('#lanes .lane').forEach(l => {
        const h = l.offsetTop, b = h + l.offsetHeight;
        if (b <= y1 || h >= y2) return;
        clipsDe(l.dataset.piste).forEach(c => {
          if (fin(c) > t1 && c.t0 < t2) dedans.add(c.uid);
        });
      });
      return {dedans: dedans, x1: x1, y1: y1, x2: x2, y2: y2};
    };

    const bouger = ev => {
      const bx = ev.clientX - rl.left + lanes.scrollLeft;
      const by = ev.clientY - rl.top;
      if (!tire && Math.abs(bx - ax) < 4 && Math.abs(by - ay) < 4) return;
      if (!tire) {
        tire = true;
        boite = document.createElement('div');
        boite.className = 'lasso';
        lanes.appendChild(boite);
      }
      const t = touches(bx, by);
      boite.style.left = t.x1 + 'px';
      boite.style.top = t.y1 + 'px';
      boite.style.width = (t.x2 - t.x1) + 'px';
      boite.style.height = (t.y2 - t.y1) + 'px';
      // On marque les blocs a la volee : surtout ne pas redessiner la piste,
      // cela detruirait le rectangle en cours de trace.
      $$('#lanes .clip').forEach(x =>
        x.classList.toggle('sel', t.dedans.has(+x.dataset.uid)));
    };

    const lacher = ev => {
      window.removeEventListener('pointermove', bouger);
      window.removeEventListener('pointerup', lacher);
      if (boite) boite.remove();
      if (!tire) {
        if (!e.shiftKey) { clipsSel.clear(); rendreLanes(); rendreReglages(); }
        return;
      }
      const bx = ev.clientX - rl.left + lanes.scrollLeft;
      const by = ev.clientY - rl.top;
      clipsSel = touches(bx, by).dedans;
      rendreLanes(); rendreReglages();
      dire(clipsSel.size + (clipsSel.size > 1 ? ' blocks selected'
                                              : ' block selected'));
    };
    window.addEventListener('pointermove', bouger);
    window.addEventListener('pointerup', lacher);
    return;
  }
  const c = parUid(+el.dataset.uid);
  if (!c) return;

  if (outil === 'C') {
    const r = $('#tlContenu').getBoundingClientRect();
    let t = (e.clientX - r.left) / PPS;
    if (e.shiftKey) {
      const cibles = [tLect, c.t0, fin(c)];
      if (tIn !== null) cibles.push(tIn);
      if (tOut !== null) cibles.push(tOut);
      CLIPS.forEach(x => { if (x.uid !== c.uid) { cibles.push(x.t0); cibles.push(fin(x)); } });
      t = accrocher(t, cibles);
    }
    couper(c, t);
    return;
  }

  // Outil A : un seul geste selectionne tout ce qui suit, puis le deplace.
  // On ne rend pas la main ici — on tombe volontairement dans le glissement
  // plus bas, avec la selection qui vient d etre faite.
  const modeA = outil === 'A';
  if (modeA) {
    e.preventDefault();
    selectionnerDerriere(c, e.shiftKey);
  }

  // Fondu : soit on a vise le carre jaune, soit on est dans la bande du haut.
  // Dans la bande, le cote se decide par la distance aux DEUX attaches, et non
  // par la moitie du bloc : un fondu d entree plus long que la moitie mettrait
  // son carre dans la moitie droite, et on attraperait le mauvais.
  let cote = null;
  if (!modeA) {
    const att = e.target.closest('[data-fade]');
    if (att) cote = att.dataset.fade;
    else if (e.target.closest('[data-bande]')) {
      const el = e.target.closest('.clip');
      const r = el.getBoundingClientRect();
      const x = e.clientX - r.left;
      const xg = (c.fi || 0) * PPS, xd = (dur(c) - (c.fo || 0)) * PPS;
      cote = Math.abs(x - xg) <= Math.abs(x - xd) ? 'g' : 'd';
    }
  }
  if (cote) {
    e.preventDefault();
    const x0 = e.clientX;
    const f0 = cote === 'g' ? (c.fi || 0) : (c.fo || 0);
    memoriser();
    const bouger = ev => {
      const d = (ev.clientX - x0) / PPS;
      const v = Math.max(0, Math.min(dur(c), f0 + (cote === 'g' ? d : -d)));
      if (cote === 'g') c.fi = v; else c.fo = v;
      recalculerFondus(); rendreLanes();
    };
    const lacher = () => {
      window.removeEventListener('pointermove', bouger);
      window.removeEventListener('pointerup', lacher);
      rendreTimeline();
      dire('fade ' + (cote === 'g' ? 'in ' : 'out ') +
        (cote === 'g' ? c.fi : c.fo).toFixed(2) + 's');
    };
    window.addEventListener('pointermove', bouger);
    window.addEventListener('pointerup', lacher);
    return;
  }

  const poi = modeA ? null : e.target.closest('[data-poi]');
  if (!modeA) {
    if (e.altKey) {
      // Alt+clic : ce bloc seul, sans son partenaire lie — l image sans son
      // son, ou l inverse, comme dans Premiere (David, 06/10). Le lien reste :
      // un clic simple reprend les deux.
      if (!e.shiftKey) clipsSel.clear();
      clipsSel.add(c.uid);
    } else {
      if (!e.shiftKey && !clipsSel.has(c.uid)) clipsSel.clear();
      groupeLie(c).forEach(x => clipsSel.add(x.uid));
    }
    rendreLanes(); rendreReglages();
  }

  e.preventDefault();
  const x0 = e.clientX, y0 = e.clientY;

  if (poi) {
    const cote = poi.dataset.poi;
    const grp = groupeLie(c);
    const dep = grp.map(x => ({c: x, t0: x.t0, e: x.e, o: x.o}));
    let bougé = false;
    const bouger = ev => {
      if (!bougé) { memoriser(); bougé = true; }
      // « d » est en secondes de source (donc mis a l echelle par la
      // vitesse), « dTl » en secondes de timeline. Un rush se rogne dans sa
      // source ; un calque n en a pas, il s etire librement.
      const dTl = (ev.clientX - x0) / PPS;
      const d = dTl * vAbs(c);
      dep.forEach(s => {
        const vit = vAbs(s.c);
        if (estSynth(s.c) || estImage(s.c)) {
          // Rien ne borne la duree d un calque, d un texte ou d une image
          // fixe : il n y a pas de duree derriere, seulement celle qu on
          // decide ici.
          // Le bord gauche deplace donc le debut et rallonge d autant, au
          // lieu de grignoter un point d entree qui n existe pas.
          const bout = s.t0 + (s.o - s.e) / vit;
          if (cote === 'g') {
            const nt = Math.min(Math.max(0, s.t0 + dTl), bout - 0.08);
            s.c.t0 = nt;
            s.c.e = 0;
            s.c.o = (bout - nt) * vit;
          } else {
            s.c.o = Math.max(0.08 * vit, Math.min(3600 * vit, s.o + d));
          }
          const el3 = elClip(s.c.uid);
          if (el3) {
            el3.style.left = (s.c.t0 * PPS) + 'px';
            el3.style.width = (dur(s.c) * PPS) + 'px';
          }
          return;
        }
        const f = PAR_ID[s.c.film], max = (f && f.s) || s.o;
        if (s.c.rev) {
          // A l envers, la premiere image montree est « o » et la derniere
          // « e ». Le bord GAUCHE rogne donc « o », le bord droit « e » —
          // sinon tirer un bord ferait bouger l autre bout du plan.
          if (cote === 'g') {
            const no = Math.max(Math.min(max, s.o - d), s.c.e + 0.08);
            s.c.t0 = Math.max(0, s.t0 + (s.o - no) / vit);
            s.c.o = no;
          } else {
            s.c.e = Math.min(Math.max(0, s.e - d), s.c.o - 0.08);
          }
        } else if (cote === 'g') {
          const ne = Math.min(Math.max(0, s.e + d), s.o - 0.08);
          s.c.t0 = Math.max(0, s.t0 + (ne - s.e) / vit);
          s.c.e = ne;
        } else {
          s.c.o = Math.max(Math.min(max, s.o + d), s.c.e + 0.08);
        }
        const el2 = elClip(s.c.uid);
        if (el2) {
          el2.style.left = (s.c.t0 * PPS) + 'px';
          el2.style.width = (dur(s.c) * PPS) + 'px';
        }
      });
    };
    const lacher = () => {
      window.removeEventListener('pointermove', bouger);
      window.removeEventListener('pointerup', lacher);
      if (bougé) { rendreTimeline(); resynchroniser(true); }
    };
    window.addEventListener('pointermove', bouger);
    window.addEventListener('pointerup', lacher);
    return;
  }

  const grp = CLIPS.filter(x => clipsSel.has(x.uid));
  const dep = grp.map(x => ({c: x, t0: x.t0}));
  const ignorer = new Set(grp.map(x => x.uid));
  let bougé = false, laneCible = null;
  const bouger = ev => {
    if (!bougé && Math.abs(ev.clientX - x0) < 3 && Math.abs(ev.clientY - y0) < 3) return;
    if (!bougé) {
      memoriser(); bougé = true;
      // Les blocs tires deviennent transparents au pointeur : ils ne
      // doivent intercepter ni le survol ni le relachement pendant qu on
      // les traine.
      grp.forEach(x => { const el2 = elClip(x.uid);
        if (el2) el2.style.pointerEvents = 'none'; });
    }
    let d = (ev.clientX - x0) / PPS;
    d = aimanter(dep[0].t0 + d, ignorer, ev.shiftKey) - dep[0].t0;
    dep.forEach(s => {
      s.c.t0 = Math.max(0, s.t0 + d);
      const el2 = elClip(s.c.uid);
      if (el2) el2.style.left = (s.c.t0 * PPS) + 'px';
    });
    // Avec l outil A on decale dans le temps, on ne change pas de piste :
    // la selection couvre plusieurs pistes, en deplacer une seule les
    // desalignerait.
    //
    // Et surtout : on ne demande plus au navigateur ce qu il y a sous le
    // curseur. elementFromPoint repond par la pile de rendu, qu un calque,
    // un bloc en cours de deplacement ou une capture de pointeur suffisent
    // a fausser — c est ce qui empechait de deposer un son sur une autre
    // piste. La geometrie des pistes, elle, ne ment pas.
    laneCible = modeA ? null : pisteSousY(ev.clientY);
    // Le bloc que l on tient change de piste ; les blocs lies gardent la leur.
    const pc = laneCible ? piste(laneCible) : null;
    const compatible = !!(pc && pc.type === piste(c.piste).type);
    $$('.lane').forEach(x => x.classList.toggle('cible',
      compatible && x.dataset.piste === laneCible));
    marquerEjectables(ev.ctrlKey, compatible ? laneCible : null);
  };

  // Surlignage a la volee, sans redessiner la piste : redessiner detruirait
  // le bloc que l on est en train de tirer.
  const marquerEjectables = (actif, pjSurvol) => {
    const vises = new Set();
    if (actif) dep.forEach(s => {
      const p = (s.c.uid === c.uid && pjSurvol) ? pjSurvol : s.c.piste;
      clipsDe(p).forEach(x => {
        if (ignorer.has(x.uid)) return;
        if (fin(x) > s.c.t0 + 0.001 && x.t0 < fin(s.c) - 0.001) vises.add(x.uid);
      });
    });
    $$('#lanes .clip').forEach(x =>
      x.classList.toggle('ejectable', vises.has(+x.dataset.uid)));
  };
  const lacher = ev => {
    window.removeEventListener('pointermove', bouger);
    window.removeEventListener('pointerup', lacher);
    $$('.lane').forEach(x => x.classList.remove('cible'));
    $$('#lanes .clip').forEach(x => x.classList.remove('ejectable'));
    grp.forEach(x => { const el2 = elClip(x.uid);
      if (el2) el2.style.pointerEvents = ''; });
    if (!bougé) return;
    const monType = piste(c.piste).type;
    if (laneCible && laneCible !== c.piste) {
      const pc = piste(laneCible);
      if (pc && pc.type === monType) {
        c.piste = laneCible;
        dire('moved to ' + laneCible);
      } else if (pc) {
        dire(nomType(pc.type) + ' tracks do not take ' +
          nomType(monType) + ' blocks', true);
      }
    } else if (!modeA && laneCible === c.piste &&
               PISTES.filter(p => p.type === monType).length < 2) {
      // Rien a dire quand on repose le bloc chez lui, sauf s il n a nulle
      // part ou aller : mieux vaut l expliquer qu un silence.
      dire('only one ' + nomType(monType) + ' track for now — add one with ' +
        (monType === 'v' ? '+V' : monType === 'm' ? '+M' : '+A') +
        ' so you can move this block');
    }
    if (ev && ev.ctrlKey) {
      const n = ejecter(grp);
      if (n) dire(n + (n > 1 ? ' blocks pushed behind' : ' block pushed behind'));
    }
    rendreTimeline(); resynchroniser(true);
  };
  window.addEventListener('pointermove', bouger);
  window.addEventListener('pointerup', lacher);
});

// Ctrl au lâcher : le bloc prend la place de celui qu il chevauche, et
// celui-ci part juste derrière. Un bloc poussé entraîne son son lié, et la
// poussée se propage si elle crée à son tour un chevauchement. Les poussées
// vont toujours vers l avant : la chaîne se termine forcément.
function ejecter(moteurs) {
  const intouchables = new Set();
  moteurs.forEach(p => groupeLie(p).forEach(y => intouchables.add(y.uid)));
  const file = moteurs.slice();
  const pousses = new Set();
  let garde = 0;
  while (file.length && garde++ < 400) {
    const p = file.shift();
    const bout = fin(p);
    clipsDe(p.piste).slice().forEach(x => {
      if (x.uid === p.uid || intouchables.has(x.uid)) return;
      if (fin(x) <= p.t0 + 0.001 || x.t0 >= bout - 0.001) return;
      const d = bout - x.t0;
      if (d <= 0.001) return;
      groupeLie(x).forEach(y => {
        y.t0 = Math.max(0, y.t0 + d);
        pousses.add(y.uid);
        file.push(y);
      });
    });
  }
  return pousses.size;
}

// Équivalent de l outil « Sélection de piste vers l avant » de Premiere : on
// clique un bloc, tout ce qui commence à partir de lui est sélectionné. Par
// défaut sur toutes les pistes ; Maj enfoncée, seulement la sienne — et dans
// ce cas on n entraîne pas le son lié, sinon « cette piste seulement » ne
// voudrait plus rien dire.
function selectionnerDerriere(c, seulePiste) {
  const t = c.t0 - 0.001;
  const pris = new Set();
  CLIPS.forEach(x => {
    if (seulePiste && x.piste !== c.piste) return;
    if (x.t0 < t) return;
    if (seulePiste) pris.add(x.uid);
    else groupeLie(x).forEach(y => pris.add(y.uid));
  });
  clipsSel = pris;
  rendreLanes(); rendreReglages();
  const n = pris.size;
  dire(n + (n > 1 ? ' blocks selected' : ' block selected') +
    ' from ' + tc(c.t0) +
    (seulePiste ? ' on ' + c.piste : '') +
    (n ? ' — drag to shift them' : ''));
}

// Quelle piste se trouve a cette hauteur d ecran ? On mesure les lignes
// elles-memes plutot que d interroger la pile de rendu.
function pisteSousY(y) {
  let trouve = null;
  $$('#lanes .lane').forEach(l => {
    const r = l.getBoundingClientRect();
    if (y >= r.top && y < r.bottom) trouve = l.dataset.piste;
  });
  return trouve;
}

function couper(c, t) {
  if (t <= c.t0 + 0.05 || t >= fin(c) - 0.05) { dire('cut outside the shot'); return; }
  memoriser();
  const grp = groupeLie(c);
  const decoupe = t - c.t0;
  const lien = grp.length > 1 ? lienLibre() : null;
  grp.forEach(x => {
    const v = vAbs(x);
    const droite = {};
    for (const k in x) if (k[0] !== '_') droite[k] = x[k];
    // Copies propres : sans elles, la moitie droite partageait le rack, le
    // masque et les cles de la gauche — regler l une reglait l autre.
    if (x.fx) droite.fx = JSON.parse(JSON.stringify(x.fx));
    if (x.masque) droite.masque = JSON.parse(JSON.stringify(x.masque));
    if (x.anim) droite.anim = JSON.parse(JSON.stringify(x.anim));
    // Les cles suivent la coupe : chaque moitie recoit une cle a la coupe, a
    // la valeur qu avait l animation a cet instant, et la droite decale les
    // siennes. Le mouvement continue sans saut d un morceau a l autre.
    const couperListe = (g, dr) => {
      if (!g || !g.length) return [g, dr];
      const v = interpCles(g, decoupe);
      return [g.filter(p => p.t < decoupe - 0.008).concat([{t: +decoupe.toFixed(3), v: v}]),
              [{t: 0, v: v}].concat(dr.filter(p => p.t > decoupe + 0.008)
                .map(p => ({t: +(p.t - decoupe).toFixed(3), v: p.v})))];
    };
    if (x.anim) for (const k in x.anim)
      [x.anim[k], droite.anim[k]] = couperListe(x.anim[k], droite.anim[k]);
    (x.fx || []).forEach((f, n) => {
      if (!f || !f.anim) return;
      for (const k in f.anim)
        [f.anim[k], droite.fx[n].anim[k]] = couperListe(f.anim[k], droite.fx[n].anim[k]);
    });
    droite.uid = uidSuivant++;
    droite.t0 = x.t0 + decoupe;
    droite.lien = lien;
    // Une coupe fait deux bords francs : le morceau de gauche garde son fondu
    // d ouverture et perd celui de fermeture, celui de droite l inverse.
    droite.fi = 0;
    x.fo = 0;
    if (x.rev) {
      // A l envers, la gauche descend de « o » jusqu a la coupe, et la droite
      // reprend la ou l autre s arrete pour descendre jusqu a « e ».
      const coupe = x.o - decoupe * v;
      droite.o = coupe;
      x.e = coupe;
    } else {
      const coupe = x.e + decoupe * v;
      droite.e = coupe;
      x.o = coupe;
    }
    CLIPS.push(droite);
  });
  clipsSel.clear();
  rendreTimeline();
  dire('cut at ' + tc(t));
}

function retirerSelection() {
  if (!clipsSel.size) { dire('no block selected'); return; }
  memoriser();
  const n = clipsSel.size;
  CLIPS = CLIPS.filter(c => !clipsSel.has(c.uid));
  clipsSel.clear();
  rendreTimeline(); resynchroniser(true);
  dire(n + (n > 1 ? ' blocks deleted' : ' block deleted'));
}

function copierBlocs() {
  const s = CLIPS.filter(c => clipsSel.has(c.uid));
  if (!s.length) { dire('nothing to copy'); return; }
  presse = s.map(c => {
    const n = {};
    for (const k in c) if (k[0] !== '_') n[k] = c[k];
    // Le rack et les images-cles sont des tableaux : sans copie profonde, le
    // bloc colle partagerait ceux de l original.
    if (c.fx) n.fx = JSON.parse(JSON.stringify(c.fx));
    if (c.masque) n.masque = JSON.parse(JSON.stringify(c.masque));
    if (c.anim) n.anim = JSON.parse(JSON.stringify(c.anim));
    return n;
  });
  dire(presse.length + (presse.length > 1 ? ' blocks copied' : ' block copied'));
}
function collerBlocs() {
  if (!presse.length) { dire('clipboard empty'); return; }
  memoriser();
  const t0min = Math.min.apply(null, presse.map(c => c.t0));
  const liens = {};
  const neufs = presse.map(c => {
    const n = {};
    for (const k in c) n[k] = c[k];
    if (c.fx) n.fx = JSON.parse(JSON.stringify(c.fx));
    if (c.masque) n.masque = JSON.parse(JSON.stringify(c.masque));
    if (c.anim) n.anim = JSON.parse(JSON.stringify(c.anim));
    n.uid = uidSuivant++;
    n.t0 = Math.max(0, tLect + (c.t0 - t0min));
    if (c.lien) {
      if (!liens[c.lien]) liens[c.lien] = lienLibre();
      n.lien = liens[c.lien];
    }
    if (!piste(n.piste)) n.piste = PISTES[0].id;
    return n;
  });
  CLIPS = CLIPS.concat(neufs);
  clipsSel = new Set(neufs.map(n => n.uid));
  rendreTimeline();
  dire(neufs.length + ' block' + (neufs.length > 1 ? 's' : '') +
    ' pasted at ' + tc(tLect));
}

// Duplique la selection juste derriere elle, sur les memes pistes. Le son
// lie suit, avec un nouveau lien : les deux copies restent appariees entre
// elles sans rester collees a l original.
function dupliquerBlocs() {
  const src = CLIPS.filter(c => clipsSel.has(c.uid));
  if (!src.length) { dire('no block selected'); return; }
  memoriser();
  const bout = Math.max.apply(null, src.map(fin));
  const debut = Math.min.apply(null, src.map(c => c.t0));
  let ecart = bout - debut;
  // Posee juste derriere, la copie peut tomber sur un bloc deja en place :
  // elle s y glisserait dessous sans qu on la voie. On la fait coulisser
  // jusqu au premier creux, pistes liees en bloc pour rester appariees.
  const autres = CLIPS.filter(c => !clipsSel.has(c.uid));
  let decale = false;
  for (let garde = 0; garde < 200; garde++) {
    let butoir = null;
    for (const c of src) for (const o of autres) {
      if (o.piste !== c.piste) continue;
      if (c.t0 + ecart < fin(o) - 0.001 && fin(c) + ecart > o.t0 + 0.001) {
        const e = fin(o) - c.t0;
        butoir = butoir === null ? e : Math.max(butoir, e);
      }
    }
    if (butoir === null) break;
    ecart = butoir; decale = true;
  }
  const liens = {};
  const neufs = src.map(c => {
    const n = {};
    for (const k in c) if (k[0] !== '_') n[k] = c[k];
    n.uid = uidSuivant++;
    n.t0 = c.t0 + ecart;
    if (c.anim) n.anim = JSON.parse(JSON.stringify(c.anim));
    if (c.fx) n.fx = JSON.parse(JSON.stringify(c.fx));
    if (c.masque) n.masque = JSON.parse(JSON.stringify(c.masque));
    if (c.lien) {
      if (!liens[c.lien]) liens[c.lien] = lienLibre();
      n.lien = liens[c.lien];
    }
    return n;
  });
  CLIPS = CLIPS.concat(neufs);
  clipsSel = new Set(neufs.map(n => n.uid));
  rendreTimeline(); resynchroniser(true);
  dire(neufs.length + (neufs.length > 1 ? ' blocks duplicated' : ' block duplicated') +
    ' at ' + tc(debut + ecart) +
    (decale ? ' — shifted past the blocks already there' : ''));
}

// « Clone » : N copies de la selection, posees bout a bout juste derriere
// elle, sur les memes pistes ; le son lie suit chaque copie avec son propre
// lien. Ce qui venait apres, sur ces pistes, recule de la longueur ajoutee —
// sinon les copies tomberaient dessus et fondraient avec. Les autres pistes
// (la musique, typiquement) ne bougent pas.
let CLONE_N = Math.max(1, Math.min(50, parseInt(pref.lire('cloneN', '2'), 10) || 2));
function clonerBlocs(n) {
  const src = CLIPS.filter(c => clipsSel.has(c.uid));
  if (!src.length) { dire('no block selected'); return; }
  n = Math.max(1, Math.min(50, parseInt(n, 10) || 1));
  CLONE_N = n;
  pref.ecrire('cloneN', String(n));
  const debut = Math.min.apply(null, src.map(c => c.t0));
  const bout = Math.max.apply(null, src.map(fin));
  const ecart = bout - debut;
  if (ecart < 0.04) { dire('the selection is too short to clone'); return; }
  memoriser();
  const total = ecart * n;
  const pistes = new Set(src.map(c => c.piste));
  const aPousser = new Set();
  CLIPS.forEach(c => {
    if (clipsSel.has(c.uid) || !pistes.has(c.piste)) return;
    // Ce qui commence apres la selection, et ce qui la chevauche en
    // debordant derriere (un fondu enchaine avec sa fin) : il garde ainsi son
    // fondu, avec la derniere copie.
    if (c.t0 >= bout - 0.001 || (c.t0 > debut + 0.001 && fin(c) > bout + 0.001))
      aPousser.add(c);
  });
  // Le son (ou l image) lie a un bloc qui recule le suit, meme s il est sur
  // une autre piste : sinon les deux se decaleraient.
  [...aPousser].forEach(c => {
    if (c.lien) CLIPS.forEach(x => {
      if (x.lien === c.lien && !clipsSel.has(x.uid)) aPousser.add(x);
    });
  });
  aPousser.forEach(c => { c.t0 += total; });
  const pousses = aPousser.size;
  const neufs = [];
  for (let k = 1; k <= n; k++) {
    const liens = {};
    src.forEach(c => {
      const m = {};
      for (const cle in c) if (cle[0] !== '_') m[cle] = c[cle];
      if (c.fx) m.fx = JSON.parse(JSON.stringify(c.fx));
      if (c.anim) m.anim = JSON.parse(JSON.stringify(c.anim));
      if (c.masque) m.masque = JSON.parse(JSON.stringify(c.masque));
      if (c.shks) m.shks = JSON.parse(JSON.stringify(c.shks));
      if (Array.isArray(c.mq)) m.mq = JSON.parse(JSON.stringify(c.mq));
      m.uid = uidSuivant++;
      m.t0 = c.t0 + k * ecart;
      if (c.lien) {
        if (!liens[c.lien]) liens[c.lien] = lienLibre();
        m.lien = liens[c.lien];
      }
      neufs.push(m);
    });
  }
  CLIPS = CLIPS.concat(neufs);
  clipsSel = new Set(neufs.map(m => m.uid));
  rendreTimeline(); resynchroniser(true);
  dire(n + (n > 1 ? ' clones' : ' clone') + ' placed from ' + tc(bout) +
    ' to ' + tc(bout + total) +
    (pousses ? ' — ' + pousses + ' block' + (pousses > 1 ? 's' : '') +
      ' moved back' : '') + ' · Ctrl+Z to undo');
}
$('#menu').addEventListener('keydown', e => {
  const ch = e.target.closest('[data-clone-n]');
  if (!ch) return;
  e.stopPropagation();
  if (e.key === 'Enter') {
    e.preventDefault();
    $('#menu').className = '';
    clonerBlocs(ch.value);
  } else if (e.key === 'Escape') {
    e.preventDefault();
    $('#menu').className = '';
  }
});

function delier() {
  const l = CLIPS.filter(c => clipsSel.has(c.uid) && c.lien);
  if (!l.length) { dire('nothing to unlink'); return; }
  memoriser();
  const liens = new Set(l.map(c => c.lien));
  CLIPS.forEach(c => { if (liens.has(c.lien)) c.lien = null; });
  rendreTimeline(); dire('audio unlinked from the rush');
}
function relier() {
  const s = CLIPS.filter(c => clipsSel.has(c.uid));
  const v = s.find(c => piste(c.piste).type === 'v');
  const a = s.find(c => piste(c.piste).type === 'a');
  if (!v || !a) { dire('select a video shot and an audio shot', true); return; }
  memoriser();
  const lien = lienLibre();
  v.lien = lien; a.lien = lien;
  rendreTimeline(); dire('audio linked to the rush');
}
function vitesseSelection(v) {
  const s = CLIPS.filter(c => clipsSel.has(c.uid));
  if (!s.length) return;
  memoriser();
  s.forEach(c => c.vitesse = v);
  rendreTimeline(); resynchroniser(true);
  dire('speed ×' + v);
}
function couleurSelection(i) {
  const s = CLIPS.filter(c => clipsSel.has(c.uid));
  if (!s.length) return;
  memoriser();
  s.forEach(c => c.couleur = i);
  rendreTimeline();
}

function setOutil(o) {
  outil = o;
  document.body.classList.toggle('outilC', o === 'C');
  document.body.classList.toggle('outilA', o === 'A');
  $('#oV').classList.toggle('on', o === 'V');
  $('#oC').classList.toggle('on', o === 'C');
  $('#oA').classList.toggle('on', o === 'A');
}
$('#oV').onclick = () => setOutil('V');
$('#oC').onclick = () => setOutil('C');
$('#oA').onclick = () => setOutil('A');
$('#bVider').onclick = () => {
  if (!CLIPS.length) { dire('the timeline is already empty'); return; }
  if (!confirm('Clear the timeline?\n\n' + CLIPS.length +
      ' block(s) will be removed from the sequence.\nFiles on disk are not touched.\n' +
      'Ctrl+Z takes you back.')) return;
  memoriser();
  CLIPS = []; clipsSel.clear(); tLect = 0; projetNom = ''; MARQUEURS = [];
  rendreTimeline(); resynchroniser(true);
  dire('timeline cleared — Ctrl+Z to go back');
};
