  if (img.tagName !== 'IMG' || !img.dataset.poster) return;
  const id = img.dataset.poster;
  if (posterTentes.has(id)) return;
  posterTentes.add(id); filePosters.push(id); prochainPoster();
}, true);

function finirPoster(ok) {
  if (!posterEnCours) return;
  posterEnCours = false;
  clearTimeout(posterMinuteur);
  if (ok && posterId) {
    const i = document.querySelector('[data-poster="' + posterId + '"]');
    if (i) i.src = posterDe(posterId) + '?' + Date.now();
  }
  posterId = null;
  vPoster.removeAttribute('src'); vPoster.load();
  setTimeout(prochainPoster, 60);
}
vPoster.addEventListener('loadeddata', () => {
  if (posterEnCours) vPoster.currentTime = (vPoster.duration || 1) * 0.35;
});
vPoster.addEventListener('seeked', async () => {
  if (!posterEnCours || !vPoster.videoWidth) return;
  const id = posterId;
  try {
    const c = document.createElement('canvas');
    c.width = 480;
    c.height = Math.round(480 * vPoster.videoHeight / vPoster.videoWidth) || 270;
    c.getContext('2d').drawImage(vPoster, 0, 0, c.width, c.height);
    await api('api/poster', {projet: (PAR_ID[id] || {}).pj, id: id,
                              data: c.toDataURL('image/jpeg', 0.78)});
    finirPoster(true);
  } catch (err) { finirPoster(false); }
});
vPoster.addEventListener('error', () => finirPoster(false));

function prochainPoster() {
  if (posterEnCours || !filePosters.length) return;
  const id = filePosters.shift();
  const f = PAR_ID[id];
  if (!f || f.absent) { setTimeout(prochainPoster, 0); return; }
  posterEnCours = true; posterId = id;
  vPoster.src = urlMedia(f);
  vPoster.load();
  posterMinuteur = setTimeout(() => finirPoster(false), 12000);
}
</script>
<script>
// ===========================================================================
//  Interactions bibliothèque
// ===========================================================================
async function renommerFilm(id, neuf) {
  const f = PAR_ID[id];
  if (!f || !neuf || neuf === f.nom) return false;
  try {
    const d = await api('api/renommer', {projet: f.pj, id: id, nom: neuf});
    Object.assign(f, d.film);
    rendreGrille(); rendreTimeline();
    dire('renamed on disk: ' + f.nom);
    return true;
  } catch (err) { dire('rename refused — ' + err.message, true); return false; }
}

grille.addEventListener('click', async e => {
  const pa = e.target.closest('[data-pastille]');
  if (pa) { e.stopPropagation(); menuPastille(pa); return; }
  const et = e.target.closest('[data-fav]');
  if (et) {
    e.stopPropagation();
    const f = PAR_ID[et.dataset.fav];
    try {
      const d = await api('api/marquer',
                          {projet: f.pj, id: f.id, fav: !f.fav});
      Object.assign(f, d.film); rendreGrille();
    } catch (err) { dire('favourite not saved — ' + err.message, true); }
    return;
  }
  const red = e.target.closest('[data-reduire]');
  if (red) { e.stopPropagation(); reduire(); return; }
  const lire = e.target.closest('[data-lire]');
  if (lire) { e.stopPropagation(); visionner(lire.dataset.lire); return; }
  if (e.target.closest('video') || e.target.tagName === 'INPUT') return;
  const c = e.target.closest('.c');
  if (!c) return;
  // Le deuxieme clic d un double-clic ne doit pas defaire la selection faite
  // par le premier.
  if (e.detail > 1) return;
  const id = c.dataset.id;
  if (e.shiftKey && selection.size) {
    const l = FILMS.filter(correspond).map(f => f.id);
    const der = [...selection].pop();
    const a = l.indexOf(der), b = l.indexOf(id);
    if (a >= 0 && b >= 0) l.slice(Math.min(a, b), Math.max(a, b) + 1)
      .forEach(x => selection.add(x));
  } else if (e.ctrlKey || e.metaKey) {
    selection.has(id) ? selection.delete(id) : selection.add(id);
  } else {
    const seul = selection.size === 1 && selection.has(id);
    selection.clear();
    if (!seul) selection.add(id);
  }
  rendreGrille();
});

grille.addEventListener('dblclick', e => {
  if (e.target.closest('[data-pastille]')) return;
  const n = e.target.closest('[data-nom]');
  if (n) { editerNom(n); return; }
  // Toute la carte repond : on double-clique « sur le rush », pas sur une
  // zone. Le nom reste au renommage, lui.
  const c = e.target.closest('.c');
  if (!c) return;
  // preventDefault coupe le plein ecran natif que Chrome declenche sur un
  // double-clic dans une video a controles.
  e.preventDefault(); e.stopPropagation();
  agrandir(c.dataset.id);
});

// Le volume des apercus de rushes — le lecteur qui s ouvre dans la vignette
// et celui du pop-up. Les controles du navigateur repartaient a 100 % a
// chaque rush, et un son mixe fort l etait a chaque fois (signale par David
// le 29/09). Baisse une fois, il vaut pour tous les rushes, et il est retenu
// d une visite a l autre — par bibliotheque, comme les autres preferences.
// La coupure du son suit le meme chemin. La timeline n est pas concernee :
// elle a ses volumes de bloc et de piste.
const VOL_APERCU = (() => {
  const v = parseFloat(pref.lire('volApercu', '1'));
  return {v: isFinite(v) ? Math.min(1, Math.max(0, v)) : 1,
          muet: pref.lire('muetApercu', '0') === '1'};
})();
const LECTEURS_APERCU = '.media video, .media audio, #loupe video, #loupe audio';
function reglerApercu(el) {
  if (!el) return;
  el.volume = VOL_APERCU.v;
  el.muted = VOL_APERCU.muet;
}
// « volumechange » ne remonte pas : on l ecoute a la descente.
document.addEventListener('volumechange', e => {
  const el = e.target;
  if (!el || !el.matches || !el.matches(LECTEURS_APERCU)) return;
  if (Math.abs(el.volume - VOL_APERCU.v) < 0.001 &&
      el.muted === VOL_APERCU.muet) return;
  VOL_APERCU.v = el.volume;
  VOL_APERCU.muet = el.muted;
  pref.ecrire('volApercu', String(+el.volume.toFixed(3)));
  pref.ecrire('muetApercu', el.muted ? '1' : '0');
  $$(LECTEURS_APERCU).forEach(x => { if (x !== el) reglerApercu(x); });
}, true);

// Double-clic sur un rush : il s ouvre en pop-up, six fois la vignette,
// par-dessus la bibliotheque assombrie, et le clip part tout seul. Un
// deuxieme double-clic, la croix, un clic a cote ou Échap le referment.
function agrandir(id) {
  const f = PAR_ID[id];
  if (!f || f.absent) return;
  if (agrandi === id) { reduire(); return; }
  // Un seul lecteur a la fois : on coupe ceux qui jouent dans la grille.
  $$('.media video, .media audio').forEach(v => {
    v.pause(); v.removeAttribute('src'); v.load();
  });
  agrandi = id;
  const esc = x => String(x === undefined || x === null ? '' : x)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
  // « poster » affiche la vignette AVANT le premier octet de video : le
  // panneau est plein des l ouverture, jamais un rectangle noir le temps du
  // chargement. Et rien n est recalcule dans la grille, donc c est immediat.
  const w = f.w || 16, h = f.h || 9;
  const media = f.son_seul
    ? '<div class="pochette" style="--t:' + (tonSon(f.nom) | 0) + 'deg">' +
      '<span>♪</span></div><audio src="' + urlMedia(f) +
      '" controls autoplay loop preload="auto"></audio>'
    : f.image
    ? '<div class="scene" style="--ar:' + w + '/' + h + ';--arn:' +
      (w / h).toFixed(4) + '"><img src="' + urlMedia(f) + '" alt="' +
      esc(f.nom) + '" style="width:100%;height:100%;object-fit:contain">' +
      '</div>'
    : '<div class="scene" style="--ar:' + w + '/' + h + ';--arn:' +
      (w / h).toFixed(4) + '"><video src="' + urlMedia(f) + '" poster="' +
      urlPoster(f) + '" controls autoplay loop playsinline preload="auto">' +
      '</video></div>';
  const l = $('#loupe');
  l.innerHTML = '<div class="cadre"><div class="loupeTete">' +
    '<b>' + esc(f.nom) + '</b>' +
    '<span style="color:var(--sourd);white-space:nowrap">' +
    (f.s || 0).toFixed(1) + 's' + (f.w ? ' · ' + f.w + '×' + f.h : '') +
    '</span><span class="sp"></span>' +
    '<button data-loupe-x="1" title="close (Esc)">⤡</button></div>' +
    media + '</div>';
  reglerApercu(l.querySelector('video, audio'));
  l.className = 'on';
}

function reduire() {
  if (!agrandi) return false;
  agrandi = null;
  const l = $('#loupe');
  $$('#loupe video, #loupe audio').forEach(v => {
    v.pause(); v.removeAttribute('src'); v.load();
  });
  l.className = '';
  l.innerHTML = '';
  return true;
}

// Le fond et la croix referment. Un clic DANS le cadre ne doit rien faire :
// on manipule les controles du lecteur.
$('#loupe').addEventListener('click', e => {
  if (e.target.closest('[data-loupe-x]') || e.target.id === 'loupe') reduire();
});

function editerNom(el) {
  const id = el.dataset.nom, f = PAR_ID[id];
  const inp = document.createElement('input');
  inp.className = 'nom'; inp.value = f.nom;
  el.replaceWith(inp); inp.focus(); inp.select();
  let clos = false;
  const fermer = async valider => {
    if (clos) return; clos = true;
    const neuf = inp.value.trim();
    if (valider) await renommerFilm(id, neuf);
    rendreGrille();
  };
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); fermer(true); }
    if (e.key === 'Escape') { e.preventDefault(); fermer(false); }
    e.stopPropagation();
  });
  inp.addEventListener('blur', () => fermer(true));
}

function visionner(id) {
  const f = PAR_ID[id];
  const zone = document.querySelector('[data-media="' + id + '"]');
  if (!zone) return;
  const vignette = i => '<img src="' + posterDe(i) + '" data-poster="' + i +
    '" alt=""><button class="lire" data-lire="' + i + '">▶</button>';
  const liberer = v => { v.pause(); v.removeAttribute('src'); v.load(); };
  if (zone.querySelector('video')) {
    liberer(zone.querySelector('video')); zone.innerHTML = vignette(id); return;
  }
  $$('.media video').forEach(v => {
    const i = v.dataset.dansCarte; liberer(v);
    v.parentElement.innerHTML = vignette(i);
  });
  zone.innerHTML = '<video data-dans-carte="' + id + '" src="' + urlMedia(f) +
    '" controls autoplay loop playsinline preload="metadata"></video>';
  reglerApercu(zone.querySelector('video'));
}

grille.addEventListener('dragstart', e => {
  const m = e.target.closest('[data-media]');
  if (!m) return;
  const id = m.dataset.media;
  if (!selection.has(id)) { selection.clear(); selection.add(id); rendreGrille(); }
  e.dataTransfer.setData('text/plain',
    JSON.stringify({type: 'films', ids: [...selection]}));
  e.dataTransfer.effectAllowed = 'copyMove';
});

// Clic droit sur une vignette : ou ce rush a-t-il deja servi ? Le meme geste
// qu au clic droit sur un bloc de la timeline, et le meme resultat. #grille
// EST le deck en mode Montage (body.edit #grille) : un seul gestionnaire
// couvre donc la bibliotheque et le deck.
grille.addEventListener('contextmenu', e => {
  const carte = e.target.closest('[data-id]');
  if (!carte) return;
  const id = carte.dataset.id;
  const f = PAR_ID[id];
  if (!f) return;
  e.preventDefault();
  const m = $('#menu');
  // Plusieurs vignettes selectionnees : la couleur les prend toutes, comme
  // sur la timeline.
  const cibles = selection.has(id) && selection.size > 1
    ? [...selection] : [id];
  m.innerHTML = '<div class="lbl">' + echapHtml((f.nom || '').slice(0, 28)) +
    (cibles.length > 1 ? ' · ' + cibles.length + ' clips' : '') +
    '</div><div class="it" data-carte-act="usages">' +
    '⌕ Used in which sequences…</div>' +
    (REVELER_OK
      ? '<div class="it" data-carte-act="disque">⊞ Show in computer</div>'
      : '') +
    '<div class="sep"></div><div class="lbl">Colour filter</div>' +
    chipsCats('data-carte-coul', catDe(f.coul) ? +f.coul : 0);
  m.dataset.carteCibles = cibles.join(',');
  m.dataset.carteId = id;
  m.className = 'on';
  const r = m.getBoundingClientRect();
  m.style.left = Math.min(e.clientX, innerWidth - r.width - 8) + 'px';
  m.style.top = Math.min(e.clientY, innerHeight - r.height - 8) + 'px';
});

$('#menu').addEventListener('click', e => {
  const pc = e.target.closest('[data-carte-coul]');
  if (pc) {
    const l = ($('#menu').dataset.carteCibles || '').split(',').filter(Boolean);
    $('#menu').className = '';
    couleurRush(l, +pc.dataset.carteCoul);
    return;
  }
  const it = e.target.closest('[data-carte-act]');
  if (!it) return;
  const id = $('#menu').dataset.carteId;
  $('#menu').className = '';
  if (!id) return;
  if (it.dataset.carteAct === 'usages') boiteUsages(id);
  if (it.dataset.carteAct === 'disque') montrerSurLeDisque(id);
});

// La couleur d un rush vit dans le catalogue, pas dans le navigateur : elle
// suit le fichier, et se retrouve d une machine a l autre. L affichage bouge
// tout de suite, et se corrige si le disque refuse.
async function couleurRush(ids, i) {
  const avant = ids.map(id => (PAR_ID[id] || {}).coul || 0);
  ids.forEach(id => { if (PAR_ID[id]) PAR_ID[id].coul = i; });
  rendreGrille();
  let rate = 0;
  for (let k = 0; k < ids.length; k++) {
    const f = PAR_ID[ids[k]];
    if (!f) continue;
    try {
      const d = await api('api/marquer', {projet: f.pj, id: f.id, coul: i});
      Object.assign(f, d.film);
    } catch (err) { f.coul = avant[k]; rate++; }
  }
  if (rate) { rendreGrille(); dire(rate + ' colour(s) not saved', true); }
  else {
    const c = catDe(i);
    dire((ids.length > 1 ? ids.length + ' clips' : 'clip') +
         (c ? ' → ' + (c.nom ? '“' + c.nom + '”' : 'colour') : ': no colour'));
  }
}

// ===========================================================================
//  Couleurs de rangement : la palette, son editeur, la pastille des cartes
// ===========================================================================
// Les couleurs de la palette en pastilles nommees, pour un menu. « attr »
// porte le numero choisi ; « actuel » est entoure (0 : aucune, null : les
// cibles n ont pas toutes la meme).
function chipsCats(attr, actuel) {
  const ch = (id, fond, nom) => '<span ' + attr + '="' + id + '"' +
    (actuel === id ? ' class="on"' : '') + '><i' +
    (fond ? ' style="background:' + fond + '"' : ' class="aucune"') + '></i>' +
    echapHtml(nom) + '</span>';
  return '<div class="chipsCat">' +
    CATS.liste.map(c => ch(c.id, c.coul, c.nom || '—')).join('') +
    ch(0, '', 'none') + '</div>';
}

function nettoyerCats(v) {
  const vus = new Set();
  const liste = (Array.isArray(v && v.liste) ? v.liste : [])
    .filter(c => c && +c.id > 0 && !vus.has(+c.id) && vus.add(+c.id))
    .slice(0, CAT_MAX)
    .map(c => ({id: +c.id,
                coul: /^#[0-9a-f]{6}$/i.test(c.coul || '') ? c.coul : '#7d8a99',
                nom: String(c.nom || '').replace(/\s+/g, ' ').trim().slice(0, 40)}));
  const max = liste.reduce((m, c) => Math.max(m, c.id), 0);
  return {suivant: Math.max(+v.suivant || 0, max + 1), liste: liste};
}

async function chargerCategories() {
  try {
    const d = await api('api/presets?genre=categories');
    const v = d && d.presets && d.presets.palette;
    if (v && Array.isArray(v.liste)) CATS = nettoyerCats(v);
  } catch (e) {}
  rendreCats();
}

async function enregistrerCats() {
  try {
    await api('api/presets', {genre: 'categories', nom: 'palette',
                               valeur: CATS});
    return true;
  } catch (err) { dire('colours not saved — ' + err.message, true); return false; }
}

function rendreCats() {
  const b = $('#cats');
  if (!b) return;
  if (FILTRE_CAT && !catDe(FILTRE_CAT)) FILTRE_CAT = 0;
  b.innerHTML = CATS.liste.map(c =>
    '<button class="cat' + (c.nom ? '' : ' vide') +
    (FILTRE_CAT === c.id ? ' on' : '') + '" data-cat="' + c.id +
    '" style="--cc:' + c.coul + '" title="' +
    echapHtml(c.nom || 'no name yet') + ' — click: show only these · ' +
    'double-click or right-click: edit"><i></i>' +
    (c.nom ? '<span>' + echapHtml(c.nom) + '</span>' : '') + '</button>')
    .join('') +
    (CATS.liste.length < CAT_MAX
      ? '<button id="catPlus" title="add a new colour">+</button>' : '');
}

// Poser le menu pres d un element, sans deborder de la fenetre.
function placerMenu(m, r, aDroite) {
  m.className = 'on';
  const w = m.offsetWidth, h = m.offsetHeight;
  let x = aDroite ? r.right - w : r.left;
  let y = r.bottom + 4;
  if (y + h > innerHeight - 8) y = Math.max(8, r.top - h - 4);
  m.style.left = Math.max(8, Math.min(x, innerWidth - w - 8)) + 'px';
  m.style.top = y + 'px';
}

// Le deroulant de la pastille : les couleurs de la palette, et « aucune ».
// Sur une carte de la selection, le choix vaut pour toute la selection —
// comme le clic droit.
function menuPastille(el) {
  const id = el.dataset.pastille, f = PAR_ID[id];
  if (!f) return;
  EDIT_CAT = null;
  const cibles = selection.has(id) && selection.size > 1 ? [...selection] : [id];
  const m = $('#menu');
  m.innerHTML = '<div class="lbl">' + (cibles.length > 1
      ? 'Colour filter · ' + cibles.length + ' clips' : 'Colour filter') + '</div>' +
    CATS.liste.map(c => '<div class="it' + (+f.coul === c.id ? ' choisi' : '') +
      '" data-cat-choix="' + c.id + '"><i class="pt" style="background:' +
      c.coul + '"></i>' + (c.nom ? echapHtml(c.nom)
        : '<span style="opacity:.6">no name</span>') + '</div>').join('') +
    '<div class="sep"></div><div class="it' + (catDe(f.coul) ? '' : ' choisi') +
    '" data-cat-choix="0"><i class="pt aucune"></i>No colour</div>';
  m.dataset.carteCibles = cibles.join(',');
  placerMenu(m, el.getBoundingClientRect(), true);
}

// L editeur d une couleur de la palette : sa teinte, son nom, l effacer.
let EDIT_CAT = null;
function ouvrirEditeurCat(id) {
  const c = catDe(id);
  const b = $('#cats [data-cat="' + id + '"]');
  if (!c || !b) return;
  EDIT_CAT = c.id;
  const n = FILMS.filter(f => +f.coul === c.id && !f.absent).length;
  const m = $('#menu');
  m.innerHTML = '<div class="lbl">Colour and its name</div><div class="edCat">' +
    '<div class="ligne"><input type="color" data-cat-coul value="' + c.coul +
    '" title="any colour"><input type="text" data-cat-nom maxlength="40" ' +
    'placeholder="category name…" value="' + echapHtml(c.nom) + '"></div>' +
    '<div class="teintes">' + [...new Set(CAT_TEINTES)].map(x =>
      '<b data-cat-teinte="' + x + '" style="background:' + x + '"></b>').join('') +
    '</div>' +
    '<div class="petit">' + n + ' clip' + (n === 1 ? '' : 's') +
    ' in the open projects · Enter to save</div>' +
    '<div class="ligne"><button data-cat-ok>OK</button>' +
    '<span class="pousse"></span>' +
    '<button data-cat-suppr title="remove this colour from the palette — ' +
    'the clips that carry it are left without colour">Delete</button></div>' +
    '</div>';
  placerMenu(m, b.getBoundingClientRect(), false);
  const ch = m.querySelector('[data-cat-nom]');
  ch.focus(); ch.select();
}

// Ecrit ce que l editeur montre. Appele par OK, Entree, ou un clic ailleurs.
async function validerEditeurCat() {
  if (!EDIT_CAT) return;
  const m = $('#menu');
  const c = catDe(EDIT_CAT);
  EDIT_CAT = null;
  const ec = m.querySelector('[data-cat-coul]');
  const en = m.querySelector('[data-cat-nom]');
  if (!c || !ec || !en) return;
  const coul = /^#[0-9a-f]{6}$/i.test(ec.value) ? ec.value : c.coul;
  const nom = en.value.replace(/\s+/g, ' ').trim().slice(0, 40);
  if (coul === c.coul && nom === c.nom) return;
  c.coul = coul; c.nom = nom;
  rendreCats(); rendreGrille();
  if (await enregistrerCats()) dire('colour saved' + (nom ? ': “' + nom + '”' : ''));
}

async function effacerCat(id) {
  const c = catDe(id);
  if (!c) return;
  const n = FILMS.filter(f => +f.coul === c.id && !f.absent).length;
  if (!confirm('Delete the colour “' + (c.nom || 'no name') + '” from the palette?' +
      (n ? '\n\n' + n + ' clip' + (n > 1 ? 's' : '') + ' will be left without colour.'
         : ''))) return;
  CATS.liste = CATS.liste.filter(x => x.id !== c.id);
  if (FILTRE_CAT === c.id) FILTRE_CAT = 0;
  rendreCats(); rendreGrille();
  if (await enregistrerCats()) dire('colour deleted');
}

function ajouterCat() {
  if (CATS.liste.length >= CAT_MAX) { dire(CAT_MAX + ' colours at most'); return; }
  const prises = new Set(CATS.liste.map(c => c.coul.toLowerCase()));
  const coul = CAT_TEINTES.find(x => !prises.has(x)) ||
    CAT_TEINTES[CATS.liste.length % CAT_TEINTES.length];
  const c = {id: CATS.suivant++, coul: coul, nom: ''};
  CATS.liste.push(c);
  rendreCats();
  enregistrerCats();
  ouvrirEditeurCat(c.id);
}

// Un clic filtre ; le double-clic edite, et rend le filtre tel qu il etait
// avant son premier clic.
let FILTRE_AVANT = 0;
$('#cats').addEventListener('click', e => {
  if (e.target.closest('#catPlus')) { ajouterCat(); return; }
  const b = e.target.closest('[data-cat]');
  if (!b || e.detail > 1) return;
  FILTRE_AVANT = FILTRE_CAT;
  FILTRE_CAT = FILTRE_CAT === +b.dataset.cat ? 0 : +b.dataset.cat;
  rendreCats(); rendreGrille();
});

// Retrouver une fiche dans la bibliotheque : on ne touche aux filtres que
// s ils la cachent, on va a son dossier, et la carte bat le temps qu on la
// repere. Depuis la timeline, le projet ferme se rouvre tout seul.
async function montrerDansLeProjet(id, pj) {
  if (!PAR_ID[id] && pj && !projetOuvert(pj)) {
    dire('opening “' + pj + '”…');
    try { await ouvrirProjetDisque(pj, true); } catch (err) {}
  }
  const f = PAR_ID[id];
  if (!f) {
    dire(pj ? 'not found in “' + pj + '” — rescan the project'
            : 'this block comes from a project that is not open', true);
    return;
  }
  if (!correspond(f)) {
    if (q) { q = ''; $('#q').value = ''; }
    if (favSeul) { favSeul = false; $('#bFav').classList.remove('on'); }
    if (FILTRE_CAT) { FILTRE_CAT = 0; rendreCats(); }
    dossierActif = clefDossier(f);
    appliquerProfil();
    rendreDossiers();
  }
  selection.clear();
  selection.add(f.id);
  rendreGrille();
  const el = grille.querySelector('[data-id="' + f.id + '"]');
  if (!el) { dire('“' + f.nom + '” is in the library', true); return; }
  el.scrollIntoView({block: 'center', inline: 'nearest'});
  el.classList.add('visee');
  setTimeout(() => el.classList.remove('visee'), 1800);
  dire('“' + f.nom + '” · ' + f.pj + (f.dossier ? ' / ' + f.dossier : ''));
}

// L explorateur du systeme, sur le fichier, deja selectionne. C est le
// serveur qui l ouvre : lui seul connait le chemin reel du rush.
async function montrerSurLeDisque(id, pj) {
  const f = PAR_ID[id];
  const projet = (f && f.pj) || pj || '';
  if (!projet) { dire('unknown project for this block', true); return; }
  try {
    const d = await api('api/reveler', {projet: projet, id: id});
    dire(d.manquant ? 'the file is gone — its folder is open'
                    : 'shown in the file browser');
  } catch (err) { dire(err.message, true); }
}

function memoriserOuverts() {
  pref.ecrire('projets', OUVERTS.map(p => p.nom).join('\t'));
  pref.ecrire('replies', [...REPLIES].join('\t'));
}

// Replier un projet cache ses dossiers dans la colonne, rien d autre : la
// bibliotheque continue d afficher ses clips et le menu deroulant les garde.
function plierProjet(nom) {
  REPLIES.has(nom) ? REPLIES.delete(nom) : REPLIES.add(nom);
  memoriserOuverts();
  rendreDossiers();
}

async function ouvrirProjetDisque(nom, discret) {
  const deja = projetOuvert(nom);
  if (deja) return deja;
  const d = await api('api/catalogue?projet=' + encodeURIComponent(nom));
  const p = {nom: nom, films: d.films || [], dossiers: d.dossiers || [],
             racine: d.racine_abs || '', besoinScan: !!d.besoin_scan,
             aScanner: d.a_scanner || 0};
  OUVERTS.push(p);
  refondre(); appliquerProfil(); rendre(); memoriserOuverts();
  if (!discret)
    dire('“' + nom + '” opened: ' +
      p.films.filter(f => !f.absent).length + ' clips' +
      (p.besoinScan ? ' — never scanned' : ''));
  return p;
}

// Fermer retire les rushes de la bibliotheque. Les blocs deja poses sur la
// timeline restent la, marques « ? » : on ne detruit pas un montage parce
// qu on a ferme un projet.
function fermerVraiment(nom) {
  // Les blocs gardent le projet et le fichier d ou ils viennent : c est ce
  // qu un montage enregistre contient deja, et c est ce qui permet de les
  // retrouver — « Show in project » — apres avoir referme leur projet.
  CLIPS.forEach(c => {
    const f = PAR_ID[c.film];
    if (f && f.pj === nom) { c.pj = nom; c.fichier = f.rel; }
  });
  OUVERTS = OUVERTS.filter(x => x.nom !== nom);
  if (dossierActif && dossierActif.split('/')[0] === nom) dossierActif = null;
  selection.clear();
  refondre(); appliquerProfil(); rendre(); rendreTimeline(); memoriserOuverts();
  rafraichirProjets();
  dire('“' + nom + '” closed');
}

// Recopie des rushes d un projet dans un autre, puis fait suivre les blocs du
// montage : ils pointent les copies, le montage ne depend plus de la source.
async function copierRushesVers(source, cible, ids, afficher) {
  const suivi = setInterval(async () => {
    try {
      const e = await api('api/import_etat');
      if (e.etat === 'encours' && afficher)
        afficher(e.fait + '/' + e.total + (e.nom ? ' · ' + e.nom : ''));
    } catch (err) {}
  }, 900);
  try {
    const r = await api('api/importer',
      {projet: cible, source: source, ids: ids});
    const p = projetOuvert(cible);
    if (p) { p.films = r.films; p.dossiers = r.dossiers; }
    refondre();
    let bouges = 0;
    CLIPS.forEach(c => {
      const neuf = r.corresp[c.film];
      if (!neuf) return;
      c.film = neuf; c.pj = cible; bouges++;
      // le lecteur en memoire pointe encore l ancien fichier : on le jette
      const v = POOL.get(c.uid);
      if (v) { v.pause(); v.removeAttribute('src'); v.load(); POOL.delete(c.uid); }
    });
    if (bouges) modifie = true;
    return {ok: true, bouges: bouges, r: r};
  } catch (err) {
    return {ok: false, message: err.message};
  } finally {
    clearInterval(suivi);
  }
}

async function fermerProjet(nom) {
  if (!projetOuvert(nom)) return;
  const concernes = CLIPS.filter(c => (PAR_ID[c.film] || {}).pj === nom);
  if (!concernes.length) { fermerVraiment(nom); return; }
  const ids = [...new Set(concernes.map(c => c.film))];
  // Ou recopier ? Dans le projet du montage, s il n est pas celui qu on ferme ;
  // sinon dans le premier autre projet ouvert.
  let cible = (PROJET.pj && PROJET.pj !== nom && projetOuvert(PROJET.pj))
    ? PROJET.pj : '';
  if (!cible) {
    const autre = OUVERTS.find(p => p.nom !== nom);
    cible = autre ? autre.nom : '';
  }
  const go = ids.reduce((t, i) => t + ((PAR_ID[i] || {}).m || 0), 0) / 1024;
  const b = $('#boite');
  b.innerHTML = '<h3>Close “' + nom + '”</h3>' +
    '<div style="font-size:12px;line-height:1.55">The current sequence uses <b>' +
    concernes.length + ' block' + (concernes.length > 1 ? 's' : '') +
    '</b> coming from this project — ' + ids.length + ' rush' +
    (ids.length > 1 ? 'es' : '') + ', ' + go.toFixed(2) + ' GB.<br>' +
    (cible
      ? 'I can copy them into <b>' + cible + '</b>: the blocks will follow ' +
        'the copies, the sequence stays playable and the project becomes self-contained.'
      : 'No other project is open: I cannot copy the rushes across. ' +
        'The blocks stay on the timeline but will no longer play.') +
    '</div>' +
    '<div style="margin-top:16px;display:flex;gap:8px;justify-content:flex-end">' +
    '<button id="fAnnule">Cancel</button>' +
    '<button id="fSec">Close without copying</button>' +
    (cible ? '<button id="fCopie" class="on">Copy into ' + cible +
      ', then close</button>' : '') + '</div>';
  $('#voile').className = 'on';
  $('#fAnnule').onclick = () => $('#voile').className = '';
  $('#fSec').onclick = () => { $('#voile').className = ''; fermerVraiment(nom); };
  if (cible) $('#fCopie').onclick = async () => {
    const bt = $('#fCopie');
    [bt, $('#fSec'), $('#fAnnule')].forEach(x => x.disabled = true);
    bt.textContent = 'copying…';
    const res = await copierRushesVers(nom, cible, ids,
      t => bt.textContent = 'copie ' + t);
    $('#voile').className = '';
    if (!res.ok) { dire('could not copy — ' + res.message, true); return; }
    fermerVraiment(nom);
    const nb = (res.r.importes || []).length;
    const ref = (res.r.refus || []).length;
    dire(nb + ' rush' + (nb > 1 ? 'es' : '') + ' copied' +
      ' in ' + cible + '/' + res.r.dossier + ' · ' + res.bouges +
      ' block(s) repointed' +
      (ref ? ' · ' + ref + ' refused' : ''), ref > 0);
  };
}

async function scannerProjet(nom) {
  const p = projetOuvert(nom);
  if (!p) { dire('pick a project in the column first', true); return; }
  let btns = $$('[data-scanner="' + nom + '"]').concat([$('#bScan')]);
  btns.forEach(b => { if (b) { b.disabled = true; b.textContent = 'scanning…'; } });
  // Combien manquaient avant : si ce scan en trouve de nouveaux (des doublons
  // effaces, par exemple), on propose tout de suite de les retirer.
  const manquaientAvant = (p.films || []).filter(f => f.absent).length;
  let disparus = 0;
  const suivi = setInterval(async () => {
    try {
      const e = await api('api/scan_etat');
      if (e.etat === 'encours' && e.projet === nom)
        btns.forEach(b => { if (b) b.textContent = e.fait + '/' + e.total; });
    } catch (err) {}
  }, 1200);
  try {
    // Un scan peut durer des minutes sur un disque reseau : pas de limite.
    const d = await api('api/scan?projet=' + encodeURIComponent(nom), null, 0);
    p.films = d.films || []; p.dossiers = d.dossiers || [];
    p.racine = d.racine_abs || p.racine;
    p.besoinScan = false; p.aScanner = 0;
    refondre();
    dire('scanning “' + nom + '” finished: ' +
      p.films.filter(f => !f.absent).length + ' clips');
    disparus = p.films.filter(f => f.absent).length - manquaientAvant;
  } catch (err) { dire('scan failed — ' + err.message, true); }
  clearInterval(suivi);
  const b = $('#bScan'); b.disabled = false; b.textContent = 'Rescan';
  rendre();
  if (PURGE && disparus > 0) {
    const tous = p.films.filter(f => f.absent).length;
    setTimeout(() => retirerManquants([nom], disparus +
      (disparus > 1 ? ' clips have' : ' clip has') + ' disappeared from disk ' +
      'since the last scan' + (tous > disparus ? ' (' + tous +
      ' missing in all)' : '') + '.'), 150);
  }
}

async function sitesVoisins() {

// Ce qu un dossier contient, en clair : « 12 videos · 3 sounds · 40 images ».
function contenuDossier(x) {
  const bouts = [];
  if (x.videos) bouts.push(x.videos + (x.videos > 1 ? ' videos' : ' video'));
  if (x.sons) bouts.push(x.sons + (x.sons > 1 ? ' sounds' : ' sound'));
  if (x.images) bouts.push(x.images + (x.images > 1 ? ' images' : ' image'));
  if (!bouts.length) return 'no media';
  return (x.beaucoup ? 'over ' : '') + bouts.join(' · ');
}

          (p.aScanner || 0) + ' media files' : ''), true);

  const sc = e.target.closest('[data-scanner]');
  if (sc) { e.stopPropagation(); scannerProjet(sc.dataset.scanner); return; }
  const mt = e.target.closest('[data-montages]');
  if (mt) {
    const n = mt.dataset.montages;
    MONT_OUVERTS.has(n) ? MONT_OUVERTS.delete(n) : MONT_OUVERTS.add(n);
    pref.ecrire('montOuverts', [...MONT_OUVERTS].join('\t'));
    rendreDossiers();
    return;
  }
  const mo = e.target.closest('[data-mont]');
  if (mo && e.target.tagName !== 'INPUT') {
    ouvrirMontage(mo.dataset.pj, mo.dataset.mnom);
    return;
  }
  const d = e.target.closest('[data-clef]');
  if (!d || e.target.tagName === 'INPUT') return;
  dossierActif = d.dataset.clef === '' ? null : d.dataset.clef;
  appliquerProfil(); rendre();
});
colDos.addEventListener('dblclick', e => {
  const m = e.target.closest('[data-mont]');
  if (m) { editerMontage(m); return; }
  const d = e.target.closest('.dos');
  if (d && d.dataset.d) editerDossier(d);
});

// ---- les montages du projet, depuis la colonne -------------------------
// La derniere sequence travaillee. Sans elle, la page s ouvre sur une
// timeline vide et RIEN ne dit que le travail est sauve : il est bien sur le
// serveur, mais on croit l avoir perdu — ce qui est exactement ce qui est
// arrive le 12/09.
function noterDernier(pj, nom) {
  if (pj && nom) pref.ecrire('dernier', pj + '\t' + nom);
}

async function rouvrirDernier() {
  const v = (pref.lire('dernier', '') || '').split('\t');
  if (v.length !== 2 || !v[0] || !v[1]) return;
  const [pj, nom] = v;
  if (!projetOuvert(pj)) return;
  const l = (typeof MONTAGES !== 'undefined' ? MONTAGES : []);
  if (!l.some(m => m.projet === pj && m.nom === nom)) return;
  try {
    const d = await api('api/montage?projet=' + encodeURIComponent(pj) +
      '&nom=' + encodeURIComponent(nom));
    await chargerProjet(d.montage, d.nom, d.projet);
    dire('“' + nom + '” reopened');
  } catch (err) {
    // Une sequence effacee entre deux sessions ne doit pas gener l ouverture.
  }
}

async function ouvrirMontage(pj, nom) {
  if (nom === projetNom && pj === PROJET.pj) {
    dire('“' + nom + '” is already open'); return;
  }
  await assurerSauvegarde();
  try {
    const d = await api('api/montage?projet=' + encodeURIComponent(pj) +
      '&nom=' + encodeURIComponent(nom));
    await chargerProjet(d.montage, d.nom, d.projet);
    noterDernier(d.projet || pj, d.nom || nom);
  } catch (err) { dire('could not open — ' + err.message, true); }
}

// « Ajouter » plutot qu « ouvrir » : un simple clic sur la ligne ouvre deja le
// montage, donc le menu sert a en assembler plusieurs. Les blocs viennent se
// poser a la suite de ce qui est deja sur la timeline, sur les memes pistes —
// creees si elles manquent. Rien n est ecrase, et Ctrl+Z defait l ajout d un
// coup.
async function ajouterMontage(pj, nom) {
  let d;
  try {
    d = await api('api/montage?projet=' + encodeURIComponent(pj) +
      '&nom=' + encodeURIComponent(nom));
  } catch (err) { dire('could not read — ' + err.message, true); return; }
  const p = d && d.montage;
  if (!p || !p.clips || !p.clips.length) {
    dire('“' + nom + '” is empty — nothing to add'); return;
  }
  // Timeline vide : ajouter revient a ouvrir, autant le faire proprement
  // (format, cadence, reperes I/O et nom du montage suivent).
  if (!CLIPS.length) {
    await assurerSauvegarde();
    await chargerProjet(p, d.nom, d.projet);
    return;
  }
  // Les projets dont il a besoin, sinon la moitie des plans arriverait vide.
  const besoins = [...new Set((p.projets || [])
    .concat(p.clips.map(c => c.pj)).concat([p.hote, pj]).filter(Boolean))];
  const absents = [];
  for (const x of besoins) {
    if (projetOuvert(x)) continue;
    try { await ouvrirProjetDisque(x, true); }
    catch (err) { absents.push(x); }
  }
  memoriser();
  const parRel = {};
  FILMS.forEach(f => parRel[f.pj + '|' + f.rel] = f.id);
  // Une piste qui manque est creee, une piste existante est reutilisee : on
  // ne double pas les pistes a chaque ajout.
  const neuves = [];
  const assurerPiste = (id, modele) => {
    const pid = id || 'V1';
    if (piste(pid)) return pid;
    const type = (modele && modele.type) ||
      (String(pid).charAt(0).toUpperCase() === 'A' ? 'a' : 'v');
    const np = {id: pid, type: type, mute: false, solo: false};
    if (modele && modele.vol !== undefined) np.vol = modele.vol;
    PISTES.push(np);
    neuves.push(pid);
    return pid;
  };
  (p.pistes || []).forEach(x => assurerPiste(x.id, x));
  const depart = dureeTotale();
  const liens = {};
  let perdus = 0, n = 0;
  p.clips.forEach(c => {
    const q = {};
    for (const k in c) if (k[0] !== '_') q[k] = c[k];
    if (!q.genre) {
      let film = q.film;
      if (!PAR_ID[film])
        film = parRel[(c.pj || p.hote || pj || '') + '|' + c.fichier] || null;
      q.film = film;
      // Un plan dont le projet est absent reste sur la timeline, marque « ? » :
      // on ne mutile pas un montage parce qu un dossier n est pas la.
      if (!film) perdus++;
    }
    q.uid = uidSuivant++;
    q.t0 = (+q.t0 || 0) + depart;
    q.vitesse = q.vitesse || 1;
    if (q.vitesse < 0) { q.rev = !q.rev; q.vitesse = -q.vitesse; }
    q.rev = !!q.rev;
    q.couleur = q.couleur || 0;
    q.opac = q.opac === undefined ? 1 : q.opac;
    q.fi = q.fi || 0; q.fo = q.fo || 0;
    q.piste = assurerPiste(q.piste);
    // Liens renumerotes : les paires image+son du montage ajoute restent
    // appariees entre elles, sans se coller a celles deja en place.
    if (c.lien) {
      if (!liens[c.lien]) liens[c.lien] = lienLibre();
      q.lien = liens[c.lien];
    } else {
      q.lien = null;
    }
    CLIPS.push(q);
    n++;
  });
  modifie = true;
  rendreTimeline(); resynchroniser(true);
  dire(n + ' block' + (n > 1 ? 's' : '') + ' of “' + nom + '” added' +
    (n > 1 ? 's' : '') + ' at ' + tc(depart) +
    (neuves.length ? ' · track' + (neuves.length > 1 ? 's ' : ' ') +
      neuves.join(' ') + ' created' + (neuves.length > 1 ? 's' : '') : '') +
    (perdus ? ' — ' + perdus + ' shot(s) not found' : '') +
    (absents.length ? ', project ' + absents.join(' and ') + ' missing from disk'
                    : ''), perdus > 0 || absents.length > 0);
}

function editerMontage(el) {
  const pj = el.dataset.pj, ancien = el.dataset.mnom, b = el.querySelector('b');
  if (!b) return;
  const inp = document.createElement('input');
  inp.value = ancien; inp.style.width = '100%';
  b.replaceWith(inp); inp.focus(); inp.select();
  let clos = false;
  const fermer = async valider => {
    if (clos) return; clos = true;
    const neuf = inp.value.trim();
    if (valider && neuf && neuf !== ancien) {
      try {
        const r = await api('api/montage/renommer',
          {projet: pj, ancien: ancien, nom: neuf});
        // Si c est le montage ouvert, il change de nom sous nos pieds.
        if (projetNom === ancien && PROJET.pj === pj) {
          projetNom = r.nom; PROJET.nom = r.nom;
          noterDernier(pj, r.nom);
          FERMES.delete(pj + '|' + ancien); noterFermes();
          rendreTimeline();
        }
        dire('sequence renamed: ' + r.nom);
      } catch (err) { dire('rename refused — ' + err.message, true); }
    }
    rafraichirProjets();
  };
  inp.addEventListener('keydown', ev => {
    if (ev.key === 'Enter') fermer(true);
    if (ev.key === 'Escape') fermer(false);
    ev.stopPropagation();
  });
  inp.addEventListener('blur', () => fermer(true));
}

// Renommage en place d une ligne de dossier. Le nom est change sur le disque ;
// les fiches du dossier et de ses sous-dossiers suivent.
// ---- les trois gestes sur un dossier virtuel ---------------------------
// Un dossier virtuel n est qu une chaine dans une liste. Le renommer, c est
// reecrire cette chaine partout ou elle sert — y compris pour ses
// sous-dossiers, qui la portent en prefixe.
// Les vrais sous-dossiers d un projet, tels que le catalogue les connait
// (« dossier » de chaque fiche), parents compris.
function sousDossiersReels(pj) {
  const p = projetOuvert(pj);
  const s = new Set();
  ((p && p.films) || []).forEach(f => {
    if (f.absent || !f.dossier) return;
    const bouts = String(f.dossier).split('/');
    for (let i = 1; i <= bouts.length; i++) s.add(bouts.slice(0, i).join('/'));
  });
  return [...s].sort();
}

// Les limites du serveur pour un dossier virtuel (_chemin_virtuel) : cinq
// niveaux, soixante caracteres par nom. Au-dela il les jetterait sans rien
// dire ; on prefere le dire.
const dossierVirtuelPossible = d => {
  const b = String(d).split('/');
  return b.length <= 5 && b.every(x => x.trim() && x.trim().length <= 60);
};

// « Import subfolders as folders » : les vrais sous-dossiers deviennent des
// dossiers virtuels, et chaque rush encore NON RANGE va dans celui de son
// vrai dossier. Ce qu on avait deja range a la main ne bouge pas.
async function importerSousDossiers(pj) {
  const p = projetOuvert(pj);
  const reels = sousDossiersReels(pj);
  if (!p || !reels.length) { dire('no subfolder in “' + pj + '”'); return; }
  // Sans son rangement charge, on repartirait d un rangement vide et on
  // ecraserait celui du disque.
  if (!RANGEMENTS[pj]) await chargerRangement(pj);
  const bons = reels.filter(dossierVirtuelPossible);
  const refuses = reels.length - bons.length;
  const r = rangementDe(pj);
  const avant = new Set(r.dossiers);
  const neufs = bons.filter(d => !avant.has(d));
  if (r.dossiers.length + neufs.length > 300) {
    dire('too many folders — the arrangement holds 300 at most', true);
    return;
  }
  const ou = Object.assign({}, r.ou);
  const garde = new Set(bons);
  let ranges = 0, laisses = 0;
  p.films.forEach(f => {
    if (f.absent || !f.dossier || !garde.has(f.dossier)) return;
    if (ou[f.id]) { if (ou[f.id] !== f.dossier) laisses++; return; }
    ou[f.id] = f.dossier;
    ranges++;
  });
  r.dossiers = [...new Set(r.dossiers.concat(bons))];
  r.ou = ou;
  await enregistrerRangement(pj);
  // On montre le resultat : la vue « My folders », sur ce projet.
  if (VUE !== 'rangement') await basculerVue('rangement');
  dossierActif = pj;
  refondre(); appliquerProfil(); rendre();
  dire(neufs.length + ' folder' + (neufs.length > 1 ? 's' : '') + ' created, ' +
       ranges + ' clip' + (ranges > 1 ? 's' : '') + ' filed' +
       (laisses ? ', ' + laisses + ' already filed elsewhere, left there' : '') +
       (refuses ? ' — ' + refuses + ' folder(s) too deep or with too long a ' +
        'name, left out' : ''));
}

function creerDossierVirtuel(pj, parent, nom) {
  const p = String(nom).trim().replace(/[\/\\:*?"<>|]/g, '-');
  if (!p) return;
  const plein = parent ? parent + '/' + p : p;
  const r = rangementDe(pj);
  if (r.dossiers.includes(plein)) { dire('this folder already exists', true); return; }
  r.dossiers = [...r.dossiers, plein];
  enregistrerRangement(pj).then(() => { refondre(); rendre(); });
  dire('folder created: ' + plein);
}

async function renommerDossierVirtuel(pj, ancien, neuf) {
  const p = String(neuf).trim().replace(/[\/\\:*?"<>|]/g, '-');
  if (!p || p === ancien) return;
  const bouts = ancien.split('/');
  bouts[bouts.length - 1] = p;
  const cible = bouts.join('/');
  const r = rangementDe(pj);
  if (r.dossiers.includes(cible)) { dire('this folder already exists', true); return; }
  const dedans = x => x === ancien || x.startsWith(ancien + '/');
  const change = x => cible + x.slice(ancien.length);
  r.dossiers = r.dossiers.map(x => dedans(x) ? change(x) : x);
  for (const id in r.ou) if (dedans(r.ou[id])) r.ou[id] = change(r.ou[id]);
  if (dossierActif === pj + '/' + ancien) dossierActif = pj + '/' + cible;
  await enregistrerRangement(pj);
  refondre();
  dire('folder renamed: ' + cible);
}

// Effacer un dossier virtuel ne perd RIEN : les rushes qu il contenait
// redeviennent simplement non ranges. C est pour ca qu il n y a pas de
// confirmation — il n y a rien a regretter.
async function effacerDossierVirtuel(pj, rel) {
  if (!rel || rel === NONRANGE) return;
  const r = rangementDe(pj);
  const dedans = x => x === rel || x.startsWith(rel + '/');
  let libres = 0;
  for (const id in r.ou) if (dedans(r.ou[id])) { delete r.ou[id]; libres++; }
  r.dossiers = r.dossiers.filter(x => !dedans(x));
  if (String(dossierActif).startsWith(pj + '/' + rel)) dossierActif = null;
  await enregistrerRangement(pj);
  refondre(); rendre();
  dire('folder removed · ' + libres + ' rush' + (libres > 1 ? 'es' : '') +
    ' back to not filed');
}

function editerDossier(d) {
  const pj = d.dataset.pj, ancien = d.dataset.d, b = d.querySelector('b');
  if (!b) return;
  const inp = document.createElement('input');
  inp.value = ancien; inp.style.width = '100%';
  b.replaceWith(inp); inp.focus(); inp.select();
  let clos = false;
  const fermer = async valider => {
    if (clos) return; clos = true;
    const neuf = inp.value.trim();
    if (valider && neuf && neuf !== ancien && VUE === 'rangement') {
      await renommerDossierVirtuel(pj, ancien, neuf);
      rendre();
      return;
    }
    if (valider && neuf && neuf !== ancien) {
      try {
        const r = await api('api/dossier/renommer',
          {projet: pj, ancien: ancien, nom: neuf});
        // L ordre choisi a la poignee suit le nouveau nom, sous-dossiers compris.
        try {
          const tous = JSON.parse(pref.lire('ordreSrc', '{}')) || {};
          if (Array.isArray(tous[pj])) {
            const bouts = ancien.split('/');
            bouts[bouts.length - 1] = neuf;
            const cible = bouts.join('/');
            tous[pj] = tous[pj].map(x => x === ancien ? cible
              : x.startsWith(ancien + '/') ? cible + x.slice(ancien.length) : x);
            pref.ecrire('ordreSrc', JSON.stringify(tous));
          }
        } catch (e) {}
        const p = projetOuvert(pj);
        if (p) { p.films = r.films; p.dossiers = r.dossiers; refondre(); }
        if (dossierActif === pj + '/' + ancien) dossierActif = pj + '/' + neuf;
        dire('folder renamed: ' + neuf);
      } catch (err) { dire('rename refused — ' + err.message, true); }
    }
    rendre();
  };
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter') fermer(true);
    if (e.key === 'Escape') fermer(false);
    e.stopPropagation();
  });
  inp.addEventListener('blur', () => fermer(true));
}

// ---- effacer un dossier -------------------------------------------------
// Jamais de perte : un dossier vide est retire, un dossier qui contient
// quelque chose part dans <projet>/_corbeille/ et « Annuler disque » le ramene.
async function effacerDossier(pj, rel) {
  const p = projetOuvert(pj);
  if (!p) return;
  const dans = f => f.pj === pj &&
    (f.dossier === rel || String(f.dossier).startsWith(rel + '/'));
  const clips = FILMS.filter(f => dans(f) && !f.absent).length;
  const blocs = CLIPS.filter(c => {
    const f = PAR_ID[c.film];
    return f && dans(f);
  }).length;
  const b = $('#boite');
  b.innerHTML = '<h3>Delete “' + rel + '”</h3>' +
    '<div style="font-size:12px;line-height:1.55">' +
    (clips
      ? 'This folder holds <b>' + clips + ' clip' + (clips > 1 ? 's' : '') +
        '</b>. It goes to <b>' + pj + '/_corbeille/</b>: it leaves the ' +
        'library, <b>nothing is deleted from disk</b>, and “Undo ' +
        'on disk” brings it back.'
      : 'This folder holds no file: it is removed from disk.') +
    (blocs ? '<br><br><b style="color:var(--rouge)">' + blocs + ' block' +
      (blocs > 1 ? 's' : '') + ' of the current sequence</b> come' +
      (blocs > 1 ? '' : 's') + ' from this folder: ' + (blocs > 1 ? 'they' : 'it') +
      ' stay' + (blocs > 1 ? '' : 's') + ' on the timeline but will no longer ' +
      'be playable.' : '') +
    '</div>' +
    '<div style="margin-top:16px;display:flex;gap:8px;justify-content:flex-end">' +
    '<button id="eAnnule">Cancel</button>' +
    '<button id="eOk" class="on">' +
    (clips ? 'Move to trash' : 'Delete') + '</button></div>';
  $('#voile').className = 'on';
  $('#eAnnule').onclick = () => $('#voile').className = '';
  $('#eOk').onclick = async () => {
    const bt = $('#eOk');
    bt.disabled = true; bt.textContent = 'running…';
    try {
      const r = await api('api/dossier/effacer', {projet: pj, dossier: rel});
      p.films = r.films; p.dossiers = r.dossiers;
      if (dossierActif === pj + '/' + rel ||
          String(dossierActif).startsWith(pj + '/' + rel + '/'))
        dossierActif = pj;
      selection.clear();
      refondre(); appliquerProfil(); rendre(); rendreTimeline();
      // Rien a dire : la boite a annonce ce qui allait se passer, et le
      // dossier vient de disparaitre de la colonne. Seuls les echecs parlent.
    } catch (err) {
      // L operation a pu passer malgre le silence : on relit le projet plutot
      // que de laisser la colonne afficher un dossier qui n existe plus.
      try {
        const c = await api('api/catalogue?projet=' + encodeURIComponent(pj));
        p.films = c.films; p.dossiers = c.dossiers;
        refondre(); appliquerProfil(); rendre(); rendreTimeline();
      } catch (e2) { /* tant pis : on ne bloque pas pour autant */ }
      dire('delete — ' + err.message, true);
    } finally {
      $('#voile').className = '';
    }
  };
}

const cibles = () => $$('.dos, .pjt');

// ---- la poignee : changer l ordre des projets et des dossiers ------------
// Un projet se pose entre deux projets ; un dossier entre deux freres (meme
// projet, meme parent) et emporte ses sous-dossiers. Les projets : l ordre
// des projets ouverts, deja memorise par ce navigateur. Les dossiers « My
// folders » : l ordre de la liste du rangement, enregistre avec lui. Les vrais
// dossiers (vue Source) : une preference de ce navigateur.
let GLISSE = null;
const parentDe = d => d.lastIndexOf('/') < 0 ? '' : d.slice(0, d.lastIndexOf('/'));
function cibleOrdre(e) {
  if (!GLISSE) return null;
  const l = e.target.closest(GLISSE.genre === 'pjt' ? '.pjt' : '.dos');
  if (!l || !colDos.contains(l)) return null;
  if (GLISSE.genre === 'pjt') {
    const n = l.dataset.pj;
    if (!n || n === GLISSE.pj || estBibli(n) || estCaptures(n)) return null;
  } else {
    const d = l.dataset.d;
    if (l.dataset.pj !== GLISSE.pj || !d || d === NONRANGE || d === GLISSE.d ||
        l.dataset.mont || l.dataset.montages ||
        parentDe(d) !== parentDe(GLISSE.d)) return null;
  }
  const b = l.getBoundingClientRect();
  return {ligne: l, apres: e.clientY > b.top + b.height / 2};
}
function effacerMarques() {
  cibles().forEach(x => x.classList.remove('avant', 'apres', 'glisse', 'survol'));
}
// Deplace « quoi » juste avant ou juste apres « pres » dans une liste.
function deplacerDans(l, quoi, pres, apres) {
  const r = l.filter(x => x !== quoi);
  const i = r.indexOf(pres);
  if (i < 0) return l;
  r.splice(apres ? i + 1 : i, 0, quoi);
  return r;
}
colDos.addEventListener('dragstart', e => {
  const h = e.target.closest && e.target.closest('.poignee');
  if (!h) return;
  const l = h.closest('.pjt, .dos');
  GLISSE = {genre: h.dataset.ordre, pj: l.dataset.pj, d: l.dataset.d || ''};
  e.dataTransfer.setData('text/plain', JSON.stringify({type: 'ordre'}));
  e.dataTransfer.effectAllowed = 'move';
  try { e.dataTransfer.setDragImage(l, 12, 10); } catch (err) {}
  setTimeout(() => l.classList.add('glisse'), 0);
});
colDos.addEventListener('dragend', () => { GLISSE = null; effacerMarques(); });
async function deposerOrdre(c) {
  const g = GLISSE;
  GLISSE = null; effacerMarques();
  if (!c) return;
  if (g.genre === 'pjt') {
    const noms = deplacerDans(OUVERTS.map(p => p.nom), g.pj, c.ligne.dataset.pj, c.apres);
    OUVERTS.sort((a, b) => noms.indexOf(a.nom) - noms.indexOf(b.nom));
    memoriserOuverts();
    refondre(); rendre();
    return;
  }
  const pres = c.ligne.dataset.d;
  if (VUE === 'rangement') {
    const r = rangementDe(g.pj);
    r.dossiers = deplacerDans(r.dossiers, g.d, pres, c.apres);
    refondre(); rendre();
    await enregistrerRangement(g.pj);
    refondre(); rendre();
    return;
  }
  const p = projetOuvert(g.pj);
  if (!p) return;
  let tous = {};
  try { tous = JSON.parse(pref.lire('ordreSrc', '{}')) || {}; } catch (err) {}
  tous[g.pj] = deplacerDans(ordreSource(g.pj, p.dossiers || []), g.d, pres, c.apres);
  pref.ecrire('ordreSrc', JSON.stringify(tous));
  refondre(); rendre();
}

colDos.addEventListener('dragover', e => {
  if (GLISSE) {
    const c = cibleOrdre(e);
    cibles().forEach(x => x.classList.remove('avant', 'apres'));
    if (!c) return;
    e.preventDefault(); e.dataTransfer.dropEffect = 'move';
    c.ligne.classList.add(c.apres ? 'apres' : 'avant');
    return;
  }
  const d = e.target.closest('.dos, .pjt');
  if (!d) return;
  e.preventDefault(); e.dataTransfer.dropEffect = 'move';
  cibles().forEach(x => x.classList.toggle('survol', x === d));
});
colDos.addEventListener('dragleave', e => {
  if (!colDos.contains(e.relatedTarget))
    cibles().forEach(x => x.classList.remove('survol'));
});
colDos.addEventListener('drop', async e => {
  if (GLISSE) { e.preventDefault(); deposerOrdre(cibleOrdre(e)); return; }
  const d = e.target.closest('.dos, .pjt');
  cibles().forEach(x => x.classList.remove('survol'));
  if (!d || !d.dataset.pj) return;
  e.preventDefault();
  let charge;
  try { charge = JSON.parse(e.dataTransfer.getData('text/plain')); }
  catch (err) { return; }
  if (charge.type !== 'films') return;
  // EN RANGEMENT : on ne touche a aucun fichier, on note seulement dans
  // quelle etagere ce rush s affiche. Le meme geste qu au bureau, une
  // consequence entierement differente.
  if (VUE === 'rangement') {
    const pjv = d.dataset.pj;
    const cible = d.dataset.d || '';
    const r = rangementDe(pjv);
    let bouges = 0, etrangers = 0;
    charge.ids.forEach(i => {
      const f = PAR_ID[i];
      if (!f || f.pj !== pjv) { etrangers++; return; }
      if (!cible || cible === NONRANGE) delete r.ou[i];
      else r.ou[i] = cible;
      bouges++;
    });
    if (!bouges) {
      dire('those rushes belong to another project', true);
      return;
    }
    await enregistrerRangement(pjv);
    refondre(); rendre();
    dire(bouges + (bouges > 1 ? ' rushes' : ' rush') +
      (!cible || cible === NONRANGE ? ' unfiled' : ' filed in “' + cible + '”') +
      (etrangers ? ' · ' + etrangers + ' from another project left alone' : ''));
    return;
  }
  // On ne deplace pas un fichier d un projet vers un autre : ce serait sortir
  // un rush de son dossier de tournage. Les intrus sont signales, pas caches.
  const pj = d.dataset.pj;
  const bons = charge.ids.filter(i => (PAR_ID[i] || {}).pj === pj);
  const autres = charge.ids.length - bons.length;
  if (!bons.length) {
    dire('these clips belong to another project — filing stays ' +
      'inside a single project', true);
    return;
  }
  try {
    const r = await api('api/deplacer',
      {projet: pj, ids: bons, dossier: d.dataset.d});
    const p = projetOuvert(pj);
    if (p) { p.films = r.films; refondre(); }
    rendre();
    const n = r.deplaces.length;
    const queue = (autres ? ' · ' + autres + ' outside the project ignored' : '');
    if (r.refus.length) dire(n + ' moved, ' + r.refus.length + ' refused: ' +
      r.refus.map(x => x.nom + ' — ' + x.cause).join(' · ') + queue, true);
    else dire(n + (n > 1 ? ' clips moved' : ' clip moved') + queue, !!autres);
  } catch (err) { dire('move refused — ' + err.message, true); }
});

// Le « + » de la ligne du projet. Il vise CE projet : si le dossier ouvert
// appartient a un autre, il ne sert pas de parent — l ancien bouton du bas,
// lui, melangeait « projet courant » et « dossier actif ».
async function nouveauDossier(pj) {
  if (!pj) return;
  const dedans = dossierActif && dossierActif.indexOf('/') > 0 &&
    dossierActif.slice(0, dossierActif.indexOf('/')) === pj
    ? dossierActif.slice(pj.length + 1) : '';
  // En ligne ou en lecture seule, la vue Source ne peut pas creer de vrai
  // dossier : le « + » y cree un dossier « My folders » et bascule dans cette
  // vue, plutot que de disparaitre (David, 06/10 : « les dossiers ont perdu
  // leur + »).
  if (VUE !== 'rangement' && (ENLIGNE || LECTURE_SEULE) && RANGEABLE) {
    await basculerVue('rangement');
    const nom = prompt('New folder in “' + pj + '” (My folders):');
    if (nom) creerDossierVirtuel(pj, '', nom);
    return;

  if (VUE === 'rangement') {
    const parent = dedans === NONRANGE ? '' : dedans;
    const nom = prompt('New folder in “' + (parent || pj) + '” :');
    if (nom) creerDossierVirtuel(pj, parent, nom);
    return;
  }
  const nom = prompt('New folder in “' + (dedans || pj) + '” :');
  if (!nom) return;
  try {
    const r = await api('api/dossier/creer',
      {projet: pj, nom: nom, parent: dedans});
    const p = projetOuvert(pj);
    if (p) { p.dossiers = r.dossiers; refondre(); }
    rendre(); dire('folder created: ' + nom);
  } catch (err) { dire('create refused — ' + err.message, true); }
}

// « + Add rush » : le selecteur de Windows s ouvre dans le dossier choisi
// dans la colonne (le projet, ou son sous-dossier), et seuls les fichiers
// pris sont lus — un rescan relit tout le projet. Les fichiers doivent deja
// etre dans le dossier d un projet : rien n est copie ni deplace.
// ---- ⇅ Sync online (1.3.20) ------------------------------------------------
// Sequences et dossiers « My folders » passent dans les deux sens ; le serveur
// tranche (voir synchro_enligne). Le mot de passe va au serveur de bureau, qui
// ouvre la session sur le site et l oublie aussitot.
function boiteConnexionSite() {
  return new Promise(res => {
    const b = $('#boite');
    b.innerHTML = '<h3>Sign in to the website</h3>' +
      '<div style="font-size:12px;color:var(--sourd);margin-bottom:10px">' +
      echapHtml(SYNCHRO) + '</div>' +
      '<div style="display:flex;flex-direction:column;gap:8px">' +
      '<input id="syId" placeholder="name" autocomplete="username">' +
      '<input id="syMp" type="password" placeholder="password" ' +
      'autocomplete="current-password">' +
      '<div id="syMal" style="color:var(--rouge);font-size:12px;min-height:1em"></div>' +
      '<div style="display:flex;gap:8px;justify-content:flex-end">' +
      '<button id="syAnnule">Cancel</button>' +
      '<button id="syOk" class="on">Sign in and sync</button></div></div>';
    $('#voile').className = 'on';
    const fin = v => { $('#voile').className = ''; res(v); };
    $('#syAnnule').onclick = () => fin(false);
    const go = async () => {
      const id = $('#syId').value.trim(), mp = $('#syMp').value;
      if (!id || !mp) { $('#syMal').textContent = 'a name and a password'; return; }
      $('#syOk').disabled = true;
      try {
        const d = await api('api/enligne/connecter',
                            {jeton: JETON, identifiant: id, motdepasse: mp}, 60000);
        SYNCHRO_QUI = d.qui || id;
        fin(true);
      } catch (err) {
        $('#syMal').textContent = err.message;
        $('#syOk').disabled = false;
        $('#syMp').value = '';
        $('#syMp').focus();
      }
    };
    $('#syOk').onclick = go;
    $('#syMp').onkeydown = e => { if (e.key === 'Enter') go(); };
    $('#syId').onkeydown = e => { if (e.key === 'Enter') $('#syMp').focus(); };
    $('#syId').focus();
  });
}

async function synchroniser() {
  const b = $('#bSynchro');
  if (!SYNCHRO || b.disabled) return;
  if (!SYNCHRO_QUI && !(await boiteConnexionSite())) return;
  await assurerSauvegarde(true);
  b.disabled = true;
  const avant = b.textContent;
  b.textContent = '⇅ syncing…';
  try {
    let d;
    try {
      d = await api('api/enligne/synchro', {jeton: JETON}, 900000);
    } catch (err) {
      // La session du site a expire : on se reconnecte une fois.
      if (!/sign in|401|signed/i.test(err.message)) throw err;
      SYNCHRO_QUI = '';
      if (!(await boiteConnexionSite())) return;
      d = await api('api/enligne/synchro', {jeton: JETON}, 900000);
    }
    // La sequence ouverte vient d etre remplacee par celle du site : on la
    // recharge, sinon le prochain enregistrement l ecraserait.
    const ouverte = PROJET.pj && projetNom ? PROJET.pj + ' / ' + projetNom : '';
    if (ouverte && d.tires.includes(ouverte)) {
      try {
        const m = await api('api/montage?projet=' + encodeURIComponent(PROJET.pj) +
                            '&nom=' + encodeURIComponent(projetNom));
        await chargerProjet(m.montage, m.nom, m.projet);

    for (const p of OUVERTS) await chargerRangement(p.nom);
    refondre(); rendre();
    rafraichirProjets();
    rapportSynchro(d);
  } catch (err) {
    dire('sync — ' + err.message, true);
  } finally {
    b.disabled = false;
    b.textContent = avant;
  }
}

// Retirer les fiches MISSING : celles dont le fichier a disparu du disque.
// Un rescan les garde expres — un disque reseau debranche le temps d un scan
// ne doit rien effacer — : les retirer est donc un geste, demande ici. Le
// serveur refuse si aucun fichier du projet n est visible, et garde celles
// qu une sequence utilise encore. Les fichiers, eux, ne sont jamais touches.
async function retirerManquants(noms, raison) {
  const liste = OUVERTS.filter(p => (!noms || noms.includes(p.nom)) &&
    (p.films || []).some(f => f.absent));
  const n = liste.reduce((s, p) => s + p.films.filter(f => f.absent).length, 0);
  if (!n) { dire('no missing clip'); return; }
  if (!confirm((raison || (n + (n > 1 ? ' clips are' : ' clip is') +
      ' no longer on disk (deleted, or moved out of the library).')) +
      '\n\nRemove ' + (n > 1 ? 'them' : 'it') + ' from the library?\n' +
      'The files themselves are not touched. A clip still used in a ' +
      'sequence stays.')) return;
  const b = $('#bPurge');
  b.disabled = true; b.textContent = 'removing…';
  let retires = 0, gardes = 0, revenus = 0;
  const refus = [];
  for (const p of liste) {
    try {
      const d = await api('api/purger', {projet: p.nom});
      const restent = new Set((d.films || []).map(f => f.id));
      // Ce qui est parti ne doit plus trainer dans l etat de la page : une
      // selection, un rangement renvoye plus tard au serveur.
      for (const f of p.films) {
        if (restent.has(f.id)) continue;
        selection.delete(f.id);
        if (RANGEMENTS[p.nom]) delete RANGEMENTS[p.nom].ou[f.id];
      }
      p.films = d.films || p.films;
      p.dossiers = d.dossiers || p.dossiers;
      retires += d.retires || 0;
      gardes += (d.gardes || []).length;
      revenus += d.revenus || 0;
    } catch (err) { refus.push(p.nom + ': ' + err.message); }
  }
  b.disabled = false;
  refondre(); rendre();
  dire(retires + ' missing clip' + (retires > 1 ? 's' : '') + ' removed' +
    (gardes ? ' · ' + gardes + ' kept: still used in a sequence' : '') +
    (revenus ? ' · ' + revenus + ' back on disk: rescan to see them' : '') +
    (refus.length ? ' · ' + refus.join(' · ') : ''), refus.length > 0);
}
$('#bPurge').onclick = () => retirerManquants(null);

// Mettre a jour le PROGRAMME de la bibliotheque depuis GitHub. Le serveur
// compare, telecharge, verifie, sauvegarde ; rushes, sequences, marques et
// rangements ne sont jamais touches. Le nouveau programme prend effet au
// prochain lancement de la bibliotheque.
async function verifierMaj(silencieux) {
  const b = $('#bMaj');
  let r;
  try { r = await api('api/maj', null, 30000); }
  catch (err) {
    if (!silencieux) dire('update check failed — ' + err.message, true);
    return null;
  }
  const n = (r.a_faire || []).length;
  b.classList.toggle('dispo', n > 0);
  b.textContent = n ? 'Update ● ' + r.version_distante : 'Update';
  b.title = n ? 'version ' + r.version_distante + ' is available (this ' +
                'library: ' + r.version_locale + ')'
              : 'up to date — version ' + r.version_locale;
  return r;
}
$('#bMaj').onclick = async () => {
  const b = $('#bMaj');
  const avant = b.textContent;
  b.disabled = true; b.textContent = 'checking…';
  const r = await verifierMaj(false);
  b.disabled = false;
  if (!r) { b.textContent = avant; return; }
  const n = (r.a_faire || []).length;
  if (!n) {
    dire('up to date — version ' + r.version_locale +
      ((r.lanceurs_en_attente || []).length
        ? ' · launchers: update them with Library Editor' : ''));
    return;
  }
  if (!confirm('Version ' + r.version_distante + ' is available (this ' +
      'library: ' + r.version_locale + ').\n\nFiles to update: ' +
      r.a_faire.join(', ') + '\n' +
      ((r.modifies || []).length
        ? 'Kept as they are, modified by hand: ' + r.modifies.join(', ') + '\n' : '') +
      '\nUpdate now? Each replaced file is backed up first. Your rushes, ' +
      'sequences, marks and folders are not touched.')) return;
  b.disabled = true; b.textContent = 'updating…';
  try {
    const d = await api('api/maj', {appliquer: true}, 180000);
    b.classList.remove('dispo'); b.textContent = 'Relaunch to finish';
    alert('Updated to version ' + d.version + ' (' + d.faits.length +
      (d.faits.length > 1 ? ' files' : ' file') + ').\n\nClose this tab, ' +
      'then relaunch the library (LANCER-LA-BIBLIOTHEQUE) to use it.' +
      ((d.lanceurs_en_attente || []).length
        ? '\n\nThe launchers will be updated by Library Editor, library closed.' : ''));
  } catch (err) { dire('update failed — ' + err.message, true); b.textContent = avant; }
  b.disabled = false;
};
