<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>library &amp; edit table</title>
<style>
:root{--fond:#1a1917;--carte:#232220;--haut:#2c2a27;--encre:#e9e4da;
 --sourd:#8c877e;--orange:#d9532b;--trait:#34322e;--vert:#6a9b4a;--or:#e8b93a;
 --rouge:#a8302f;
 --c0:#4a4843;--c1:#a8302f;--c2:#c98a2b;--c3:#6a9b4a;--c4:#4a7fa8;--c5:#7a5a9b;
 --wMoni:430px;--wRegl:236px;--hFooter:270px;--wDeck:250px;--wAside:196px;
 --vign:206px}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--fond);color:var(--encre);overflow:hidden;
 font:13px/1.5 "Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;
 user-select:none}
button,input,select{font:inherit;color:var(--encre);background:var(--carte);
 border:1px solid var(--trait);border-radius:4px;padding:5px 10px}
button{cursor:pointer}button:hover{border-color:var(--sourd)}
button.on{background:var(--orange);border-color:var(--orange);color:#fff}
button:disabled{opacity:.4;cursor:default}
input{min-width:120px}
select{padding:4px 6px}
.mono{font-family:ui-monospace,Consolas,monospace}
.pousse{margin-left:auto}

/* poignées de redimensionnement */
.rz{flex:0 0 8px;background:transparent;position:relative;z-index:8}
.rz:hover,.rz.actif{background:var(--orange)}
.rz::after{content:"";position:absolute;background:var(--trait);border-radius:2px}
.rz.vert::after{top:50%;left:3px;width:2px;height:28px;margin-top:-14px}
.rz.horiz::after{left:50%;top:3px;height:2px;width:28px;margin-left:-14px}
.rz:hover::after,.rz.actif::after{background:#fff}
.rz.vert{cursor:col-resize}
.rz.horiz{flex:0 0 8px;height:8px;width:100%;cursor:row-resize}

header{flex:0 0 auto;border-bottom:1px solid var(--trait);
 padding:8px 13px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
h1{margin:0;font-size:13px;letter-spacing:.14em;text-transform:uppercase;
 white-space:nowrap}
h1 small{color:var(--sourd);letter-spacing:.05em;font-weight:400;
 text-transform:none;margin-left:7px;font-size:11px}
/* Le nom de la bibliotheque — le dossier ou elle a ete creee — au-dessus des
   projets ouverts : on sait toujours dans quelle bibliotheque on travaille. */
#biblio{display:block;font-size:11px;letter-spacing:.18em;color:var(--or);
 margin-bottom:2px}
#biblio:empty{display:none}
.modes{display:flex;border:1px solid var(--trait);border-radius:5px;overflow:hidden}
.modes button{border:0;border-radius:0;padding:5px 13px}
#selDossier{display:none;max-width:190px}
body.edit #selDossier{display:inline-block}
body.edit .rushOnly{display:none}
#tailleVign{min-width:74px;width:74px}

main{flex:1 1 auto;display:flex;min-height:0}
aside{flex:0 0 var(--wAside);border-right:1px solid var(--trait);overflow-y:auto;
 padding:9px 7px 24px;min-width:120px}
body.edit aside{display:none}
body.edit [data-rz="aside"]{display:none}
.dos{padding:5px 9px;border-radius:4px;cursor:pointer;display:flex;
 justify-content:space-between;gap:8px;align-items:center;margin-bottom:1px}
.dos:hover{background:var(--carte)}
.dos.on{background:var(--orange);color:#fff}
.dos.survol{outline:2px dashed var(--orange);outline-offset:-2px;background:var(--carte)}
.dos b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dos i{font-style:normal;color:var(--sourd);font-size:11px;flex:0 0 auto}
.dos.on i{color:#fff9}
/* Colonne a deux niveaux : l en-tete d un projet ouvert, puis ses dossiers. */
.pjt .chev{flex:0 0 auto;width:13px;text-align:center;font-size:9px;
 color:var(--sourd);cursor:pointer;user-select:none;line-height:1}
.pjt .chev:hover{color:var(--encre)}
.pjt.on .chev{color:#fff9}
.pjt.on .chev:hover{color:#fff}
.pjt{display:flex;gap:6px;align-items:center;padding:6px 9px;margin-top:9px;
 border-radius:4px;cursor:pointer;border:1px solid var(--trait);background:#22242a}
.pjt:hover{border-color:var(--orange)}
.pjt.on{background:var(--orange);border-color:var(--orange);color:#fff}
.pjt b{flex:1;font-weight:600;font-size:12px;overflow:hidden;
 text-overflow:ellipsis;white-space:nowrap}
.pjt i{font-style:normal;color:var(--sourd);font-size:11px;flex:0 0 auto}
.pjt.on i{color:#fff9}
.pjt .x{background:none;border:0;color:var(--sourd);cursor:pointer;
 font-size:15px;line-height:1;padding:0 1px;flex:0 0 auto}
.pjt .x:hover{color:var(--rouge)}
.pjt.on .x{color:#fff9}
.pjt.on .x:hover{color:#fff}
.pjt.survol{outline:2px dashed var(--orange);outline-offset:-2px}
.dos{margin-left:12px}
/* Les montages du projet : premiere ligne sous l en-tete, couleur a part. */
.dos.montages{margin-top:5px;background:#2b2118;border:1px solid #6b5322;
 color:var(--or)}
.dos.montages:hover{background:#362a1e;border-color:var(--or)}
.dos.montages b{color:var(--or);font-weight:600}
.dos.montages i{color:var(--or);opacity:.8}
.dos.montages .chev{flex:0 0 auto;width:12px;text-align:center;font-size:9px;
 line-height:1}
.dos.mont{margin-left:26px;font-size:11px}
.dos.mont b{font-weight:400}
.dos.mont.on{background:var(--or);color:#1a1917}
.dos.mont.on b{color:#1a1917}
.dosVide{padding:2px 9px 6px 26px;font-size:10px;color:var(--sourd)}
.aScan{padding:3px 9px 6px 21px;font-size:11px;color:var(--sourd);
 display:flex;gap:6px;align-items:center}
.aScan button{font-size:11px;padding:2px 7px}
.addPj{width:100%;margin-top:11px}
.titre-col{font-size:10px;letter-spacing:.14em;text-transform:uppercase;
 color:var(--sourd);margin:3px 0 6px;padding:0 9px}

#grille{flex:1 1 auto;overflow-y:auto;padding:11px 12px 30px;display:grid;
 grid-template-columns:repeat(auto-fill,var(--vign));gap:9px;
 align-content:start;align-items:start;justify-content:start}
body.edit #grille{flex:0 0 var(--wDeck);border-right:1px solid var(--trait)}
/* Surtout PAS overflow:hidden ici : un element de grille dont le debordement
   est masque voit sa contribution de hauteur s effondrer, la ligne se calcule
   a quelques pixels et les cartes se chevauchent en bandes ecrasees.
   Le rognage se fait sur .media, qui a une hauteur explicite. */
.c{background:var(--carte);border:1px solid var(--trait);border-radius:5px;
 position:relative}
.c:hover{border-color:var(--sourd)}
.c.sel{border-color:var(--orange);box-shadow:0 0 0 1px var(--orange)}
.c.absent{opacity:.4}
#bMaj.dispo{background:var(--orange);border-color:var(--orange);color:#fff}
/* Hauteur en pixels, jamais en aspect-ratio : dans une grille, une hauteur
   deduite d un ratio ne participe pas au calcul de la ligne tant que l image
   n est pas chargee, et la carte s ecrase a une dizaine de pixels. */
.c .media{position:relative;background:#000;height:calc(var(--vign)*9/16);
 cursor:grab;overflow:hidden;border-radius:4px 4px 0 0}
.c .etiq{position:absolute;left:0;right:0;bottom:0;height:5px;z-index:2;
 box-shadow:0 -1px 3px #0008}
.c .media img,.c .media video{width:100%;height:100%;display:block;
 object-fit:cover;background:#000}
body.forme-carre .c .media{height:var(--vign)}
body.forme-rond{--rayon:50%}
body.forme-rond .c{background:none;border:0;text-align:center}
body.forme-rond .c .media{height:var(--vign);border-radius:50%;overflow:hidden;
 border:1px solid var(--trait)}
body.forme-carre .c .media{border-radius:4px 4px 0 0}
body.forme-rond .c.sel .media{border-color:var(--orange);
 box-shadow:0 0 0 2px var(--orange)}
body.forme-rond .c .nom{text-align:center}
/* Double-clic sur une vignette : la carte passe au double, sur deux colonnes,
   et le clip demarre. Hauteur en calc(), jamais en aspect-ratio — meme regle
   que plus haut : un ratio ne participe pas au calcul de la ligne. La largeur
   double vaut 2 colonnes plus la gouttiere, d ou le « + 5px » qui garde le
   16:9 (2V+9)*9/16 = V*9/8 + 5,06. */
/* Loupe : le rush en grand PAR-DESSUS la grille, qui ne bouge plus d un
   pixel. L ancienne version agrandissait la carte sur place : elle
   redessinait les 349 vignettes et reorganisait toute la grille derriere —
   lent, et pas tres chic. */
#loupe{position:fixed;inset:0;z-index:88;background:#000000dc;display:none;
 align-items:center;justify-content:center;padding:24px}
#loupe.on{display:flex}
#loupe .cadre{display:flex;flex-direction:column;gap:9px;max-width:100%;
 max-height:100%;align-items:stretch}
/* La taille vient du RAPPORT du rush, pas de la taille intrinseque du
   lecteur : un <video> en width:auto prend celle de son poster (480x270 ici)
   tant que la video n est pas chargee, puis saute. On calcule donc la boite :
   largeur = min(92vw, 80vh x rapport), hauteur deduite. Aucun saut, aucune
   deformation, et c est bon des la premiere image. */
#loupe .scene{width:min(calc(var(--vign)*3 + 18px), 92vw,
 calc(80vh * var(--arn,1.7778)));
 aspect-ratio:var(--ar,16/9);margin:0 auto;background:#000;border-radius:6px}
#loupe .scene video,#loupe .scene img{width:100%;height:100%;
 object-fit:contain;display:block;border-radius:6px;background:#000}
#loupe audio{width:100%}
#loupe .pochette{width:min(460px,72vw);height:min(460px,72vw);
 border-radius:6px;margin:0 auto}
/* « loupeTete » et pas « tete » : .tete est DEJA la tete de lecture de la
   timeline — position absolue, fond orange. Mon bandeau en heritait et
   repeignait la moitie de l ecran en orange. */
#loupe .loupeTete{display:flex;align-items:center;gap:11px;color:var(--encre);
 font-size:13px;width:100%}
#loupe .loupeTete b{font-weight:500;overflow:hidden;text-overflow:ellipsis;
 white-space:nowrap}
#loupe .loupeTete .sp{flex:1 1 auto}
.c .reduire{position:absolute;top:5px;right:5px;z-index:3;background:#000a;
 border:1px solid #fff3;color:#fff;border-radius:4px;padding:1px 6px;
 font-size:11px;line-height:1.5;cursor:pointer}
.c .reduire:hover{background:var(--orange);border-color:var(--orange)}
.c .lire{position:absolute;inset:auto 5px 5px auto;background:#000a;
 border:1px solid #fff3;color:#fff;border-radius:4px;padding:1px 6px;
 font-size:11px;opacity:0}
.c:hover .lire{opacity:1}
.etoile{position:absolute;top:2px;left:3px;font-size:15px;line-height:1;
 color:#fff6;text-shadow:0 1px 3px #000;cursor:pointer;z-index:2;
 padding:2px 3px;background:none;border:0}
.etoile:hover,.etoile.on{color:var(--or)}
.c .bas{padding:4px 6px}
.c .nom{font-size:12px;font-weight:500;overflow:hidden;text-overflow:ellipsis;
 white-space:nowrap;cursor:text;border-radius:3px;padding:1px 3px;margin:-1px -3px}
.c .nom:hover{background:var(--haut)}
.c input.nom{width:100%;font-size:12px;padding:1px 3px}
.c .meta{margin-top:3px;display:flex;gap:3px;flex-wrap:wrap}
body.petit .c .meta,body.forme-rond .c .meta{display:none}
body.petit .c .nom,body.forme-rond .c .nom{font-size:10px}
.b{font:10px/1.6 ui-monospace,monospace;letter-spacing:.05em;padding:0 5px;
 border-radius:3px;background:#4a4843;color:#c9c4bb}
.b.fmt{background:#ffb347;color:#1a1917}
.b.vert{background:#66d9e8;color:#1a1917}
.b.carre{background:#c8a882;color:#1a1917}
.b.muet{background:#5a3a3a;color:#f0c8c8}
.b.abs{background:var(--rouge);color:#fff}
.vide{grid-column:1/-1;padding:50px 16px;color:var(--sourd);text-align:center}

.moniteur{padding:9px 11px;display:flex;flex-direction:column;gap:6px;
 flex:0 0 var(--wMoni);min-width:220px}
body.edit .moniteur{flex:1 1 auto;padding:5px 12px;align-items:center}
.cadreMoni{width:100%;display:flex;align-items:center;justify-content:center;
 min-height:0}
body.edit .cadreMoni{flex:1 1 auto}
.moniteur canvas{width:100%;aspect-ratio:16/9;background:#000;border-radius:4px;
 display:block}
body.edit .moniteur canvas{width:auto;max-width:100%;max-height:100%;
 object-fit:contain}
.transport{display:flex;gap:4px;align-items:center;width:100%;flex-wrap:wrap}
.transport .tr{padding:4px 8px;font-size:12px;min-width:30px;text-align:center}
.transport .tr.on{background:var(--vert);border-color:var(--vert);color:#fff}
.transport #bBoucle.on{background:var(--or);border-color:var(--or);color:#1a1917}
/* plein ecran : le moniteur prend tout, le reste s efface */
.moniteur:fullscreen{background:#000;padding:0;justify-content:center}
.moniteur:fullscreen .cadreMoni{flex:1 1 auto;width:100%}
.moniteur:fullscreen canvas{max-width:100vw;max-height:100vh;width:auto;height:auto}
.moniteur:fullscreen .transport{position:fixed;left:50%;bottom:18px;
 transform:translateX(-50%);width:auto;background:#1a1917e8;padding:7px 11px;
 border-radius:8px;border:1px solid var(--trait);opacity:.15;transition:opacity .2s}
.moniteur:fullscreen .transport:hover{opacity:1}
.transport .tc{font:12px/1 ui-monospace,monospace;color:var(--sourd);
 white-space:nowrap}
#curseur{flex:1 1 auto;min-width:50px;padding:0;background:none;border:0}

footer{flex:0 0 var(--hFooter);border-top:1px solid var(--trait);background:#151412;
 display:flex;flex-direction:column;min-height:150px}
.bandeau{padding:5px 11px;display:flex;gap:6px;align-items:center;
 border-bottom:1px solid var(--trait);flex-wrap:wrap}
.outil{padding:4px 8px;font-size:12px}
/* Rendre : vert au repos, rouge pendant le rendu, avec sa jauge en fond. */
.outil.rendre{position:relative;overflow:hidden;background:var(--vert);
 border-color:var(--vert);color:#0b1408;font-weight:600;min-width:104px}
.outil.rendre:hover{filter:brightness(1.12)}
.outil.rendre .txt{position:relative;z-index:2}
.outil.rendre .jauge{position:absolute;left:0;top:0;bottom:0;width:0;z-index:1;
 background:#0000003d;transition:width .25s linear}
.outil.rendre.encours{background:var(--rouge);border-color:var(--rouge);
 color:#fff;cursor:progress}
.outil.rendre.encours .jauge{background:#ffffff40}
/* Cache de lecture : meme jauge que le rendu, une autre couleur. Vert quand
   la sequence est en memoire. */
.outil.cache{position:relative;overflow:hidden;min-width:86px;
 background:#241f33;border-color:#6b5a92;color:#c9bce6}
.outil.cache:hover{background:#2e2742}
.outil.cache .txt{position:relative;z-index:2}
.outil.cache .jauge{position:absolute;left:0;top:0;bottom:0;width:0;z-index:1;
 background:#8f79c4;transition:width .2s linear}
.outil.cache.encours{cursor:progress}
.outil.cache.pret{background:var(--vert);border-color:var(--vert);color:#0b1408;
 font-weight:600}
.outil.cache.pret .jauge{background:#0003;width:100%}
.minimap{flex:1 1 130px;min-width:110px;height:24px;background:#100f0e;
 border:1px solid var(--trait);border-radius:3px;position:relative;
 overflow:hidden;cursor:ew-resize}
.minimap .mb{position:absolute;top:3px;height:7px;border-radius:1px;opacity:.85}
.minimap .mb.a{top:13px;height:6px}
.minimap .vue{position:absolute;top:0;bottom:0;border:1px solid var(--orange);
 background:#d9532b22;pointer-events:none}
.minimap .bulle{position:absolute;top:2px;z-index:7;background:#12110fee;
 border:1px solid var(--or);border-radius:3px;color:var(--or);
 font:9px/1.6 ui-monospace,monospace;padding:0 4px;white-space:nowrap;
 pointer-events:none;margin-left:5px}
.minimap .bulle.gauche{margin-left:0;transform:translateX(-100%) translateX(-5px)}
.minimap .mt{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;
 background:var(--or);box-shadow:0 0 4px #e8b93a99;pointer-events:none}
.minimap .mt::before{content:"";position:absolute;top:0;left:-3px;
 border:4px solid transparent;border-top-color:var(--or);border-bottom:0;height:0}
.atelier{display:flex;min-height:0;flex:1 1 auto}
.tl{flex:1 1 auto;display:flex;min-width:0;min-height:0}
.tl-entetes{flex:0 0 118px;border-right:1px solid var(--trait);overflow:hidden;
 background:#191816}
.tl-defile{flex:1 1 auto;overflow:auto;position:relative}
.tl-contenu{position:relative;min-width:100%}
.regle{height:21px;position:sticky;top:0;z-index:3;background:#1c1b19;
 border-bottom:1px solid var(--trait);cursor:pointer}
.regle .tick{position:absolute;top:0;bottom:0;border-left:1px solid #ffffff14;
 font:9px/21px ui-monospace,monospace;color:var(--sourd);padding-left:3px}
.hEntete{height:21px;border-bottom:1px solid var(--trait);background:#1c1b19}
.pEntete{display:flex;align-items:center;gap:4px;padding:0 6px;
 border-bottom:1px solid var(--trait);font:11px/1 ui-monospace,monospace;
 flex-wrap:wrap;align-content:center;row-gap:4px}
.pEntete b{flex:1 1 auto;font-weight:600;letter-spacing:.05em}
.pEntete i{font-style:normal;font-size:9px;color:var(--or);flex:0 0 auto}
/* Volume general de la piste son : sa propre ligne dans l en-tete. */
.pEntete input.vol{-webkit-appearance:none;appearance:none;flex:1 0 100%;
 min-width:0;height:3px;margin:0;padding:0;border:0;border-radius:2px;
 background:var(--trait);cursor:pointer}
.pEntete input.vol::-webkit-slider-thumb{-webkit-appearance:none;width:9px;
 height:9px;border-radius:50%;background:var(--orange);border:0;cursor:pointer}
.pEntete input.vol::-moz-range-thumb{width:9px;height:9px;border-radius:50%;
 background:var(--orange);border:0;cursor:pointer}
.pEntete button{padding:1px 5px;font-size:10px;border-radius:3px;
 font-family:ui-monospace,monospace}
.pEntete button.m.on{background:var(--rouge);border-color:var(--rouge);color:#fff}
.pEntete button.s.on{background:var(--or);border-color:var(--or);color:#1a1917}
/* La piste visee par « Add » : un clic sur son en-tete, un liseré orange. */
.pEntete.active{background:#241f19;box-shadow:inset 3px 0 0 var(--orange)}
.lane{position:relative;border-bottom:1px solid var(--trait);
 background:repeating-linear-gradient(90deg,#00000000 0 39px,#ffffff08 39px 40px)}
.lane.va{background-color:#1d1c1a}
.lane.aa{background-color:#1a1c1d}
.lane.cible{background-color:#2a2320}
.clip{position:absolute;top:2px;bottom:2px;background:var(--carte);
 border:1px solid var(--c0);border-radius:3px;overflow:hidden;cursor:grab;
 min-width:6px}
.clip.sel{box-shadow:0 0 0 1px var(--orange);z-index:2}
.clip.sel{border-color:var(--orange)}
.clip .vign{position:absolute;inset:0;background-size:auto 100%;
 background-repeat:repeat-x;opacity:.5}
.clip .teinte{position:absolute;inset:0;opacity:.28}
/* L onde du son : dessinee dans le bloc, sous son nom et ses attaches. */
.clip canvas.onde{position:absolute;left:0;top:0;width:100%;height:100%;
 z-index:1;pointer-events:none}
.clip .nom{position:relative;font-size:10px;padding:2px 6px;white-space:nowrap;
 overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px #000}
.clip .info{position:absolute;right:4px;bottom:1px;font:9px/1.4 ui-monospace,monospace;
 opacity:.75;text-shadow:0 1px 2px #000}
.clip .poi{position:absolute;top:0;bottom:0;width:8px;z-index:3;
 background:linear-gradient(#d9532b66,#d9532b22)}
.clip .poi.g{left:0;cursor:w-resize}
.clip .poi.d{right:0;cursor:e-resize}
.clip .poi:hover{background:var(--orange)}
.clip .fondu{position:absolute;top:0;bottom:0;pointer-events:none;
 background:linear-gradient(90deg,#000c,#0000)}
/* Bande du haut : viser les carres de 9 px demandait trop de precision. Toute
   la largeur du bloc, sur ses 11 premiers pixels, attrape le fondu le plus
   proche ; en dessous, le bloc se deplace et se rogne comme avant. */
.clip .bande{position:absolute;left:0;right:0;top:0;height:11px;z-index:5;
 cursor:ew-resize}
.lane.aa .clip .bande,.lane.ma .clip .bande{height:8px}
.clip:hover .bande{background:#e8b93a1f}
.clip .att{position:absolute;top:1px;width:9px;height:9px;background:var(--or);
 border:1px solid #0009;border-radius:2px;z-index:4;cursor:ew-resize;opacity:.45;
 margin-left:-4px}
.clip:hover .att,.clip.sel .att{opacity:1}
.clip .fondu.d{background:linear-gradient(90deg,#0000,#000c)}
body.outilC .clip{cursor:crosshair}
body.outilC .clip .poi{display:none}
/* Sélection de piste vers l avant : le curseur montre le sens. */
body.outilA .clip{cursor:e-resize}
body.outilA .clip .poi,body.outilA .clip .att{display:none}
/* Ctrl pendant un deplacement : le bloc survole sera ejecte derriere. */
.clip.ejectable{outline:2px dashed var(--or);outline-offset:-2px}
.lasso{position:absolute;z-index:8;border:1px solid var(--orange);
 background:#d9532b26;pointer-events:none;border-radius:2px}
/* Marqueurs. La poignee tient dans la reglette, en haut ; le trait qui
   descend sur les pistes ne prend aucun clic, sinon il volerait 11 px de
   largeur a chaque bloc qu il traverse. */

let VUE = 'source';
const RANGEMENTS = {};
let MOI = {identifiant: '', admin: false, comptes: -1};
// Vrai des qu un serveur sait ranger : l hebergeur, et le serveur de bureau
// d une bibliotheque qui l annonce. Un serveur plus ancien ne dit rien, et
// tout reste comme avant.
let RANGEABLE = false, LECTURE_SEULE = false, TITRE = '';
// Le serveur sait retirer les fiches manquantes (champ « purge » annonce par
// /api/projets). Absent — vieux serveur, version en ligne — : pas de bouton.
let PURGE = false;
// Le serveur sait-il fabriquer l onde d un son (/api/onde) ? Sans ce champ —
// ancien serveur, version en ligne — le menu ne la propose pas.
let ONDE_OK = false;
// Le serveur sait-il lister TOUS les dossiers (/api/dossiers) et en ouvrir un
// (/api/projet/ajouter) ? Sans ce champ, « Open project » s en tient aux
// projets declares, comme avant.
let DOSSIERS_OK = false;
// Le serveur sait se mettre a jour depuis GitHub (champ « maj »).
let MAJ_DISPO = false;
// Le faux dossier qui recueille ce qui n a pas encore ete range. Il n est
// jamais enregistre : c est un affichage, pas un dossier.
const NONRANGE = '— not filed —';
const rangementDe = pj =>
  RANGEMENTS[pj] || (RANGEMENTS[pj] = {dossiers: [], ou: {}});

const clefDossier = f => VUE === 'rangement'
  ? f.pj + '/' + (rangementDe(f.pj).ou[f.id] || NONRANGE)
  : f.pj + (f.dossier ? '/' + f.dossier : '');
// Ou vivent les medias. Vides, on est sur le serveur de bureau et rien ne
// change. En ligne, le serveur annonce ses deux bases dans /api/projets : les
// proxys sont alors ailleurs (stockage objet ou sous-dossier), et chaque fiche
// porte le chemin de SON proxy, extension comprise — un .wav devient un .m4a,
// on ne peut pas le deviner.
let BASE_MEDIA = '', BASE_POSTERS = '', ENLIGNE = false;
const urlMedia = f => BASE_MEDIA
  ? BASE_MEDIA + encodeURIComponent(f.pj) + '/' + encodeURI(f.proxy || f.rel)
  : '/media/' + encodeURIComponent(f.pj) + '/' + encodeURI(f.rel);
const urlPoster = f => BASE_POSTERS
  ? BASE_POSTERS + encodeURIComponent(f.pj) + '/' + f.id + '.jpg'
  : '/posters/' + encodeURIComponent(f.pj) + '/' + f.id + '.jpg';
const posterDe = id => { const f = PAR_ID[id]; return f ? urlPoster(f) : ''; };

// Le projet « courant » sert aux actions qui ne visent pas une fiche precise :
// creer un dossier, rescanner, annuler. C est celui choisi dans la colonne,
// ou le seul ouvert s il n y en a qu un.
function projetCourant() {
  if (dossierActif) return dossierActif.split('/')[0];
  return OUVERTS.length === 1 ? OUVERTS[0].nom : null;
}

// Recompose les listes plates a partir des projets ouverts.
async function chargerRangement(pj) {
  if (!RANGEABLE) return;
  try {
    const d = await api('/api/rangement?projet=' + encodeURIComponent(pj));
    RANGEMENTS[pj] = {dossiers: d.dossiers || [], ou: d.ou || {}};
  } catch (err) {
    RANGEMENTS[pj] = {dossiers: [], ou: {}};
  }
}

// On enregistre le rangement ENTIER a chaque changement : il pese quelques
// kilo-octets pour cinq cents rushes, et un envoi complet ne peut pas laisser
// le serveur dans un etat a moitie ecrit.
let _rangEnCours = null;
async function enregistrerRangement(pj) {
  const r = rangementDe(pj);
  try {
    _rangEnCours = api('/api/rangement',
      {projet: pj, dossiers: r.dossiers, ou: r.ou});
    const d = await _rangEnCours;
    // Le serveur fait autorite : il cree les parents manquants et jette ce
    // qui pointe dans le vide. On reprend SA version, pas la notre.
    RANGEMENTS[pj] = {dossiers: d.dossiers || [], ou: d.ou || {}};
  } catch (err) {
    dire('arrangement not saved — ' + err.message, true);
  } finally {
    _rangEnCours = null;
  }
}

async function basculerVue(v) {
  if (VUE === v) return;
  // Un projet ouvert apres le demarrage n a pas encore son rangement.
  await Promise.all(OUVERTS.map(p =>
    RANGEMENTS[p.nom] ? null : chargerRangement(p.nom)));
  VUE = v;
  pref.ecrire('vue', VUE);
  dossierActif = null;
  document.body.classList.toggle('rangement', VUE === 'rangement');
  $$('[data-vue]').forEach(b => b.classList.toggle('on', b.dataset.vue === VUE));
  refondre(); rendre();
}

function refondre() {
  // Une bibliotheque passe TOUJOURS apres les projets — dans la colonne
  // comme dans la grille, et quel que soit l ordre d ouverture. Le tri est
  // stable, donc l ordre des projets entre eux ne bouge pas.
  OUVERTS.sort((a, b) => (estBibli(a.nom) ? 1 : 0) - (estBibli(b.nom) ? 1 : 0));
  FILMS = []; DOSSIERS = [];
  OUVERTS.forEach(p => {
    (p.films || []).forEach(f => { f.pj = p.nom; FILMS.push(f); });
    if (VUE === 'rangement') {
      const r = rangementDe(p.nom);
      const l = [...r.dossiers];
      // « non range » n apparait que s il reste quelque chose dedans : une
      // ligne vide en permanence serait un reproche permanent.
      if ((p.films || []).some(f => !f.absent && !r.ou[f.id])) l.push(NONRANGE);
      l.forEach(d => DOSSIERS.push({pj: p.nom, d: d, clef: p.nom + '/' + d}));
    } else {
      (p.dossiers || []).forEach(d =>
        DOSSIERS.push({pj: p.nom, d: d, clef: p.nom + '/' + d}));
    }
  });
  indexer();
}

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

const RACINE_CSS = document.documentElement.style;

function dire(msg, mal) {
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'on' + (mal ? ' mal' : '');
  clearTimeout(dire._h);
  dire._h = setTimeout(() => t.className = '', mal ? 5200 : 2400);
}

function tc(v) {
  v = Math.max(0, v || 0);
  const m = Math.floor(v / 60), s = Math.floor(v % 60);
  const f = Math.floor((v - Math.floor(v)) * PROJET.fps);
  const d = n => String(n).padStart(2, '0');
  return d(m) + ':' + d(s) + ':' + d(f);
}

// Specifications du montage en cours. Tout ce qui parle de temps ou de
// cadre s y refere : moniteur, compteurs, export XML, rendu ffmpeg.
// « pj » : le projet dans lequel ce montage est enregistre. Les plans, eux,
// peuvent venir de n importe quel projet ouvert.
const PROJET = {nom: '', pj: '', w: 1280, h: 720, fps: 24};

// Une seule unite pour tous les affichages de temps : secondes ou images.
let unite = 'sec';
function fmt(v) {
  v = Math.max(0, v || 0);
  if (unite === 'img') return Math.round(v * PROJET.fps) + ' img';
  const m = Math.floor(v / 60), s = v % 60;
  return String(m).padStart(2, '0') + ':' +
    s.toFixed(2).padStart(5, '0') + ' s';
}

// Un appel qui ne revient jamais laissait la boite bloquee sur « running… »,
// sans aucune sortie. Toute requete a donc une limite de temps ; passer 0 en
// troisieme argument la leve, pour le scan qui dure legitimement des minutes.
const DELAI_API = 25000;
async function api(route, corps, delai) {
  const ms = delai === undefined ? DELAI_API : delai;
  const ctrl = ms && window.AbortController ? new AbortController() : null;
  const minuteur = ctrl ? setTimeout(() => ctrl.abort(), ms) : null;
  let r;
  try {
    const opts = corps
      ? {method: 'POST', headers: {'Content-Type': 'application/json'},
         body: JSON.stringify(corps)}
      : {cache: 'no-store'};
    if (ctrl) opts.signal = ctrl.signal;
    r = await fetch(route, opts);
  } catch (e) {
    if (e && e.name === 'AbortError')
      throw new Error('no answer from the server after ' +
        Math.round(ms / 1000) + ' s — the operation may have gone through anyway');
    throw e;
  } finally {
    if (minuteur) clearTimeout(minuteur);
  }
  const d = await r.json().catch(() => ({erreur: 'unreadable answer'}));
  if (!r.ok || d.erreur) throw new Error(d.erreur || ('HTTP ' + r.status));
  return d;
}

// Trois vues, trois reglages de vignette : la planche complete veut de
// petites icones, un dossier veut des vignettes lisibles, le deck de montage
// veut le plus petit. Les deux controles agissent toujours sur la vue en cours.
const PROFILS = {
  tous:    {taille: 104, forme: 'carre'},
  dossier: {taille: 206, forme: '169'},
  deck:    {taille: 96,  forme: 'carre'}
};
function profilCourant() {
  if (document.body.classList.contains('edit')) return 'deck';
  // la planche d un projet entier veut de petites icones, comme « tous »
  return (dossierActif === null || dossierActif.indexOf('/') < 0)
    ? 'tous' : 'dossier';

function poserTaille(px) {
  RACINE_CSS.setProperty('--vign', px + 'px');
  document.body.classList.toggle('petit', px < 130);
}
function poserForme(f) {
  document.body.classList.remove('forme-carre', 'forme-rond');
  if (f === 'carre') document.body.classList.add('forme-carre');
  if (f === 'rond') document.body.classList.add('forme-rond');
}
function appliquerProfil() {
  const k = profilCourant(), d = PROFILS[k];
  const t = parseInt(pref.lire('vign_' + k, d.taille), 10) || d.taille;
  const f = pref.lire('forme_' + k, d.forme);

  $('#tailleVign').value = t;
  $('#forme').value = f;
}
function appliquerTaille(px) {
  poserTaille(px);
  pref.ecrire('vign_' + profilCourant(), px);
}
function appliquerForme(f) {
  poserForme(f);
  pref.ecrire('forme_' + profilCourant(), f);
}
$('#tailleVign').oninput = e => appliquerTaille(+e.target.value);
$('#forme').onchange = e => appliquerForme(e.target.value);

// -- poignées de redimensionnement ------------------------------------------
const RZ = {
  aside: {v: '--wAside', min: 120, max: 520, sens: 1},
  moni: {v: '--wMoni', min: 200, max: 900, sens: -1},
  regl: {v: '--wRegl', min: 150, max: 620, sens: -1},
  footer: {v: '--hFooter', min: 150, max: 900, sens: -1}
};
$$('.rz').forEach(el => {
  el.addEventListener('pointerdown', e => {
    let cfg = RZ[el.dataset.rz];
    if (!cfg) return;
    // En mode Montage, le moniteur est elastique et c est le deck qui a une
    // largeur fixe : la meme poignee doit donc piloter --wDeck, et dans l
    // autre sens puisque le deck est a gauche.
    let cle = el.dataset.rz;
    if (cle === 'moni' && document.body.classList.contains('edit')) {
      cfg = {v: '--wDeck', min: 120, max: 760, sens: 1};
      cle = 'deck';
    }
    e.preventDefault();
    el.classList.add('actif');
    const vertical = el.classList.contains('horiz');
    const dep = parseFloat(getComputedStyle(document.documentElement)
      .getPropertyValue(cfg.v)) || cfg.min;
    const p0 = vertical ? e.clientY : e.clientX;
    const bouger = ev => {
      const d = ((vertical ? ev.clientY : ev.clientX) - p0) * cfg.sens;
      const val = Math.min(cfg.max, Math.max(cfg.min, dep + d));
      RACINE_CSS.setProperty(cfg.v, val + 'px');
      if (cle === 'footer' || cle === 'regl') majMinimap();
      if (typeof dimensionnerMoniteur === 'function') {
        dimensionnerMoniteur();
        dessiner();
      }
    };
    const lacher = () => {
      el.classList.remove('actif');
      window.removeEventListener('pointermove', bouger);
      window.removeEventListener('pointerup', lacher);
      pref.ecrire(cle,
        getComputedStyle(document.documentElement).getPropertyValue(cfg.v).trim());
      majMinimap();
    };
    window.addEventListener('pointermove', bouger);
    window.addEventListener('pointerup', lacher);
  });
});

// Teinte stable tiree du nom : deux morceaux voisins ne se ressemblent pas.
function tonSon(nom) {
  let h = 0;
  const t = String(nom || '');
  for (let i = 0; i < t.length; i++) h = (h * 31 + t.charCodeAt(i)) % 360;
  return h;
}

function format(f) {
  if (f.son_seul || !f.w || !f.h) return null;
  const r = f.w / f.h;
  if (r > 2.1) return {code: 'SCOPE', cls: 'fmt'};
  if (r < 0.9) return {code: 'VERT', cls: 'vert'};
  if (r < 1.12) return {code: 'CARRE', cls: 'carre'};
  if (r < 1.6) return {code: '4:3', cls: 'fmt'};
  return null;
}

function correspond(f) {
  if (dossierActif !== null &&
      dossierActif !== f.pj && dossierActif !== clefDossier(f)) return false;
  if (favSeul && !f.fav) return false;
  if (q && !f.nom.toLowerCase().includes(q)) return false;
  return true;
}

function rendreDossiers() {
  // un compteur par couple projet + dossier
  const n = {};
  FILMS.forEach(f => {
    if (f.absent) return;
    const c = clefDossier(f);
    n[c] = (n[c] || 0) + 1;
    n[f.pj] = (n[f.pj] || 0) + 1;
  });
  const vivants = FILMS.filter(f => !f.absent).length;
  const ech = x => String(x).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/"/g, '&quot;');

  let h = '';
  let o = '<option value="">All open projects (' + vivants + ')</option>';
  if (OUVERTS.length > 1)
    h += '<div class="dos ' + (dossierActif === null ? 'on' : '') +
      '" data-clef=""><b>All projects</b><i>' + vivants + '</i></div>';

  // OUVERTS est deja trie par refondre() : les bibliotheques en dernier.
  for (const p of OUVERTS) {
    const bibli = estBibli(p.nom);
    const plie = REPLIES.has(p.nom);
    const aPlier = (p.dossiers || []).length || p.besoinScan ||
      !(p.films || []).length;
    h += '<div class="pjt ' + (dossierActif === p.nom ? 'on' : '') +
      (bibli ? ' bibli' : '') +
      '" data-clef="' + ech(p.nom) + '" data-pj="' + ech(p.nom) +
      '" data-d="" title="' + ech(p.racine || p.nom) + '">' +
      (aPlier
        ? '<span class="chev" data-plier="' + ech(p.nom) + '" title="' +
          (plie ? 'expand' : 'replier') + ' the folders">' +
          (plie ? '▶' : '▼') + '</span>'
        : '<span class="chev" style="visibility:hidden">▼</span>') +
      '<b>' + (bibli ? '♪ ' : '') + ech(p.nom) + '</b><i>' +
      (n[p.nom] || 0) + '</i>' +
      (bibli ? '' : '<button class="x" data-fermer="' + ech(p.nom) +
        '" title="close this project">×</button>') + '</div>';
    if (!plie) {
      const mm = (typeof MONTAGES !== 'undefined' ? MONTAGES : [])
        .filter(x => x.projet === p.nom);
      const om = MONT_OUVERTS.has(p.nom);
    // Une bibliotheque n a pas de montages a elle : les musiques sont
    // enregistrees avec le montage qui les utilise, dans son projet.
    if (!bibli) {
      h += '<div class="dos montages" data-montages="' + ech(p.nom) +
        '" title="sequences in this project"><span class="chev">' +
        (om ? '▼' : '▶') + '</span><b>Sequences</b><i>' + mm.length +
        '</i></div>';
      if (om) h += (mm.length
        ? mm.map(x => '<div class="dos mont' +
            (x.nom === projetNom && x.projet === PROJET.pj ? ' on' : '') +
            '" data-mont="1" data-pj="' + ech(x.projet) + '" data-mnom="' +
            ech(x.nom) + '" title="modified on ' + ech(x.maj) +
            ' — click to open, double-click to rename, right-click for ' +
            'the menu"><b>' + ech(x.nom) + '</b></div>').join('')
        : '<div class="dosVide">no saved sequence</div>');
    }
    }
    if (!plie && (p.besoinScan || !(p.films || []).length))
      h += '<div class="aScan">' +
        (p.aScanner ? p.aScanner + ' file(s) to scan'
                    : 'no rush found') +
        '<button class="bureauSeul" data-scanner="' + ech(p.nom) +
        '">Scan</button></div>';
    o += '<optgroup label="' + ech(p.nom) + '">' +
      '<option value="' + ech(p.nom) + '"' +
      (dossierActif === p.nom ? ' selected' : '') + '>all ' + ech(p.nom) +
      ' (' + (n[p.nom] || 0) + ')</option>';
    for (const d of DOSSIERS) {
      if (d.pj !== p.nom) continue;
      // Replie : la ligne n est pas rendue, mais reste dans le menu deroulant.
      if (!plie)
        h += '<div class="dos ' + (dossierActif === d.clef ? 'on' : '') +
          '" data-clef="' + ech(d.clef) + '" data-pj="' + ech(d.pj) +
          '" data-d="' + ech(d.d) + '" title="double-click to rename"><b>' +
          ech(d.d) + '</b><i>' + (n[d.clef] || 0) + '</i></div>';
      o += '<option value="' + ech(d.clef) + '"' +
        (dossierActif === d.clef ? ' selected' : '') + '>' + ech(d.d) +
        ' (' + (n[d.clef] || 0) + ')</option>';
    }
    o += '</optgroup>';
  }
  if (!OUVERTS.length)
    h += '<div style="padding:9px;color:var(--sourd);font-size:12px">' +
      'no project open</div>';
  $('#dossiers').innerHTML = h;
  $('#selDossier').innerHTML = o;
  majEntete();
}

// Bandeau de titre : ce que contiennent les projets ouverts.
function majEntete() {
  const vivants = FILMS.filter(f => !f.absent);
  // Une image n a pas de duree : elle ne compte pas dans celle du projet.
  const duree = vivants.reduce((s, f) => s + (f.image ? 0 : (f.s || 0)), 0);
  const poids = vivants.reduce((s, f) => s + (f.m || 0), 0);
  // Le nom de la bibliotheque vient de bibliotheque.json (le dossier ou
  // elle a ete creee) ; l onglet du navigateur le porte aussi.
  const bib = $('#biblio');
  if (bib) bib.textContent = TITRE || '';
  const voulu = TITRE ? TITRE + ' — library & edit table'
                      : 'library & edit table';
  if (document.title !== voulu) document.title = voulu;
  $('#titre').textContent = OUVERTS.length
    ? OUVERTS.map(p => p.nom).join(' + ') : 'no project open';
  $('#entete').textContent = OUVERTS.length
    ? (vivants.length + ' clips · ' + DOSSIERS.length + ' folders · ' +
       (duree / 60).toFixed(0) + ' min · ' + (poids / 1024).toFixed(1) + ' Go')
    : 'open a project in the left column';
  // Le bouton n apparait que s il y a des fiches MISSING a retirer.
  const manquantes = FILMS.length - vivants.length;
  const bp = $('#bPurge');
  if (bp && !bp.disabled) {
    bp.hidden = !(PURGE && manquantes);
    bp.textContent = 'Remove ' + manquantes + ' missing';
  }
}

function carte(f) {
  const fmt = format(f);
  const cls = ['c', selection.has(f.id) ? 'sel' : '',
               f.absent ? 'absent' : ''].filter(Boolean).join(' ');
  return '<div class="' + cls + '" data-id="' + f.id + '">' +
    '<button class="etoile ' + (f.fav ? 'on' : '') + '" data-fav="' + f.id +
    '" title="favourite">' + (f.fav ? '★' : '☆') + '</button>' +
    '<div class="media" draggable="true" data-media="' + f.id + '">' +
    (f.son_seul
        // Un fichier de son seul n a pas de poster : une pochette dessinee,
        // teintee par son nom pour que l oeil distingue les morceaux.
        ? '<div class="pochette" style="--t:' + (tonSon(f.nom) | 0) + 'deg">' +
          '<span>♪</span></div>' +
          '<button class="lire" data-lire="' + f.id + '">▶</button>'
        : '<img loading="lazy" src="' + urlPoster(f) + '" data-poster="' + f.id +
          '" alt=""><button class="lire" data-lire="' + f.id + '">▶</button>') +
    // Une etiquette de couleur, posee sur le bas de la vignette : elle se voit
    // a toutes les tailles, y compris sur les plus petites du deck.
    (f.coul ? '<div class="etiq" style="background:var(' +
      (COULS[f.coul] || '--c0') + ')"></div>' : '') +
    '</div>' +
    '<div class="bas"><div class="nom" data-nom="' + f.id +
    '" title="' + f.nom + ' — double-click to rename">' +
    f.nom.replace(/</g, '&lt;') + '</div>' +
    '<div class="meta">' +
    (f.image ? '<span class="b">still</span>'
             : '<span class="b">' + (f.s || 0).toFixed(1) + 's</span>') +
    (fmt ? '<span class="b ' + fmt.cls + '">' + fmt.code + '</span>' : '') +
    (f.image ? '<span class="b son">IMAGE</span>'
             : f.son_seul ? '<span class="b son">SOUND</span>'
                : (f.a ? '' : '<span class="b muet">MUTE</span>')) +
    (f.absent ? '<span class="b abs">MISSING</span>' : '') +
    '</div></div></div>';
}

function rendreGrille() {
  const l = FILMS.filter(correspond);
  grille.innerHTML = l.length ? l.map(carte).join('')
    : '<div class="vide">no clip matches</div>';
  $('#cpt').textContent = l.length + ' / ' + FILMS.length;
  const n = selection.size;
  $('#selInfo').textContent = n
    ? n + (n > 1 ? ' clips selected' : ' clip selected') : 'no clip';
  $('#bAjouter').disabled = !n;
}

function rendre() { rendreDossiers(); rendreGrille(); }
function indexer() { PAR_ID = {}; FILMS.forEach(f => PAR_ID[f.id] = f); }

const filePosters = [], posterTentes = new Set();
let posterEnCours = false, posterId = null, posterMinuteur = null;

function finirPoster(ok) {
  if (!posterEnCours) return;
  posterEnCours = false;
  clearTimeout(posterMinuteur);
  if (ok && posterId) {
    const i = document.querySelector('[data-poster="' + posterId + '"]');
    if (i) i.src = posterDe(posterId) + '?' + Date.now();
  }
  posterId = null;
  vPoster.removeAttribute('src'); vPoster.load();
  setTimeout(prochainPoster, 60);
}
vPoster.addEventListener('loadeddata', () => {
  if (posterEnCours) vPoster.currentTime = (vPoster.duration || 1) * 0.35;
});
vPoster.addEventListener('seeked', async () => {
  if (!posterEnCours || !vPoster.videoWidth) return;
  const id = posterId;
  try {
    const c = document.createElement('canvas');
    c.width = 480;
    c.height = Math.round(480 * vPoster.videoHeight / vPoster.videoWidth) || 270;
    c.getContext('2d').drawImage(vPoster, 0, 0, c.width, c.height);
    await api('/api/poster', {projet: (PAR_ID[id] || {}).pj, id: id,
                              data: c.toDataURL('image/jpeg', 0.78)});
    finirPoster(true);
  } catch (err) { finirPoster(false); }
});
vPoster.addEventListener('error', () => finirPoster(false));

function prochainPoster() {
  if (posterEnCours || !filePosters.length) return;
  const id = filePosters.shift();
  const f = PAR_ID[id];
  if (!f || f.absent) { setTimeout(prochainPoster, 0); return; }
  posterEnCours = true; posterId = id;
  vPoster.src = urlMedia(f);
  vPoster.load();
  posterMinuteur = setTimeout(() => finirPoster(false), 12000);
}
</script>
<script>
// ===========================================================================
//  Interactions bibliothèque
// ===========================================================================
async function renommerFilm(id, neuf) {
  const f = PAR_ID[id];
  if (!f || !neuf || neuf === f.nom) return false;
  try {
    const d = await api('/api/renommer', {projet: f.pj, id: id, nom: neuf});
    Object.assign(f, d.film);
    rendreGrille(); rendreTimeline();
    dire('renamed on disk: ' + f.nom);
    return true;
  } catch (err) { dire('rename refused — ' + err.message, true); return false; }
}

grille.addEventListener('click', async e => {
  const et = e.target.closest('[data-fav]');
  if (et) {
    e.stopPropagation();
    const f = PAR_ID[et.dataset.fav];
    try {
      const d = await api('/api/marquer',
                          {projet: f.pj, id: f.id, fav: !f.fav});
      Object.assign(f, d.film); rendreGrille();
    } catch (err) { dire('favourite not saved — ' + err.message, true); }
    return;
  }
  const red = e.target.closest('[data-reduire]');
  if (red) { e.stopPropagation(); reduire(); return; }
  const lire = e.target.closest('[data-lire]');
  if (lire) { e.stopPropagation(); visionner(lire.dataset.lire); return; }
  if (e.target.closest('video') || e.target.tagName === 'INPUT') return;
  const c = e.target.closest('.c');
  if (!c) return;
  // Le deuxieme clic d un double-clic ne doit pas defaire la selection faite
  // par le premier.
  if (e.detail > 1) return;
  const id = c.dataset.id;
  if (e.shiftKey && selection.size) {
    const l = FILMS.filter(correspond).map(f => f.id);
    const der = [...selection].pop();
    const a = l.indexOf(der), b = l.indexOf(id);
    if (a >= 0 && b >= 0) l.slice(Math.min(a, b), Math.max(a, b) + 1)
      .forEach(x => selection.add(x));
  } else if (e.ctrlKey || e.metaKey) {
    selection.has(id) ? selection.delete(id) : selection.add(id);
  } else {
    const seul = selection.size === 1 && selection.has(id);
    selection.clear();
    if (!seul) selection.add(id);
  }
  rendreGrille();
});

grille.addEventListener('dblclick', e => {
  const n = e.target.closest('[data-nom]');
  if (n) { editerNom(n); return; }
  const m = e.target.closest('[data-media]');
  if (!m) return;
  // preventDefault coupe le plein ecran natif que Chrome declenche sur un
  // double-clic dans une video a controles.
  e.preventDefault(); e.stopPropagation();
  agrandir(m.dataset.media);
});

// Double-clic sur une vignette : la carte double de taille et le clip part
// tout seul. Un deuxieme double-clic, le bouton ⤡ ou Échap la remettent a sa
// taille. Une seule carte agrandie a la fois : la grille reste lisible.
function agrandir(id) {
  const f = PAR_ID[id];
  if (!f || f.absent) return;
  if (agrandi === id) { reduire(); return; }
  // Un seul lecteur a la fois : on coupe ceux qui jouent dans la grille.
  $$('.media video, .media audio').forEach(v => {
    v.pause(); v.removeAttribute('src'); v.load();
  });
  agrandi = id;
  const esc = x => String(x === undefined || x === null ? '' : x)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
  // « poster » affiche la vignette AVANT le premier octet de video : le
  // panneau est plein des l ouverture, jamais un rectangle noir le temps du
  // chargement. Et rien n est recalcule dans la grille, donc c est immediat.
  const w = f.w || 16, h = f.h || 9;
  const media = f.son_seul
    ? '<div class="pochette" style="--t:' + (tonSon(f.nom) | 0) + 'deg">' +
      '<span>♪</span></div><audio src="' + urlMedia(f) +
      '" controls autoplay loop preload="auto"></audio>'
    : f.image
    ? '<div class="scene" style="--ar:' + w + '/' + h + ';--arn:' +
      (w / h).toFixed(4) + '"><img src="' + urlMedia(f) + '" alt="' +
      esc(f.nom) + '" style="width:100%;height:100%;object-fit:contain">' +
      '</div>'
    : '<div class="scene" style="--ar:' + w + '/' + h + ';--arn:' +
      (w / h).toFixed(4) + '"><video src="' + urlMedia(f) + '" poster="' +
      urlPoster(f) + '" controls autoplay loop playsinline preload="auto">' +
      '</video></div>';
  const l = $('#loupe');
  l.innerHTML = '<div class="cadre"><div class="loupeTete">' +
    '<b>' + esc(f.nom) + '</b>' +
    '<span style="color:var(--sourd);white-space:nowrap">' +
    (f.s || 0).toFixed(1) + 's' + (f.w ? ' · ' + f.w + '×' + f.h : '') +
    '</span><span class="sp"></span>' +
    '<button data-loupe-x="1" title="close (Esc)">⤡</button></div>' +
    media + '</div>';
  l.className = 'on';
}

function reduire() {
  if (!agrandi) return false;
  agrandi = null;
  const l = $('#loupe');
  $$('#loupe video, #loupe audio').forEach(v => {
    v.pause(); v.removeAttribute('src'); v.load();
  });
  l.className = '';
  l.innerHTML = '';
  return true;
}

// Le fond et la croix referment. Un clic DANS le cadre ne doit rien faire :
// on manipule les controles du lecteur.
$('#loupe').addEventListener('click', e => {
  if (e.target.closest('[data-loupe-x]') || e.target.id === 'loupe') reduire();
});

function editerNom(el) {
  const id = el.dataset.nom, f = PAR_ID[id];
  const inp = document.createElement('input');
  inp.className = 'nom'; inp.value = f.nom;
  el.replaceWith(inp); inp.focus(); inp.select();
  let clos = false;
  const fermer = async valider => {
    if (clos) return; clos = true;
    const neuf = inp.value.trim();
    if (valider) await renommerFilm(id, neuf);
    rendreGrille();
  };
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); fermer(true); }
    if (e.key === 'Escape') { e.preventDefault(); fermer(false); }
    e.stopPropagation();
  });
  inp.addEventListener('blur', () => fermer(true));
}

function visionner(id) {
  const f = PAR_ID[id];
  const zone = document.querySelector('[data-media="' + id + '"]');
  if (!zone) return;
  const vignette = i => '<img src="' + posterDe(i) + '" data-poster="' + i +
    '" alt=""><button class="lire" data-lire="' + i + '">▶</button>';
  const liberer = v => { v.pause(); v.removeAttribute('src'); v.load(); };
  if (zone.querySelector('video')) {
    liberer(zone.querySelector('video')); zone.innerHTML = vignette(id); return;
  }
  $$('.media video').forEach(v => {
    const i = v.dataset.dansCarte; liberer(v);
    v.parentElement.innerHTML = vignette(i);
  });
  zone.innerHTML = '<video data-dans-carte="' + id + '" src="' + urlMedia(f) +
    '" controls autoplay loop playsinline preload="metadata"></video>';
}

grille.addEventListener('dragstart', e => {
  const m = e.target.closest('[data-media]');
  if (!m) return;
  const id = m.dataset.media;
  if (!selection.has(id)) { selection.clear(); selection.add(id); rendreGrille(); }
  e.dataTransfer.setData('text/plain',
    JSON.stringify({type: 'films', ids: [...selection]}));
  e.dataTransfer.effectAllowed = 'copyMove';
});

// Clic droit sur une vignette : ou ce rush a-t-il deja servi ? Le meme geste
// qu au clic droit sur un bloc de la timeline, et le meme resultat. #grille
// EST le deck en mode Montage (body.edit #grille) : un seul gestionnaire
// couvre donc la bibliotheque et le deck.
grille.addEventListener('contextmenu', e => {
  const carte = e.target.closest('[data-id]');
  if (!carte) return;
  const id = carte.dataset.id;
  const f = PAR_ID[id];
  if (!f) return;
  e.preventDefault();
  const m = $('#menu');
  // Plusieurs vignettes selectionnees : la couleur les prend toutes, comme
  // sur la timeline.
  const cibles = selection.has(id) && selection.size > 1
    ? [...selection] : [id];
  m.innerHTML = '<div class="lbl">' + echapHtml((f.nom || '').slice(0, 28)) +
    (cibles.length > 1 ? ' · ' + cibles.length + ' clips' : '') +
    '</div><div class="it" data-carte-act="usages">' +
    '⌕ Used in which sequences…</div>' +
    '<div class="sep"></div><div class="lbl">Colour</div><div class="couls">' +
    COULS.map((v, i) => '<span data-carte-coul="' + i + '" style="background:var(' +
      v + ')' + (i === (f.coul || 0) ? ';outline:2px solid var(--encre)' +
      ';outline-offset:1px' : '') + '"></span>').join('') + '</div>';
  m.dataset.carteCibles = cibles.join(',');
  m.dataset.carteId = id;
  m.className = 'on';
  const r = m.getBoundingClientRect();
  m.style.left = Math.min(e.clientX, innerWidth - r.width - 8) + 'px';
  m.style.top = Math.min(e.clientY, innerHeight - r.height - 8) + 'px';
});

$('#menu').addEventListener('click', e => {
  const pc = e.target.closest('[data-carte-coul]');
  if (pc) {
    const l = ($('#menu').dataset.carteCibles || '').split(',').filter(Boolean);
    $('#menu').className = '';
    couleurRush(l, +pc.dataset.carteCoul);
    return;
  }
  const it = e.target.closest('[data-carte-act]');
  if (!it) return;
  const id = $('#menu').dataset.carteId;
  $('#menu').className = '';
  if (it.dataset.carteAct === 'usages' && id) boiteUsages(id);
});

// La couleur d un rush vit dans le catalogue, pas dans le navigateur : elle
// suit le fichier, et se retrouve d une machine a l autre. L affichage bouge
// tout de suite, et se corrige si le disque refuse.
async function couleurRush(ids, i) {
  const avant = ids.map(id => (PAR_ID[id] || {}).coul || 0);
  ids.forEach(id => { if (PAR_ID[id]) PAR_ID[id].coul = i; });
  rendreGrille();
  let rate = 0;
  for (let k = 0; k < ids.length; k++) {
    const f = PAR_ID[ids[k]];
    if (!f) continue;
    try {
      const d = await api('/api/marquer', {projet: f.pj, id: f.id, coul: i});
      Object.assign(f, d.film);
    } catch (err) { f.coul = avant[k]; rate++; }
  }
  if (rate) { rendreGrille(); dire(rate + ' colour(s) not saved', true); }
  else dire(ids.length > 1 ? ids.length + ' clips coloured' : 'clip coloured');
}

// ===========================================================================
//  Projets : ouvrir, fermer, creer, scanner
// ===========================================================================
function memoriserOuverts() {
  pref.ecrire('projets', OUVERTS.map(p => p.nom).join('\t'));
  pref.ecrire('replies', [...REPLIES].join('\t'));
}

// Replier un projet cache ses dossiers dans la colonne, rien d autre : la
// bibliotheque continue d afficher ses clips et le menu deroulant les garde.
function plierProjet(nom) {
  REPLIES.has(nom) ? REPLIES.delete(nom) : REPLIES.add(nom);
  memoriserOuverts();
  rendreDossiers();
}

async function ouvrirProjetDisque(nom, discret) {
  const deja = projetOuvert(nom);
  if (deja) return deja;
  const d = await api('/api/catalogue?projet=' + encodeURIComponent(nom));
  const p = {nom: nom, films: d.films || [], dossiers: d.dossiers || [],
             racine: d.racine_abs || '', besoinScan: !!d.besoin_scan,
             aScanner: d.a_scanner || 0};
  OUVERTS.push(p);
  refondre(); appliquerProfil(); rendre(); memoriserOuverts();
  if (!discret)
    dire('“' + nom + '” opened: ' +
      p.films.filter(f => !f.absent).length + ' clips' +
      (p.besoinScan ? ' — never scanned' : ''));
  return p;
}

// Fermer retire les rushes de la bibliotheque. Les blocs deja poses sur la
// timeline restent la, marques « ? » : on ne detruit pas un montage parce
// qu on a ferme un projet.
function fermerVraiment(nom) {
  OUVERTS = OUVERTS.filter(x => x.nom !== nom);
  if (dossierActif && dossierActif.split('/')[0] === nom) dossierActif = null;
  selection.clear();
  refondre(); appliquerProfil(); rendre(); rendreTimeline(); memoriserOuverts();
  rafraichirProjets();
  dire('“' + nom + '” closed');
}

// Recopie des rushes d un projet dans un autre, puis fait suivre les blocs du
// montage : ils pointent les copies, le montage ne depend plus de la source.
async function copierRushesVers(source, cible, ids, afficher) {
  const suivi = setInterval(async () => {
    try {
      const e = await api('/api/import_etat');
      if (e.etat === 'encours' && afficher)
        afficher(e.fait + '/' + e.total + (e.nom ? ' · ' + e.nom : ''));
    } catch (err) {}
  }, 900);
  try {
    const r = await api('/api/importer',
      {projet: cible, source: source, ids: ids});
    const p = projetOuvert(cible);
    if (p) { p.films = r.films; p.dossiers = r.dossiers; }
    refondre();
    let bouges = 0;
    CLIPS.forEach(c => {
      const neuf = r.corresp[c.film];
      if (!neuf) return;
      c.film = neuf; c.pj = cible; bouges++;
      // le lecteur en memoire pointe encore l ancien fichier : on le jette
      const v = POOL.get(c.uid);
      if (v) { v.pause(); v.removeAttribute('src'); v.load(); POOL.delete(c.uid); }
    });
    if (bouges) modifie = true;
    return {ok: true, bouges: bouges, r: r};
  } catch (err) {
    return {ok: false, message: err.message};
  } finally {
    clearInterval(suivi);
  }
}

async function fermerProjet(nom) {
  if (!projetOuvert(nom)) return;
  const concernes = CLIPS.filter(c => (PAR_ID[c.film] || {}).pj === nom);
  if (!concernes.length) { fermerVraiment(nom); return; }
  const ids = [...new Set(concernes.map(c => c.film))];
  // Ou recopier ? Dans le projet du montage, s il n est pas celui qu on ferme ;
  // sinon dans le premier autre projet ouvert.
  let cible = (PROJET.pj && PROJET.pj !== nom && projetOuvert(PROJET.pj))
    ? PROJET.pj : '';
  if (!cible) {
    const autre = OUVERTS.find(p => p.nom !== nom);
    cible = autre ? autre.nom : '';
  }
  const go = ids.reduce((t, i) => t + ((PAR_ID[i] || {}).m || 0), 0) / 1024;
  const b = $('#boite');
  b.innerHTML = '<h3>Close “' + nom + '”</h3>' +
    '<div style="font-size:12px;line-height:1.55">The current sequence uses <b>' +
    concernes.length + ' block' + (concernes.length > 1 ? 's' : '') +
    '</b> coming from this project — ' + ids.length + ' rush' +
    (ids.length > 1 ? 'es' : '') + ', ' + go.toFixed(2) + ' GB.<br>' +
    (cible
      ? 'I can copy them into <b>' + cible + '</b>: the blocks will follow ' +
        'the copies, the sequence stays playable and the project becomes self-contained.'
      : 'No other project is open: I cannot copy the rushes across. ' +
        'The blocks stay on the timeline but will no longer play.') +
    '</div>' +
    '<div style="margin-top:16px;display:flex;gap:8px;justify-content:flex-end">' +
    '<button id="fAnnule">Cancel</button>' +
    '<button id="fSec">Close without copying</button>' +
    (cible ? '<button id="fCopie" class="on">Copy into ' + cible +
      ', then close</button>' : '') + '</div>';
  $('#voile').className = 'on';
  $('#fAnnule').onclick = () => $('#voile').className = '';
  $('#fSec').onclick = () => { $('#voile').className = ''; fermerVraiment(nom); };
  if (cible) $('#fCopie').onclick = async () => {
    const bt = $('#fCopie');
    [bt, $('#fSec'), $('#fAnnule')].forEach(x => x.disabled = true);
    bt.textContent = 'copying…';
    const res = await copierRushesVers(nom, cible, ids,
      t => bt.textContent = 'copie ' + t);
    $('#voile').className = '';
    if (!res.ok) { dire('could not copy — ' + res.message, true); return; }
    fermerVraiment(nom);
    const nb = (res.r.importes || []).length;
    const ref = (res.r.refus || []).length;
    dire(nb + ' rush' + (nb > 1 ? 'es' : '') + ' copied' +
      ' in ' + cible + '/' + res.r.dossier + ' · ' + res.bouges +
      ' block(s) repointed' +
      (ref ? ' · ' + ref + ' refused' : ''), ref > 0);
  };
}

async function scannerProjet(nom) {
  const p = projetOuvert(nom);
  if (!p) { dire('pick a project in the column first', true); return; }
  let btns = $$('[data-scanner="' + nom + '"]').concat([$('#bScan')]);
  btns.forEach(b => { if (b) { b.disabled = true; b.textContent = 'scanning…'; } });
  // Combien manquaient avant : si ce scan en trouve de nouveaux (des doublons
  // effaces, par exemple), on propose tout de suite de les retirer.
  const manquaientAvant = (p.films || []).filter(f => f.absent).length;
  let disparus = 0;
  const suivi = setInterval(async () => {
    try {
      const e = await api('/api/scan_etat');
      if (e.etat === 'encours' && e.projet === nom)
        btns.forEach(b => { if (b) b.textContent = e.fait + '/' + e.total; });
    } catch (err) {}
  }, 1200);
  try {
    // Un scan peut durer des minutes sur un disque reseau : pas de limite.
    const d = await api('/api/scan?projet=' + encodeURIComponent(nom), null, 0);
    p.films = d.films || []; p.dossiers = d.dossiers || [];
    p.racine = d.racine_abs || p.racine;
    p.besoinScan = false; p.aScanner = 0;
    refondre();
    dire('scanning “' + nom + '” finished: ' +
      p.films.filter(f => !f.absent).length + ' clips');
    disparus = p.films.filter(f => f.absent).length - manquaientAvant;
  } catch (err) { dire('scan failed — ' + err.message, true); }
  clearInterval(suivi);
  const b = $('#bScan'); b.disabled = false; b.textContent = 'Rescan';
  rendre();
  if (PURGE && disparus > 0) {
    const tous = p.films.filter(f => f.absent).length;
    setTimeout(() => retirerManquants([nom], disparus +
      (disparus > 1 ? ' clips have' : ' clip has') + ' disappeared from disk ' +
      'since the last scan' + (tous > disparus ? ' (' + tous +
      ' missing in all)' : '') + '.'), 150);
  }
}

// ===========================================================================
//  Entrer
// ===========================================================================
// Aucun mot de passe ne passe par ici autrement que pour partir au serveur :
// rien n est garde, ni en memoire ni ailleurs. Le serveur n en conserve
// qu une empreinte bcrypt.
function majQui() {
  const q = $('#qui');
  if (!q || !MOI.identifiant) return;
  q.innerHTML = '<span>signed in as <b>' + MOI.identifiant + '</b>' +
    (MOI.admin ? ' · admin' : '') + '</span>' +
    '<button id="bSortir">Sign out</button>';
  $('#bSortir').onclick = async () => {
    try { await api('/api/sortir', {}); } catch (err) {}
    location.reload();
  };
}

async function ouvrirPorte() {
  let m;
  try {
    m = await api('/api/moi');
  } catch (err) {
    return true;          // serveur de bureau : il n y a pas de comptes
  }
  MOI = m;
  document.body.classList.toggle('admin', !!m.admin);
  if (m.identifiant) { majQui(); return true; }

  const amorce = (m.comptes === 0);
  $('#porteTitre').textContent = amorce ? 'Create the administrator'
                                        : 'Sign in';
  $('#portePhrase').textContent = amorce
    ? 'Nobody has an account yet. The first one created is the '
      + 'administrator, and this offer then disappears for good. Do it now, '
      + 'before sharing the link with anyone.'
    : 'This library is private. Ask David for a name and a password.';
  $('#porteMp').setAttribute('autocomplete',
    amorce ? 'new-password' : 'current-password');
  $('#porteOk').textContent = amorce ? 'Create and enter' : 'Enter';
  $('#porte').className = 'on';
  setTimeout(() => $('#porteId').focus(), 50);
  // On ne va pas plus loin : tant qu on n est pas entre, il n y a rien a
  // montrer. Entrer recharge la page, ce qui repart d un etat propre.
  return new Promise(() => {});
}

// ===========================================================================
//  Comptes — administrateur seulement
// ===========================================================================
async function boiteComptes() {
  let l = [];
  try { l = (await api('/api/comptes')).comptes || []; }
  catch (err) { dire('accounts unavailable — ' + err.message, true); return; }
  const b = $('#boite');
  b.innerHTML = '<h3>Accounts</h3>' +
    '<p style="font-size:11px;color:var(--sourd);margin:0 0 12px;' +
    'line-height:1.45">You create the accounts — nobody can create their own. ' +
    'A password is never stored, only a fingerprint of it: even you cannot ' +
    'read someone else’s, only replace it.</p>' +
    l.map(c => '<div class="ligne"><b>' + c.identifiant + '</b><i>' +
      (c.admin ? 'admin · ' : '') + c.cree + '</i>' +
      '<button data-mp="' + c.identifiant + '">password…</button>' +
      (c.identifiant === MOI.identifiant ? ''
        : '<button data-sup="' + c.identifiant + '">✕</button>') +
      '</div>').join('') +
    '<div style="margin-top:14px;display:flex;gap:6px;flex-wrap:wrap;' +
    'align-items:center">' +

// Ce qu un dossier contient, en clair : « 12 videos · 3 sounds · 40 images ».
function contenuDossier(x) {
  const bouts = [];
  if (x.videos) bouts.push(x.videos + (x.videos > 1 ? ' videos' : ' video'));
  if (x.sons) bouts.push(x.sons + (x.sons > 1 ? ' sounds' : ' sound'));
  if (x.images) bouts.push(x.images + (x.images > 1 ? ' images' : ' image'));
  if (!bouts.length) return 'no media';
  return (x.beaucoup ? 'over ' : '') + bouts.join(' · ');
}

// ---- les montages du projet, depuis la colonne -------------------------
// La derniere sequence travaillee. Sans elle, la page s ouvre sur une
// timeline vide et RIEN ne dit que le travail est sauve : il est bien sur le
// serveur, mais on croit l avoir perdu — ce qui est exactement ce qui est
// arrive le 12/09.
function noterDernier(pj, nom) {
  if (pj && nom) pref.ecrire('dernier', pj + '\t' + nom);
}

async function rouvrirDernier() {
  const v = (pref.lire('dernier', '') || '').split('\t');
  if (v.length !== 2 || !v[0] || !v[1]) return;
  const [pj, nom] = v;
  if (!projetOuvert(pj)) return;
  const l = (typeof MONTAGES !== 'undefined' ? MONTAGES : []);
  if (!l.some(m => m.projet === pj && m.nom === nom)) return;
  try {
    const d = await api('/api/montage?projet=' + encodeURIComponent(pj) +
      '&nom=' + encodeURIComponent(nom));
    await chargerProjet(d.montage, d.nom, d.projet);
    dire('“' + nom + '” reopened');
  } catch (err) {
    // Une sequence effacee entre deux sessions ne doit pas gener l ouverture.
  }
}

async function ouvrirMontage(pj, nom) {
  if (nom === projetNom && pj === PROJET.pj) {
    dire('“' + nom + '” is already open'); return;
  }
  await assurerSauvegarde();
  try {
    const d = await api('/api/montage?projet=' + encodeURIComponent(pj) +
      '&nom=' + encodeURIComponent(nom));
    await chargerProjet(d.montage, d.nom, d.projet);
    noterDernier(d.projet || pj, d.nom || nom);
  } catch (err) { dire('could not open — ' + err.message, true); }
}

// « Ajouter » plutot qu « ouvrir » : un simple clic sur la ligne ouvre deja le
// montage, donc le menu sert a en assembler plusieurs. Les blocs viennent se
// poser a la suite de ce qui est deja sur la timeline, sur les memes pistes —
// creees si elles manquent. Rien n est ecrase, et Ctrl+Z defait l ajout d un
// coup.
async function ajouterMontage(pj, nom) {
  let d;
  try {
    d = await api('/api/montage?projet=' + encodeURIComponent(pj) +
      '&nom=' + encodeURIComponent(nom));
  } catch (err) { dire('could not read — ' + err.message, true); return; }
  const p = d && d.montage;
  if (!p || !p.clips || !p.clips.length) {
    dire('“' + nom + '” is empty — nothing to add'); return;
  }
  // Timeline vide : ajouter revient a ouvrir, autant le faire proprement
  // (format, cadence, reperes I/O et nom du montage suivent).
  if (!CLIPS.length) {
    await assurerSauvegarde();
    await chargerProjet(p, d.nom, d.projet);
    return;
  }
  // Les projets dont il a besoin, sinon la moitie des plans arriverait vide.
  const besoins = [...new Set((p.projets || [])
    .concat(p.clips.map(c => c.pj)).concat([p.hote, pj]).filter(Boolean))];
  const absents = [];
  for (const x of besoins) {
    if (projetOuvert(x)) continue;
    try { await ouvrirProjetDisque(x, true); }
    catch (err) { absents.push(x); }
  }
  memoriser();
  const parRel = {};
  FILMS.forEach(f => parRel[f.pj + '|' + f.rel] = f.id);
  // Une piste qui manque est creee, une piste existante est reutilisee : on
  // ne double pas les pistes a chaque ajout.
  const neuves = [];
  const assurerPiste = (id, modele) => {
    const pid = id || 'V1';
    if (piste(pid)) return pid;
    const type = (modele && modele.type) ||
      (String(pid).charAt(0).toUpperCase() === 'A' ? 'a' : 'v');
    const np = {id: pid, type: type, mute: false, solo: false};
    if (modele && modele.vol !== undefined) np.vol = modele.vol;
    PISTES.push(np);
    neuves.push(pid);
    return pid;
  };
  (p.pistes || []).forEach(x => assurerPiste(x.id, x));
  const depart = dureeTotale();
  const liens = {};
  let perdus = 0, n = 0;
  p.clips.forEach(c => {
    const q = {};
    for (const k in c) if (k[0] !== '_') q[k] = c[k];
    if (!q.genre) {
      let film = q.film;
      if (!PAR_ID[film])
        film = parRel[(c.pj || p.hote || pj || '') + '|' + c.fichier] || null;
      q.film = film;
      // Un plan dont le projet est absent reste sur la timeline, marque « ? » :
      // on ne mutile pas un montage parce qu un dossier n est pas la.
      if (!film) perdus++;
    }
    q.uid = uidSuivant++;
    q.t0 = (+q.t0 || 0) + depart;
    q.vitesse = q.vitesse || 1;
    if (q.vitesse < 0) { q.rev = !q.rev; q.vitesse = -q.vitesse; }
    q.rev = !!q.rev;
    q.couleur = q.couleur || 0;
    q.opac = q.opac === undefined ? 1 : q.opac;
    q.fi = q.fi || 0; q.fo = q.fo || 0;
    q.piste = assurerPiste(q.piste);
    // Liens renumerotes : les paires image+son du montage ajoute restent
    // appariees entre elles, sans se coller a celles deja en place.
    if (c.lien) {
      if (!liens[c.lien]) liens[c.lien] = lienLibre();
      q.lien = liens[c.lien];
    } else {
      q.lien = null;
    }
    CLIPS.push(q);
    n++;
  });
  modifie = true;
  rendreTimeline(); resynchroniser(true);
  dire(n + ' block' + (n > 1 ? 's' : '') + ' of “' + nom + '” added' +
    (n > 1 ? 's' : '') + ' at ' + tc(depart) +
    (neuves.length ? ' · track' + (neuves.length > 1 ? 's ' : ' ') +
      neuves.join(' ') + ' created' + (neuves.length > 1 ? 's' : '') : '') +
    (perdus ? ' — ' + perdus + ' shot(s) not found' : '') +
    (absents.length ? ', project ' + absents.join(' and ') + ' missing from disk'
                    : ''), perdus > 0 || absents.length > 0);
}

// Renommage en place d une ligne de dossier. Le nom est change sur le disque ;
// les fiches du dossier et de ses sous-dossiers suivent.
// ---- les trois gestes sur un dossier virtuel ---------------------------
// Un dossier virtuel n est qu une chaine dans une liste. Le renommer, c est
// reecrire cette chaine partout ou elle sert — y compris pour ses
// sous-dossiers, qui la portent en prefixe.
function creerDossierVirtuel(pj, parent, nom) {
  const p = String(nom).trim().replace(/[\/\\:*?"<>|]/g, '-');
  if (!p) return;
  const plein = parent ? parent + '/' + p : p;
  const r = rangementDe(pj);
  if (r.dossiers.includes(plein)) { dire('this folder already exists', true); return; }
  r.dossiers = [...r.dossiers, plein].sort();
  enregistrerRangement(pj).then(() => { refondre(); rendre(); });
  dire('folder created: ' + plein);
}

async function renommerDossierVirtuel(pj, ancien, neuf) {
  const p = String(neuf).trim().replace(/[\/\\:*?"<>|]/g, '-');
  if (!p || p === ancien) return;
  const bouts = ancien.split('/');
  bouts[bouts.length - 1] = p;
  const cible = bouts.join('/');
  const r = rangementDe(pj);
  if (r.dossiers.includes(cible)) { dire('this folder already exists', true); return; }
  const dedans = x => x === ancien || x.startsWith(ancien + '/');
  const change = x => cible + x.slice(ancien.length);
  r.dossiers = r.dossiers.map(x => dedans(x) ? change(x) : x).sort();
  for (const id in r.ou) if (dedans(r.ou[id])) r.ou[id] = change(r.ou[id]);
  if (dossierActif === pj + '/' + ancien) dossierActif = pj + '/' + cible;
  await enregistrerRangement(pj);
  refondre();
  dire('folder renamed: ' + cible);
}

// Effacer un dossier virtuel ne perd RIEN : les rushes qu il contenait
// redeviennent simplement non ranges. C est pour ca qu il n y a pas de
// confirmation — il n y a rien a regretter.
async function effacerDossierVirtuel(pj, rel) {
  if (!rel || rel === NONRANGE) return;
  const r = rangementDe(pj);
  const dedans = x => x === rel || x.startsWith(rel + '/');
  let libres = 0;
  for (const id in r.ou) if (dedans(r.ou[id])) { delete r.ou[id]; libres++; }
  r.dossiers = r.dossiers.filter(x => !dedans(x));
  if (String(dossierActif).startsWith(pj + '/' + rel)) dossierActif = null;
  await enregistrerRangement(pj);
  refondre(); rendre();
  dire('folder removed · ' + libres + ' rush' + (libres > 1 ? 'es' : '') +
    ' back to not filed');
}

function editerDossier(d) {
  const pj = d.dataset.pj, ancien = d.dataset.d, b = d.querySelector('b');
  if (!b) return;
  const inp = document.createElement('input');
  inp.value = ancien; inp.style.width = '100%';

  let clos = false;
  const fermer = async valider => {
    if (clos) return; clos = true;
    const neuf = inp.value.trim();
    if (valider && neuf && neuf !== ancien && VUE === 'rangement') {
      await renommerDossierVirtuel(pj, ancien, neuf);
      rendre();
      return;
    }
    if (valider && neuf && neuf !== ancien) {
      try {
        const r = await api('/api/dossier/renommer',
          {projet: pj, ancien: ancien, nom: neuf});
        const p = projetOuvert(pj);
        if (p) { p.films = r.films; p.dossiers = r.dossiers; refondre(); }
        if (dossierActif === pj + '/' + ancien) dossierActif = pj + '/' + neuf;
        dire('folder renamed: ' + neuf);
      } catch (err) { dire('rename refused — ' + err.message, true); }
    }
    rendre();
  };
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter') fermer(true);
    if (e.key === 'Escape') fermer(false);
    e.stopPropagation();
  });
  inp.addEventListener('blur', () => fermer(true));
}

// ---- effacer un dossier -------------------------------------------------
// Jamais de perte : un dossier vide est retire, un dossier qui contient
// quelque chose part dans <projet>/_corbeille/ et « Annuler disque » le ramene.
async function effacerDossier(pj, rel) {
  const p = projetOuvert(pj);
  if (!p) return;
  const dans = f => f.pj === pj &&
    (f.dossier === rel || String(f.dossier).startsWith(rel + '/'));
  const clips = FILMS.filter(f => dans(f) && !f.absent).length;
  const blocs = CLIPS.filter(c => {
    const f = PAR_ID[c.film];
    return f && dans(f);
  }).length;
  const b = $('#boite');
  b.innerHTML = '<h3>Delete “' + rel + '”</h3>' +
    '<div style="font-size:12px;line-height:1.55">' +
    (clips
      ? 'This folder holds <b>' + clips + ' clip' + (clips > 1 ? 's' : '') +
        '</b>. It goes to <b>' + pj + '/_corbeille/</b>: it leaves the ' +
        'library, <b>nothing is deleted from disk</b>, and “Undo ' +
        'on disk” brings it back.'
      : 'This folder holds no file: it is removed from disk.') +
    (blocs ? '<br><br><b style="color:var(--rouge)">' + blocs + ' block' +
      (blocs > 1 ? 's' : '') + ' of the current sequence</b> come' +
      (blocs > 1 ? '' : 's') + ' from this folder: ' + (blocs > 1 ? 'they' : 'it') +
      ' stay' + (blocs > 1 ? '' : 's') + ' on the timeline but will no longer ' +
      'be playable.' : '') +
    '</div>' +
    '<div style="margin-top:16px;display:flex;gap:8px;justify-content:flex-end">' +
    '<button id="eAnnule">Cancel</button>' +
    '<button id="eOk" class="on">' +
    (clips ? 'Move to trash' : 'Delete') + '</button></div>';
  $('#voile').className = 'on';
  $('#eAnnule').onclick = () => $('#voile').className = '';
  $('#eOk').onclick = async () => {
    const bt = $('#eOk');
    bt.disabled = true; bt.textContent = 'running…';
    try {
      const r = await api('/api/dossier/effacer', {projet: pj, dossier: rel});
      p.films = r.films; p.dossiers = r.dossiers;
      if (dossierActif === pj + '/' + rel ||
          String(dossierActif).startsWith(pj + '/' + rel + '/'))
        dossierActif = pj;
      selection.clear();
      refondre(); appliquerProfil(); rendre(); rendreTimeline();
      // Rien a dire : la boite a annonce ce qui allait se passer, et le
      // dossier vient de disparaitre de la colonne. Seuls les echecs parlent.
    } catch (err) {
      // L operation a pu passer malgre le silence : on relit le projet plutot
      // que de laisser la colonne afficher un dossier qui n existe plus.
      try {
        const c = await api('/api/catalogue?projet=' + encodeURIComponent(pj));
        p.films = c.films; p.dossiers = c.dossiers;
        refondre(); appliquerProfil(); rendre(); rendreTimeline();
      } catch (e2) { /* tant pis : on ne bloque pas pour autant */ }
      dire('delete — ' + err.message, true);
    } finally {
      $('#voile').className = '';
    }
  };
}

  const d = e.target.closest('.dos, .pjt');
  cibles().forEach(x => x.classList.remove('survol'));
  if (!d || !d.dataset.pj) return;
  e.preventDefault();
  let charge;
  try { charge = JSON.parse(e.dataTransfer.getData('text/plain')); }
  catch (err) { return; }
  if (charge.type !== 'films') return;
  // EN RANGEMENT : on ne touche a aucun fichier, on note seulement dans
  // quelle etagere ce rush s affiche. Le meme geste qu au bureau, une
  // consequence entierement differente.
  if (VUE === 'rangement') {
    const pjv = d.dataset.pj;
    const cible = d.dataset.d || '';
    const r = rangementDe(pjv);
    let bouges = 0, etrangers = 0;
    charge.ids.forEach(i => {
      const f = PAR_ID[i];
      if (!f || f.pj !== pjv) { etrangers++; return; }
      if (!cible || cible === NONRANGE) delete r.ou[i];
      else r.ou[i] = cible;
      bouges++;
    });
    if (!bouges) {
      dire('those rushes belong to another project', true);
      return;
    }
    await enregistrerRangement(pjv);
    refondre(); rendre();
    dire(bouges + (bouges > 1 ? ' rushes' : ' rush') +
      (!cible || cible === NONRANGE ? ' unfiled' : ' filed in “' + cible + '”') +
      (etrangers ? ' · ' + etrangers + ' from another project left alone' : ''));
    return;
  }
  // On ne deplace pas un fichier d un projet vers un autre : ce serait sortir
  // un rush de son dossier de tournage. Les intrus sont signales, pas caches.
  const pj = d.dataset.pj;
  const bons = charge.ids.filter(i => (PAR_ID[i] || {}).pj === pj);
  const autres = charge.ids.length - bons.length;
  if (!bons.length) {
    dire('these clips belong to another project — filing stays ' +
      'inside a single project', true);
    return;
  }
  try {
    const r = await api('/api/deplacer',
      {projet: pj, ids: bons, dossier: d.dataset.d});
    const p = projetOuvert(pj);
    if (p) { p.films = r.films; refondre(); }
    rendre();
    const n = r.deplaces.length;
    const queue = (autres ? ' · ' + autres + ' outside the project ignored' : '');
    if (r.refus.length) dire(n + ' moved, ' + r.refus.length + ' refused: ' +
      r.refus.map(x => x.nom + ' — ' + x.cause).join(' · ') + queue, true);
    else dire(n + (n > 1 ? ' clips moved' : ' clip moved') + queue, !!autres);
  } catch (err) { dire('move refused — ' + err.message, true); }
});

// Retirer les fiches MISSING : celles dont le fichier a disparu du disque.
// Un rescan les garde expres — un disque reseau debranche le temps d un scan
// ne doit rien effacer — : les retirer est donc un geste, demande ici. Le
// serveur refuse si aucun fichier du projet n est visible, et garde celles
// qu une sequence utilise encore. Les fichiers, eux, ne sont jamais touches.
async function retirerManquants(noms, raison) {
  const liste = OUVERTS.filter(p => (!noms || noms.includes(p.nom)) &&
    (p.films || []).some(f => f.absent));
  const n = liste.reduce((s, p) => s + p.films.filter(f => f.absent).length, 0);
  if (!n) { dire('no missing clip'); return; }
  if (!confirm((raison || (n + (n > 1 ? ' clips are' : ' clip is') +
      ' no longer on disk (deleted, or moved out of the library).')) +
      '\n\nRemove ' + (n > 1 ? 'them' : 'it') + ' from the library?\n' +
      'The files themselves are not touched. A clip still used in a ' +
      'sequence stays.')) return;
  const b = $('#bPurge');
  b.disabled = true; b.textContent = 'removing…';
  let retires = 0, gardes = 0, revenus = 0;
  const refus = [];
  for (const p of liste) {
    try {
      const d = await api('/api/purger', {projet: p.nom});
      const restent = new Set((d.films || []).map(f => f.id));
      // Ce qui est parti ne doit plus trainer dans l etat de la page : une
      // selection, un rangement renvoye plus tard au serveur.
      for (const f of p.films) {
        if (restent.has(f.id)) continue;
        selection.delete(f.id);
        if (RANGEMENTS[p.nom]) delete RANGEMENTS[p.nom].ou[f.id];
      }
      p.films = d.films || p.films;
      p.dossiers = d.dossiers || p.dossiers;
      retires += d.retires || 0;
      gardes += (d.gardes || []).length;
      revenus += d.revenus || 0;
    } catch (err) { refus.push(p.nom + ': ' + err.message); }
  }
  b.disabled = false;
  refondre(); rendre();
  dire(retires + ' missing clip' + (retires > 1 ? 's' : '') + ' removed' +
    (gardes ? ' · ' + gardes + ' kept: still used in a sequence' : '') +
    (revenus ? ' · ' + revenus + ' back on disk: rescan to see them' : '') +
    (refus.length ? ' · ' + refus.join(' · ') : ''), refus.length > 0);
}
$('#bPurge').onclick = () => retirerManquants(null);
