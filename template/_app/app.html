      '<option value="libre">custom size…</option></select></div>' +
    '<div id="pLibre" style="display:none;gap:8px">' +
    '<input id="pW" type="number" min="64" max="7680" step="2" value="' + PROJET.w +
      '" style="width:88px"> × <input id="pH" type="number" min="64" max="4320" ' +
      'step="2" value="' + PROJET.h + '" style="width:88px"> px</div>' +
    '<div><label style="font-size:11px;color:var(--sourd)">Frame rate</label><br>' +
    '<select id="pFps" style="width:100%">' +
      [23.976, 24, 25, 29.97, 30, 50, 60].map(f => '<option value="' + f + '"' +
        (Math.abs(PROJET.fps - f) < 0.01 ? ' selected' : '') + '>' + f +
        ' fps</option>').join('') + '</select></div>' +
    '<div style="font-size:11px;color:var(--sourd)">' + (neuf
      ? 'The sequence in progress is saved first, then an empty timeline ' +
        'opens with these settings.'
      : 'Shots already placed keep their duration in seconds. The format ' +
        'applies to the monitor, the render and the XML export.') + '</div>' +
    '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:6px">' +
    '<button id="pAnnule">Cancel</button>' +
    '<button id="pOk" class="on">' + (neuf ? 'Create new sequence' : 'Apply') +
    '</button></div></div>';
  $('#voile').className = 'on';
  const maj = () => {
    $('#pLibre').style.display =
      $('#pTaille').value === 'libre' ? 'flex' : 'none';
  };
  $('#pTaille').onchange = maj; maj();
  $('#pAnnule').onclick = () => $('#voile').className = '';
  // Format et cadence tels que la boite les montre.
  const specs = () => {
    let w, h;
    if ($('#pTaille').value === 'libre') {
      w = Math.max(64, Math.min(7680, parseInt($('#pW').value, 10) || 1280));
      h = Math.max(64, Math.min(4320, parseInt($('#pH').value, 10) || 720));
    } else {
      [w, h] = $('#pTaille').value.split('x').map(Number);
    }
    return {w: w - w % 2, h: h - h % 2,
            fps: parseFloat($('#pFps').value) || 24};
  };
  if (!neuf) $('#pOk').onclick = () => {
    PROJET.nom = $('#pNom').value.trim();
    projetNom = PROJET.nom;
    PROJET.pj = $('#pHote').value || PROJET.pj;
    const s = specs();
    PROJET.w = s.w; PROJET.h = s.h; PROJET.fps = s.fps;
    appliquerSpecs(); rendreTimeline();
    $('#voile').className = '';
    dire((PROJET.nom || 'untitled') + ' — ' + PROJET.w + '×' + PROJET.h +
      ' at ' + PROJET.fps + ' i/s');
  };
  else $('#pOk').onclick = async () => {
    const bt = $('#pOk');
    bt.disabled = true;
    const s = specs();
    try {
      await assurerSauvegarde();
      memoriser();
      CLIPS = []; clipsSel.clear(); tIn = null; tOut = null; tLect = 0;
      MARQUEURS = [];
      PISTES = [{id: 'V1', type: 'v', mute: false, solo: false},
                {id: 'A1', type: 'a', mute: false, solo: false}];
      assurerPistes();          // la piste musique revient avec les autres
      const hote = $('#pHote').value || hoteMontage() || PROJET.pj;
      // Jamais le nom d une sequence deja presente dans ce projet : « creer »
      // ne doit pas pouvoir ecraser un montage existant.
      const base = ($('#pNom').value.trim() || 'untitled');
      const pris = x => (typeof MONTAGES !== 'undefined' ? MONTAGES : [])
        .some(m => m.projet === hote && m.nom === x);
      let nom = base, k = 1;
      while (pris(nom) && k < 200) { k++; nom = base + '-' + k; }
      PROJET.nom = nom; projetNom = nom; PROJET.pj = hote;
      PROJET.w = s.w; PROJET.h = s.h; PROJET.fps = s.fps;
      appliquerSpecs();
      modifie = false;
      // On l ECRIT tout de suite. La sauvegarde continue refuse un montage
      // sans bloc — c est voulu, elle ne doit pas semer des brouillons vides —
      // donc une sequence neuve n arrivait jamais sur le disque et
      // n apparaissait dans aucun onglet.
      if (hote) {
        try {
          await api('api/montage',
            {projet: hote, nom: nom, montage: objetProjet()});
          noterDernier(hote, nom);
        } catch (err) {
          dire('new sequence not saved — ' + err.message, true);
        }
      }
      rendreTimeline(); majIO(); resynchroniser(true);
      await rafraichirProjets();
      dire('new sequence: ' + nom + (hote ? ' · ' + hote : ''));
    } finally {
      $('#voile').className = '';
      bt.disabled = false;
    }
  };
}
// Avant de quitter un montage, on l enregistre sans rien demander : changer
// de projet ne doit jamais coûter une boîte de dialogue ni du travail perdu.
// L enregistrement est CONTINU : il n y a plus de bouton « Save ». Le montage
// part sur le disque quelques secondes apres la derniere modification, a
// chaque changement de montage, et une derniere fois quand on ferme l onglet.
// « modifie » reste le seul drapeau, « sauveEnEchec » retient le seul cas ou
// il reste vraiment quelque chose a perdre.
let sauveEnCours = false, sauveEnEchec = false;

async function assurerSauvegarde(silencieux) {
  if (!modifie || !CLIPS.length) return true;
  if (sauveEnCours) return true;
  const nom = projetNom || PROJET.nom || ('brouillon-' + horodate());
  const hote = hoteMontage();
  if (!hote) return false;
  sauveEnCours = true;
  try {
    // Une sequence qui vivait ailleurs (sous un kit, par exemple) change de
    // dossier : elle est ecrite a sa nouvelle place, puis l ancienne copie
    // part a la corbeille de son dossier — rien n est detruit.
    const ancien = (projetNom && PROJET.pj && PROJET.pj !== hote) ? PROJET.pj : '';
    PROJET.pj = hote;
    await api('api/montage',
      {projet: hote, nom: nom, montage: objetProjet()});
    if (ancien) {
      try {
        await api('api/montage/effacer', {projet: ancien, nom: nom});
        rafraichirProjets();
      } catch (e) {}
    }
    const neuf = projetNom !== nom;
    projetNom = nom; PROJET.nom = nom; modifie = false; sauveEnEchec = false;
    noterDernier(hote, nom);
    majEtatSauve();
    // Un montage sans nom vient de s en donner un : la bande et la colonne
    // doivent le montrer.
    if (neuf) { rafraichirProjets(); }
    if (!silencieux) dire('“' + nom + '” saved');
    return true;
  } catch (err) {
    sauveEnEchec = true;
    majEtatSauve();
    dire('autosave failed — ' + err.message, true);
    return false;
  } finally {
    sauveEnCours = false;
  }
}

// Un point à côté du nom tant que le disque n est pas à jour. Discret : c est
// une information, pas une alerte — l enregistrement se fait tout seul.
function majEtatSauve() {
  const n = CLIPS.length;
  const e = $('#mDuree');
  if (!e) return;
  e.textContent = (n ? fmt(dureeTotale()) + ' · ' + n + 'p' : 'empty') +
    (projetNom ? ' · ' + projetNom : '') +
    (modifie ? (sauveEnEchec ? ' · NOT SAVED' : ' ·') : '');
  e.style.color = sauveEnEchec ? 'var(--rouge)' : 'var(--sourd)';
}

// Toutes les 4 s, et seulement s il y a quelque chose a ecrire.
setInterval(() => { if (modifie && CLIPS.length) assurerSauvegarde(true); }, 4000);

// A la fermeture, « keepalive » fait survivre la requete a la page. On part
// avant l adieu au serveur, qui lui ne quitte qu apres cinq secondes.
function sauverAvantDeFermer() {
  if (!modifie || !CLIPS.length) return;
  const hote = hoteMontage();
  if (!hote) return;
  const nom = projetNom || PROJET.nom || ('brouillon-' + horodate());
  try {
    fetch('api/montage', {method: 'POST', keepalive: true,
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({projet: hote, nom: nom, montage: objetProjet()})
    }).catch(() => {});
    modifie = false;
  } catch (e) {}
}

// ---- bande horizontale des montages des projets ouverts ----------------
// Fermer un onglet le retire de la bande, rien de plus : le fichier reste
// dans <projet>/_projet/_montages/ et « Ouvrir » le retrouve. La liste des
// onglets fermes est memorisee d une session a l autre.
let MONTAGES = [];
const clefMontage = m => m.projet + '|' + m.nom;
let FERMES = new Set();
function chargerFermes() {
  FERMES = new Set((pref.lire('montagesFermes', '') || '')
    .split('\t').filter(Boolean));
}
function noterFermes() {
  pref.ecrire('montagesFermes', [...FERMES].join('\t'));
}
async function rafraichirProjets() {
  const b = $('#barreProjets');
  if (!OUVERTS.length) {
    b.innerHTML = '<span class="et">Sequences</span>' +
      '<span style="color:var(--sourd);font-size:11px">no project open</span>';
    return;
  }
  MONTAGES = await listerMontages();
  chargerFermes();
  MONT_OUVERTS = new Set((pref.lire('montOuverts', '') || '')
    .split('\t').filter(Boolean));
  rendreDossiers();
  const actif = m => m.nom === projetNom && m.projet === PROJET.pj;
  // Le montage ouvert reste toujours visible, meme si son onglet a ete ferme.
  const visibles = MONTAGES.filter(m => actif(m) || !FERMES.has(clefMontage(m)));
  const caches = MONTAGES.length - visibles.length;
  b.innerHTML = '<span class="et">Sequences</span>' +
    (visibles.length ? visibles.map(m =>
      '<span class="pu ' + (actif(m) ? 'on' : '') + '" data-p="' +
      m.nom.replace(/"/g, '&quot;') + '" data-pj="' + m.projet +
      '" title="' + m.projet + ' · modified on ' + m.maj + '">' +
      m.projet + ' / ' + m.nom +
      '<b class="x" data-fermerm="' + clefMontage(m).replace(/"/g, '&quot;') +
      '" title="close this tab — the file stays on disk">×</b>' +
      '</span>').join('')
      : '<span style="color:var(--sourd);font-size:11px">no sequence open</span>') +
    (caches ? '<span class="pu rouvrir" data-rouvrir="1" title="click: reopen all ' +
      '— right-click: choose">⟲ ' + caches + ' closed' +
      (caches > 1 ? 's' : '') + '</span>' : '') +
    '<span class="pu neuf" data-nouveau="1" title="create a new sequence">' +
    '+ new</span>' +
    '<span class="pu neuf" data-recharger="1" title="refresh the list">↻</span>';
}

// ---- clic droit sur la bande : gerer les onglets en lot -----------------
// Le chip « N fermés » ouvre ce menu, mais la bande entiere y repond : sans
// ca « fermer tous les autres » serait injoignable tant qu aucun onglet n est
// ferme, puisque le chip n existe pas encore.
const echap = x => String(x === undefined || x === null ? '' : x)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
const estActif = m => m.nom === projetNom && m.projet === PROJET.pj;
const ongletsFermes = () =>
  MONTAGES.filter(m => !estActif(m) && FERMES.has(clefMontage(m)));

$('#barreProjets').addEventListener('contextmenu', e => {
  const nf = ongletsFermes().length;
  // Rien de fermé : rien à proposer, on laisse le menu du navigateur.
  if (!nf) return;
  e.preventDefault();
  const m = $('#menu');
  m.innerHTML = '<div class="lbl">Closed tabs</div>' +
    '<div class="it" data-bar="tout">⟲ ' + (nf > 1
      ? 'Reopen the ' + nf + ' closed' : 'Reopen the closed tab') + '</div>' +
    '<div class="it" data-bar="choisir">☑ Choose which to reopen…</div>';
  m.className = 'on';
  const r = m.getBoundingClientRect();
  m.style.left = Math.min(e.clientX, innerWidth - r.width - 8) + 'px';
  m.style.top = Math.min(e.clientY, innerHeight - r.height - 8) + 'px';
});

// Les entrees portent « data-bar » et non « data-act » : le menu est partage
// avec celui des blocs, dont le gestionnaire ne cherche que « data-act » et
// ne verra donc rien ici.
$('#menu').addEventListener('click', e => {
  const it = e.target.closest('[data-bar]');
  if (!it) return;
  const a = it.dataset.bar;
  $('#menu').className = '';
  if (a === 'tout') {
    const n = ongletsFermes().length;
    FERMES.clear(); noterFermes(); rafraichirProjets();
    dire(n + ' tab' + (n > 1 ? 's reopened' : ' reopened'));
  } else if (a === 'choisir') {
    boiteRouvrir();
  }
});

// Choisir lesquels rouvrir. Rien n est touche sur le disque : on ne fait
// qu enlever des clefs de FERMES, et la bande se redessine.
function boiteRouvrir() {
  const caches = ongletsFermes();
  if (!caches.length) { dire('no closed tab'); return; }
  const b = $('#boite');
  const parProjet = {};
  caches.forEach(m => {
    (parProjet[m.projet] = parProjet[m.projet] || []).push(m);
  });
  b.innerHTML = '<h3>Reopen tabs</h3>' +
    '<div style="display:flex;flex-direction:column;gap:11px">' +
    '<div style="font-size:11px;color:var(--sourd);line-height:1.5">' +
    caches.length + ' tab' + (caches.length > 1 ? 's closed' : ' closed') +
    '. All the files are in <code>_projet/_montages/</code>: ticking only ' +
    'only brings them back into the bar.</div>' +
    '<div style="display:flex;gap:8px">' +
    '<button id="roTout">Check all</button>' +
    '<button id="roRien">Uncheck all</button></div>' +
    '<div style="max-height:44vh;overflow:auto;border:1px solid var(--trait);' +
    'border-radius:5px;padding:6px 8px">' +
    Object.keys(parProjet).sort().map(pj =>
      '<div style="font:10px/2 ui-monospace,monospace;letter-spacing:.11em;' +
      'text-transform:uppercase;color:var(--sourd)">' + echap(pj) + '</div>' +
      parProjet[pj].map(m =>
        '<label style="display:flex;align-items:center;gap:8px;padding:3px 2px;' +
        'cursor:pointer;font-size:12px">' +
        '<input type="checkbox" class="roC" value="' +
        echap(clefMontage(m)) + '" checked>' +
        '<span style="flex:1;min-width:0;overflow:hidden;white-space:nowrap;' +
        'text-overflow:ellipsis">' + echap(m.nom) + '</span>' +
        '<i style="font-style:normal;color:var(--sourd);font-size:10px;' +
        'flex:0 0 auto">' + echap(m.maj) + '</i></label>').join('')).join('') +
    '</div>' +
    '<div style="display:flex;gap:8px;justify-content:flex-end">' +
    '<button id="roAnnule">Cancel</button>' +
    '<button id="roOk" class="on">Reopen</button></div></div>';
  $('#voile').className = 'on';
  const cases = () => [...b.querySelectorAll('.roC')];
  const majOk = () => {
    const n = cases().filter(c => c.checked).length;
    const ok = $('#roOk');
    ok.textContent = n ? 'Reopen ' + n + ' tab' + (n > 1 ? 's' : '')
                       : 'Reopen';
    ok.disabled = !n;
  };
  cases().forEach(c => c.onchange = majOk);
  $('#roTout').onclick = () => { cases().forEach(c => c.checked = true); majOk(); };
  $('#roRien').onclick = () => { cases().forEach(c => c.checked = false); majOk(); };
  $('#roAnnule').onclick = () => { $('#voile').className = ''; };
  $('#roOk').onclick = () => {
    const pris = cases().filter(c => c.checked).map(c => c.value);
    if (!pris.length) return;
    pris.forEach(k => FERMES.delete(k));
    noterFermes();
    $('#voile').className = '';
    rafraichirProjets();
    dire(pris.length + ' tab' + (pris.length > 1 ? 's reopened' : ' reopened'));
  };
  majOk();
}

$('#barreProjets').addEventListener('click', async e => {
  const croix = e.target.closest('[data-fermerm]');
  if (croix) {
    e.stopPropagation();
    FERMES.add(croix.dataset.fermerm);
    noterFermes();
    rafraichirProjets();
    dire('tab closed — the file stays in _projet/_montages/');
    return;
  }
  if (e.target.dataset.rouvrir) {
    FERMES.clear(); noterFermes(); rafraichirProjets(); return;
  }
  if (e.target.dataset.recharger) { rafraichirProjets(); return; }
  if (e.target.dataset.nouveau) { boiteProjet(true); return; }
  const el = e.target.closest('[data-p]');
  const nom = el && el.dataset.p, pj = el && el.dataset.pj;
  if (!nom) return;
  if (nom === projetNom && pj === PROJET.pj) {
    dire('“' + nom + '” is already open'); return;
  }
  await assurerSauvegarde();
  try {
    const d = await api('api/montage?projet=' + encodeURIComponent(pj) +
      '&nom=' + encodeURIComponent(nom));
    await chargerProjet(d.montage, d.nom, d.projet);
    noterDernier(d.projet || pj, d.nom || nom);
  } catch (err) { dire('could not open — ' + err.message, true); }
});

// Seul moment ou l on previent : la fermeture de l onglet ou du navigateur.
// L enregistrement etant continu, il n y a plus rien a perdre en fermant —
// sauf si la derniere ecriture a echoue. C est le seul cas ou on previent.
addEventListener('beforeunload', e => {
  if (!sauveEnEchec || !CLIPS.length) return;
  e.preventDefault();
  e.returnValue = '';
});

// ---- le serveur s arrête quand on ferme l onglet -----------------------
// La page bat la mesure toutes les 5 s. À la fermeture elle prévient, et le
// serveur attend 5 s avant de sortir : un simple rechargement reprend la main
// dans la seconde et ne tue rien. Si le navigateur part sans prévenir, le
// silence prolongé suffit — c est le filet côté serveur.
let JETON = '';
setInterval(() => {
  // En ligne il n y a pas de processus a tenir eveille : la mesure ne sert
  // qu au serveur de bureau, qui s arrete quand l onglet se ferme.
  if (!ENLIGNE) fetch('api/vivant', {cache: 'no-store'}).catch(() => {});
}, 5000);
// Un retour d onglet (ou un reveil de machine) rebat la mesure sans attendre
// les 5 s du minuteur : c est ce qui annule un adieu parti pour rien.
addEventListener('pageshow', () => {
  adieuEnvoye = false;
  if (!ENLIGNE) fetch('api/vivant', {cache: 'no-store'}).catch(() => {});
});
// L adieu part sur « pagehide » ET sur « beforeunload » : selon la facon dont
// l onglet est ferme, l un des deux peut ne pas se declencher. Un drapeau
// evite le double envoi, et le serveur attend 5 s de toute facon — un
// rechargement reprend la main avant l echeance et annule le depart.
let adieuEnvoye = false;
function direAdieu() {
  if (adieuEnvoye || !JETON) return;
  adieuEnvoye = true;
  const corps = JSON.stringify({jeton: JETON});
  try {
    if (navigator.sendBeacon) {
      navigator.sendBeacon('api/adieu',
        new Blob([corps], {type: 'application/json'}));
      return;
    }
  } catch (e) {}
  // Pas de sendBeacon : un fetch « keepalive » survit a la fermeture.
  try {
    fetch('api/adieu', {method: 'POST', body: corps, keepalive: true,
      headers: {'Content-Type': 'application/json'}}).catch(() => {});
  } catch (e) {}
}
// « beforeunload » se declenche aussi quand la fermeture peut encore etre
// annulee (le message « modifications non enregistrees »). Si la page est
// toujours la une seconde plus tard, c est qu on est reste : on rebat la
// mesure, ce qui annule l adieu cote serveur. Un minuteur pose juste avant
// une vraie fermeture ne se declenche jamais.
function adieuPeutEtreAnnule() {
  setTimeout(() => {
    adieuEnvoye = false;
    if (!ENLIGNE) fetch('api/vivant', {cache: 'no-store'}).catch(() => {});
  }, 900);
}
addEventListener('pagehide', () => { sauverAvantDeFermer(); direAdieu(); });
addEventListener('beforeunload', () => {
  sauverAvantDeFermer(); direAdieu(); adieuPeutEtreAnnule();
});

$('#bProjet').onclick = () => boiteProjet(false);
// Un seul bouton pour les trois sorties : le menu s ouvre sous lui.
// Les entrees portent « data-exp », jamais « data-act » : #menu est partage
// avec le menu des blocs, dont le gestionnaire ne cherche que « data-act ».
$('#bExport').onclick = e => {
  const m = $('#menu');
  m.innerHTML = '<div class="lbl">Export the sequence</div>' +
    // Le film : en ligne, enregistre dans ce navigateur (temps reel) ; au
    // bureau, le rendu ffmpeg en pleine qualite (le bouton Render).
    '<div class="it" data-exp="mp4">⏺ MP4 film<span class="pousse" ' +
    'style="color:var(--sourd);font-size:10px">' + (ENLIGNE
      ? 'recorded here, in real time' : 'full quality render') + '</span></div>' +
    '<div class="sep"></div>' +
    '<div class="it" data-exp="json">↓ JSON<span class="pousse" ' +
    'style="color:var(--sourd);font-size:10px">the timeline as data</span></div>' +
    '<div class="it" data-exp="xml">↓ XML<span class="pousse" ' +
    'style="color:var(--sourd);font-size:10px">Premiere / Resolve</span></div>' +
    '<div class="sep"></div>' +
    '<div class="it" data-exp="ffmpeg">⧉ ffmpeg commands<span class="pousse" ' +
    'style="color:var(--sourd);font-size:10px">to the clipboard</span></div>';
  m.className = 'on';
  const r = m.getBoundingClientRect();
  const b = e.currentTarget.getBoundingClientRect();
  m.style.left = Math.min(b.left, innerWidth - r.width - 8) + 'px';
  m.style.top = Math.max(8, b.top - r.height - 6) + 'px';
};
$('#menu').addEventListener('click', e => {
  const it = e.target.closest('[data-exp]');
  if (!it) return;
  $('#menu').className = '';
  const a = it.dataset.exp;
  if (a === 'mp4') bRendre.onclick();
  else if (a === 'json') exporterJson();
  else if (a === 'xml') exporterXml();
  else if (a === 'ffmpeg') exporterFfmpeg();
});
$('#voile').addEventListener('click', e => {
  if (e.target.id === 'voile') $('#voile').className = '';
});
</script>
<script>
// ===========================================================================
//  Exports
// ===========================================================================
// Chaque projet a sa racine absolue sur le disque : l export XML doit ecrire
// le bon chemin pour chaque plan, pas une racine unique.
const racineDe = pj => (projetOuvert(pj) || {}).racine || '';
const img = s => Math.round(s * PROJET.fps);
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
  .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const horodate = () =>
  new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-');

function telecharger(nom, texte, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([texte], {type: type}));
  a.download = nom;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

function clipsDansBornes() {
  const {a, b} = bornes();
  return CLIPS.filter(c => fin(c) > a + 0.001 && c.t0 < b - 0.001);
}

// « avecMasques » : pour le rendu seulement, chaque masque part aussi en
// image (PNG a la taille de sortie). Les exports n en ont pas besoin.
function objetMontage(avecMasques) {
  const {a, b} = bornes();
  return {
    genere: new Date().toISOString(), racine: hoteMontage(), nom: PROJET.nom,
    fps: PROJET.fps, format: {w: PROJET.w, h: PROJET.h},
    entree: +a.toFixed(3), sortie: +b.toFixed(3),
    duree: +(b - a).toFixed(3),
    pistes: PISTES.map(p => ({id: p.id, type: p.type, mute: p.mute,
                              solo: p.solo, vol: volPiste(p)})),
    plans: clipsDansBornes().sort((x, y) => x.t0 - y.t0).map(c => {
      const f = PAR_ID[c.film] || {};
      return {piste: c.piste, projet: f.pj || c.pj || '',
              fichier: f.rel || c.fichier || '', nom: f.nom,
              genre: c.genre || '', fond: c.fond || '',
              texte: c.genre === 'texte' ? String(c.txt || '') : '',
              police: c.police || '', ttf: c.genre === 'texte'
                // La clef d une typo de bibliotheque EST son nom de fichier :
                // si elle n est pas chargee pour l instant, on garde quand
                // meme la reference, sinon un enregistrement ferait perdre
                // la typo pour de bon.
                ? (POLICES[c.police] ? POLICES[c.police].ttf
                   : (/\.[A-Za-z0-9]{2,5}$/.test(c.police || '') ? c.police
                      : POLICES[POLICE_DEFAUT].ttf))
                : '',
              taille: c.taille || 0, teinte: c.teinte || '',
              ombre: c.ombre !== false,
              position: +c.t0.toFixed(3), entree: +c.e.toFixed(3),
              sortie: +c.o.toFixed(3), duree: +dur(c).toFixed(3),
              vitesse: vAbs(c), rev: !!c.rev, couleur: c.couleur || 0,
              gain: c.gain, opacite: c.opac === undefined ? 1 : c.opac,
              lien: c.lien, anim: c.anim || null, fx: fxRendu(c),
              masque: masqueActif(c) ? c.masque : null,
              gel: estGel(c) ? c.gel : undefined,
              masque_png: avecMasques && masqueActif(c) ? pngMasque(c)
                                                        : undefined,
              fondu_entree: +(c._fIn || 0).toFixed(3),
              fondu_sortie: +(c._fOut || 0).toFixed(3),
              cadrage: {mode: c.mode, echelle: c.ech, dx: c.dx, dy: c.dy,
                        shk: !!c.shk,
                        shks: couchesShk(c).map(p => ({
                          f: p.f === undefined ? SHK_F : p.f,
                          a: p.a === undefined ? SHK_A : p.a,
                          r: p.r === undefined ? SHK_R : p.r,
                          i: p.i || 0, o: p.o || 0,
                          on: coucheActive(p)}))}};
    })
  };
}

function versXml() {
  const rate = '<rate><timebase>' + PROJET.fps +
    '</timebase><ntsc>FALSE</ntsc></rate>';
  const vus = {};
  let nf = 0;
  // Une image fixe n a pas de duree : pour Premiere, sa « source » dure
  // autant que le plus long bloc qui la montre — sinon il la couperait.
  const dureeSource = f => f.image
    ? Math.max(1, ...CLIPS.filter(x => x.film === f.id).map(x => dur(x)))
    : (f.s || 0);
  const fichier = c => {
    const f = PAR_ID[c.film];
    if (!f) return '<file id="f0"/>';
    if (vus[f.id]) return '<file id="' + vus[f.id] + '"/>';
    const fid = 'f' + (++nf);
    vus[f.id] = fid;
    const racine = racineDe(f.pj).replace(/\\/g, '/').replace(/\/$/, '');
    const chemin = racine
      ? 'file://localhost/' + encodeURI(racine + '/' + f.rel)
      : encodeURI(f.rel);
    return '<file id="' + fid + '"><name>' + esc(f.nom + f.ext) + '</name>' +
      '<pathurl>' + chemin + '</pathurl>' + rate +
      '<duration>' + img(dureeSource(f)) + '</duration><media><video>' +
      '<samplecharacteristics><width>' + (f.w || 1280) + '</width><height>' +
      (f.h || 720) + '</height></samplecharacteristics></video>' +
      (f.a ? '<audio><channelcount>2</channelcount></audio>' : '') + '</media></file>';
  };
  const {a: bA} = bornes();
  const item = (c, i, audio, niveau) => {
    const f = PAR_ID[c.film] || {};
    const v = vSignee(c);
    return '<clipitem id="clip' + i + '"><name>' + esc(f.nom || 'shot') + '</name>' +
      '<duration>' + img(dureeSource(f)) + '</duration>' + rate +
      '<start>' + img(c.t0 - bA) + '</start><end>' + img(fin(c) - bA) + '</end>' +
      '<in>' + img(c.e) + '</in><out>' + img(c.o) + '</out>' +
      (v !== 1 ? '<filter><effect><name>Time Remap</name><effectid>timeremap</effectid>' +
        '<parameter><parameterid>speed</parameterid><name>speed</name>' +
        '<value>' + Math.round(v * 100) + '</value></parameter></effect></filter>' : '') +
      (audio && Math.abs((niveau || 1) - 1) > 0.005
        ? '<filter><effect><name>Audio Levels</name>' +
          '<effectid>audiolevels</effectid><effecttype>audiolevels</effecttype>' +
          '<mediatype>audio</mediatype><parameter><parameterid>level' +
          '</parameterid><name>Level</name><valuemin>0</valuemin>' +
          '<valuemax>3.98108</valuemax><value>' + (niveau || 1).toFixed(4) +
          '</value></parameter></effect></filter>' : '') +
      fichier(c) +
      (audio ? '<sourcetrack><mediatype>audio</mediatype><trackindex>1</trackindex>' +
               '</sourcetrack>' : '') + '</clipitem>';
  };
  // Un calque ou un texte n a pas de fichier sur le disque : l ecrire dans un
  // xmeml donnerait un clip hors-ligne dans Premiere. On les laisse de cote,
  // et le bouton XML le dit.
  const dedans = clipsDansBornes().filter(c => !estSynth(c));
  let n = 0, pv = '', pa = '';
  PISTES.filter(p => p.type === 'v')
    .sort((x, y) => numPiste(x.id) - numPiste(y.id)).forEach(p => {
      const l = dedans.filter(c => c.piste === p.id).sort((x, y) => x.t0 - y.t0);
      pv += '<track>' + l.map(c => item(c, ++n, false)).join('') +
        '<enabled>' + (p.mute ? 'FALSE' : 'TRUE') + '</enabled></track>';
    });
  PISTES.filter(p => p.type === 'a')
    .sort((x, y) => numPiste(x.id) - numPiste(y.id)).forEach(p => {
      const l = dedans.filter(c => c.piste === p.id).sort((x, y) => x.t0 - y.t0);
      pa += '<track>' + l.map(c =>
        item(c, ++n, true, (c.gain === undefined ? 1 : c.gain) * volPiste(p))
      ).join('') +
        '<enabled>' + (p.mute ? 'FALSE' : 'TRUE') + '</enabled></track>';
    });
  const {a, b} = bornes();
  return '<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE xmeml>\n' +
    '<xmeml version="4"><sequence id="gary"><name>' +
    esc(projetNom || 'GARY-ALL sequence') + '</name>' +
    '<duration>' + img(b - a) + '</duration>' + rate +
    '<media><video><format><samplecharacteristics>' + rate +
    '<width>' + PROJET.w + '</width><height>' + PROJET.h +
    '</height></samplecharacteristics></format>' +
    pv + '</video><audio>' + pa + '</audio></media></sequence></xmeml>';
}

function exporterFfmpeg() {
  const dedans = clipsDansBornes();
  if (!dedans.length) { dire('nothing between the marks'); return; }
  const pv = pistesOrdonnees().find(p => p.type === 'v' && visible(p));
  const l = dedans.filter(c => c.piste === (pv ? pv.id : 'V1'))
    .sort((a, b) => a.t0 - b.t0);
  if (!l.length) { dire('no shot on the visible video track'); return; }
  const cmd = l.map((c, i) => {
    const f = PAR_ID[c.film], v = vAbs(c);
    const arriere = estRev(c) ? ',reverse' : '';
    const T = PROJET.w + ':' + PROJET.h;
    const cadre = c.mode === 'cover'
      ? 'scale=' + T + ':force_original_aspect_ratio=increase,crop=' + T
      : 'scale=' + T + ':force_original_aspect_ratio=decrease,pad=' + T + ':-1:-1';
    const vit = arriere + (v !== 1 ? ',setpts=' + (1 / v).toFixed(4) + '*PTS'
                                   : '');
    const lie = c.lien && CLIPS.some(x => x.lien === c.lien && piste(x.piste).type === 'a');
    return 'ffmpeg -ss ' + c.e.toFixed(3) + ' -to ' + c.o.toFixed(3) +
      ' -i "' + f.rel + '" -vf "' + cadre + vit + '" -r ' + PROJET.fps + ' ' +
      (lie ? '-c:a aac -b:a 192k -af atempo=' + Math.min(2, Math.max(0.5, v)) : '-an') +
      ' -c:v libx264 -crf 18 -pix_fmt yuv420p -y plan-' +
      String(i + 1).padStart(3, '0') + '.mp4';
  });
  cmd.push('', '# liste.txt:');
  l.forEach((c, i) => cmd.push("#   file 'plan-" + String(i + 1).padStart(3, '0') + ".mp4'"));
  cmd.push('ffmpeg -f concat -safe 0 -i liste.txt -c copy montage.mp4',
    '# NB: hard cuts only. For fades and multitrack,',
    '#      use the Render button or the XML export.');
  const t = cmd.join('\n');
  navigator.clipboard.writeText(t)
    .then(() => dire('ffmpeg commands copied'))
    .catch(() => { console.log(t); dire('copy refused — see the console', true); });
};

const bRendre = $('#bRendre');

const rendreJauge = bRendre.querySelector('.jauge');

// Un seul endroit qui touche à l aspect du bouton : libellé, couleur, jauge.
function etatRendu(txt, part) {
  rendreTxt.textContent = txt;
  bRendre.classList.toggle('encours', part !== null && part !== undefined);
  rendreJauge.style.width = (part === null || part === undefined)
    ? '0%' : Math.round(Math.max(0, Math.min(1, part)) * 100) + '%';
}

let renduEnCours = false;
const TYPES_RENDU = [
  ['mp4',   'MP4 · picture + sound', 'Picture and sound, hard cuts and cross dissolves.'],
  ['video', 'Picture only',       'Same picture, no audio track in the file.'],
  ['audio', 'Sound only',          'Only the sound linked to the shots. Output .wav ' +
                                 '(or .m4a if you give that extension).']
];

// ---- Export dans le navigateur (1.3.21) ------------------------------------
// En ligne il n y a pas de ffmpeg : « Render » rejoue la sequence et enregistre
// ce que montre le moniteur, avec le son mixe, dans un fichier video que le
// navigateur telecharge. En temps reel (6 min de montage = 6 min), a la
// definition des copies en ligne (720p) — de quoi verifier et envoyer, pas un
// master. Marche aussi sur Mac (Safari, Chrome). Un second clic arrete.
let EXPORT_W = 0, EXPORT_NAV = null, AUDIO_EXPORT = null;

// Le son d un lecteur passe par le mixeur de l export, et toujours vers les
// haut-parleurs. Un lecteur ne se branche qu une fois : le navigateur refuse
// de le faire deux fois, et une fois branche il ne sort plus que par la.
function brancherSon(v) {
  if (!AUDIO_EXPORT || v._branche) return;
  try {
    const s = AUDIO_EXPORT.ctx.createMediaElementSource(v);
    s.connect(AUDIO_EXPORT.dest);
    s.connect(AUDIO_EXPORT.ctx.destination);
    v._branche = true;
  } catch (e) {}
}

function typeExport() {
  const l = ['video/mp4;codecs=avc1.42E01E,mp4a.40.2', 'video/mp4',
             'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus',
             'video/webm'];
  return l.find(x => { try { return MediaRecorder.isTypeSupported(x); }
                       catch (e) { return false; } }) || '';
}

async function exporterNavigateur() {
  if (EXPORT_NAV) { EXPORT_NAV.finir(true); return; }
  if (!CLIPS.length) { dire('the timeline is empty'); return; }
  const Ctx = window.AudioContext || window.webkitAudioContext;
  const type = window.MediaRecorder && moni.captureStream && Ctx ? typeExport() : '';
  if (!type) { dire('this browser cannot record video — try Chrome, Edge or Safari', true); return; }
  await assurerSauvegarde(true);
  pause();
  const a = tIn !== null ? tIn : 0, b = tOut !== null ? tOut : dureeTotale();
  if (b - a < 0.1) { dire('nothing to export', true); return; }
  if (!AUDIO_EXPORT) {
    const c = new Ctx();
    AUDIO_EXPORT = {ctx: c, dest: c.createMediaStreamDestination()};
  }
  // Sans un vrai clic, le navigateur laisse le son en attente indefiniment :
  // on n attend pas plus d une seconde et demie.
  try {
    await Promise.race([AUDIO_EXPORT.ctx.resume(),
                        new Promise(r => setTimeout(r, 1500))]);
  } catch (e) {}
  for (const v of POOL.values()) brancherSon(v);
  EXPORT_W = Math.min(PROJET.w, 1280) & ~1;
  dimensionnerMoniteur();
  const boucle = boucleIO;
  boucleIO = false;
  tLect = a; majTete(); resynchroniser(true); dessiner();
  // Le temps que les lecteurs se placent sur la premiere image.
  await new Promise(r => setTimeout(r, 900));
  const image = moni.captureStream(Math.max(12, Math.min(60, PROJET.fps || 25)));
  const flux = new MediaStream([...image.getVideoTracks(),
                                ...AUDIO_EXPORT.dest.stream.getAudioTracks()]);
  const rec = new MediaRecorder(flux, {mimeType: type, videoBitsPerSecond: 8000000,
                                       audioBitsPerSecond: 192000});
  const morceaux = [];
  rec.ondataavailable = e => { if (e.data && e.data.size) morceaux.push(e.data); };
  const nom = (projetNom || PROJET.nom || 'sequence').replace(/[\/:*?"<>|]/g, '-');
  const ext = type.indexOf('mp4') >= 0 ? '.mp4' : '.webm';
  let fini = false, minuteur = null;
  const finir = annule => {
    if (fini) return;
    fini = true;
    clearInterval(minuteur);
    pause();
    rec.onstop = () => {
      image.getTracks().forEach(x => x.stop());
      EXPORT_W = 0; EXPORT_NAV = null; boucleIO = boucle;
      dimensionnerMoniteur(); dessiner();
      etatRendu(ENLIGNE ? '⏺ Export MP4' : '⏺ Render', null);
      if (annule) { dire('export stopped — nothing was saved'); return; }
      const blob = new Blob(morceaux, {type: type.split(';')[0]});
      const lien = document.createElement('a');
      lien.href = URL.createObjectURL(blob);
      lien.download = nom + ext;
      lien.click();
      setTimeout(() => URL.revokeObjectURL(lien.href), 60000);
      dire('“' + nom + ext + '” downloaded (' +
           (blob.size / 1048576).toFixed(1) + ' MB)');
    };
    try { rec.stop(); } catch (e) { rec.onstop(); }
  };
  EXPORT_NAV = {finir: finir};
  // Un onglet cache n avance plus : la lecture (et donc l export) attend
  // qu on le remette devant. On le dit, au lieu de laisser croire a un gel.
  const vu = () => { if (document.hidden && EXPORT_NAV)
    dire('export paused while this tab is hidden — bring it back to resume', true); };
  document.addEventListener('visibilitychange', vu);
  const finir0 = finir;
  EXPORT_NAV.finir = x => { document.removeEventListener('visibilitychange', vu); finir0(x); };
  rec.start(1000);
  lire();
  dire('exporting in real time — keep this tab in front; click Render again to stop');
  minuteur = setInterval(() => {
    const part = (tLect - a) / Math.max(0.01, b - a);
    etatRendu('⏹ ' + Math.round(Math.max(0, Math.min(1, part)) * 100) + ' %', part);
    if (!enLecture || tLect >= b - 0.03) EXPORT_NAV && EXPORT_NAV.finir(false);
  }, 200);
}

async function suivreRendu() {
  try {
    const e = await api('api/rendu');
    if (e.etat === 'encours') {
      const t = e.total || 0, f = e.fait || 0;
      // Les segments faits ne comptent que pour les trois quarts : le dernier
      // quart, c est l assemblage, qui n a pas d avancement chiffré.
      etatRendu(f + '/' + (t || '?'), t ? (f / t) * 0.75 : 0.05);
      setTimeout(suivreRendu, 1200);
      return;
    }
    renduEnCours = false;
    etatRendu(ENLIGNE ? '⏺ Export MP4' : '⏺ Render', null);
    if (e.etat === 'fini') dire('render finished → ' + e.fichier);
    else if (e.etat === 'erreur') dire('render failed: ' + (e.message || ''), true);
  } catch (err) {
    renduEnCours = false;
    etatRendu(ENLIGNE ? '⏺ Export MP4' : '⏺ Render', null);
    dire('render tracking lost — ' + err.message, true);
  }
}

(async function () {
  // Le moniteur a grandi par defaut le 11/09. Une largeur memorisee plus
  // ancienne masquerait le changement : on l oublie une fois, et une seule.
  if (pref.lire('dispo', '') !== 'moni2') {
    pref.ecrire('moni', '');
    pref.ecrire('dispo', 'moni2');
  }
  ['aside', 'moni', 'regl', 'footer'].forEach(k => {
    const v = pref.lire(k, null);
    if (v) RACINE_CSS.setProperty(RZ[k].v, v);
  });
  const vd = pref.lire('deck', null);
  if (vd) RACINE_CSS.setProperty('--wDeck', vd);
  appliquerProfil();
  poserUnite(pref.lire('unite', 'sec'));
  appliquerSpecs();
  // Les typos de la bibliotheque avant tout le reste : un montage rouvert
  // doit retrouver la sienne des le premier dessin.
  // Avant tout le reste : y a-t-il des comptes, et suis-je entre ? Sur le
  // serveur de bureau cette route n existe pas, et rien ne change.
  await ouvrirPorte();
  sitesVoisins();
  await chargerPolices();
  // Les prereglages de secousse : ils viennent de la bibliotheque.
  await chargerPresets();
  // Et les couleurs de rangement, avant la premiere grille.
  await chargerCategories();

  try {
    const l = await api('api/projets');
    JETON = l.jeton || '';
    // Le serveur de bureau n envoie aucun de ces trois champs : tout reste
    // exactement comme avant chez David.
    ENLIGNE = !!l.enligne;
    RANGEABLE = ENLIGNE || !!l.rangement;
    PURGE = !ENLIGNE && !!l.purge;
    // En ligne, le navigateur calcule l onde lui-meme (ondeNavigateur).
    ONDE_OK = ENLIGNE ? !!(window.AudioContext || window.webkitAudioContext)
                      : !!l.onde;
    // En ligne, « Render » enregistre le film dans le navigateur : on le dit.
    if (ENLIGNE) {
      $('#bRendre .txt').textContent = '⏺ Export MP4';
      $('#bRendre').title = 'export an MP4 of the sequence, recorded in this ' +
        'browser in real time — keep this tab in front';
    }
    DOSSIERS_OK = !ENLIGNE && !!l.dossiers;
    REVELER_OK = !ENLIGNE && !!l.reveler;
    AJOUT_OK = !ENLIGNE && !!l.ajout;
    $('#bAjoutRush').hidden = !AJOUT_OK;
    SYNCHRO = ENLIGNE ? '' : (l.synchro || '');
    SYNCHRO_QUI = l.synchro_qui || '';
    $('#bSynchro').hidden = !SYNCHRO;
    MAJ_DISPO = !ENLIGNE && !!l.maj;
    if (MAJ_DISPO) {
      // Le bouton apparait tout de suite ; la verification aupres de GitHub
      // se fait en arriere-plan, et le colore s il y a du neuf.
      $('#bMaj').hidden = false;
      if (l.version) $('#bMaj').title = 'version ' + l.version;
      verifierMaj(true);
    }
    LECTURE_SEULE = !!l.lecture_seule;
    TITRE = l.titre || '';
    // Le nom de la bibliotheque est connu : l en-tete et l onglet le portent
    // tout de suite, meme avant qu un projet soit ouvert.
    try { majEntete(); } catch (e) {}
    document.body.classList.toggle('rangeable', RANGEABLE);
    document.body.classList.toggle('lectureseule', LECTURE_SEULE);
    // Le format de la bibliotheque, pour une timeline encore vide. Une
    // sequence rouverte ensuite impose le sien.
    if (Array.isArray(l.format) && l.format.length === 2) {
      PROJET.w = +l.format[0] || PROJET.w;
      PROJET.h = +l.format[1] || PROJET.h;
      // Le moniteur prend tout de suite la bonne proportion : sinon il
      // resterait en 16:9 jusqu au premier reglage touche.
      try { appliquerSpecs(); } catch (e) {}
    }
    document.body.classList.toggle('enligne', ENLIGNE);
    BASE_MEDIA = l.media || '';
    BASE_POSTERS = l.posters || '';
    if ((l.api || 0) < 5) {
      // Un serveur d avant le travail par projet : on n ouvre rien, sinon on
      // afficherait les rushes d un projet sous le nom d un autre.
      $('#alerte').className = 'on';
      $('#alerte').innerHTML = '<b>The server is running an older version.</b>' +
        ' Working by project will not work. ' +
        'Close the black <code>serveur.py</code> window and run ' +
        '<code>LANCER.bat</code> again, then reload this page.' +
        '<button id="alerteX" style="margin-left:auto">Dismiss</button>';
      $('#alerteX').onclick = () => $('#alerte').className = '';
      $('#entete').textContent = 'old server';
      grille.innerHTML = '<div class="vide">Run <b>LANCER.bat</b> again then ' +
        'reload this page.</div>';
    } else {
      // Sans jeton, la page ne peut pas signer l adieu : le serveur en place
      // est anterieur a la fermeture automatique. Ce serait invisible — la
      // page se fermerait, la fenetre noire resterait — donc on le dit.
      if (!JETON && !ENLIGNE) {
        $('#alerte').className = 'on';
        $('#alerte').innerHTML = '<b>The running server will not quit ' +
          'on its own.</b> Its version predates this feature. ' +
          'Close the black <code>serveur.py</code> window and run ' +
          '<code>LANCER.bat</code> again — everything else works meanwhile.' +
          '<button id="alerteJ" style="margin-left:auto">Dismiss</button>';
        $('#alerteJ').onclick = () => { $('#alerte').className = ''; };
      }
      BIBLIS = l.biblis || [];
      CAPTURES_NOM = l.captures || '';
      const dispo = (l.projets || []).map(p => p.nom)
        .filter(n => !estBibli(n) && !estCaptures(n));
      // Ceux de la derniere session, sinon le premier projet deja scanne.
      REPLIES = new Set((pref.lire('replies', '') || '').split('\t')
        .filter(Boolean));
      const sauves = (pref.lire('projets', '') || '').split('\t').filter(Boolean);
      let voulus = sauves.filter(n => dispo.indexOf(n) >= 0);
      // Un projet apparu depuis la derniere visite s ouvre de lui-meme : un
      // dossier renomme disparaissait sinon de la session, son ancien nom
      // n existant plus et le nouveau n ayant jamais ete ouvert (David, 05/10 :
      // EP-11 sans « Vids » apres le renommage de « render »). Ceux qu on a
      // fermes expres restent fermes : ils sont deja connus.
      const connusTxt = pref.lire('connus', null);
      const connus = connusTxt === null ? null : new Set(connusTxt.split('\t'));
      const perdus = sauves.some(n => dispo.indexOf(n) < 0);
      if (voulus.length) {
        voulus = voulus.concat((l.projets || [])
          .filter(p => p.scanne && p.clips && dispo.indexOf(p.nom) >= 0 &&
                       voulus.indexOf(p.nom) < 0 &&
                       (connus ? !connus.has(p.nom) : perdus))
          .map(p => p.nom));
      }
      pref.ecrire('connus', dispo.join('\t'));
      // Premiere visite : tous les projets qui ont des clips. N en ouvrir
      // qu un cachait les rushes derriere « Open a project » (David, 05/10 :
      // EP-06 s ouvrait sur « audio », sans bambozoo-Render).
      if (!voulus.length) {
        voulus = (l.projets || []).filter(p => p.scanne && p.clips &&
                                                dispo.indexOf(p.nom) >= 0)
          .map(p => p.nom);
        if (!voulus.length && dispo.length) voulus = [dispo[0]];
      }
      for (const n of voulus) {
        try { await ouvrirProjetDisque(n, true); }
        catch (err) { dire('“' + n + '” unreadable — ' + err.message, true); }
      }
      // La bibliotheque en dernier : elle doit se poser sous les projets,
      // dans la colonne comme dans la grille.
      for (const n of BIBLIS) {
        try { await ouvrirProjetDisque(n, true); }
        catch (err) { dire('“' + n + '” unreadable — ' + err.message, true); }
      }
      // Les captures du moniteur, tout en bas.
      if (CAPTURES_NOM) {
        try { await ouvrirProjetDisque(CAPTURES_NOM, true); }
        catch (err) { CAPTURES_NOM = ''; }
      }
      // On ouvre sur le premier PROJET, pas sur la musique : sinon la grille
      // s ouvre sur 145 pochettes au lieu des rushes.
      // Le rangement de chacun, projet par projet. Il ne sert qu en ligne.
      for (const p of OUVERTS) await chargerRangement(p.nom);
      // On travaille toujours dans « My folders » : la source ne se consulte
      // qu un moment, par le bouton du titre, et l on y revient a l ouverture.
      if (RANGEABLE) {
        VUE = 'rangement';
        majBoutonSource();
        document.body.classList.toggle('rangement', VUE === 'rangement');
        $$('[data-vue]').forEach(b =>
          b.classList.toggle('on', b.dataset.vue === VUE));
        refondre();
      }
      const prem = OUVERTS.find(x => !estBibli(x.nom) && !estCaptures(x.nom));
      if (prem) dossierActif = prem.nom;
      rendre();
      if (!OUVERTS.length)
        grille.innerHTML = '<div class="vide">No project open.<br>' +
          'Click “+ Open / create a project” on the left.</div>';
    }
  } catch (err) {
    $('#entete').textContent = 'erreur';
    grille.innerHTML = '<div class="vide">Cannot reach the server.<br>' +
      'Check that the black serveur.py window is open.</div>';
  }
  // Toujours les rushes au demarrage : on arrive dans la bibliotheque, pas au
  // milieu d un montage. Le mode reste memorise pour la session en cours, mais
  // il ne decide plus de l ecran d accueil.
  mode('rush');
  rendreTimeline();
  await rafraichirProjets();
  await rouvrirDernier();
  addEventListener('resize', () => {
    majMinimap(); majIO(); dimensionnerMoniteur(); dessiner();
  });
  requestAnimationFrame(boucle);
})();
</script>
</body></html>
