<script>
// ===========================================================================
//  Masque
// ===========================================================================
// Un masque par bloc, dans le CADRE : ses points sont en 0..1 de l image de
// sortie, on le trace sur le moniteur, la ou on le voit. Trois formes — a main
// levee, rectangle, ellipse —, une plume (ecart-type du flou du bord, en % de
// la largeur du cadre) et l inversion. Il s applique APRES les effets du bloc
// et AVANT sa transparence et ses fondus. Le rendu recoit la MEME image,
// tracee ici a la taille de sortie : ce qu on voit est ce qui sort.
var MQ_PLUME = 1, MQ_INV = false;
var MQ_DESSIN = null, mqCle = '', MQ_GESTE = false;
var MQ_TOILES = new Map();

function masqueActif(c) {
  return !!(c && c.masque && c.masque.on !== false &&
            Array.isArray(c.masque.pts) && c.masque.pts.length >= 2);
}
// Les blocs que le masque concerne : la selection, sur les pistes image.
function blocsMasquables() {
  return CLIPS.filter(c => clipsSel.has(c.uid) && piste(c.piste) &&
                           piste(c.piste).type === 'v');
}

function boiteMasque(mq, w, h) {
  const p = mq.pts;
  const x0 = Math.min(p[0][0], p[1][0]) * w, x1 = Math.max(p[0][0], p[1][0]) * w;
  const y0 = Math.min(p[0][1], p[1][1]) * h, y1 = Math.max(p[0][1], p[1][1]) * h;
  return [x0, y0, x1, y1];
}
function cheminMasque(g, mq, w, h) {
  if (mq.forme === 'rect' || mq.forme === 'ellipse') {
    const [x0, y0, x1, y1] = boiteMasque(mq, w, h);
    if (mq.forme === 'rect') g.rect(x0, y0, x1 - x0, y1 - y0);
    else g.ellipse((x0 + x1) / 2, (y0 + y1) / 2, Math.max(0.5, (x1 - x0) / 2),
                   Math.max(0.5, (y1 - y0) / 2), 0, 0, Math.PI * 2);
    return;
  }
  const p = mq.pts, a = mq.anses;
  g.moveTo(p[0][0] * w, p[0][1] * h);
  // Avec des poignees de Bezier (mq.anses[i] = [entree, sortie] ou null) :
  // une courbe entre deux points si l un d eux en a, un trait sinon.
  const seg = (i, j) => {
    if (a && (a[i] || a[j])) {
      const o = a[i] ? a[i][1] : p[i], n = a[j] ? a[j][0] : p[j];
      g.bezierCurveTo(o[0] * w, o[1] * h, n[0] * w, n[1] * h, p[j][0] * w, p[j][1] * h);
    } else g.lineTo(p[j][0] * w, p[j][1] * h);
  };
  for (let i = 1; i < p.length; i++) seg(i - 1, i);
  if (a) seg(p.length - 1, 0);
  g.closePath();
}

// Le masque en alpha : blanc opaque dedans, transparent dehors (l inverse
// s il est inverse), bord adouci par la plume.
function tracerMasque(g, mq, w, h) {
  g.save();
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalAlpha = 1;
  g.globalCompositeOperation = 'source-over';
  g.clearRect(0, 0, w, h);
  const s = Math.max(0, +mq.plume || 0) / 100 * w;
  g.fillStyle = '#fff';
  if (mq.inv) {
    g.fillRect(0, 0, w, h);
    g.globalCompositeOperation = 'destination-out';
  }
  g.filter = s > 0.05 ? 'blur(' + s.toFixed(2) + 'px)' : 'none';
  g.beginPath();
  cheminMasque(g, mq, w, h);
  g.fill();
  g.restore();
}

function toileMasque(c, w, h) {
  const cle = JSON.stringify(c.masque) + '|' + w + 'x' + h;
  const e = MQ_TOILES.get(c.uid);
  if (e && e.cle === cle) return e.tl;
  const tl = (e && e.tl) || document.createElement('canvas');
  tl.width = w; tl.height = h;
  tracerMasque(tl.getContext('2d'), c.masque, w, h);
  MQ_TOILES.set(c.uid, {cle: cle, tl: tl});
  return tl;
}

// Sur une toile ou le bloc est deja pose (et traite), ne garder que ce que
// le masque laisse passer.
function appliquerMasque(tl, c, w, h) {
  if (!masqueActif(c)) return;
  const g = tl.getContext('2d');
  g.save();
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalAlpha = 1;
  g.filter = 'none';
  g.globalCompositeOperation = 'destination-in';
  g.drawImage(toileMasque(c, w, h), 0, 0);
  g.restore();
}

// Pour le rendu : le masque a la taille de sortie, en niveaux de gris
// (blanc = garde), que ffmpeg multiplie a l image ou a l alpha.
function pngMasque(c) {
  const w = PROJET.w, h = PROJET.h;
  const a = document.createElement('canvas');
  a.width = w; a.height = h;
  tracerMasque(a.getContext('2d'), c.masque, w, h);
  const b = document.createElement('canvas');
  b.width = w; b.height = h;
  const g = b.getContext('2d');
  g.fillStyle = '#000';
  g.fillRect(0, 0, w, h);
  g.drawImage(a, 0, 0);
  return b.toDataURL('image/png');
}

// ---- le bouton -------------------------------------------------------------
function majBoutonMasque() {
  const b = $('#bMasque');
  if (b) b.classList.toggle('plein', blocsMasquables().some(masqueActif));
}

// ---- le contour, par-dessus le moniteur -------------------------------------
function dMasque(mq, w, h) {
  if (mq.forme === 'rect' || mq.forme === 'ellipse') {
    const [x0, y0, x1, y1] = boiteMasque(mq, w, h);
    if (mq.forme === 'rect')
      return 'M' + x0 + ' ' + y0 + 'H' + x1 + 'V' + y1 + 'H' + x0 + 'Z';
    const rx = Math.max(0.5, (x1 - x0) / 2), ry = Math.max(0.5, (y1 - y0) / 2);
    const cx = x0 + rx, cy = y0 + ry;
    return 'M' + (cx - rx) + ' ' + cy + 'A' + rx + ' ' + ry + ' 0 1 0 ' +
      (cx + rx) + ' ' + cy + 'A' + rx + ' ' + ry + ' 0 1 0 ' + (cx - rx) +
      ' ' + cy + 'Z';
  }
  const P = q => (q[0] * w).toFixed(1) + ' ' + (q[1] * h).toFixed(1);
  const p = mq.pts, a = mq.anses;
  if (a && !MQ_DESSIN) {
    let d = 'M' + P(p[0]);
    for (let i = 1; i <= p.length; i++) {
      const j = i % p.length, k = i - 1;
      d += (a[k] || a[j])
        ? 'C' + P(a[k] ? a[k][1] : p[k]) + ' ' + P(a[j] ? a[j][0] : p[j]) + ' ' + P(p[j])
        : 'L' + P(p[j]);
    }
    return d + 'Z';
  }
  return 'M' + p.map(P).join('L') + (MQ_DESSIN ? '' : 'Z');
}

function majContourMasque() {
  const sv = $('#mqCalque'), cv = $('#moni');
  if (!sv || !cv) return;
  const r = cv.getBoundingClientRect(), pr = cv.parentElement.getBoundingClientRect();
  const w = Math.round(r.width), h = Math.round(r.height);
  const c = MQ_DESSIN ? null : (MQ_EDIT ? parUid(MQ_EDIT.uid)
    : blocsMasquables().find(x => x.masque && x.masque.pts));
  const mq = MQ_DESSIN ? MQ_DESSIN.mq : (c ? c.masque : null);
  const cle = [w, h, Math.round(r.left - pr.left), Math.round(r.top - pr.top),
               mq ? JSON.stringify(mq) : '', MQ_DESSIN ? 1 : 0,
               MQ_EDIT ? 'e' + MQ_EDIT.sel : ''].join('|');
  if (cle === mqCle) return;
  mqCle = cle;
  sv.style.left = Math.round(r.left - pr.left) + 'px';
  sv.style.top = Math.round(r.top - pr.top) + 'px';
  sv.style.width = w + 'px';
  sv.style.height = h + 'px';
  sv.setAttribute('viewBox', '0 0 ' + Math.max(1, w) + ' ' + Math.max(1, h));
  if (MQ_EDIT && mq && mq.pts && w > 0) {
    const X = q => (q[0] * w).toFixed(1), Y = q => (q[1] * h).toFixed(1);
    let s = '<path class="edit" d="' + dMasque(mq, w, h) + '"/>';
    (mq.anses || []).forEach((an, i) => {
      if (!an) return;
      [0, 1].forEach(k => {
        s += '<line class="an" x1="' + X(mq.pts[i]) + '" y1="' + Y(mq.pts[i]) +
          '" x2="' + X(an[k]) + '" y2="' + Y(an[k]) + '"/>' +
          '<circle class="an" r="4" cx="' + X(an[k]) + '" cy="' + Y(an[k]) +
          '" data-i="' + i + '" data-k="' + k + '"/>';
      });
    });
    mq.pts.forEach((q, i) => {
      s += '<circle class="pt' + (MQ_EDIT.sel === i ? ' sel' : '') + '" r="5" cx="' +
        X(q) + '" cy="' + Y(q) + '" data-i="' + i + '"/>';
    });
    sv.innerHTML = s;
    return;
  }
  sv.innerHTML = (mq && mq.pts && mq.pts.length >= 2 && w > 0)
    ? '<path class="' + (MQ_DESSIN ? '' : 'repos') +
      (mq.on === false ? ' eteint' : '') + '" d="' + dMasque(mq, w, h) + '"/>'
    : '';
}
addEventListener('resize', () => { mqCle = ''; majContourMasque(); });

// ---- le trace -----------------------------------------------------------------
const NOMS_OUTIL = {libre: 'freehand', rect: 'rectangle', ellipse: 'ellipse'};
function commencerMasque(outil) {
  const cibles = blocsMasquables();
  if (!cibles.length) { dire('select a block on a video track first'); return; }
  MQ_DESSIN = {outil: outil, mq: null, appui: false,

}
function pointMoniteur(e) {
  const r = $('#moni').getBoundingClientRect();
  const f = v => Math.round(v * 10000) / 10000;
  return [f((e.clientX - r.left) / Math.max(1, r.width)),
          f((e.clientY - r.top) / Math.max(1, r.height))];
}
$('#mqCalque').addEventListener('pointerdown', e => {
  const d = MQ_DESSIN;

  const p = pointMoniteur(e);
  d.mq = {forme: d.outil, pts: d.outil === 'libre' ? [p] : [p, p.slice()],
          plume: MQ_PLUME, inv: MQ_INV, on: true};

    if (Math.hypot(p[0] - q[0], p[1] - q[1]) > 0.003 && l.length < 1500) l.push(p);
  } else {
    if (e.shiftKey) {
      // Un carre, un cercle — en pixels, pas en fractions du cadre.
      const r = $('#moni').getBoundingClientRect();
      const dx = (p[0] - l[0][0]) * r.width, dy = (p[1] - l[0][1]) * r.height;
      const m = Math.max(Math.abs(dx), Math.abs(dy));
      p = [l[0][0] + Math.sign(dx || 1) * m / r.width,
           l[0][1] + Math.sign(dy || 1) * m / r.height];

  const d = MQ_DESSIN;

    : Math.abs(l[1][0] - l[0][0]) > 0.008 && Math.abs(l[1][1] - l[0][1]) > 0.008;
  if (!assez) {

// ---- edition des points (1.3.29) ----------------------------------------------
// Tirer un point le deplace ; Alt + tirer un point sort ses poignees de Bezier ;
// tirer une poignee courbe le trace (l autre suit en miroir, sauf Alt). Double-
// clic sur un point : arrondi <-> angle ; double-clic sur le trait : un point de
// plus ; Suppr : retire le point choisi. Entree ou Echap : fini. Le rectangle et
// l ellipse deviennent des traces a points (l ellipse en 4 points courbes) ; un
// trace a main levee est simplifie, sinon ses centaines de points seraient
// impossibles a attraper. Le masque edite va a tous les blocs selectionnes qui
// en ont un.
var MQ_EDIT = null;

function versChemin(mq) {
  const m = JSON.parse(JSON.stringify(mq));
  if (m.forme === 'rect' || m.forme === 'ellipse') {
    const [a, b] = m.pts;
    const x0 = Math.min(a[0], b[0]), x1 = Math.max(a[0], b[0]);
    const y0 = Math.min(a[1], b[1]), y1 = Math.max(a[1], b[1]);
    if (m.forme === 'rect') {
      m.pts = [[x0, y0], [x1, y0], [x1, y1], [x0, y1]];
      m.anses = [null, null, null, null];
    } else {
      const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, rx = (x1 - x0) / 2,
            ry = (y1 - y0) / 2, k = 0.5523;
      m.pts = [[cx + rx, cy], [cx, cy + ry], [cx - rx, cy], [cx, cy - ry]];
      m.anses = [[[cx + rx, cy - k * ry], [cx + rx, cy + k * ry]],
                 [[cx + k * rx, cy + ry], [cx - k * rx, cy + ry]],
                 [[cx - rx, cy + k * ry], [cx - rx, cy - k * ry]],
                 [[cx - k * rx, cy - ry], [cx + k * rx, cy - ry]]];
    }
    m.forme = 'libre';
    return m;
  }
  if (!m.anses) {
    // Ramer-Douglas-Peucker : on garde la silhouette, pas les centaines de
    // points du trace. Le seuil monte jusqu a tomber sous 40 points.
    const rdp = (l, eps) => {
      if (l.length < 3) return l;
      const [a, b] = [l[0], l[l.length - 1]];
      let dmax = 0, idx = 0;
      for (let i = 1; i < l.length - 1; i++) {
        const dx = b[0] - a[0], dy = b[1] - a[1], n = Math.hypot(dx, dy) || 1e-9;
        const d = Math.abs(dy * l[i][0] - dx * l[i][1] + b[0] * a[1] - b[1] * a[0]) / n;
        if (d > dmax) { dmax = d; idx = i; }
      }
      if (dmax <= eps) return [a, b];
      return rdp(l.slice(0, idx + 1), eps).slice(0, -1).concat(rdp(l.slice(idx), eps));
    };
    let eps = 0.002, l = m.pts;
    while (l.length > 40 && eps < 0.2) { l = rdp(m.pts, eps); eps *= 1.6; }
    m.pts = l.length >= 3 ? l : m.pts;
    m.anses = m.pts.map(() => null);
  }
  return m;
}

function editerMasque() {
  const c = blocsMasquables().find(x => x.masque && x.masque.pts);
  if (!c) { dire('no mask on the selection — draw one first'); return; }
  if (MQ_DESSIN) finirMasque();
  if (c.masque.forme !== 'libre' || !c.masque.anses) {
    memoriser();
    const m = versChemin(c.masque);
    blocsMasquables().filter(x => x.masque).forEach(x => {
      const n = JSON.parse(JSON.stringify(m));
      n.plume = x.masque.plume; n.inv = !!x.masque.inv; n.on = x.masque.on;
      x.masque = n;
    });
  }
  MQ_EDIT = {uid: c.uid, sel: -1, geste: null};
  document.body.classList.add('mqEdit');
  mqCle = ''; majContourMasque(); dessiner();
  dire('edit the mask: drag points · Alt+drag a point for curves · double-click ' +
       'a point: smooth/corner · double-click the line: add · Del · Enter or Esc: done');
}
function finirEdition() {
  if (!MQ_EDIT) return;
  MQ_EDIT = null;
  document.body.classList.remove('mqEdit');
  mqCle = ''; majContourMasque();
  rendreLanes(); dessiner();
}
// Le masque edite part vers les autres blocs selectionnes qui en ont un.
function propagerMasque() {
  const c = MQ_EDIT && parUid(MQ_EDIT.uid);
  if (!c || !c.masque) return;
  blocsMasquables().forEach(x => {
    if (x === c || !x.masque) return;
    const n = JSON.parse(JSON.stringify(c.masque));
    n.plume = x.masque.plume; n.inv = !!x.masque.inv; n.on = x.masque.on;
    x.masque = n;
  });

}
const mqApres = () => { mqCle = ''; majContourMasque(); dessiner(); };

$('#mqCalque').addEventListener('pointerdown', e => {
  if (!MQ_EDIT || e.button !== 0) return;
  const c = parUid(MQ_EDIT.uid);
  if (!c || !c.masque) { finirEdition(); return; }
  const mq = c.masque, cible = e.target;
  const i = cible.dataset ? +cible.dataset.i : NaN;
  if (cible.classList.contains('pt')) {
    e.preventDefault(); e.stopPropagation();
    memoriser();
    MQ_EDIT.sel = i;
    // Alt : on sort les poignees de ce point, en symetrie, a la souris.
    MQ_EDIT.geste = e.altKey ? {mode: 'tire', i: i} : {mode: 'pt', i: i,
      dep: pointMoniteur(e), p0: mq.pts[i].slice(),
      a0: mq.anses[i] ? JSON.parse(JSON.stringify(mq.anses[i])) : null};
  } else if (cible.classList.contains('an')) {
    e.preventDefault(); e.stopPropagation();
    memoriser();
    MQ_EDIT.geste = {mode: 'an', i: i, k: +cible.dataset.k, casse: e.altKey};
  } else {
    MQ_EDIT.sel = -1;
    mqApres();

}, true);
$('#mqCalque').addEventListener('pointermove', e => {
  const g = MQ_EDIT && MQ_EDIT.geste;
  if (!g) return;
  const c = parUid(MQ_EDIT.uid), mq = c.masque, p = pointMoniteur(e);
  if (g.mode === 'pt') {
    const dx = p[0] - g.dep[0], dy = p[1] - g.dep[1];
    mq.pts[g.i] = [g.p0[0] + dx, g.p0[1] + dy];
    if (g.a0) mq.anses[g.i] = g.a0.map(q => [q[0] + dx, q[1] + dy]);
  } else if (g.mode === 'tire') {
    const q = mq.pts[g.i];
    mq.anses[g.i] = [[2 * q[0] - p[0], 2 * q[1] - p[1]], p];
  } else if (g.mode === 'an') {
    const q = mq.pts[g.i], an = mq.anses[g.i];
    an[g.k] = p;

      // L autre poignee en miroir, a sa propre longueur.
      const o = an[1 - g.k];
      const lo = Math.hypot(o[0] - q[0], o[1] - q[1]);
      const dx = q[0] - p[0], dy = q[1] - p[1], n = Math.hypot(dx, dy) || 1e-9;
      an[1 - g.k] = [q[0] + dx / n * lo, q[1] + dy / n * lo];

}, true);
$('#mqCalque').addEventListener('pointerup', () => {
  if (!MQ_EDIT || !MQ_EDIT.geste) return;
  MQ_EDIT.geste = null;

}, true);
$('#mqCalque').addEventListener('dblclick', e => {
  if (!MQ_EDIT) return;
  e.preventDefault(); e.stopPropagation();
  const c = parUid(MQ_EDIT.uid), mq = c && c.masque;
  if (!mq) return;
  const cible = e.target;
  memoriser();
  if (cible.classList.contains('pt')) {
    // Arrondi <-> angle : des poignees le long des voisins, ou plus rien.
    const i = +cible.dataset.i, n = mq.pts.length;
    if (mq.anses[i]) mq.anses[i] = null;
    else {
      const a = mq.pts[(i - 1 + n) % n], b = mq.pts[(i + 1) % n], q = mq.pts[i];
      const tx = (b[0] - a[0]) / 6, ty = (b[1] - a[1]) / 6;
      mq.anses[i] = [[q[0] - tx, q[1] - ty], [q[0] + tx, q[1] + ty]];
    }
  } else {
    // Un point de plus, sur le segment le plus proche du clic.
    const p = pointMoniteur(e), n = mq.pts.length;
    let best = 0, dmin = Infinity;
    for (let i = 0; i < n; i++) {
      const a = mq.pts[i], b = mq.pts[(i + 1) % n];
      const vx = b[0] - a[0], vy = b[1] - a[1], l2 = vx * vx + vy * vy || 1e-9;
      const u = Math.max(0, Math.min(1, ((p[0] - a[0]) * vx + (p[1] - a[1]) * vy) / l2));
      const d = Math.hypot(a[0] + u * vx - p[0], a[1] + u * vy - p[1]);
      if (d < dmin) { dmin = d; best = i; }
    }
    mq.pts.splice(best + 1, 0, p);
    mq.anses.splice(best + 1, 0, null);
    MQ_EDIT.sel = best + 1;
  }
  propagerMasque(); rendreLanes(); mqApres();
}, true);
document.addEventListener('keydown', e => {
  if (!MQ_EDIT) return;

    mq.pts.splice(MQ_EDIT.sel, 1); mq.anses.splice(MQ_EDIT.sel, 1);

// ---- le menu du bouton ----------------------------------------------------------
function menuMasque() {

$('#bMasque').onclick = () => {

  if (MQ_EDIT) { finirEdition(); dire('mask edited'); return; }

function apresMasque() {
  majBoutonMasque();
  mqCle = ''; majContourMasque();

}
$('#menu').addEventListener('click', e => {
  const o = e.target.closest('[data-mq-outil]');
  if (o) { $('#menu').className = ''; finirEdition(); commencerMasque(o.dataset.mqOutil); return; }
  if (e.target.closest('[data-mq-edit]')) { $('#menu').className = ''; editerMasque(); return; }
  const s = e.target.closest('[data-mq-suppr]');
  if (s) {
    if (s.classList.contains('mort')) return;
    const l = blocsMasquables().filter(c => c.masque);

  }
});
$('#menu').addEventListener('change', e => {
  const on = e.target.closest('[data-mq-on]');
  if (on) {
    memoriser();
    blocsMasquables().forEach(c => { if (c.masque) c.masque.on = on.checked; });
    apresMasque();
    dire(on.checked ? 'mask on' : 'mask off — kept, not applied');
    return;
  }
  const iv = e.target.closest('[data-mq-inv]');
  if (iv) {
    MQ_INV = iv.checked;
    const l = blocsMasquables().filter(c => c.masque);
    if (l.length) { memoriser(); l.forEach(c => { c.masque.inv = iv.checked; }); }
    apresMasque();
    return;
  }
  if (e.target.closest('[data-mq-plume]')) MQ_GESTE = false;
});
$('#menu').addEventListener('input', e => {
  const sl = e.target.closest('[data-mq-plume]');
  if (!sl) return;
  const v = Math.max(0, Math.min(10, parseFloat(sl.value) || 0));
  MQ_PLUME = v;
  if (sl.nextElementSibling) sl.nextElementSibling.textContent = v.toFixed(1) + '%';
  const l = blocsMasquables().filter(c => c.masque);
  if (!l.length) return;
  if (!MQ_GESTE) { memoriser(); MQ_GESTE = true; }
  l.forEach(c => { c.masque.plume = v; });

menu.addEventListener('click', async e => {
  const cad = e.target.closest('[data-cadre]');
  if (cad) {
    memoriser();
    CLIPS.forEach(x => {
      if (clipsSel.has(x.uid) && piste(x.piste) && piste(x.piste).type === 'v')
        x.mode = cad.dataset.cadre;
    });
    dessiner(); rendreReglages(); fermerMenu();
    return;
  }
  const coul = e.target.closest('[data-coul]');
  if (coul) { couleurSelection(+coul.dataset.coul); fermerMenu(); return; }
  const rc = e.target.closest('[data-rush-cat]');
  if (rc) {
    const ids = rushesDeLaSelection();
    fermerMenu();
    if (ids.length) couleurRush(ids, +rc.dataset.rushCat);
    return;
  }
  const vit = e.target.closest('[data-vit]');
  if (vit) {
    let v = vit.dataset.vit;
    if (v === 'autre') {
      const r = prompt('Block speed (0.1 to 8):', '1');
      if (!r) { fermerMenu(); return; }
      v = parseFloat(r.replace(',', '.'));
      if (!(v > 0.05 && v <= 8)) { dire('invalid speed', true); fermerMenu(); return; }
    }
    vitesseSelection(parseFloat(v));
    fermerMenu();
    return;
  }
  const it = e.target.closest('[data-act]');
  if (!it) return;
  const a = it.dataset.act;
  fermerMenu();
  if (a === 'reinit') { reinitSelection(); return; }
  if (a === 'figer') { figerSelection(+menu.dataset.uid); return; }
  if (a === 'usages') {
    const c = CLIPS.find(x => clipsSel.has(x.uid) && !estSynth(x));
    if (c) boiteUsages(c.film);
    return;
  }
  if (a === 'voirProjet' || a === 'voirDisque') {
    const c = parUid(+menu.dataset.uid) ||
              CLIPS.find(x => clipsSel.has(x.uid) && !estSynth(x));
    if (!c || estSynth(c)) return;
    // Un bloc garde le projet et le fichier d ou il vient : on sait donc le
    // montrer meme quand son projet a ete referme.
    const pj = (PAR_ID[c.film] || {}).pj || c.pj || '';
    if (a === 'voirProjet') montrerDansLeProjet(c.film, pj);
    else montrerSurLeDisque(c.film, pj);
    return;
  }
  if (a === 'cloner') {
    const ch = menu.querySelector('[data-clone-n]');
    clonerBlocs(ch ? ch.value : 1);
    return;
  }
  if (a === 'dupliquer') dupliquerBlocs();
  else if (a === 'delier') delier();
  else if (a === 'relier') relier();
  else if (a === 'copier') copierBlocs();
  else if (a === 'coller') collerBlocs();
  else if (a === 'supprimer') retirerSelection();
  else if (a === 'modifier') modifierSynth();
  else if (a === 'renommer') {
    const c = CLIPS.find(x => clipsSel.has(x.uid));
    if (!c) return;
    const f = PAR_ID[c.film];
    // Un calque n a pas de fichier a renommer : le menu propose « Modifier »
    // a sa place, mais on se garde du cas ou l entree serait atteinte quand
    // meme (selection mixte, raccourci).
    if (!f) { modifierSynth(); return; }
    const neuf = prompt('New file name on disk:', f.nom);
    if (neuf) await renommerFilm(c.film, neuf.trim());
  }
});

// ===========================================================================
//  Animation par images-clés
// ===========================================================================
// c.anim = {ech:[{t,v},…], dx:[…], dy:[…], opac:[…], gain:[…]}
// « t » est le temps depuis le début du bloc, en secondes : déplacer un bloc
// emmène son animation avec lui. Interpolation linéaire, valeurs tenues avant
// la première clé et après la dernière. Aucune clé = la valeur fixe du bloc.
const ANIMABLES = {
  ech:  {min: 0.3, max: 3,   pas: 0.01, defaut: 1, pct: true},
  dx:   {min: -100, max: 100, pas: 1,   defaut: 0, pct: false},
  dy:   {min: -100, max: 100, pas: 1,   defaut: 0, pct: false},
  gain: {min: 0,   max: 2,   pas: 0.01, defaut: 1, pct: true},
  opac: {min: 0,   max: 1,   pas: 0.01, defaut: 1, pct: true}
};
// Un calque ou un texte n est pas cadré dans un rush : il doit pouvoir sortir
// du cadre et grossir bien plus qu un plan. Les plans gardent leurs bornes
// d origine, pour que le même geste de curseur y reste précis.
const PLAGES_SYNTH = {
  ech: {min: 0.05, max: 5,   pas: 0.01},
  dx:  {min: -300, max: 300, pas: 1},
  dy:  {min: -300, max: 300, pas: 1}
};
function amplitude(k, t) {
  const A = ANIMABLES[k];
  if (!A) return {min: 0, max: 1, pas: 0.01, defaut: 0, pct: false};
  const S = estSynth(t) ? PLAGES_SYNTH[k] : null;
  if (!S) return A;
  return {min: S.min, max: S.max, pas: S.pas, defaut: A.defaut, pct: A.pct};
}

const ANIM_OUVERTS = new Set();
// ---- prereglages de secousse --------------------------------------------
// Ils vivaient dans les preferences du navigateur. Un vidage de cache les
// emportait — c est arrive, et c etait ma faute. Ils vivent maintenant dans

// L affichage est synchrone : il lit le miroir en memoire, jamais le disque.

// L onglet ouvert dans le panneau de reglages. Global : on reste sur le meme
// en changeant de bloc, plutot que d avoir a le rechercher a chaque clic.
let REG_ONGLET = 'tr';
// Le petit panneau de la secousse est plie ou deplie pour tous les blocs a
// la fois, comme les fleches d images-cles : c est un etat d affichage.
// Indice de la couche dont la montee/descente est depliee, ou -1.
let SHK_PLI = -1;
let presseAnim = null;
// Un reglage copie par parametre : copier l echelle ne doit pas effacer
// l opacite qu on avait mise de cote. Chaque entree garde la valeur ET les
// images-cles, s il y en a.
const PRESSE_PARAM = {};

const cles = (c, k) => (c && c.anim && c.anim[k]) || null;
const anime = (c, k) => { const l = cles(c, k); return !!(l && l.length); };
const fmtVal = (k, v) => ANIMABLES[k] && ANIMABLES[k].pct
  ? Math.round(v * 100) + '%' : String(Math.round(v));

function valAnim(c, k, t) {
  const d = ANIMABLES[k] ? ANIMABLES[k].defaut : 0;
  const stat = (c[k] === undefined || c[k] === null) ? d : c[k];
  const l = cles(c, k);
  if (!l || !l.length) return stat;
  const x = t - c.t0;
  if (x <= l[0].t) return l[0].v;
  const der = l[l.length - 1];
  if (x >= der.t) return der.v;
  for (let i = 1; i < l.length; i++) {
    if (x <= l[i].t) {
      const p = l[i - 1], q = l[i], e = q.t - p.t;
      return e <= 0.0001 ? q.v : p.v + (q.v - p.v) * (x - p.t) / e;
    }
  }
  return stat;
}

function poserCle(c, k, t, v) {
  c.anim = c.anim || {};
  const l = c.anim[k] = c.anim[k] || [];
  const x = +Math.max(0, Math.min(dur(c), t - c.t0)).toFixed(3);
  const i = l.findIndex(p => Math.abs(p.t - x) < 0.008);
  if (i >= 0) l[i].v = v; else l.push({t: x, v: v});
  l.sort((p, q) => p.t - q.t);
  return l;
}

function oterCle(c, k, i) {
  const l = cles(c, k);
  if (!l) return;
  l.splice(i, 1);
  if (!l.length) viderAnim(c, k);
}

function viderAnim(c, k) {
  if (!c.anim) return;
  delete c.anim[k];
  if (!Object.keys(c.anim).length) delete c.anim;
}

// Une clé posée prend la valeur effective à cet instant : la première clé
// fige donc la valeur fixe du bloc, et la deuxième crée le mouvement.
function basculerCle(c, k, t) {
  const x = +Math.max(0, Math.min(dur(c), t - c.t0)).toFixed(3);
  const l = cles(c, k);
  const i = l ? l.findIndex(p => Math.abs(p.t - x) < 0.008) : -1;
  if (i >= 0) oterCle(c, k, i);
  else poserCle(c, k, t, valAnim(c, k, t));
}

// Une couleur par sorte d image-cle (David, 07/10) : sur le bloc, dans la
// timeline, et sur le compteur ◆ du reglage. Les reglages de cadre ont la
// leur ; chaque effet a la sienne, pour tous ses reglages.
const COUL_CLES = {
  ech: ['#4fa3ff', 'Scale'], dx: ['#57c27a', 'Position'],
  dy: ['#57c27a', 'Position'], opac: ['#f2efe8', 'Opacity'],
  gain: ['#e8b93a', 'Volume'],
  flou: ['#c77dff', 'Blur'], etal: ['#ff7a45', 'Colour'],
  nb: ['#b9b2a6', 'B&W'], vignette: ['#8c6dff', 'Vignette'],
  grain: ['#9fd36a', 'Grain'], halation: ['#ff4d6d', 'Halation'],
  aberration: ['#2ed3d3', 'Chromatic aberration']
};
const couleurCle = k => (COUL_CLES[k] || ['#e8b93a', k])[0];

// Toutes les cles d un bloc : {t, coul, nom}, les reglages de cadre puis
// les effets.
function clesDuBloc(c) {
  const out = [];
  if (c.anim) for (const k in c.anim)
    (c.anim[k] || []).forEach(p => out.push({t: p.t, coul: couleurCle(k),
      nom: (COUL_CLES[k] || [0, k])[1]}));
  (Array.isArray(c.fx) ? c.fx : []).forEach(x => {
    if (!x || !x.anim) return;
    for (const k in x.anim)
      (x.anim[k] || []).forEach(p => out.push({t: p.t, coul: couleurCle(x.t),
        nom: ((COUL_CLES[x.t] || [0, x.t])[1]) + ' · ' + k}));
  });
  return out;
}

// Les losanges du bloc, a leur place dans le temps. Plusieurs sortes au meme
// instant : elles s empilent au lieu de se cacher.
function losangesCles(c) {
  const l = clesDuBloc(c);
  if (!l.length) return '';
  const sortes = [...new Set(l.map(x => x.coul))];
  const d = dur(c);
  return '<div class="cles">' + l.filter(x => x.t >= -0.001 && x.t <= d + 0.001)
    .map(x => '<i style="left:' + (x.t * PPS).toFixed(1) + 'px;bottom:' +
      (3 + sortes.indexOf(x.coul) * 10) + 'px;background:' + x.coul +
      '" title="' + x.nom + ' · ' + x.t.toFixed(2) + 's"></i>').join('') + '</div>';
}

const aDesAnims = c => !!(c.anim && Object.keys(c.anim)

  // Le volume agit sur le son : les blocs audio selectionnes, et pour un bloc

    const curs = (id, k, min, max, pas, v, unite, dec) =>

      '<span class="val">' + v.toFixed(dec) + unite + '</span></div>';
    // Chaque couche porte son nom, sa coche et son prereglage : on en allume
    // une, on en eteint une autre, et on entend — enfin, on voit — la
    // difference sans rien perdre.
    const couche = (p, k) => {
      const vif = coucheActive(p);
      return '<div class="animPan" style="margin-top:' + (k ? 7 : 2) + 'px">' +
        '<div style="display:flex;align-items:center;gap:6px;' + petit +
        ';margin:0 0 3px">' +
        '<input type="checkbox" data-shkon="' + k + '"' + (vif ? ' checked' : '') +
        ' style="margin:0;vertical-align:-2px;cursor:pointer"' +
        ' title="turn this shake off without losing its settings">' +
        '<b style="color:' + (vif ? 'var(--or)' : 'var(--sourd)') +
        ';font-weight:500">Shake' + (l.length > 1 ? ' ' + (k + 1) : '') + '</b>' +
        '<button class="fleche ' + (SHK_PLI === k ? 'on' : '') + '" ' +
        'data-shkpli="' + k + '" title="fade this shake in and out">' +
        (SHK_PLI === k ? '▾' : '▸') + '</button>' +
        (((p.i || 0) > 0.01 || (p.o || 0) > 0.01)
          ? '<i class="nbcle">' + (p.i || 0).toFixed(1) + '/' +
            (p.o || 0).toFixed(1) + '</i>' : '') +
        '<span style="flex:1"></span>' +
        (l.length > 1 ? '<button class="cv" data-shkdel="' + k +
          '" title="remove this shake">✕</button>' : '') +
        '</div>' +
        '<div' + (vif ? '' : ' style="opacity:.4"') + '>' +
        '<div style="' + petit + '">Rate</div>' +
        curs('rShkF', k, 0.5, 20, 0.1, p.f === undefined ? SHK_F : p.f, ' Hz', 1) +
        '<div style="' + petit + '">Amount</div>' +
        curs('rShkA', k, 0.1, 10, 0.1, p.a === undefined ? SHK_A : p.a, '%', 1) +
        '<div style="' + petit + '">Rotation</div>' +
        curs('rShkR', k, 0, 8, 0.1, p.r === undefined ? SHK_R : p.r, '\u00b0', 1) +
        (SHK_PLI === k
          ? '<div style="' + petit + '">Effect fade in</div>' +
            curs('rShkIn', k, 0, 5, 0.05, p.i || 0, 's', 2) +
            '<div style="' + petit + '">Effect fade out</div>' +
            curs('rShkOut', k, 0, 5, 0.05, p.o || 0, 's', 2)
          : '') + '</div>' +
        presetsSecousse(k, p.pre) + '</div>';
    };
    return '<div><label>Shake' +
      '<input type="checkbox" id="rShk"' + (on ? ' checked' : '') +
      ' style="margin-left:8px;vertical-align:-2px;cursor:pointer">' +
      '<button class="fleche" data-shkadd="1" title="add a shake — a slow ' +
      'one that sways plus a fast one that vibrates reads as a real camera"' +
      ' style="font-size:12px">＋</button>' +
      '<button class="fleche" data-shkmoins="1" title="remove the last shake"' +
      (l.length > 1 ? '' : ' disabled') + ' style="font-size:12px">\u2212</button>' +
      (on && l.length > 1
        ? '<i class="nbcle">' + vives + '/' + l.length + '</i>' : '') +
      '</label>' +
      (on ? l.map(couche).join('') : '') + '</div>';
  };

  // Une rangée = un libellé, sa flèche d animation, son curseur, et son
  // panneau d images-clés quand la flèche est dépliée.
  const rangee = (k, etiq, id, extra) => {
    const t = cibleDe(k);
    if (!t) return '';
    const A = amplitude(k, t);
    const v = valAnim(t, k, tLect);
    const n = (cles(t, k) || []).length;
    const ouvert = ANIM_OUVERTS.has(k);
    return '<div><label>' + etiq + (extra || '') +
      '<button class="fleche ' + (ouvert ? 'on' : '') + '" data-anim="' + k +
      '" title="keyframes">' + (ouvert ? '▾' : '▸') + '</button>' +
      (n ? '<i class="nbcle" style="color:' + couleurCle(k) + '">◆' + n + '</i>' : '') +
      '</label>' +
      '<div class="rang"><input type="range" id="' + id + '" min="' + A.min +
      '" max="' + A.max + '" step="' + A.pas + '" value="' + v + '"' +
      (ANIMABLES[k] && ANIMABLES[k].pct ? ' data-pct="1"' : '') + '>' +
      '<span class="val">' + fmtVal(k, v) + '</span>' +
      boutonsCV(k) + '</div>' +
      (ouvert ? panneauAnim(k, t) : '') + '</div>';
  };

  const rangeeVolume = () => {
    if (cibleSon.length) {
      const ou = [...new Set(cibleSon.map(x => x.piste))].join(' ');
      return rangee('gain', 'Block volume', 'rGain',
        estV ? ' <span style="color:var(--or)">' + ou + '</span>' : '');
    }
    return '<div><label>Block volume</label>' +
      '<div class="mono" style="font-size:11px;color:var(--sourd)">' +
      (estV ? 'no audio linked to this block' : 'track without audio') +
      '</div></div>';
  };
  const rangeeVitesse = () => {
    const sv = vSignee(c);
    return '<div><label>Speed</label><div class="rang">' +
      '<input type="range" id="rVit" min="-4" max="4" step="0.05" value="' +
      sv.toFixed(2) + '"><span class="val">×' + sv.toFixed(2) + '</span>' +
      boutonsCV('vitesse') + '</div>' +
      '<label style="display:flex;align-items:center;gap:6px;margin-top:5px;' +
      'font-size:11px;color:var(--sourd);cursor:pointer;user-select:none">' +
      '<input type="checkbox" id="cRev"' + (c.rev ? ' checked' : '') + '>' +
      'Reverse — plays backwards</label></div>';
  };

  if (estReglage(c)) {
    // Un calque d effet n a ni cadre ni son : sa transparence dose l effet,
    // et son rack fait tout le reste.
    h += rangee('opac', 'Amount', 'rOpac') + rackFx(c, sel);
  } else if (estV) {
    const ONG = [['tr', 'Transform'], ['fx', 'Effects'], ['sh', 'Anim']];
    if (!ONG.some(o => o[0] === REG_ONGLET)) REG_ONGLET = 'tr';
    h += '<div class="ongletsReg">' + ONG.map(o =>
      '<button data-onglet="' + o[0] + '" class="' +
      (REG_ONGLET === o[0] ? 'on' : '') + '">' + o[1] + '</button>').join('') +
      '</div>';
    if (REG_ONGLET === 'tr')
      h += rangee('ech', 'Scale', 'rEch') +
           rangee('dx', 'Position X', 'rDx') +
           rangee('dy', 'Position Y', 'rDy');
    else if (REG_ONGLET === 'fx')
      h += rangee('opac', 'Opacity', 'rOpac') + rangeeVitesse() + rangeeVolume() +
           rackFx(c, sel);
    else
      h += rangeeSecousse(c);
  } else {
    // Un bloc son n a que deux reglages : des onglets pour si peu seraient
    // un clic de plus pour rien.
    h += rangeeVolume() + rangeeVitesse();
  }
  // Couleur, cadrage, liaison, remise a zero et suppression sont au clic droit
  // sur le bloc : ce sont des actions, pas des reglages qu on ajuste a l oeil.
  h += '<div><label>Source · fades</label>' +
    '<div class="mono" style="font-size:11px;color:var(--sourd)">' +
    c.e.toFixed(2) + 's → ' + c.o.toFixed(2) + 's<br>duration ' + dur(c).toFixed(2) + 's' +
    '<br>fades ' + fonduIn(c).toFixed(2) + 's / ' + fonduOut(c).toFixed(2) + 's' +
    ((c._xIn > 0.02 || c._xOut > 0.02) ? ' (crossfade on the overlap)'
     : (fonduIn(c) > 0.02 || fonduOut(c) > 0.02) ? '' : ' (none)') +
    '</div></div>';
  r.innerHTML = h;
  lierRackFx(r, c, sel);

  r.querySelectorAll('[data-onglet]').forEach(b => b.onclick = () => {
    REG_ONGLET = b.dataset.onglet;
    rendreReglages();
  });

  const lier = (sl, cle, pct, prefixe, liste) => {
    const el = r.querySelector(sl);
    if (!el) return;
    const quoi = liste || sel;
    el.oninput = () => {
      const v = parseFloat(el.value);
      quoi.forEach(x => {
        // Paramètre animé et tête de lecture sur le bloc : on déplace la clé
        // de cet instant au lieu d écraser la valeur fixe.
        if (ANIMABLES[cle] && anime(x, cle) &&
            tLect >= x.t0 - 0.001 && tLect <= fin(x) + 0.001)
          poserCle(x, cle, tLect, v);
        else x[cle] = v;
      });
      el.nextElementSibling.textContent = pct ? Math.round(v * 100) + '%'
        : (prefixe || '') + (prefixe ? v.toFixed(2) : v);
      if (cle === 'vitesse') { recalculerFondus(); rendreLanes(); majMinimap(); }
      modifie = true;
      if (cle === 'gain' || cle === 'vitesse') resynchroniser(true); else dessiner();
    };
    el.onchange = () => {
      if (cle === 'vitesse') rendreTimeline();
      else if (ANIM_OUVERTS.has(cle)) rendreReglages();
    };
  };
  // ---- secousse : une pile de couches ------------------------------------
  // Chaque modification recopie la liste avant de l ecrire : deux blocs
  // pourraient sinon partager le meme tableau apres un copier-coller.
  const surVideo = x => piste(x.piste) && piste(x.piste).type === 'v';
  const majCouches = (x, f) => {
    const l = couchesShk(x).map(p => Object.assign({}, p));
    f(l);
    couchesEcrire(x, l);
  };
  const cocheShk = r.querySelector('#rShk');
  if (cocheShk) cocheShk.onchange = () => {
    memoriser();
    sel.forEach(x => {
      if (!surVideo(x)) return;
      x.shk = cocheShk.checked;
      if (cocheShk.checked && !couchesShk(x).length)
        couchesEcrire(x, [coucheNeuve()]);
    });
    modifie = true; rendreReglages(); dessiner();
  };
  const addShk = r.querySelector('[data-shkadd]');
  if (addShk) addShk.onclick = () => {
    memoriser();
    sel.forEach(x => {
      if (!surVideo(x)) return;
      x.shk = true;
      majCouches(x, l => l.push(l.length
        // La deuxieme couche arrive lente et ample : c est le MELANGE qui fait
        // le geste, pas deux fois la meme vibration.
        ? {f: 1.8, a: 3, r: 1.2, i: 0, o: 0}
        : coucheNeuve()));
    });
    SHK_PLI = -1;
    modifie = true; rendreReglages(); dessiner();
    dire('shake layer added');
  };
  const moinsShk = r.querySelector('[data-shkmoins]');
  if (moinsShk) moinsShk.onclick = () => {
    memoriser();
    sel.forEach(x => {
      if (surVideo(x)) majCouches(x, l => { if (l.length > 1) l.pop(); });
    });
    SHK_PLI = -1;
    modifie = true; rendreReglages(); dessiner();
    dire('last shake removed');
  };
  // La coche d une couche : ses valeurs restent, seul l effet s arrete.
  r.querySelectorAll('[data-shkon]').forEach(b => b.onchange = () => {
    const k = +b.dataset.shkon, v = b.checked;
    memoriser();
    sel.forEach(x => {
      if (surVideo(x)) majCouches(x, l => { if (l[k]) l[k].on = v; });
    });
    modifie = true; rendreReglages(); dessiner();
  });
  r.querySelectorAll('[data-shkdel]').forEach(b => b.onclick = () => {
    const k = +b.dataset.shkdel;
    memoriser();
    sel.forEach(x => { if (surVideo(x)) majCouches(x, l => l.splice(k, 1)); });
    SHK_PLI = -1;
    modifie = true; rendreReglages(); dessiner();
  });
  r.querySelectorAll('[data-shkpli]').forEach(b => b.onclick = () => {
    const k = +b.dataset.shkpli;
    SHK_PLI = (SHK_PLI === k) ? -1 : k;
    rendreReglages();
  });
  const curseurCouche = (prefixe, champ, unite, dec) => {
    r.querySelectorAll('[id^="' + prefixe + '"]').forEach(el => {
      const k = parseInt(el.id.slice(prefixe.length), 10);
      if (!(k >= 0)) return;
      el.oninput = () => {
        const v = parseFloat(el.value);
        sel.forEach(x => {
          if (surVideo(x)) majCouches(x, l => { if (l[k]) l[k][champ] = v; });
        });
        el.nextElementSibling.textContent = v.toFixed(dec) + unite;
        modifie = true; dessiner();
      };
    });
  };
  curseurCouche('rShkF', 'f', ' Hz', 1);
  curseurCouche('rShkA', 'a', '%', 1);
  curseurCouche('rShkR', 'r', '\u00b0', 1);
  curseurCouche('rShkIn', 'i', 's', 2);
  curseurCouche('rShkOut', 'o', 's', 2);

  // ---- prereglages, un par couche ---------------------------------------
  // Un prereglage enregistre UNE couche : c est le geste qu on retrouve, pas
  // la pile entiere. Les anciens, qui gardaient plusieurs couches, sont
  // toujours lisibles : ils remplacent alors toute la pile.
  // Le nom d origine reste sur la couche, jamais dans le prereglage.
  const valeursCouche = p => ({f: p.f === undefined ? SHK_F : p.f,
                               a: p.a === undefined ? SHK_A : p.a,
                               r: p.r === undefined ? SHK_R : p.r,
                               i: p.i || 0, o: p.o || 0, on: true});
  r.querySelectorAll('[data-pre-sel]').forEach(el => el.onchange = () => {
    const k = +el.dataset.preSel;
    const p = lireSecoussePresets()[el.value];
    if (!p) return;
    const pile = Array.isArray(p.l) ? p.l : null;
    memoriser();
    if (pile && pile.length > 1) {
      sel.forEach(x => {
        if (!surVideo(x)) return;
        x.shk = true;
        couchesEcrire(x, pile.map(q => Object.assign({on: true}, q,
          {pre: el.value})));
      });
      SHK_PLI = -1;
      modifie = true; rendreReglages(); dessiner();
      dire('preset “' + el.value + '” applied · ' + pile.length + ' shakes');
      return;
    }
    const v = valeursCouche(pile ? pile[0] : p);
    sel.forEach(x => {
      if (!surVideo(x)) return;
      x.shk = true;
      majCouches(x, l => {
        while (l.length <= k) l.push(coucheNeuve());
        l[k] = Object.assign({}, v, {pre: el.value});
      });
    });
    modifie = true; rendreReglages(); dessiner();
    dire('preset “' + el.value + '” applied to shake ' + (k + 1));
  });
  r.querySelectorAll('[data-pre-add]').forEach(b => b.onclick = () => {
    const k = +b.dataset.preAdd;
    const p = couchesShk(c)[k];
    if (!p) { dire('nothing to save here'); return; }
    const nom = (prompt('Name this shake preset:', '') || '').trim().slice(0, 40);
    if (!nom) return;
    const v = valeursCouche(p);
    sel.forEach(x => {
      if (surVideo(x)) majCouches(x, l => { if (l[k]) l[k].pre = nom; });
    });
    enregistrerPreset(nom, v);
  });
  r.querySelectorAll('[data-pre-del]').forEach(b => b.onclick = () => {
    const k = +b.dataset.preDel;
    const s2 = r.querySelector('[data-pre-sel="' + k + '"]');
    if (!s2 || !s2.value) { dire('choose a preset first'); return; }
    const nom = s2.value;
    if (!confirm('Delete the shake preset “' + nom + '” ?')) return;
    oublierPreset(nom);
    dire('preset “' + nom + '” removed');
  });

  lier('#rEch', 'ech', true); lier('#rDx', 'dx'); lier('#rDy', 'dy');
  lier('#rGain', 'gain', true, null, cibleSon);
  lier('#rOpac', 'opac', true);
  // La vitesse est le seul reglage signe. Le curseur va de -4 a 4 et la case
  // « Reverse » n est qu une autre facon d en changer le signe : les deux
  // ecrivent la meme chose. En memoire « vitesse » reste POSITIVE et « rev »
  // porte le sens — c est ce qui permet aux durees, au rognage, a setpts et a
  // atempo de continuer a calculer avec un facteur.
  (() => {
    const sl = r.querySelector('#rVit');
    if (!sl) return;
    const cb = r.querySelector('#cRev');
    const ecrire = (signee, refaire) => {
      const arriere = signee < 0;
      const m = Math.min(4, Math.max(0.25, Math.abs(signee) || 1));
      sel.forEach(x => { x.vitesse = m; x.rev = arriere; });
      const aff = (arriere ? -m : m).toFixed(2);
      sl.value = aff;
      sl.nextElementSibling.textContent = '×' + aff;
      if (cb) cb.checked = arriere;
      modifie = true;
      recalculerFondus(); rendreLanes(); majMinimap(); resynchroniser(true);
      if (refaire) rendreTimeline();
    };
    sl.oninput = () => {
      let v = parseFloat(sl.value);
      // Une zone morte autour de zero : sous le quart de vitesse une image
      // durerait plus de quatre secondes, et a zero le plan serait infini.
      if (!(Math.abs(v) >= 0.25)) v = v < 0 ? -0.25 : 0.25;
      ecrire(v, false);
    };
    sl.onchange = () => rendreTimeline();
    if (cb) cb.onchange = () => ecrire((cb.checked ? -1 : 1) * vAbs(c), true);
  })();

  // ---- panneau d animation ---------------------------------------------
  r.querySelectorAll('[data-anim]').forEach(b => b.onclick = () => {
    const k = b.dataset.anim;
    ANIM_OUVERTS.has(k) ? ANIM_OUVERTS.delete(k) : ANIM_OUVERTS.add(k);
    rendreReglages();
  });
  r.querySelectorAll('[data-cle]').forEach(b => b.onclick = () => {
    const k = b.dataset.cle;
    memoriser();
    tousDe(k).forEach(x => {
      if (tLect >= x.t0 - 0.001 && tLect <= fin(x) + 0.001)
        basculerCle(x, k, tLect);
    });
    rendreReglages(); rendreLanes(); dessiner(); resynchroniser(true);
  });
  const allerA = (k, sens) => {
    const t = cibleDe(k), l = cles(t, k);
    if (!l || !l.length) return;
    const x = tLect - t.t0;
    const c2 = sens > 0 ? l.find(p => p.t > x + 0.008)
                        : [...l].reverse().find(p => p.t < x - 0.008);
    if (!c2) { dire(sens > 0 ? 'last key' : 'first key'); return; }
    allerAuTemps(t.t0 + c2.t);
  };
  r.querySelectorAll('[data-cle-prec]').forEach(b =>
    b.onclick = () => allerA(b.dataset.clePrec, -1));
  r.querySelectorAll('[data-cle-suiv]').forEach(b =>
    b.onclick = () => allerA(b.dataset.cleSuiv, 1));
  r.querySelectorAll('[data-aller-cle]').forEach(b => b.onclick = e => {
    if (e.target.dataset.oteCle) return;
    const [k, i] = b.dataset.allerCle.split(':');
    const t = cibleDe(k), l = cles(t, k);
    if (l && l[+i]) allerAuTemps(t.t0 + l[+i].t);
  });
  r.querySelectorAll('[data-ote-cle]').forEach(b => b.onclick = e => {
    e.stopPropagation();
    const [k, i] = b.dataset.oteCle.split(':');
    memoriser();
    oterCle(cibleDe(k), k, +i);
    rendreReglages(); rendreLanes(); dessiner(); resynchroniser(true);
  });
  const valeurDe = (x, k) => ANIMABLES[k]
    ? valAnim(x, k, tLect)
    : (x[k] === undefined ? (k === 'vitesse' ? 1 : 0) : x[k]);
  r.querySelectorAll('[data-copie-val]').forEach(b => b.onclick = () => {
    const k = b.dataset.copieVal, x = cibleDe(k);
    if (!x) return;
    const l = ANIMABLES[k] ? (cles(x, k) || []) : [];
    PRESSE_PARAM[k] = {v: valeurDe(x, k), cles: l.map(p => ({t: p.t, v: p.v}))};
    rendreReglages();
    dire(fmtVal(k, PRESSE_PARAM[k].v) + ' copied' +
      (l.length ? ' with its ' + l.length + ' key(s)' : ''));
  });
  r.querySelectorAll('[data-colle-val]').forEach(b => b.onclick = () => {
    const k = b.dataset.colleVal, p = PRESSE_PARAM[k];
    if (!p) return;
    memoriser();
    let n = 0;
    tousDe(k).forEach(x => {
      if (p.cles.length) {
        x.anim = x.anim || {};
        // Une cle posee au-dela de la duree du bloc revient a sa fin.
        x.anim[k] = p.cles.map(q => ({t: Math.min(q.t, dur(x)), v: q.v}));
      } else {
        if (ANIMABLES[k]) viderAnim(x, k);
        x[k] = p.v;
      }
      n++;
    });
    rendreReglages(); rendreLanes(); dessiner(); resynchroniser(true);
    dire(fmtVal(k, p.v) + ' pasted onto ' + n + ' block(s)');
  });
  r.querySelectorAll('[data-copie-anim]').forEach(b => b.onclick = () => {
    const k = b.dataset.copieAnim, t = cibleDe(k), l = cles(t, k);
    if (!l || !l.length) { dire('nothing to copy on this parameter'); return; }
    presseAnim = {cle: k, liste: l.map(p => ({t: p.t, v: p.v}))};
    rendreReglages();
    dire(l.length + ' key(s) copied — select another block and paste');
  });
  r.querySelectorAll('[data-colle-anim]').forEach(b => b.onclick = () => {
    const k = b.dataset.colleAnim;
    if (!presseAnim || presseAnim.cle !== k) return;
    memoriser();
    let n = 0;
    tousDe(k).forEach(x => {
      x.anim = x.anim || {};
      // Une clé posée au-delà de la durée du bloc est ramenée à sa fin :
      // coller sur un bloc plus court ne doit pas perdre le mouvement.
      x.anim[k] = presseAnim.liste.map(p =>
        ({t: Math.min(p.t, dur(x)), v: p.v}));
      n++;
    });
    rendreReglages(); rendreLanes(); dessiner(); resynchroniser(true);
    dire('animation pasted onto ' + n + ' block(s)');
  });
  r.querySelectorAll('[data-vide-anim]').forEach(b => b.onclick = () => {
    const k = b.dataset.videAnim;
    memoriser();
    tousDe(k).forEach(x => viderAnim(x, k));
    rendreReglages(); rendreLanes(); dessiner(); resynchroniser(true);
    dire('animation cleared');
  });

}

// Remise a zero d un bloc, appelee depuis le menu du clic droit.
// Fige les blocs image selectionnes sur l image sous la tete de lecture (sur
// leur premiere image si la tete est ailleurs), pour toute leur duree. Le son
// lie continue, comme un « frame hold ». Sur un bloc deja fige : il repart.
// L image du moniteur a la taille du projet — pas a celle de l ecran : on
// agrandit un instant la toile, on redessine sans le cache (ses images sont a
// la taille de l ecran), on lit, et on remet tout. Les lecteurs sont d abord
// ramenes a l instant exact.
async function imageMoniteur() {
  if (enLecture) pause();
  resynchroniser(true);

// Les curseurs suivent la tête de lecture quand le paramètre est animé, sans
// redessiner le panneau : on y tire parfois un curseur.
let REG = null;
function majValeursAnim() {
  if (!REG || !REG.c) return;
  const r = $('#reglages');
  // Le ◆ ne s allume QUE si la tete est sur une cle, et s eteint des qu elle
  // la quitte (David, 07/10) ; la cle sous la tete est surlignee dans la
  // liste. Sans cette mise a jour, il gardait l etat de l ouverture du panneau.
  const ici = (t, l) => {
    const x = tLect - t.t0;
    return (l || []).findIndex(p => Math.abs(p.t - x) < 0.008);
  };
  const dedans = t => tLect >= t.t0 - 0.001 && tLect <= fin(t) + 0.001;
  r.querySelectorAll('[data-cle]').forEach(b => {
    const k = b.dataset.cle, t = k === 'gain' ? REG.son[0] : REG.c;
    if (!t) return;
    b.classList.toggle('on', ici(t, cles(t, k)) >= 0);
    b.disabled = !dedans(t);
  });
  r.querySelectorAll('[data-aller-cle]').forEach(s => {
    const [k, j] = s.dataset.allerCle.split(':'), t = k === 'gain' ? REG.son[0] : REG.c;
    if (t) s.classList.toggle('ici', ici(t, cles(t, k)) === +j);
  });
  if (Array.isArray(REG.c.fx)) {
    r.querySelectorAll('[data-fx-cle]').forEach(b => {
      const [i, k] = b.dataset.fxCle.split(':'), x = REG.c.fx[+i];
      if (!x) return;
      b.classList.toggle('on', ici(REG.c, clesFx(x, k)) >= 0);
      b.disabled = !dedans(REG.c);
    });
    r.querySelectorAll('[data-fx-aller]').forEach(s => {
      const [i, k, j] = s.dataset.fxAller.split(':'), x = REG.c.fx[+i];
      if (x) s.classList.toggle('ici', ici(REG.c, clesFx(x, k)) === +j);
    });
  }
  // Les reglages d effet animes suivent aussi la tete de lecture.
  if (Array.isArray(REG.c.fx)) r.querySelectorAll('input[type=range][data-fx-p]')
    .forEach(s => {
      const x = REG.c.fx[+s.dataset.fxI];
      if (!x || !clesFx(x, s.dataset.fxP) || s === document.activeElement) return;
      const v = valFx(REG.c, x, s.dataset.fxP, tLect);
      s.value = v;
      if (s.nextElementSibling)
        s.nextElementSibling.textContent = fmtFx(v, +s.step, s.dataset.fxU);
    });
  [['ech', '#rEch'], ['dx', '#rDx'], ['dy', '#rDy'], ['opac', '#rOpac'],
   ['gain', '#rGain']].forEach(([k, sl]) => {
    const t = k === 'gain' ? REG.son[0] : REG.c;
    if (!t || !anime(t, k)) return;
    const el = r.querySelector(sl);
    if (!el || el === document.activeElement) return;
    const v = valAnim(t, k, tLect);
    el.value = v;
    if (el.nextElementSibling) el.nextElementSibling.textContent = fmtVal(k, v);
  });
}

// ===========================================================================
//  Lecture avec fondus
// ===========================================================================
const moni = $('#moni'), ctx = moni.getContext('2d');
const POOL = new Map();
let horloge0 = 0, t0Lect = 0;

const actifs = t => CLIPS.filter(c => t >= c.t0 - 0.001 && t < fin(c) - 0.001);

// Les images fixes, une par fiche : rien a decoder, rien a synchroniser,
// et deux blocs de la meme image partagent la meme balise.
const IMAGES = new Map();
function imageDe(c) {
  const f = PAR_ID[c.film];
  if (!f) return null;
  let im = IMAGES.get(c.film);
  if (!im) {
    im = new Image();
    im.decoding = 'async';
    // Chargee, elle se montre sans attendre le prochain mouvement.
    im.onload = () => { try { dessiner(); } catch (e) {} };
    im.src = urlMedia(f);
    IMAGES.set(c.film, im);
  }
  return im;
}

function media(c) {
  // Un calque, un texte ou une image fixe n a rien a lire : ils sont
  // dessines a chaque image, sans lecteur ni synchronisation.
  if (estSynth(c) || estImage(c)) return null;
  const f = PAR_ID[c.film];
  if (!f) return null;
  let v = POOL.get(c.uid);
  // Le pool est range par NUMERO DE BLOC, et deux sequences emploient les
  // memes numeros : sans cette verification, un bloc reprenait le lecteur
  // laisse par le bloc de meme numero de la sequence precedente, et le
  // moniteur montrait un autre rush que celui annonce par la timeline
  // (signale par David le 26/09 : 14 blocs sur 42 apres un changement de
  // sequence). Le lecteur porte donc le rush qu il a charge.
  if (v && v.dataset.film !== c.film) {
    try { v.pause(); v.removeAttribute('src'); v.load(); } catch (e) {}
    POOL.delete(c.uid);
    v = null;
  }
  if (!v) {
    v = document.createElement('video');
    v.preload = 'auto'; v.playsInline = true;
    v.dataset.film = c.film;
    v.src = urlMedia(f);
    v.load();
    POOL.set(c.uid, v);
    brancherSon(v);
  }
  return v;
}

// Les lecteurs de la sequence qu on quitte n ont plus rien a lire.
function viderPool() {
  for (const v of POOL.values()) {
    try { v.pause(); v.removeAttribute('src'); v.load(); } catch (e) {}
  }
  POOL.clear();
}
// Combien de temps a l avance un plan est prepare, et combien de lecteurs on
// garde sous la main.
//
// C est ici qu etait la saute. L ancien menage ne gardait que les plans
// presents a l instant et deux secondes plus loin : sur une sequence de plus
// de douze blocs, il DETRUISAIT tout le reste a chaque image. Le plan suivant
// etait donc recree de zero 0,4 s avant la coupe — a charger, a decoder, a
// positionner. Quand le disque suivait, on ne voyait rien ; quand il ne
// suivait pas, la coupe arrivait sur un lecteur vide, donc sur du noir.
const HORIZON = 2.5;     // on prepare un plan 2,5 s avant son entree
const AMORCE = 0.4;      // on le lance en sourdine 0,4 s avant
const MAX_POOL = 16;

// Les plans dont l intervalle croise la fenetre autour de la tete de lecture.
function prochesDuCurseur(avant, apres) {
  const a = tLect - avant, b = tLect + apres;
  return CLIPS.filter(c => !estSynth(c) && fin(c) > a && c.t0 < b);
}

function menage() {
  if (POOL.size <= MAX_POOL) return;
  const garder = new Set(prochesDuCurseur(1, HORIZON + 1).map(c => c.uid));
  // Distance du plan a la tete de lecture : on jette les plus loin d abord.
  const loin = u => {
    const c = parUid(u);
    if (!c) return 1e9;
    return tLect < c.t0 ? c.t0 - tLect : (tLect > fin(c) ? tLect - fin(c) : 0);
  };
  const jetables = [...POOL.keys()].filter(u => !garder.has(u))
    .sort((x, y) => loin(y) - loin(x));
  for (const uid of jetables) {
    if (POOL.size <= MAX_POOL) break;
    const v = POOL.get(uid);
    v.pause(); v.removeAttribute('src'); v.load(); POOL.delete(uid);
  }
}

function resynchroniser(force) {
  const vivants = new Set();
  for (const c of actifs(tLect)) {
    const p = piste(c.piste);
    if (!p) continue;
    // Quand l image vient du cache, les lecteurs des pistes video n ont plus
    // rien a fournir — ils sont muets de toute facon. On les laisse en pause :
    // plus une seule image decodee pendant la lecture, seul le son tourne.
    if (p.type === 'v' && CACHE.pret && !CACHE.occupe && imageCache(tLect)) {
      const w = POOL.get(c.uid);
      if (w && !w.paused) w.pause();
      vivants.add(c.uid);
      continue;
    }
    const v = media(c);
    if (!v) continue;
    vivants.add(c.uid);
    const vit = vAbs(c);
    const rev = estRev(c);
    const cible = srcA(c, tLect);
    // On n ecrit une propriete que si elle change : ces affectations passent
    // par le moteur media a chaque fois, et la boucle tourne a chaque image.
    if (!rev && v.playbackRate !== vit) {
      try { v.playbackRate = vit; } catch (e) {}
    }
    if (p.type === 'v' || rev) {
      if (!v.muted) v.muted = true;
    } else {
      const muet = !audible(p);
      if (v.muted !== muet) v.muted = muet;
      // Le navigateur plafonne volume a 1 : au-dela de 100 % le gain ne
      // s entend qu au rendu ffmpeg, qui lui sait amplifier.
      const vol = Math.max(0, Math.min(1,
        valAnim(c, 'gain', tLect) * volPiste(p) * alpha(c, tLect)));
      if (Math.abs(v.volume - vol) > 0.004) v.volume = vol;
    }
    // Un <video> refuse une vitesse negative : playbackRate doit rester
    // positif, c est une regle du navigateur et non un reglage. Un plan
    // inverse ne se LIT donc jamais — il se deplace, image par image, a
    // chaque tour de boucle. C est plus saccade qu une lecture normale et
    // c est muet. Le bouton Cache et le rendu ffmpeg, eux, le restituent
    // parfaitement, son compris.
    if (p.type === 'v' && estGel(c)) {
      if (!v.paused) v.pause();
      if (force || Math.abs(v.currentTime - c.gel) > 0.015) {
        try { v.currentTime = Math.max(0, c.gel); } catch (e) {}
      }
      v._prep = 1;
      continue;
    }
    if (rev) {
      if (!v.paused) v.pause();
      if (force || Math.abs(v.currentTime - cible) > 0.015) {
        try { v.currentTime = Math.max(0, cible); } catch (e) {}
      }
      v._prep = 1;
      continue;
    }
    if (force || Math.abs(v.currentTime - cible) > 0.28) {
      try { v.currentTime = Math.max(0, cible); } catch (e) {}
      v._prep = 1;
    }
    if (enLecture) {
      // Ne pas relancer play() a chaque image : tant qu il n a pas abouti,
      // le rappeler ne fait qu empiler des promesses et bloquer le demarrage.
      const t = performance.now();
      if (v.paused && t - (v._essaiLecture || 0) > 250) {
        v._essaiLecture = t;
        v.play().catch(() => {});
      }
    } else if (!v.paused) v.pause();
  }
  for (const [uid, v] of POOL) if (!vivants.has(uid) && !v.paused) v.pause();
  // AMORCE — le plan suivant est pose sur son point d entree bien avant la
  // coupe, puis lance en sourdine juste avant : un lecteur en pause met
  // quelques dizaines de millisecondes a repartir, et ces millisecondes-la
  // tombent pile sur la coupe. Il la traverse donc sans jamais s arreter,
  // deja a la bonne image. Si le plan entre trop pres du debut de son
  // fichier, l amorce se raccourcit — on ne recule jamais avant la premiere
  // image.
  // On ne prepare que les quatre prochains : au-dela, quatre decodages
  // simultanes couteraient plus cher que la coupe qu ils evitent.
  const aVenir = CLIPS
    .filter(c => !vivants.has(c.uid) && !estSynth(c) &&
                 c.t0 > tLect && c.t0 - tLect <= HORIZON)
    .sort((a, b) => a.t0 - b.t0)
    .slice(0, 4);
  for (const c of aVenir) {
    const v = media(c);
    if (!v) continue;
    const vit = vAbs(c);
    // Un plan inverse commence par sa DERNIERE image et ne se lance jamais :
    // il n y a rien a amorcer, seulement a se placer au bon endroit.
    // Un plan fige ne se lance pas non plus : il attend sur son image.
    const rev = estRev(c) || estGel(c);
    const av = rev ? 0 : Math.min(AMORCE, c.e / vit);
    const poser = estGel(c) ? c.gel : rev ? c.o : Math.max(0, c.e - av * vit);
    const lance = !rev && enLecture && tLect >= c.t0 - av;
    // « _prep » etait un drapeau : une fois leve, il le restait a vie. Le plan
    // avait donc beau avoir deja ete joué et s etre arrete a sa sortie, on ne
    // le remettait plus jamais a son entree — et a la lecture suivante le
    // lecteur principal decouvrait un ecart de plusieurs secondes et sautait
    // pour le rattraper, pile sur la coupe. On compare des POSITIONS.
    if (!lance && !v.seeking && Math.abs(v.currentTime - poser) > 0.08) {
      const t = performance.now();
      if (t - (v._essaiPose || 0) > 200) {
        v._essaiPose = t;
        try { v.currentTime = poser; } catch (e) {}
      }
    }
    if (lance) {
      if (!v.muted) v.muted = true;              // l amorce ne s entend jamais
      if (v.playbackRate !== vit) { try { v.playbackRate = vit; } catch (e) {} }
      const t = performance.now();
      if (v.paused && t - (v._essaiLecture || 0) > 250) {
        v._essaiLecture = t;
        v.play().catch(() => {});
      }
    }
  }
  menage();
}

// ===========================================================================
//  Cache de lecture
// ===========================================================================
// Monter, c est juger un rythme. Une image qui accroche au cut fausse ce
// jugement. Le cache fabrique une fois pour toutes chaque image de la plage,
// et la lecture n a plus qu a les poser : plus aucun decodage video, donc plus
// aucune saute possible. Le son, lui, continue de venir des lecteurs.
const CACHE = {a: 0, b: 0, fps: 24, img: [], pret: false, signe: '',
               occupe: false, annule: false};

// Signature du montage : si elle change, le cache ment et doit partir. On la
// calcule rarement — a la construction, et au demarrage de chaque lecture.
function signeMontage() {
  const p = [PROJET.w, PROJET.h, PROJET.fps,
             PISTES.map(x => x.id + x.type + (x.mute ? 'm' : '') +
               (x.solo ? 's' : '') + (x.vol === undefined ? '' : x.vol)).join()];
  for (const c of CLIPS)
    p.push([c.uid, c.piste, c.film || '', c.genre || '', c.t0.toFixed(3),
            c.e.toFixed(3), c.o.toFixed(3), c.vitesse || 1, c.ech || 1,
            c.dx || 0, c.dy || 0, c.opac === undefined ? 1 : c.opac,
            c.fi || 0, c.fo || 0, c.mode || '', c.couleur || 0,
            c.shk ? 1 : 0, JSON.stringify(couchesShk(c)),
            c.fond || '', c.txt || '', c.police || '', c.taille || 0,
            c.teinte || '', c.ombre === false ? 0 : 1,
            c.anim ? JSON.stringify(c.anim) : '',
            c.fx ? JSON.stringify(c.fx) : '',
            c.masque ? JSON.stringify(c.masque) : '',
            estGel(c) ? c.gel : ''].join(':'));
  return p.join('|');
}

function viderCache(msg) {
  for (const b of CACHE.img) { try { b.close(); } catch (e) {} }
  CACHE.img = []; CACHE.pret = false; CACHE.signe = '';
  majBoutonCache();
  if (msg) dire(msg);
}

function imageCache(t) {
  if (!CACHE.pret || t < CACHE.a - 1e-4 || t > CACHE.b + 1e-4) return null;
  const i = Math.round((t - CACHE.a) * CACHE.fps);
  return (i >= 0 && i < CACHE.img.length) ? CACHE.img[i] : null;
}

function majBoutonCache(part) {
  const b = $('#bCache');
  if (!b) return;
  const j = b.querySelector('.jauge'), x = b.querySelector('.txt');
  b.classList.toggle('encours', part !== null && part !== undefined);
  b.classList.toggle('pret', CACHE.pret && part === undefined);
  if (part !== null && part !== undefined) {
    j.style.width = Math.round(part * 100) + '%';
    x.textContent = '⚡ ' + Math.round(part * 100) + '%';
  } else if (CACHE.pret) {
    j.style.width = '100%';
    x.textContent = '⚡ ' + (CACHE.img.length / CACHE.fps).toFixed(1) + 's';
  } else {
    j.style.width = '0';
    x.textContent = '⚡ Cache';
  }
}

// On ne capture une image que lorsque les lecteurs sont VRAIMENT arrives a
// leur position : sinon on graverait l image precedente dans le cache.
function attendrePlaces() {
  const l = [];
  for (const c of actifs(tLect)) {
    if (estSynth(c)) continue;
    const v = POOL.get(c.uid);
    if (!v) continue;
    const cible = estGel(c) ? c.gel : srcA(c, tLect);
    if (v.readyState >= 2 && Math.abs(v.currentTime - cible) < 0.02) continue;
    l.push(new Promise(res => {
      let fait = false;
      const ok = () => { if (fait) return; fait = true;
        v.removeEventListener('seeked', ok); res(); };
      v.addEventListener('seeked', ok);
      setTimeout(ok, 260);       // un fichier recalcitrant ne bloque pas tout
    }));
  }
  return Promise.all(l);
}

async function fabriquerCache() {
  if (CACHE.occupe) { CACHE.annule = true; return; }
  if (!CLIPS.length) { dire('the timeline is empty'); return; }
  const a = tIn !== null ? tIn : 0;
  const b = tOut !== null ? tOut : dureeTotale();
  if (b - a < 0.1) { dire('range too short'); return; }
  pause();
  viderCache();
  CACHE.occupe = true; CACHE.annule = false;
  const fps = PROJET.fps || 24;
  // Deux plafonds : le nombre d images, et la memoire. Une image de moniteur
  // en 1280x720 pese 3,5 Mo — mille images font deja 3,5 Go.
  const parImage = Math.max(1, moni.width * moni.height * 4);
  const plafond = Math.min(1800, Math.max(24,
    Math.floor(700 * 1024 * 1024 / parImage)));
  const total = Math.min(Math.ceil((b - a) * fps), plafond);
  const tSauve = tLect;
  const img = [];
  majBoutonCache(0);
  try {
    for (let i = 0; i < total; i++) {
      if (CACHE.annule) break;
      tLect = a + i / fps;
      resynchroniser(true);
      await attendrePlaces();
      dessiner();
      img.push(await createImageBitmap(moni));
      if (i % 4 === 0) {
        majBoutonCache(i / total);
        await new Promise(r => setTimeout(r, 0));   // on rend la main a l ecran
      }
    }
  } catch (err) {
    dire('cache failed — ' + err.message, true);
  } finally {
    CACHE.occupe = false;
    if (img.length > 1) {
      CACHE.a = a; CACHE.fps = fps; CACHE.img = img;
      CACHE.b = a + (img.length - 1) / fps;
      CACHE.pret = true; CACHE.signe = signeMontage();
    } else {
      for (const x of img) { try { x.close(); } catch (e) {} }
    }
    tLect = tSauve;
    resynchroniser(true); majTete(); majBoutonCache(); dessiner();
    const voulu = Math.ceil((b - a) * fps);
    if (CACHE.pret)
      // Un cache interrompu garde ce qu il a : cette partie-la se lit sans
      // accroc, le reste se compose comme avant.
      dire((CACHE.annule ? 'cache stopped at ' : 'cached ') +
        (img.length / fps).toFixed(1) + 's · ' + img.length + ' frames' +
        (!CACHE.annule && img.length < voulu
          ? ' (capped — the range is longer than memory allows)' : ''));
    else if (CACHE.annule) dire('cache cancelled');
  }
}

$('#bCache').onclick = e => {
  if (e.shiftKey) { viderCache('cache released'); return; }
  if (CACHE.occupe) { CACHE.annule = true; return; }
  if (cacheAJour()) { viderCache('cache released'); return; }
  fabriquerCache();
};
const cacheAJour = () => CACHE.pret && CACHE.signe === signeMontage();

// Depuis quand le moniteur attend un lecteur qui n est pas pret, et QUI il
// attend. Sans le « qui », une premiere attente expiree laissait le compteur
// en place : la coupe suivante, elle, n aurait plus ete protegee du tout.
const GEL = {depuis: 0, qui: ''};

// ===========================================================================
//  Rack d effets
// ===========================================================================
// Chaque plan porte sa pile d effets (c.fx), appliques dans l ordre. Chacun
// existe DEUX fois : ici pour le moniteur, et dans serveur.py (_graphe_fx)
// pour le rendu — et les deux doivent donner la meme image. D ou :
//  - les tailles en % de la LARGEUR DU CADRE, jamais en pixels : le moniteur
//    est plus petit que la video rendue ;
//  - la couleur en etapes identiques des deux cotes (pente, matrice), chacune
//    bornee a [0,1] comme dans ffmpeg. Le filtre SVG est declare en sRGB : en
//    linearRGB, le defaut, un rouge 200 x 0,5 donnait 146 au lieu de 100.
// Les effets s appliquent APRES le cadrage et la secousse, AVANT la
// transparence et les fondus : le meme ordre au rendu.
const FX = {
  flou: {nom: 'Blur', neuf: () => ({mode: 'gauss', force: 1, angle: 0,
                                    centre: 50, largeur: 30, fondu: 20})},
  etal: {nom: 'Colour', neuf: () => ({expo: 0, contraste: 0, satu: 0, temp: 0})},
  nb: {nom: 'B&W · sepia · tint', neuf: () => ({mode: 'nb', teinte: '#d9a066',
                                                dose: 100})},
  vignette: {nom: 'Vignette', neuf: () => ({force: 40})},
  grain: {nom: 'Grain', neuf: () => ({force: 25})},
  halation: {nom: 'Halation', neuf: () => ({force: 45, seuil: 72, taille: 1.1,
                                            teinte: '#ff5a1e'})},
  aberration: {nom: 'Chromatic aberration', neuf: () => ({force: 0.25})}
};
// [cle, etiquette, min, max, pas, unite]
const FX_REGLAGES = {
  flou: {
    gauss: [['force', 'Strength', 0, 5, 0.05, '%']],
    dir: [['force', 'Length', 0, 8, 0.05, '%'], ['angle', 'Angle', 0, 180, 1, '°']],
    tilt: [['force', 'Blur', 0, 5, 0.05, '%'],
           ['centre', 'Focus position', 0, 100, 1, '%'],
           ['largeur', 'Sharp band', 0, 100, 1, '%'],
           ['fondu', 'Transition', 0, 100, 1, '%'],
           ['angle', 'Angle', -90, 90, 1, '°']]
  },
  etal: [['expo', 'Exposure', -2, 2, 0.05, ' st'],
         ['contraste', 'Contrast', -100, 100, 1, ''],
         ['satu', 'Saturation', -100, 100, 1, ''],
         ['temp', 'Temperature', -100, 100, 1, '']],
  nb: [['dose', 'Amount', 0, 100, 1, '%']],
  vignette: [['force', 'Strength', 0, 100, 1, '']],
  grain: [['force', 'Strength', 0, 100, 1, '']],
  halation: [['force', 'Strength', 0, 100, 1, ''],
             ['seuil', 'From brightness', 0, 95, 1, '%'],
             ['taille', 'Spread', 0, 5, 0.05, '%']],
  aberration: [['force', 'Offset', 0, 1.5, 0.01, '%']]
};
// Un bloc « calque d effet » : sa pile s applique a tout ce qui est dessous.
const estReglage = c => !!c && c.genre === 'reglage';
const fxActifs = c => (c && (!estSynth(c) || estReglage(c)) && Array.isArray(c.fx))
  ? c.fx.filter(x => x && x.on !== false && FX[x.t]) : [];
const fxNum = (x, k, d) => {
  const v = parseFloat(x[k]);
  return isNaN(v) ? d : v;
};

// ---- effets animes (1.3.25) ------------------------------------------------
// x.anim = {reglage: [{t, v}, ...]} sur l EFFET lui-meme : ses cles le suivent
// quand on le deplace dans la pile ou qu on copie le bloc. « t » depuis le
// debut du bloc ; meme interpolation que valAnim — et que _valeur_cles() dans
// serveur.py, qui rend le bloc en tranches.
const clesFx = (x, k) => (x && x.anim && x.anim[k] && x.anim[k].length) ? x.anim[k] : null;
function interpCles(l, x) {
  if (x <= l[0].t) return l[0].v;
  const der = l[l.length - 1];
  if (x >= der.t) return der.v;
  for (let i = 1; i < l.length; i++) {
    if (x <= l[i].t) {
      const p = l[i - 1], q = l[i], e = q.t - p.t;
      return e <= 0.0001 ? q.v : p.v + (q.v - p.v) * (x - p.t) / e;
    }
  }
  return der.v;
}
function valFx(c, x, k, t) {
  const def = FX[x.t] ? FX[x.t].neuf()[k] : 0;
  const l = clesFx(x, k);
  return l ? interpCles(l, t - c.t0) : fxNum(x, k, def);
}
// Les effets actifs d un bloc, avec les valeurs de leurs reglages a l instant t.
function fxA(c, t) {
  return fxActifs(c).map(x => {
    if (!x.anim) return x;
    const y = Object.assign({}, x);
    for (const k in x.anim) if (clesFx(x, k)) y[k] = valFx(c, x, k, t);
    return y;
  });
}
const fxAnime = c => Array.isArray(c && c.fx) &&
  c.fx.some(x => x && x.anim && Object.keys(x.anim).some(k => clesFx(x, k)));

// Les etapes de couleur d un effet — le MEME calcul que _etapes_couleur()
// dans serveur.py. {pente, origine} : v' = v*pente + origine, par canal ;
// {m} : matrice 3x3 sur (R,V,B). Tout en 0..1, borne apres chaque etape.
function etapesCouleur(x) {
  const e = [];
  const melange = (m, d) => m.map((v, i) => (1 - d) * [1,0,0,0,1,0,0,0,1][i] + d * v);
  if (x.t === 'etal') {
    const expo = fxNum(x, 'expo', 0), temp = fxNum(x, 'temp', 0) / 100,
          satu = fxNum(x, 'satu', 0) / 100, con = fxNum(x, 'contraste', 0) / 100;
    if (Math.abs(expo) > 1e-4) e.push({pente: Math.pow(2, expo), origine: 0});
    if (Math.abs(temp) > 1e-4)
      e.push({m: [1 + 0.25 * temp, 0, 0, 0, 1, 0, 0, 0, 1 - 0.25 * temp]});
    if (Math.abs(satu) > 1e-4) {
      const s = 1 + satu;
      e.push({m: [0.213 + 0.787 * s, 0.715 - 0.715 * s, 0.072 - 0.072 * s,
                  0.213 - 0.213 * s, 0.715 + 0.285 * s, 0.072 - 0.072 * s,
                  0.213 - 0.213 * s, 0.715 - 0.715 * s, 0.072 + 0.928 * s]});
    }
    if (Math.abs(con) > 1e-4) {
      const C = 1 + con;
      e.push({pente: C, origine: 0.5 - 0.5 * C});
    }
  } else if (x.t === 'nb') {
    const d = Math.max(0, Math.min(1, fxNum(x, 'dose', 100) / 100));
    if (d <= 1e-4) return e;
    let m;
    if (x.mode === 'sepia') {
      m = [0.393, 0.769, 0.189, 0.349, 0.686, 0.168, 0.272, 0.534, 0.131];
    } else if (x.mode === 'virage') {
      const h = /^#[0-9a-f]{6}$/i.test(x.teinte || '') ? x.teinte : '#d9a066';
      const r = parseInt(h.slice(1, 3), 16) / 255, g = parseInt(h.slice(3, 5), 16) / 255,
            b = parseInt(h.slice(5, 7), 16) / 255;
      const k = Math.max(r, g, b, 1e-3);
      const L = [0.2126, 0.7152, 0.0722];
      m = [r / k * L[0], r / k * L[1], r / k * L[2],
           g / k * L[0], g / k * L[1], g / k * L[2],
           b / k * L[0], b / k * L[1], b / k * L[2]];
    } else {
      m = [0.2126, 0.7152, 0.0722, 0.2126, 0.7152, 0.0722, 0.2126, 0.7152, 0.0722];
    }
    e.push({m: melange(m, d)});
  }
  return e;
}

// Un filtre SVG par suite d etapes, fabrique une fois et garde.
const FX_SVG = (() => {
  const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  s.setAttribute('width', '0'); s.setAttribute('height', '0');
  s.style.cssText = 'position:absolute;width:0;height:0;pointer-events:none';
  document.body.appendChild(s);
  return s;
})();
const FX_FILTRES = new Map();
function filtreCouleur(etapes) {
  if (!etapes.length) return 'none';
  const f5 = v => (+v).toFixed(5);
  const corps = etapes.map(e => e.m
    ? '<feColorMatrix type="matrix" values="' +
      [e.m[0], e.m[1], e.m[2], 0, 0, e.m[3], e.m[4], e.m[5], 0, 0,
       e.m[6], e.m[7], e.m[8], 0, 0, 0, 0, 0, 1, 0].map(f5).join(' ') + '"/>'
    : '<feComponentTransfer>' + ['R', 'G', 'B'].map(c =>
        '<feFunc' + c + ' type="linear" slope="' + f5(e.pente) +
        '" intercept="' + f5(e.origine) + '"/>').join('') +
      '</feComponentTransfer>').join('');
  let id = FX_FILTRES.get(corps);
  if (!id) {
    // Un curseur qu on promene fabrique un filtre par valeur : on fait le
    // menage de temps en temps.
    if (FX_FILTRES.size > 300) { FX_FILTRES.clear(); FX_SVG.innerHTML = ''; }
    id = 'fxc' + Math.random().toString(36).slice(2, 9);
    const el = document.createElementNS('http://www.w3.org/2000/svg', 'filter');
    el.setAttribute('id', id);
    el.setAttribute('color-interpolation-filters', 'sRGB');
    el.innerHTML = corps;
    FX_SVG.appendChild(el);
    FX_FILTRES.set(corps, id);
  }
  return 'url(#' + id + ')';
}

// Toiles de travail, reutilisees d une image a l autre.
const FX_TOILES = [];
function toileFx(i, w, h) {
  let tl = FX_TOILES[i];
  if (!tl) { tl = document.createElement('canvas'); FX_TOILES[i] = tl; }
  if (tl.width !== w || tl.height !== h) { tl.width = w; tl.height = h; }
  const g = tl.getContext('2d');
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'; g.filter = 'none';
  return tl;
}

// Un grand reservoir de bruit uniforme [-1,1], tire une fois : chaque image y
// puise a partir d un point au hasard, le grain change donc a chaque image.
const FX_BRUIT = new Float32Array(1 << 20);
let fxBruitPret = false;

// La bande nette du tilt-shift, en masque — la meme formule que le « geq » du
// rendu : 1 dans la bande, rampe lineaire sur la transition, 0 au-dela. Les
// distances se comptent en hauteurs de cadre.
function degradeBande(g, x, w, h) {
  const th = fxNum(x, 'angle', 0) * Math.PI / 180;
  const nx = -Math.sin(th), ny = Math.cos(th);
  const cx = w / 2, cy = h * fxNum(x, 'centre', 50) / 100;
  const demi = Math.max(0, fxNum(x, 'largeur', 30)) / 200;
  const f = Math.max(0.001, fxNum(x, 'fondu', 20) / 100);
  const L = demi + f;
  const gr = g.createLinearGradient(cx - nx * L * h, cy - ny * L * h,
                                    cx + nx * L * h, cy + ny * L * h);
  gr.addColorStop(0, 'rgba(0,0,0,0)');
  gr.addColorStop(0.5 - demi / (2 * L), 'rgba(0,0,0,1)');
  gr.addColorStop(0.5 + demi / (2 * L), 'rgba(0,0,0,1)');
  gr.addColorStop(1, 'rgba(0,0,0,0)');
  return gr;
}

function flouFx(t1, x, w, h) {
  const mode = x.mode || 'gauss';
  const force = Math.max(0, fxNum(x, 'force', 1));
  const t2 = toileFx(2, w, h), g2 = t2.getContext('2d');
  g2.clearRect(0, 0, w, h);
  if (mode === 'dir') {
    // ffmpeg « dblur » : ecart-type ~1,1 x son rayon (mesure). Ici une somme
    // ponderee de copies decalees le long de la direction.
    const sig = force / 100 * w;
    if (sig < 0.3) return;
    const a = fxNum(x, 'angle', 0) * Math.PI / 180;
    const n = Math.max(5, Math.min(41, Math.ceil(5 * sig / 1.5)));
    const p = [];
    let somme = 0;
    for (let i = 0; i < n; i++) {
      const d = (i / (n - 1) * 2 - 1) * 2.5 * sig;
      const q = Math.exp(-d * d / (2 * sig * sig));
      p.push([d, q]); somme += q;
    }
    g2.globalCompositeOperation = 'lighter';
    for (const [d, q] of p) {
      g2.globalAlpha = q / somme;
      g2.drawImage(t1, Math.cos(a) * d, Math.sin(a) * d);
    }
    g2.globalAlpha = 1; g2.globalCompositeOperation = 'source-over';
  } else {
    const sig = force / 100 * w;
    if (sig < 0.05) return;
    g2.filter = 'blur(' + sig.toFixed(2) + 'px)';
    g2.drawImage(t1, 0, 0);
    g2.filter = 'none';
  }
  const g1 = t1.getContext('2d');
  if (mode === 'tilt') {
    const t3 = toileFx(3, w, h), g3 = t3.getContext('2d');
    g3.clearRect(0, 0, w, h);
    g3.drawImage(t1, 0, 0);
    g3.globalCompositeOperation = 'destination-in';
    g3.fillStyle = degradeBande(g3, x, w, h);
    g3.fillRect(0, 0, w, h);
    g3.globalCompositeOperation = 'source-over';
    // flou par-dessus le net (les bords ne noircissent pas), puis la bande
    // nette par-dessus le tout : maskedmerge au rendu.
    g1.drawImage(t2, 0, 0);
    g1.drawImage(t3, 0, 0);
  } else {
    g1.drawImage(t2, 0, 0);
  }
}

// ffmpeg « vignette » en rgb24 : facteur cos^4(angle x distance/demi-diagonale)
// — mesure au pixel (201 pour 200,8 attendus, 63 pour 63,8).
function vignetteFx(g, w, h, force) {
  const ang = Math.max(0, Math.min(100, force)) / 100 * Math.PI / 2;
  if (ang <= 1e-4) return;
  const R = Math.hypot(w / 2, h / 2);
  const gr = g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, R);
  for (let i = 0; i <= 24; i++) {
    const r = i / 24, c = Math.cos(ang * r);
    gr.addColorStop(r, 'rgba(0,0,0,' + (1 - c * c * c * c).toFixed(4) + ')');
  }
  g.globalCompositeOperation = 'source-atop';
  g.fillStyle = gr;
  g.fillRect(0, 0, w, h);
  g.globalCompositeOperation = 'source-over';
}

// ffmpeg « noise=c0s=S:c0f=t+u » AJOUTE a la luminance un bruit uniforme
// d ecart-type 0,33 x S (mesure), donc borne a +-0,57 x S. Meme chose ici,
// ajoute aux trois canaux. Un « overlay » ne touchait pas les couleurs
// saturees : le grain du moniteur etait six fois trop faible sur une mire.
function grainFx(g, w, h, force) {
  const S = Math.max(0, Math.min(100, force)) * 0.6;
  if (S < 0.5) return;
  if (!fxBruitPret) {
    for (let i = 0; i < FX_BRUIT.length; i++) FX_BRUIT[i] = Math.random() * 2 - 1;
    fxBruitPret = true;
  }
  const A = 0.57 * S, masque = FX_BRUIT.length - 1;
  const img = g.getImageData(0, 0, w, h), d = img.data;
  let k = Math.floor(Math.random() * FX_BRUIT.length);
  for (let i = 0; i < d.length; i += 4) {
    if (!d[i + 3]) continue;            // hors du plan : rien a graver
    const n = FX_BRUIT[k++ & masque] * A;
    d[i] += n; d[i + 1] += n; d[i + 2] += n;
  }
  g.putImageData(img, 0, 0);
}

// Halation : les hautes lumieres, seuillees puis ramenees a une luminance,
// teintees, etalees, et ajoutees en « screen » — le halo rouge-orange du
// 16 mm. Memes etapes que le rendu (_etapes_halo).
function etapesHalo(x) {
  const s = Math.max(0, Math.min(95, fxNum(x, 'seuil', 72))) / 100;
  const h = /^#[0-9a-f]{6}$/i.test(x.teinte || '') ? x.teinte : '#ff5a1e';
  const r = parseInt(h.slice(1, 3), 16) / 255, g = parseInt(h.slice(3, 5), 16) / 255,
        b = parseInt(h.slice(5, 7), 16) / 255;
  const L = [0.2126, 0.7152, 0.0722];
  return [{pente: 1 / (1 - s), origine: -s / (1 - s)},
          {m: [r * L[0], r * L[1], r * L[2], g * L[0], g * L[1], g * L[2],
               b * L[0], b * L[1], b * L[2]]}];
}
function halationFx(t1, x, w, h) {
  const a = Math.max(0, Math.min(100, fxNum(x, 'force', 45))) / 100;
  if (a <= 0.001) return;
  const sig = Math.max(0, fxNum(x, 'taille', 1.1)) / 100 * w;
  const t2 = toileFx(2, w, h), g2 = t2.getContext('2d');
  g2.clearRect(0, 0, w, h);
  g2.filter = filtreCouleur(etapesHalo(x)) +
    (sig > 0.05 ? ' blur(' + sig.toFixed(2) + 'px)' : '');
  g2.drawImage(t1, 0, 0);
  g2.filter = 'none';
  const g1 = t1.getContext('2d');
  g1.globalCompositeOperation = 'screen';
  g1.globalAlpha = a;
  g1.drawImage(t2, 0, 0);
  g1.globalAlpha = 1; g1.globalCompositeOperation = 'source-over';
}
// Aberration chromatique : le rouge part d un cote, le bleu de l autre. Trois
// passes, une par canal, additionnees — ffmpeg « rgbashift ».
function aberrationFx(t1, x, w, h) {
  const d = Math.max(0, fxNum(x, 'force', 0.25)) / 100 * w;
  if (d < 0.05) return;

  g2.clearRect(0, 0, w, h);
  g2.globalCompositeOperation = 'lighter';
