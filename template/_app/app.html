  const it = e.target.closest('[data-bar]');
  if (!it) return;
  const a = it.dataset.bar;
  $('#menu').className = '';
  if (a === 'tout') {
    const n = ongletsFermes().length;
    FERMES.clear(); noterFermes(); rafraichirProjets();
    dire(n + ' tab' + (n > 1 ? 's reopened' : ' reopened'));
  } else if (a === 'choisir') {
    boiteRouvrir();
  }
});

// Choisir lesquels rouvrir. Rien n est touche sur le disque : on ne fait
// qu enlever des clefs de FERMES, et la bande se redessine.
function boiteRouvrir() {
  const caches = ongletsFermes();
  if (!caches.length) { dire('no closed tab'); return; }
  const b = $('#boite');
  const parProjet = {};
  caches.forEach(m => {
    (parProjet[m.projet] = parProjet[m.projet] || []).push(m);
  });
  b.innerHTML = '<h3>Reopen tabs</h3>' +
    '<div style="display:flex;flex-direction:column;gap:11px">' +
    '<div style="font-size:11px;color:var(--sourd);line-height:1.5">' +
    caches.length + ' tab' + (caches.length > 1 ? 's closed' : ' closed') +
    '. All the files are in <code>_projet/_montages/</code>: ticking only ' +
    'only brings them back into the bar.</div>' +
    '<div style="display:flex;gap:8px">' +
    '<button id="roTout">Check all</button>' +
    '<button id="roRien">Uncheck all</button></div>' +
    '<div style="max-height:44vh;overflow:auto;border:1px solid var(--trait);' +
    'border-radius:5px;padding:6px 8px">' +
    Object.keys(parProjet).sort().map(pj =>
      '<div style="font:10px/2 ui-monospace,monospace;letter-spacing:.11em;' +
      'text-transform:uppercase;color:var(--sourd)">' + echap(pj) + '</div>' +
      parProjet[pj].map(m =>
        '<label style="display:flex;align-items:center;gap:8px;padding:3px 2px;' +
        'cursor:pointer;font-size:12px">' +
        '<input type="checkbox" class="roC" value="' +
        echap(clefMontage(m)) + '" checked>' +
        '<span style="flex:1;min-width:0;overflow:hidden;white-space:nowrap;' +
        'text-overflow:ellipsis">' + echap(m.nom) + '</span>' +
        '<i style="font-style:normal;color:var(--sourd);font-size:10px;' +
        'flex:0 0 auto">' + echap(m.maj) + '</i></label>').join('')).join('') +
    '</div>' +
    '<div style="display:flex;gap:8px;justify-content:flex-end">' +
    '<button id="roAnnule">Cancel</button>' +
    '<button id="roOk" class="on">Reopen</button></div></div>';
  $('#voile').className = 'on';
  const cases = () => [...b.querySelectorAll('.roC')];
  const majOk = () => {
    const n = cases().filter(c => c.checked).length;
    const ok = $('#roOk');
    ok.textContent = n ? 'Reopen ' + n + ' tab' + (n > 1 ? 's' : '')
                       : 'Reopen';
    ok.disabled = !n;
  };
  cases().forEach(c => c.onchange = majOk);
  $('#roTout').onclick = () => { cases().forEach(c => c.checked = true); majOk(); };
  $('#roRien').onclick = () => { cases().forEach(c => c.checked = false); majOk(); };
  $('#roAnnule').onclick = () => { $('#voile').className = ''; };
  $('#roOk').onclick = () => {
    const pris = cases().filter(c => c.checked).map(c => c.value);
    if (!pris.length) return;
    pris.forEach(k => FERMES.delete(k));
    noterFermes();
    $('#voile').className = '';
    rafraichirProjets();
    dire(pris.length + ' tab' + (pris.length > 1 ? 's reopened' : ' reopened'));
  };
  majOk();
}

$('#barreProjets').addEventListener('click', async e => {
  const croix = e.target.closest('[data-fermerm]');
  if (croix) {
    e.stopPropagation();
    FERMES.add(croix.dataset.fermerm);
    noterFermes();
    rafraichirProjets();
    dire('tab closed — the file stays in _projet/_montages/');
    return;
  }
  if (e.target.dataset.rouvrir) {
    FERMES.clear(); noterFermes(); rafraichirProjets(); return;
  }
  if (e.target.dataset.recharger) { rafraichirProjets(); return; }
  if (e.target.dataset.nouveau) { boiteProjet(); return; }
  const el = e.target.closest('[data-p]');
  const nom = el && el.dataset.p, pj = el && el.dataset.pj;
  if (!nom) return;
  if (nom === projetNom && pj === PROJET.pj) {
    dire('“' + nom + '” is already open'); return;
  }
  await assurerSauvegarde();
  try {
    const d = await api('/api/montage?projet=' + encodeURIComponent(pj) +
      '&nom=' + encodeURIComponent(nom));
    await chargerProjet(d.montage, d.nom, d.projet);
    noterDernier(d.projet || pj, d.nom || nom);
  } catch (err) { dire('could not open — ' + err.message, true); }
});

// Seul moment ou l on previent : la fermeture de l onglet ou du navigateur.
// L enregistrement etant continu, il n y a plus rien a perdre en fermant —
// sauf si la derniere ecriture a echoue. C est le seul cas ou on previent.
addEventListener('beforeunload', e => {
  if (!sauveEnEchec || !CLIPS.length) return;
  e.preventDefault();
  e.returnValue = '';
});

// ---- le serveur s arrête quand on ferme l onglet -----------------------
// La page bat la mesure toutes les 5 s. À la fermeture elle prévient, et le
// serveur attend 5 s avant de sortir : un simple rechargement reprend la main
// dans la seconde et ne tue rien. Si le navigateur part sans prévenir, le
// silence prolongé suffit — c est le filet côté serveur.
let JETON = '';
setInterval(() => {
  // En ligne il n y a pas de processus a tenir eveille : la mesure ne sert
  // qu au serveur de bureau, qui s arrete quand l onglet se ferme.
  if (!ENLIGNE) fetch('/api/vivant', {cache: 'no-store'}).catch(() => {});
}, 5000);
// Un retour d onglet (ou un reveil de machine) rebat la mesure sans attendre
// les 5 s du minuteur : c est ce qui annule un adieu parti pour rien.
addEventListener('pageshow', () => {
  adieuEnvoye = false;
  if (!ENLIGNE) fetch('/api/vivant', {cache: 'no-store'}).catch(() => {});
});
// L adieu part sur « pagehide » ET sur « beforeunload » : selon la facon dont
// l onglet est ferme, l un des deux peut ne pas se declencher. Un drapeau
// evite le double envoi, et le serveur attend 5 s de toute facon — un
// rechargement reprend la main avant l echeance et annule le depart.
let adieuEnvoye = false;
function direAdieu() {
  if (adieuEnvoye || !JETON) return;
  adieuEnvoye = true;
  const corps = JSON.stringify({jeton: JETON});
  try {
    if (navigator.sendBeacon) {
      navigator.sendBeacon('/api/adieu',
        new Blob([corps], {type: 'application/json'}));
      return;
    }
  } catch (e) {}
  // Pas de sendBeacon : un fetch « keepalive » survit a la fermeture.
  try {
    fetch('/api/adieu', {method: 'POST', body: corps, keepalive: true,
      headers: {'Content-Type': 'application/json'}}).catch(() => {});
  } catch (e) {}
}
// « beforeunload » se declenche aussi quand la fermeture peut encore etre
// annulee (le message « modifications non enregistrees »). Si la page est
// toujours la une seconde plus tard, c est qu on est reste : on rebat la
// mesure, ce qui annule l adieu cote serveur. Un minuteur pose juste avant
// une vraie fermeture ne se declenche jamais.
function adieuPeutEtreAnnule() {
  setTimeout(() => {
    adieuEnvoye = false;
    if (!ENLIGNE) fetch('/api/vivant', {cache: 'no-store'}).catch(() => {});
  }, 900);
}
addEventListener('pagehide', () => { sauverAvantDeFermer(); direAdieu(); });
addEventListener('beforeunload', () => {
  sauverAvantDeFermer(); direAdieu(); adieuPeutEtreAnnule();
});

$('#bProjet').onclick = boiteProjet;
// Un seul bouton pour les trois sorties : le menu s ouvre sous lui.
// Les entrees portent « data-exp », jamais « data-act » : #menu est partage
// avec le menu des blocs, dont le gestionnaire ne cherche que « data-act ».
$('#bExport').onclick = e => {
  const m = $('#menu');
  m.innerHTML = '<div class="lbl">Export the sequence</div>' +
    '<div class="it" data-exp="json">↓ JSON<span class="pousse" ' +
    'style="color:var(--sourd);font-size:10px">the timeline as data</span></div>' +
    '<div class="it" data-exp="xml">↓ XML<span class="pousse" ' +
    'style="color:var(--sourd);font-size:10px">Premiere / Resolve</span></div>' +
    '<div class="sep"></div>' +
    '<div class="it" data-exp="ffmpeg">⧉ ffmpeg commands<span class="pousse" ' +
    'style="color:var(--sourd);font-size:10px">to the clipboard</span></div>';
  m.className = 'on';
  const r = m.getBoundingClientRect();
  const b = e.currentTarget.getBoundingClientRect();
  m.style.left = Math.min(b.left, innerWidth - r.width - 8) + 'px';
  m.style.top = Math.max(8, b.top - r.height - 6) + 'px';
};
$('#menu').addEventListener('click', e => {
  const it = e.target.closest('[data-exp]');
  if (!it) return;
  $('#menu').className = '';
  const a = it.dataset.exp;
  if (a === 'json') exporterJson();
  else if (a === 'xml') exporterXml();
  else if (a === 'ffmpeg') exporterFfmpeg();
});
$('#voile').addEventListener('click', e => {
  if (e.target.id === 'voile') $('#voile').className = '';
});
</script>
<script>
// ===========================================================================
//  Exports
// ===========================================================================
// Chaque projet a sa racine absolue sur le disque : l export XML doit ecrire
// le bon chemin pour chaque plan, pas une racine unique.
const racineDe = pj => (projetOuvert(pj) || {}).racine || '';
const img = s => Math.round(s * PROJET.fps);
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
  .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const horodate = () =>
  new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-');

function telecharger(nom, texte, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([texte], {type: type}));
  a.download = nom;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

function clipsDansBornes() {
  const {a, b} = bornes();
  return CLIPS.filter(c => fin(c) > a + 0.001 && c.t0 < b - 0.001);
}

function objetMontage() {
  const {a, b} = bornes();
  return {
    genere: new Date().toISOString(), racine: hoteMontage(), nom: PROJET.nom,
    fps: PROJET.fps, format: {w: PROJET.w, h: PROJET.h},
    entree: +a.toFixed(3), sortie: +b.toFixed(3),
    duree: +(b - a).toFixed(3),
    pistes: PISTES.map(p => ({id: p.id, type: p.type, mute: p.mute,
                              solo: p.solo, vol: volPiste(p)})),
    plans: clipsDansBornes().sort((x, y) => x.t0 - y.t0).map(c => {
      const f = PAR_ID[c.film] || {};
      return {piste: c.piste, projet: f.pj || c.pj || '',
              fichier: f.rel || c.fichier || '', nom: f.nom,
              genre: c.genre || '', fond: c.fond || '',
              texte: c.genre === 'texte' ? String(c.txt || '') : '',
              police: c.police || '', ttf: c.genre === 'texte'
                // La clef d une typo de bibliotheque EST son nom de fichier :
                // si elle n est pas chargee pour l instant, on garde quand
                // meme la reference, sinon un enregistrement ferait perdre
                // la typo pour de bon.
                ? (POLICES[c.police] ? POLICES[c.police].ttf
                   : (/\.[A-Za-z0-9]{2,5}$/.test(c.police || '') ? c.police
                      : POLICES[POLICE_DEFAUT].ttf))
                : '',
              taille: c.taille || 0, teinte: c.teinte || '',
              ombre: c.ombre !== false,
              position: +c.t0.toFixed(3), entree: +c.e.toFixed(3),
              sortie: +c.o.toFixed(3), duree: +dur(c).toFixed(3),
              vitesse: vAbs(c), rev: !!c.rev, couleur: c.couleur || 0,
              gain: c.gain, opacite: c.opac === undefined ? 1 : c.opac,
              lien: c.lien, anim: c.anim || null,
              fondu_entree: +(c._fIn || 0).toFixed(3),
              fondu_sortie: +(c._fOut || 0).toFixed(3),
              cadrage: {mode: c.mode, echelle: c.ech, dx: c.dx, dy: c.dy,
                        shk: !!c.shk,
                        shks: couchesShk(c).map(p => ({
                          f: p.f === undefined ? SHK_F : p.f,
                          a: p.a === undefined ? SHK_A : p.a,
                          r: p.r === undefined ? SHK_R : p.r,
                          i: p.i || 0, o: p.o || 0,
                          on: coucheActive(p)}))}};
    })
  };
}

async function exporterJson() {
  if (!CLIPS.length) { dire('the timeline is empty'); return; }
  const m = objetMontage(), nom = 'montage-' + horodate();
  telecharger(nom + '.json', JSON.stringify(m, null, 1), 'application/json');
  try {
    await api('/api/montage',
      {projet: hoteMontage(), nom: nom, montage: m});
  } catch (e) {}
  dire('JSON exported, copy in _montages/');
};

function versXml() {
  const rate = '<rate><timebase>' + PROJET.fps +
    '</timebase><ntsc>FALSE</ntsc></rate>';
  const vus = {};
  let nf = 0;
  // Une image fixe n a pas de duree : pour Premiere, sa « source » dure
  // autant que le plus long bloc qui la montre — sinon il la couperait.
  const dureeSource = f => f.image
    ? Math.max(1, ...CLIPS.filter(x => x.film === f.id).map(x => dur(x)))
    : (f.s || 0);
  const fichier = c => {
    const f = PAR_ID[c.film];
    if (!f) return '<file id="f0"/>';
    if (vus[f.id]) return '<file id="' + vus[f.id] + '"/>';
    const fid = 'f' + (++nf);
    vus[f.id] = fid;
    const racine = racineDe(f.pj).replace(/\\/g, '/').replace(/\/$/, '');
    const chemin = racine
      ? 'file://localhost/' + encodeURI(racine + '/' + f.rel)
      : encodeURI(f.rel);
    return '<file id="' + fid + '"><name>' + esc(f.nom + f.ext) + '</name>' +
      '<pathurl>' + chemin + '</pathurl>' + rate +
      '<duration>' + img(dureeSource(f)) + '</duration><media><video>' +
      '<samplecharacteristics><width>' + (f.w || 1280) + '</width><height>' +
      (f.h || 720) + '</height></samplecharacteristics></video>' +
      (f.a ? '<audio><channelcount>2</channelcount></audio>' : '') + '</media></file>';
  };
  const {a: bA} = bornes();
  const item = (c, i, audio, niveau) => {
    const f = PAR_ID[c.film] || {};
    const v = vSignee(c);
    return '<clipitem id="clip' + i + '"><name>' + esc(f.nom || 'shot') + '</name>' +
      '<duration>' + img(dureeSource(f)) + '</duration>' + rate +
      '<start>' + img(c.t0 - bA) + '</start><end>' + img(fin(c) - bA) + '</end>' +
      '<in>' + img(c.e) + '</in><out>' + img(c.o) + '</out>' +
      (v !== 1 ? '<filter><effect><name>Time Remap</name><effectid>timeremap</effectid>' +
        '<parameter><parameterid>speed</parameterid><name>speed</name>' +
        '<value>' + Math.round(v * 100) + '</value></parameter></effect></filter>' : '') +
      (audio && Math.abs((niveau || 1) - 1) > 0.005
        ? '<filter><effect><name>Audio Levels</name>' +
          '<effectid>audiolevels</effectid><effecttype>audiolevels</effecttype>' +
          '<mediatype>audio</mediatype><parameter><parameterid>level' +
          '</parameterid><name>Level</name><valuemin>0</valuemin>' +
          '<valuemax>3.98108</valuemax><value>' + (niveau || 1).toFixed(4) +
          '</value></parameter></effect></filter>' : '') +
      fichier(c) +
      (audio ? '<sourcetrack><mediatype>audio</mediatype><trackindex>1</trackindex>' +
               '</sourcetrack>' : '') + '</clipitem>';
  };
  // Un calque ou un texte n a pas de fichier sur le disque : l ecrire dans un
  // xmeml donnerait un clip hors-ligne dans Premiere. On les laisse de cote,
  // et le bouton XML le dit.
  const dedans = clipsDansBornes().filter(c => !estSynth(c));
  let n = 0, pv = '', pa = '';
  PISTES.filter(p => p.type === 'v')
    .sort((x, y) => numPiste(x.id) - numPiste(y.id)).forEach(p => {
      const l = dedans.filter(c => c.piste === p.id).sort((x, y) => x.t0 - y.t0);
      pv += '<track>' + l.map(c => item(c, ++n, false)).join('') +
        '<enabled>' + (p.mute ? 'FALSE' : 'TRUE') + '</enabled></track>';
    });
  PISTES.filter(p => p.type === 'a')
    .sort((x, y) => numPiste(x.id) - numPiste(y.id)).forEach(p => {
      const l = dedans.filter(c => c.piste === p.id).sort((x, y) => x.t0 - y.t0);
      pa += '<track>' + l.map(c =>
        item(c, ++n, true, (c.gain === undefined ? 1 : c.gain) * volPiste(p))
      ).join('') +
        '<enabled>' + (p.mute ? 'FALSE' : 'TRUE') + '</enabled></track>';
    });
  const {a, b} = bornes();
  return '<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE xmeml>\n' +
    '<xmeml version="4"><sequence id="gary"><name>' +
    esc(projetNom || 'GARY-ALL sequence') + '</name>' +
    '<duration>' + img(b - a) + '</duration>' + rate +
    '<media><video><format><samplecharacteristics>' + rate +
    '<width>' + PROJET.w + '</width><height>' + PROJET.h +
    '</height></samplecharacteristics></format>' +
    pv + '</video><audio>' + pa + '</audio></media></sequence></xmeml>';
}

async function exporterXml() {
  if (!CLIPS.length) { dire('the timeline is empty'); return; }
  const nSynth = clipsDansBornes().filter(estSynth).length;
  const xml = versXml();
  const nom = (projetNom || 'montage-' + horodate());
  const hote = hoteMontage();
  telecharger(nom + '.xml', xml, 'application/xml');
  if (!hote) { dire('XML downloaded (no project open for the copy)', true); return; }
  try {
    const r = await api('/api/texte',
      {projet: hote, nom: nom, ext: 'xml', contenu: xml});
    const note = nSynth ? ' — ' + nSynth + ' layer/text left' +
      (nSynth > 1 ? 's' : '') + ' aside (no file to reference)' : '';
    dire(racineDe(hote)
      ? 'XML exported → ' + r.fichier + note
      : 'XML exported, but RELATIVE paths: restart serveur.py for absolute paths',
      !racineDe(hote));
  } catch (err) {
    dire('XML downloaded (server copy failed: ' + err.message + ')', true);
  }
};

function exporterFfmpeg() {
  const dedans = clipsDansBornes();
  if (!dedans.length) { dire('nothing between the marks'); return; }
  const pv = pistesOrdonnees().find(p => p.type === 'v' && visible(p));
  const l = dedans.filter(c => c.piste === (pv ? pv.id : 'V1'))
    .sort((a, b) => a.t0 - b.t0);
  if (!l.length) { dire('no shot on the visible video track'); return; }
  const cmd = l.map((c, i) => {
    const f = PAR_ID[c.film], v = vAbs(c);
    const arriere = estRev(c) ? ',reverse' : '';
    const T = PROJET.w + ':' + PROJET.h;
    const cadre = c.mode === 'cover'
      ? 'scale=' + T + ':force_original_aspect_ratio=increase,crop=' + T
      : 'scale=' + T + ':force_original_aspect_ratio=decrease,pad=' + T + ':-1:-1';
    const vit = arriere + (v !== 1 ? ',setpts=' + (1 / v).toFixed(4) + '*PTS'
                                   : '');
    const lie = c.lien && CLIPS.some(x => x.lien === c.lien && piste(x.piste).type === 'a');
    return 'ffmpeg -ss ' + c.e.toFixed(3) + ' -to ' + c.o.toFixed(3) +
      ' -i "' + f.rel + '" -vf "' + cadre + vit + '" -r ' + PROJET.fps + ' ' +
      (lie ? '-c:a aac -b:a 192k -af atempo=' + Math.min(2, Math.max(0.5, v)) : '-an') +
      ' -c:v libx264 -crf 18 -pix_fmt yuv420p -y plan-' +
      String(i + 1).padStart(3, '0') + '.mp4';
  });
  cmd.push('', '# liste.txt:');
  l.forEach((c, i) => cmd.push("#   file 'plan-" + String(i + 1).padStart(3, '0') + ".mp4'"));
  cmd.push('ffmpeg -f concat -safe 0 -i liste.txt -c copy montage.mp4',
    '# NB: hard cuts only. For fades and multitrack,',
    '#      use the Render button or the XML export.');
  const t = cmd.join('\n');
  navigator.clipboard.writeText(t)
    .then(() => dire('ffmpeg commands copied'))
    .catch(() => { console.log(t); dire('copy refused — see the console', true); });
};

// ===========================================================================
//  Rendu de la séquence finale (ffmpeg côté serveur)
// ===========================================================================
const bRendre = $('#bRendre');
const rendreTxt = bRendre.querySelector('.txt');
const rendreJauge = bRendre.querySelector('.jauge');

// Un seul endroit qui touche à l aspect du bouton : libellé, couleur, jauge.
function etatRendu(txt, part) {
  rendreTxt.textContent = txt;
  bRendre.classList.toggle('encours', part !== null && part !== undefined);
  rendreJauge.style.width = (part === null || part === undefined)
    ? '0%' : Math.round(Math.max(0, Math.min(1, part)) * 100) + '%';
}

let renduEnCours = false;
const TYPES_RENDU = [
  ['mp4',   'MP4 · picture + sound', 'Picture and sound, hard cuts and cross dissolves.'],
  ['video', 'Picture only',       'Same picture, no audio track in the file.'],
  ['audio', 'Sound only',          'Only the sound linked to the shots. Output .wav ' +
                                 '(or .m4a if you give that extension).']
];

bRendre.onclick = () => {
  if (renduEnCours) { dire('a render is already running'); return; }
  const m = objetMontage();
  if (!m.plans.length) { dire('nothing to render'); return; }
  const hote = hoteMontage();
  if (!hote) { dire('open a project first', true); return; }
  const racine = racineDe(hote);
  const sep = racine.indexOf('\\') >= 0 ? '\\' : '/';
  const defaut = racine ? racine + sep + '_projet' + sep + '_montages' : '';
  let type = pref.lire('typeRendu', 'mp4');
  if (!TYPES_RENDU.some(t => t[0] === type)) type = 'mp4';
  const b = $('#boite');
  const dessine = () => {
    b.innerHTML = '<h3>Render the sequence</h3>' +
      '<div style="display:flex;flex-direction:column;gap:12px">' +
      '<div><label style="font-size:11px;color:var(--sourd)">File name' +
      '</label><br><input id="rNom" style="width:100%" value="' +
      esc(projetNom || 'sequence-' + horodate()) + '"></div>' +
      '<div><label style="font-size:11px;color:var(--sourd)">Output folder' +
      '</label><div style="display:flex;gap:7px"><input id="rDossier" ' +
      'style="flex:1;min-width:0" value="' +
      esc(pref.lire('sortieRendu', '') || defaut) +
      '" placeholder="empty = inside the project">' +
      '<button id="rParcourir" title="choose a folder">Browse…</button>' +
      '</div></div>' +
      '<div><label style="font-size:11px;color:var(--sourd)">Render type' +
      '</label><div class="pileboutons">' +
      TYPES_RENDU.map(t => '<button data-trendu="' + t[0] + '" class="' +
        (t[0] === type ? 'on' : '') + '">' + t[1] + '</button>').join('') +
      '</div></div>' +
      '<div style="font-size:11px;color:var(--sourd);line-height:1.5">' +
      (TYPES_RENDU.find(t => t[0] === type) || [])[2] + '<br>' +
      m.plans.length + ' shot(s) · ' + tc(m.duree) + ' · ' +
      (type === 'audio' ? '48 kHz stereo'
                        : PROJET.w + '×' + PROJET.h + ' at ' + PROJET.fps + ' i/s') +
      '<br>The file never overwrites: a name already taken becomes ' +
      '<code>name-2</code>.</div>' +
      '<div style="display:flex;gap:8px;justify-content:flex-end">' +
      '<button id="rAnnule">Cancel</button>' +
      '<button id="rOk" class="on">Render</button></div></div>';
    b.querySelectorAll('[data-trendu]').forEach(x => x.onclick = () => {
      const nom = $('#rNom').value, dos = $('#rDossier').value;
      type = x.dataset.trendu;
      dessine();
      $('#rNom').value = nom; $('#rDossier').value = dos;
    });
    // Le sélecteur s ouvre sur la machine, pas dans la page : c est le
    // serveur qui l affiche, et la requête reste ouverte pendant ce temps.
    $('#rParcourir').onclick = async () => {
      const b2 = $('#rParcourir');
      b2.disabled = true; b2.textContent = 'on screen…';
      try {
        const r = await api('/api/parcourir',
          {jeton: JETON, depart: $('#rDossier').value.trim()});
        if (r.chemin) $('#rDossier').value = r.chemin;
        else dire('no folder chosen');
      } catch (err) {
        dire('picker unavailable — ' + err.message, true);
      }
      b2.disabled = false; b2.textContent = 'Browse…';
    };
    $('#rAnnule').onclick = () => $('#voile').className = '';
    $('#rOk').onclick = async () => {
      const nom = $('#rNom').value.trim() || ('sequence-' + horodate());
      const sortie = $('#rDossier').value.trim();
      pref.ecrire('typeRendu', type);
      pref.ecrire('sortieRendu', sortie);
      $('#rOk').disabled = true;
      try {
        const r = await api('/api/rendre', {projet: hote, nom: nom,
          sortie: sortie, type: type, montage: m});
        $('#voile').className = '';
        renduEnCours = true;
        etatRendu('rendering…', 0);
        dire('render started (' + type + ') — ' + m.plans.length + ' shots → ' +
          r.fichier);
        suivreRendu();
      } catch (err) {
        $('#rOk').disabled = false;
        dire('render refused — ' + err.message, true);
      }
    };
  };
  dessine();
  $('#voile').className = 'on';
};

async function suivreRendu() {
  try {
    const e = await api('/api/rendu');
    if (e.etat === 'encours') {
      const t = e.total || 0, f = e.fait || 0;
      // Les segments faits ne comptent que pour les trois quarts : le dernier
      // quart, c est l assemblage, qui n a pas d avancement chiffré.
      etatRendu(f + '/' + (t || '?'), t ? (f / t) * 0.75 : 0.05);
      setTimeout(suivreRendu, 1200);
      return;
    }
    renduEnCours = false;
    etatRendu('⏺ Render', null);
    if (e.etat === 'fini') dire('render finished → ' + e.fichier);
    else if (e.etat === 'erreur') dire('render failed: ' + (e.message || ''), true);
  } catch (err) {
    renduEnCours = false;
    etatRendu('⏺ Render', null);
    dire('render tracking lost — ' + err.message, true);
  }
}

// ===========================================================================
//  Démarrage
// ===========================================================================
(async function () {
  // Le moniteur a grandi par defaut le 11/09. Une largeur memorisee plus
  // ancienne masquerait le changement : on l oublie une fois, et une seule.
  if (pref.lire('dispo', '') !== 'moni2') {
    pref.ecrire('moni', '');
    pref.ecrire('dispo', 'moni2');
  }
  ['aside', 'moni', 'regl', 'footer'].forEach(k => {
    const v = pref.lire(k, null);
    if (v) RACINE_CSS.setProperty(RZ[k].v, v);
  });
  const vd = pref.lire('deck', null);
  if (vd) RACINE_CSS.setProperty('--wDeck', vd);
  appliquerProfil();
  poserUnite(pref.lire('unite', 'sec'));
  appliquerSpecs();
  // Les typos de la bibliotheque avant tout le reste : un montage rouvert
  // doit retrouver la sienne des le premier dessin.
  // Avant tout le reste : y a-t-il des comptes, et suis-je entre ? Sur le
  // serveur de bureau cette route n existe pas, et rien ne change.
  await ouvrirPorte();
  await chargerPolices();
  // Les prereglages de secousse : ils viennent de la bibliotheque.
  await chargerPresets();

  try {
    const l = await api('/api/projets');
    JETON = l.jeton || '';
    // Le serveur de bureau n envoie aucun de ces trois champs : tout reste
    // exactement comme avant chez David.
    ENLIGNE = !!l.enligne;
    RANGEABLE = ENLIGNE || !!l.rangement;
    PURGE = !ENLIGNE && !!l.purge;
    ONDE_OK = !ENLIGNE && !!l.onde;
    DOSSIERS_OK = !ENLIGNE && !!l.dossiers;
    MAJ_DISPO = !ENLIGNE && !!l.maj;
    if (MAJ_DISPO) {
      // Le bouton apparait tout de suite ; la verification aupres de GitHub
      // se fait en arriere-plan, et le colore s il y a du neuf.
      $('#bMaj').hidden = false;
      if (l.version) $('#bMaj').title = 'version ' + l.version;
      verifierMaj(true);
    }
    LECTURE_SEULE = !!l.lecture_seule;
    TITRE = l.titre || '';
    // Le nom de la bibliotheque est connu : l en-tete et l onglet le portent
    // tout de suite, meme avant qu un projet soit ouvert.
    try { majEntete(); } catch (e) {}
    document.body.classList.toggle('rangeable', RANGEABLE);
    document.body.classList.toggle('lectureseule', LECTURE_SEULE);
    // Le format de la bibliotheque, pour une timeline encore vide. Une
    // sequence rouverte ensuite impose le sien.
    if (Array.isArray(l.format) && l.format.length === 2) {
      PROJET.w = +l.format[0] || PROJET.w;
      PROJET.h = +l.format[1] || PROJET.h;
      // Le moniteur prend tout de suite la bonne proportion : sinon il
      // resterait en 16:9 jusqu au premier reglage touche.
      try { appliquerSpecs(); } catch (e) {}
    }
    document.body.classList.toggle('enligne', ENLIGNE);
    BASE_MEDIA = l.media || '';
    BASE_POSTERS = l.posters || '';
    if ((l.api || 0) < 5) {
      // Un serveur d avant le travail par projet : on n ouvre rien, sinon on
      // afficherait les rushes d un projet sous le nom d un autre.
      $('#alerte').className = 'on';
      $('#alerte').innerHTML = '<b>The server is running an older version.</b>' +
        ' Working by project will not work. ' +
        'Close the black <code>serveur.py</code> window and run ' +
        '<code>LANCER.bat</code> again, then reload this page.' +
        '<button id="alerteX" style="margin-left:auto">Dismiss</button>';
      $('#alerteX').onclick = () => $('#alerte').className = '';
      $('#entete').textContent = 'old server';
      grille.innerHTML = '<div class="vide">Run <b>LANCER.bat</b> again then ' +
        'reload this page.</div>';
    } else {
      // Sans jeton, la page ne peut pas signer l adieu : le serveur en place
      // est anterieur a la fermeture automatique. Ce serait invisible — la
      // page se fermerait, la fenetre noire resterait — donc on le dit.
      if (!JETON && !ENLIGNE) {
        $('#alerte').className = 'on';
        $('#alerte').innerHTML = '<b>The running server will not quit ' +
          'on its own.</b> Its version predates this feature. ' +
          'Close the black <code>serveur.py</code> window and run ' +
          '<code>LANCER.bat</code> again — everything else works meanwhile.' +
          '<button id="alerteJ" style="margin-left:auto">Dismiss</button>';
        $('#alerteJ').onclick = () => { $('#alerte').className = ''; };
      }
      BIBLIS = l.biblis || [];
      const dispo = (l.projets || []).map(p => p.nom)
        .filter(n => !estBibli(n));
      // Ceux de la derniere session, sinon le premier projet deja scanne.
      REPLIES = new Set((pref.lire('replies', '') || '').split('\t')
        .filter(Boolean));
      let voulus = (pref.lire('projets', '') || '').split('\t')
        .filter(n => n && dispo.indexOf(n) >= 0);
      if (!voulus.length) {
        const vu = (l.projets || []).find(p => p.scanne && p.clips);
        voulus = vu ? [vu.nom] : (dispo.length ? [dispo[0]] : []);
      }
      for (const n of voulus) {
        try { await ouvrirProjetDisque(n, true); }
        catch (err) { dire('“' + n + '” unreadable — ' + err.message, true); }
      }
      // La bibliotheque en dernier : elle doit se poser sous les projets,
      // dans la colonne comme dans la grille.
      for (const n of BIBLIS) {
        try { await ouvrirProjetDisque(n, true); }
        catch (err) { dire('“' + n + '” unreadable — ' + err.message, true); }
      }
      // On ouvre sur le premier PROJET, pas sur la musique : sinon la grille
      // s ouvre sur 145 pochettes au lieu des rushes.
      // Le rangement de chacun, projet par projet. Il ne sert qu en ligne.
      for (const p of OUVERTS) await chargerRangement(p.nom);
      // La vue retenue ; en lecture seule on arrive sur « My folders », seul
      // endroit ou ranger a un sens.
      if (RANGEABLE) {
        const v = pref.lire('vue', LECTURE_SEULE ? 'rangement' : 'source');
        VUE = v === 'rangement' ? 'rangement' : 'source';
        document.body.classList.toggle('rangement', VUE === 'rangement');
        $$('[data-vue]').forEach(b =>
          b.classList.toggle('on', b.dataset.vue === VUE));
        refondre();
      }
      const prem = OUVERTS.find(x => !estBibli(x.nom));
      if (prem) dossierActif = prem.nom;
      rendre();
      if (!OUVERTS.length)
        grille.innerHTML = '<div class="vide">No project open.<br>' +
          'Click “+ Open / create a project” on the left.</div>';
    }
  } catch (err) {
    $('#entete').textContent = 'erreur';
    grille.innerHTML = '<div class="vide">Cannot reach the server.<br>' +
      'Check that the black serveur.py window is open.</div>';
  }
  // Toujours les rushes au demarrage : on arrive dans la bibliotheque, pas au
  // milieu d un montage. Le mode reste memorise pour la session en cours, mais
  // il ne decide plus de l ecran d accueil.
  mode('rush');
  rendreTimeline();
  await rafraichirProjets();
  await rouvrirDernier();
  addEventListener('resize', () => {
    majMinimap(); majIO(); dimensionnerMoniteur(); dessiner();
  });
  requestAnimationFrame(boucle);
})();
</script>
