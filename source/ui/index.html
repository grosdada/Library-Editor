<!doctype html>
<html lang="fr" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Edge proposait de traduire la page : elle est en français exprès. -->
<meta name="google" content="notranslate">
<title>Library Editor</title>
<link rel="icon" href="/icone.png">
<style>
:root{
  --fond:#0f1012; --panneau:#141518; --carte:#191a1e; --carte2:#1f2025; --survol:#24252b;
  --trait:#28292f; --trait2:#34363d; --encre:#ecebe8; --doux:#a1a2a9; --faible:#6f7078;
  --accent:#d6a45c; --accent2:#e6b872; --accent-pale:rgba(214,164,92,.12); --accent-encre:#1d150a;
  --ok:#78c297; --ok-pale:rgba(120,194,151,.12); --alerte:#e2b35e; --alerte-pale:rgba(226,179,94,.12);
  --erreur:#e57b6d; --erreur-pale:rgba(229,123,109,.12); --info:#8db3e6; --info-pale:rgba(141,179,230,.11);
  --ombre:0 18px 50px rgba(0,0,0,.45); --r:12px;
  --mono:"Cascadia Mono",Consolas,ui-monospace,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root{
    --fond:#f4f2ee; --panneau:#ebe8e2; --carte:#ffffff; --carte2:#f8f6f2; --survol:#f1eee8;
    --trait:#e2ded6; --trait2:#d3cec4; --encre:#1d1c1a; --doux:#5f5c56; --faible:#8d8980;
    --accent:#a8671c; --accent2:#8f5614; --accent-pale:rgba(168,103,28,.10); --accent-encre:#ffffff;
    --ok:#2f8a57; --ok-pale:rgba(47,138,87,.10); --alerte:#a86d0c; --alerte-pale:rgba(168,109,12,.10);
    --erreur:#b8432f; --erreur-pale:rgba(184,67,47,.09); --info:#2d5fa8; --info-pale:rgba(45,95,168,.08);
    --ombre:0 18px 50px rgba(60,50,30,.14);
    color-scheme:light;
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--fond);color:var(--encre);
  font:14.5px/1.55 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  display:grid;grid-template-columns:264px minmax(0,1fr);overflow:hidden}
button,input,select{font:inherit;color:inherit}
a{color:var(--accent)}
code,.mono{font-family:var(--mono);font-size:.88em}
[hidden]{display:none!important}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ---- colonne ---------------------------------------------------------- */
aside{background:var(--panneau);border-right:1px solid var(--trait);display:flex;flex-direction:column;min-height:0}
.marque{display:flex;align-items:center;gap:11px;padding:22px 20px 18px}
.marque img{width:34px;height:34px;border-radius:9px}
.marque b{display:block;font:600 15.5px/1.2 "Segoe UI Variable Display","Segoe UI",sans-serif;letter-spacing:.01em}
.marque span{font-size:11.5px;color:var(--faible)}
nav.principal{padding:4px 12px 10px;display:flex;flex-direction:column;gap:2px}
.nav{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:none;border:0;border-radius:9px;
  padding:9px 12px;color:var(--doux);cursor:pointer;font-weight:500}
.nav:hover{background:var(--survol);color:var(--encre)}
.nav[aria-current="page"]{background:var(--carte2);color:var(--encre);box-shadow:inset 2px 0 0 var(--accent)}
.nav[aria-current="page"] svg{color:var(--accent)}
.rubrique{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--faible);padding:16px 24px 8px;font-weight:600}
#recents{flex:1;min-height:0;overflow:auto;padding:0 12px 12px}
.recent{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;border-radius:9px;padding:8px 10px;cursor:pointer;color:var(--encre)}
.recent:hover{background:var(--survol)}
.recent[aria-current="page"]{background:var(--carte2)}
.recent .pastille{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;flex:none;background:var(--carte2);color:var(--doux);margin-top:1px}
.recent .pastille svg{width:15px;height:15px}
.recent b{display:block;font-weight:500;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recent small{display:block;color:var(--faible);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:rtl;text-align:left}
.recent.absent{opacity:.5}
.recent-texte{min-width:0;flex:1}
.pied{padding:12px 20px 16px;border-top:1px solid var(--trait);font-size:11.5px;color:var(--faible);display:flex;flex-direction:column;gap:4px}
.pied .etat{display:flex;align-items:center;gap:7px}
.point{width:7px;height:7px;border-radius:50%;background:var(--faible);flex:none}
.point.ok{background:var(--ok)} .point.non{background:var(--erreur)}

/* ---- contenu --------------------------------------------------------- */
main{overflow:auto;min-width:0;scroll-behavior:smooth}
.page{max-width:1040px;margin:0 auto;padding:34px 44px 70px}
.entete{margin-bottom:26px}
.entete .sur{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:6px}
h1{font:600 27px/1.2 "Segoe UI Variable Display","Segoe UI",sans-serif;margin:0 0 6px;letter-spacing:-.005em}
.entete p{margin:0;color:var(--doux);max-width:70ch}
h2{font:600 16.5px/1.3 "Segoe UI Variable Display","Segoe UI",sans-serif;margin:0 0 4px}
h3{font-size:13px;margin:22px 0 10px;color:var(--doux);font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.petit{font-size:12.5px;color:var(--doux)}
.faible{color:var(--faible)}

/* étapes */
.etapes{display:flex;gap:6px;margin:0 0 28px;padding:0;list-style:none;flex-wrap:wrap}
.etapes li{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--faible);padding:6px 12px 6px 7px;border-radius:99px;border:1px solid var(--trait)}
.etapes li span{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--carte2);color:var(--doux)}
.etapes li.fait{color:var(--doux)} .etapes li.fait span{background:var(--ok-pale);color:var(--ok)}
.etapes li.ici{color:var(--encre);border-color:var(--accent);background:var(--accent-pale)} .etapes li.ici span{background:var(--accent);color:var(--accent-encre)}

/* cartes */
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:var(--r);padding:20px 22px}
.carte + .carte{margin-top:14px}
.grille2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.choix{position:relative;text-align:left;cursor:pointer;background:var(--carte);border:1px solid var(--trait);border-radius:var(--r);padding:22px 22px 20px;display:flex;flex-direction:column;gap:10px;transition:border-color .15s,background .15s,transform .15s}
.choix:hover{border-color:var(--trait2);background:var(--carte2)}
.choix:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.choix[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-pale)}
.choix .ico{width:42px;height:42px;border-radius:11px;background:var(--carte2);border:1px solid var(--trait);display:grid;place-items:center;color:var(--accent)}
.choix .ico svg{width:21px;height:21px}
.choix p{margin:0;color:var(--doux);font-size:13.5px}
.choix ul{margin:4px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--doux)}
.choix ul li{display:flex;gap:8px;align-items:flex-start}
.choix ul li svg{width:15px;height:15px;color:var(--ok);margin-top:3px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;letter-spacing:.03em;padding:2px 8px;border-radius:99px;background:var(--carte2);color:var(--doux);border:1px solid var(--trait);white-space:nowrap}
.badge.accent{background:var(--accent-pale);color:var(--accent);border-color:transparent}
.badge.ok{background:var(--ok-pale);color:var(--ok);border-color:transparent}
.badge.alerte{background:var(--alerte-pale);color:var(--alerte);border-color:transparent}
.badge.erreur{background:var(--erreur-pale);color:var(--erreur);border-color:transparent}
.choix .badge.coin{position:absolute;top:16px;right:16px}

/* boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--trait2);background:var(--carte2);color:var(--encre);border-radius:9px;padding:8px 15px;cursor:pointer;font-weight:500;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:var(--survol);border-color:var(--faible)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn:disabled{opacity:.45;cursor:default}
.btn.principal{background:var(--accent);border-color:var(--accent);color:var(--accent-encre);font-weight:600}
.btn.principal:hover{background:var(--accent2);border-color:var(--accent2)}
.btn.discret{background:none;border-color:transparent;color:var(--doux)}
.btn.discret:hover{background:var(--survol);color:var(--encre)}
.btn.danger{color:var(--erreur)}
.btn svg{width:16px;height:16px}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:22px}
.actions .ressort{flex:1}

/* champs */
label.champ{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--doux);font-weight:500}
input[type=text],input[type=number],select{background:var(--fond);border:1px solid var(--trait2);border-radius:9px;padding:9px 12px;color:var(--encre);min-width:0}
input[type=text]:focus,input[type=number]:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-pale)}
.ligne-champ{display:flex;gap:10px;align-items:stretch}
.ligne-champ input{flex:1}
.coche{display:flex;gap:11px;align-items:flex-start;cursor:pointer;padding:12px 14px;border:1px solid var(--trait);border-radius:10px;background:var(--carte)}
.coche:hover{border-color:var(--trait2)}
.coche input{margin:3px 0 0;accent-color:var(--accent);width:16px;height:16px;flex:none}
.coche b{display:block;font-weight:600;font-size:13.5px}
.coche span{display:block;font-size:12.5px;color:var(--doux)}
.reglages{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 18px}
.reglages .large{grid-column:1/-1}

/* encarts */
.encart{display:flex;gap:12px;align-items:flex-start;border-radius:10px;padding:13px 16px;margin:14px 0;background:var(--info-pale);border:1px solid transparent;font-size:13.5px}
.encart svg{margin-top:1px;color:var(--info)}
.encart.alerte{background:var(--alerte-pale)} .encart.alerte svg{color:var(--alerte)}
.encart.erreur{background:var(--erreur-pale)} .encart.erreur svg{color:var(--erreur)}
.encart.ok{background:var(--ok-pale)} .encart.ok svg{color:var(--ok)}
.encart p{margin:0} .encart p + p{margin-top:5px}
.encart .actions{margin-top:10px}

/* dossier choisi */
.dossier{display:flex;align-items:center;gap:12px;padding:12px 16px;border:1px solid var(--trait);border-radius:10px;background:var(--carte);margin-bottom:22px}
.dossier .ico{color:var(--accent)}
.dossier b{display:block;font-weight:600}
.dossier code{color:var(--doux);font-size:12px;word-break:break-all}
.dossier .ressort{flex:1;min-width:0}

/* tableau */
.tableau{border:1px solid var(--trait);border-radius:var(--r);overflow:hidden;background:var(--carte)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faible);font-weight:600;text-align:left;padding:10px 12px;border-bottom:1px solid var(--trait);background:var(--carte2);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--trait);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.coche-non td{color:var(--faible)}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px}
td.nom{font-weight:500;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* suffixes */
.puces{display:flex;flex-wrap:wrap;gap:8px}
.puce{border:1px solid var(--trait2);background:var(--carte2);border-radius:99px;padding:5px 12px;cursor:pointer;font-size:12.5px;display:flex;gap:7px;align-items:center}
.puce:hover{border-color:var(--faible)}
.puce[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-pale);color:var(--encre)}
.puce code{font-size:12.5px}
.puce small{color:var(--faible)}
.vignettes{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px;margin-top:14px}
.vignettes figure{margin:0;background:var(--fond);border:1px solid var(--trait);border-radius:9px;overflow:hidden}
.vignettes img{display:block;width:100%;aspect-ratio:1;object-fit:contain;background:var(--fond)}
.vignettes figcaption{font-size:11px;padding:5px 7px;color:var(--doux);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
details.diag{border:1px solid var(--trait);border-radius:10px;margin-top:10px;background:var(--carte)}
details.diag summary{cursor:pointer;padding:11px 14px;font-weight:500;font-size:13.5px}
details.diag .corps{padding:0 14px 12px;font-size:12.5px;max-height:320px;overflow:auto}
details.diag .corps div{padding:6px 0;border-top:1px solid var(--trait)}
details.diag .corps code{color:var(--doux)}

/* progression */
.progres{height:6px;background:var(--carte2);border-radius:99px;overflow:hidden}
.progres i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .3s}
.progres.indetermine i{width:30%;animation:va 1.2s ease-in-out infinite}
@keyframes va{0%{transform:translateX(-100%)}100%{transform:translateX(340%)}}
.liste-etapes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.liste-etapes li{display:flex;gap:12px;align-items:center;padding:8px 2px;font-size:13.5px;color:var(--doux)}
.liste-etapes li .marque-etape{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--trait2);flex:none}
.liste-etapes li.fait{color:var(--encre)} .liste-etapes li.fait .marque-etape{background:var(--ok-pale);border-color:transparent;color:var(--ok)}
.liste-etapes li.encours{color:var(--encre);font-weight:600} .liste-etapes li.encours .marque-etape{border-color:var(--accent);border-top-color:transparent;animation:tourne .9s linear infinite}
@keyframes tourne{to{transform:rotate(360deg)}}
.liste-etapes li .marque-etape svg{width:13px;height:13px;stroke-width:2.4}
.compteur{font-variant-numeric:tabular-nums;color:var(--doux);font-size:12.5px;display:flex;justify-content:space-between;margin:10px 0 7px}
.journal{background:var(--fond);border:1px solid var(--trait);border-radius:10px;padding:10px 12px;font:12px/1.6 var(--mono);color:var(--doux);max-height:220px;overflow:auto;margin-top:14px}
.journal div{white-space:pre-wrap;word-break:break-word}
.journal .ok{color:var(--ok)} .journal .alerte{color:var(--alerte)} .journal .erreur{color:var(--erreur)}
.journal time{color:var(--faible);margin-right:8px}

/* résultat */
.resultat{display:flex;gap:18px;align-items:flex-start}
.resultat .grand{width:46px;height:46px;border-radius:50%;background:var(--ok-pale);color:var(--ok);display:grid;place-items:center;flex:none}
.resultat .grand svg{width:24px;height:24px;stroke-width:2.2}
.resultat.rate .grand{background:var(--erreur-pale);color:var(--erreur)}
.chiffres{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:16px 0 4px}
.chiffre{background:var(--carte2);border:1px solid var(--trait);border-radius:10px;padding:11px 14px}
.chiffre b{display:block;font:600 20px/1.2 "Segoe UI Variable Display","Segoe UI",sans-serif;font-variant-numeric:tabular-nums}
.chiffre span{font-size:12px;color:var(--doux)}
.preuve{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:10px;background:var(--ok-pale);color:var(--encre);font-size:13.5px;margin-top:8px}
.preuve svg{color:var(--ok)}
.preuve.rate{background:var(--erreur-pale)} .preuve.rate svg{color:var(--erreur)}

/* guide */
.guide{list-style:none;margin:0;padding:0;counter-reset:g}
.guide > li{position:relative;padding:0 0 26px 50px}
.guide > li::before{counter-increment:g;content:counter(g);position:absolute;left:0;top:0;width:30px;height:30px;border-radius:50%;background:var(--carte2);border:1px solid var(--trait2);display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--accent)}
.guide > li::after{content:"";position:absolute;left:15px;top:36px;bottom:6px;width:1px;background:var(--trait)}
.guide > li:last-child::after{display:none}
.guide h2{margin:4px 0 8px}
.guide p{margin:6px 0;color:var(--doux);max-width:74ch}
.guide p b,.guide p i{color:var(--encre)}
.guide ul{color:var(--doux);margin:6px 0;padding-left:20px}
.guide code{background:var(--accent-pale);padding:.1em .4em;border-radius:5px;color:var(--encre);overflow-wrap:anywhere}
.guide code.url{display:inline-block;padding:6px 10px;font-size:12.5px}
.guide .outil{margin-top:12px;padding:16px 18px;border:1px solid var(--trait);border-radius:10px;background:var(--carte)}

/* fiche de bibliothèque */
.fiche-tete{display:flex;gap:16px;align-items:center}
.fiche-tete .ico{width:52px;height:52px;border-radius:13px;background:var(--carte2);border:1px solid var(--trait);display:grid;place-items:center;color:var(--accent)}
.fiche-tete .ico svg{width:25px;height:25px}
dl.infos{display:grid;grid-template-columns:150px minmax(0,1fr);gap:9px 16px;margin:18px 0 0;font-size:13.5px}
dl.infos dt{color:var(--faible)} dl.infos dd{margin:0;word-break:break-all}

/* notifications */
#toasts{position:fixed;right:22px;bottom:22px;display:flex;flex-direction:column;gap:8px;z-index:50}
.toast{background:var(--carte2);border:1px solid var(--trait2);box-shadow:var(--ombre);border-radius:10px;padding:11px 15px;font-size:13.5px;max-width:420px;display:flex;gap:10px;align-items:flex-start;animation:monte .2s ease-out}
.toast.erreur svg{color:var(--erreur)} .toast.ok svg{color:var(--ok)}
@keyframes monte{from{transform:translateY(8px);opacity:0}}
.vide{padding:34px;text-align:center;color:var(--faible);border:1px dashed var(--trait2);border-radius:var(--r)}
.coupure{position:sticky;top:0;z-index:40;background:var(--erreur-pale);color:var(--encre);border-bottom:1px solid var(--erreur);padding:10px 44px;font-size:13.5px;backdrop-filter:blur(8px)}

@media (max-width:860px){
  body{grid-template-columns:1fr;overflow:auto}
  aside{display:none}
  .page{padding:24px 16px 60px}
  .grille2,.reglages{grid-template-columns:1fr}
}
</style>
</head>
<body>
<aside>
  <div class="marque"><img src="/icone.png" alt=""><div><b>Library Editor</b><span>version %%VERSION%%</span></div></div>
  <nav class="principal" aria-label="Sections">
    <button class="nav" data-vue="nouvelle" aria-current="page"><svg class="i"><use href="#i-plus"/></svg>Nouvelle bibliothèque</button>
    <button class="nav" data-vue="maj"><svg class="i"><use href="#i-refresh"/></svg>Mettre à jour</button>
    <button class="nav" data-vue="enligne"><svg class="i"><use href="#i-cloud"/></svg>Mettre en ligne</button>
  </nav>
  <div class="rubrique">Bibliothèques</div>
  <div id="recents"></div>
  <div class="pied">
    <button class="btn principal" id="b-maj-editeur" hidden style="width:100%;justify-content:center;margin-bottom:10px"></button>
    <div class="etat"><span class="point" id="p-ffmpeg"></span><span id="t-ffmpeg">ffmpeg…</span></div>
    <div class="etat"><span class="point" id="p-moteur"></span><span id="t-moteur">moteur Python…</span></div>
  </div>
</aside>
<main id="principal"><div id="coupure" class="coupure" role="alert" hidden>Library Editor s'est arrêté. Relancez-le pour continuer : un travail en cours, lui, n'est jamais interrompu.</div><div class="page" id="vue"></div></main>
<div id="toasts" role="status" aria-live="polite"></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.3-4.9L4 8"/><path d="M4 4v4h4"/><path d="M4 13a8 8 0 0 0 14.3 4.9L20 16"/><path d="M20 20v-4h-4"/></symbol>
  <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7 18a4.5 4.5 0 0 1-.6-8.96A6 6 0 0 1 18 8.5a4 4 0 0 1-.5 9.5"/><path d="M12 12v8M9 15l3-3 3 3"/></symbol>

<script>
"use strict";
const JETON = "%%JETON%%";
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const ico = (n, cls = "i") => `<svg class="${cls}"><use href="#i-${n}"/></svg>`;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nb = n => Number(n || 0).toLocaleString("fr-FR");
function taille(o) {
  o = Number(o || 0); const u = ["octets", "Ko", "Mo", "Go", "To"]; let i = 0;
  while (o >= 1024 && i < u.length - 1) { o /= 1024; i++; }
  return i ? o.toLocaleString("fr-FR", {maximumFractionDigits: o < 10 ? 2 : 1}) + " " + u[i] : nb(o) + " octets";
}
function duree(s) {
  s = Math.round(s || 0); if (s < 60) return s + " s";
  const m = Math.floor(s / 60), r = s % 60; if (m < 60) return m + " min " + (r ? r + " s" : "");
  return Math.floor(m / 60) + " h " + (m % 60) + " min";
}

// ---- échanges avec l'application ---------------------------------------
async function api(route, donnees = {}) {
  const r = await fetch(route, {method: "POST", headers: {"Content-Type": "application/json", "X-LE-Jeton": JETON},
    body: JSON.stringify(donnees)});
  const d = await r.json().catch(() => ({erreur: "Réponse illisible (" + r.status + ")"}));
  if (!r.ok) throw new Error(d.erreur || ("Erreur " + r.status));
  return d;
}
async function lire(route, params = {}) {
  const q = new URLSearchParams({...params, j: JETON});
  const r = await fetch(route + "?" + q, {cache: "no-store"});
  const d = await r.json();
  if (!r.ok) throw new Error(d.erreur || ("Erreur " + r.status));
  return d;
}
function toast(texte, genre = "ok") {
  const t = document.createElement("div");
  t.className = "toast " + genre;
  t.innerHTML = ico(genre === "erreur" ? "alerte" : genre === "ok" ? "check" : "info") + "<div>" + esc(texte) + "</div>";
  $("#toasts").append(t);
  setTimeout(() => t.remove(), genre === "erreur" ? 9000 : 4500);
}
async function essayer(fn, bouton) {
  if (bouton) bouton.disabled = true;
  try { return await fn(); }
  catch (e) { toast(e.message, "erreur"); }
  finally { if (bouton) bouton.disabled = false; }
}

// La fenêtre dit qu'elle est là ; en se fermant, elle dit au revoir. Le
// battement porte le jeton : une page restée ouverte d'une session précédente
// reçoit un refus et se recharge sur l'instance en cours.
let pannes = 0;
async function battre() {
  try {
    const r = await fetch("/api/vivant?j=" + JETON, {cache: "no-store"});
    if (r.status === 403) { location.reload(); return; }
    pannes = 0; $("#coupure").hidden = true;
  } catch (e) { if (++pannes >= 2) $("#coupure").hidden = false; }
}
setInterval(battre, 5000); battre();
addEventListener("pagehide", () => navigator.sendBeacon("/api/adieu?j=" + JETON, JETON));

// ---- état général ---------------------------------------------------------
const S = {etat: null, vue: "nouvelle", n: {}, maj: {}, en: {}};

async function rafraichir() {
  try { S.etat = await lire("/api/etat"); } catch (e) { return; }
  const e = S.etat;
  $("#p-ffmpeg").className = "point " + (e.ffmpeg && e.ffprobe ? "ok" : "non");
  $("#t-ffmpeg").textContent = e.ffmpeg && e.ffprobe ? "ffmpeg et ffprobe trouvés" : "ffmpeg introuvable";
  $("#p-moteur").className = "point " + (e.moteur ? "ok" : "non");
  $("#t-moteur").textContent = e.moteur ? "moteur Python embarqué" : "sans moteur Python embarqué";
  const box = $("#recents");
  if (!e.recents.length) { box.innerHTML = '<p class="petit faible" style="padding:4px 12px">Les bibliothèques créées ici apparaîtront dans cette liste.</p>'; return; }
  box.innerHTML = e.recents.map((r, i) => `
    <button class="recent ${r.existe ? "" : "absent"}" data-i="${i}" ${S.vue === "fiche" && S.fiche === r.chemin ? 'aria-current="page"' : ""}>
      <span class="pastille">${ico(r.genre === "films" ? "film" : "image")}</span>
      <span class="recent-texte"><b>${esc(r.titre || r.chemin)}</b><small title="${esc(r.chemin)}">${esc(r.chemin)}</small></span>
    </button>`).join("");
  $$(".recent", box).forEach(b => b.onclick = () => montrerFiche(e.recents[+b.dataset.i].chemin));
}

function aller(vue) {
  S.vue = vue;
  $$(".nav").forEach(b => { if (b.dataset.vue === vue) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
  $("#principal").scrollTop = 0;
  if (vue === "nouvelle") vueNouvelle();
  if (vue === "maj") vueMaj();
  if (vue === "enligne") vueEnligne();
  rafraichir();
}
$$(".nav").forEach(b => b.onclick = () => aller(b.dataset.vue));

function entete(sur, titre, texte) {
  return `<header class="entete"><div class="sur">${esc(sur)}</div><h1>${esc(titre)}</h1>${texte ? `<p>${texte}</p>` : ""}</header>`;
}
function etapes(liste, ici) {
  return `<ol class="etapes">${liste.map((t, i) => `<li class="${i < ici ? "fait" : i === ici ? "ici" : ""}"><span>${i < ici ? "✓" : i + 1}</span>${esc(t)}</li>`).join("")}</ol>`;
}
function encart(genre, html, icone) {
  return `<div class="encart ${genre}">${ico(icone || (genre === "ok" ? "check" : genre === "info" ? "info" : "alerte"))}<div>${html}</div></div>`;
}
function boiteDossier(info, extra = "") {
  return `<div class="dossier"><span class="ico">${ico("dossier")}</span><div class="ressort"><b>${esc(info.nom)}</b><code>${esc(info.chemin)}</code></div>${extra}</div>`;
}

// ---- suivre un travail de fond ---------------------------------------------
function suivre(conteneur, quandFini, options = {}) {
  let depuis = 0, lignes = [], arret = false;
  conteneur.innerHTML = `
    <div class="carte">
      <ul class="liste-etapes" data-r="etapes"></ul>
      <div class="compteur"><span data-r="etape">Démarrage…</span><span data-r="nombres"></span></div>
      <div class="progres indetermine" data-r="barre"><i></i></div>
      <div class="actions" style="margin-top:14px">
        <button class="btn discret" data-r="voir">Afficher le détail</button><span class="ressort"></span>
        <button class="btn discret danger" data-r="stop">${ico("x")} Arrêter</button>
      </div>
      <div class="journal" data-r="journal" ${options.journalOuvert ? "" : "hidden"}></div>
    </div>`;
  const R = n => $(`[data-r="${n}"]`, conteneur);
  R("voir").onclick = () => { const j = R("journal"); j.hidden = !j.hidden; R("voir").textContent = j.hidden ? "Afficher le détail" : "Masquer le détail"; };
  R("stop").onclick = async () => { R("stop").disabled = true; await api("/api/tache/arreter").catch(() => {}); };
  async function tour() {
    if (arret) return;
    let t;
    try { t = await lire("/api/tache", {depuis}); } catch (e) { setTimeout(tour, 1000); return; }
    if (t.etat === "aucune") return;
    depuis = t.nlignes;
    const j = R("journal");
    for (const l of t.lignes) { const d = document.createElement("div"); d.className = l.genre; d.innerHTML = `<time>${esc(l.t)}</time>${esc(l.texte)}`; j.append(d); }
    if (t.lignes.length) j.scrollTop = j.scrollHeight;
    R("etapes").innerHTML = t.etapes.map(e => `<li class="${e.etat}"><span class="marque-etape">${e.etat === "fait" ? ico("check") : ""}</span>${esc(e.libelle)}</li>`).join("");
    R("etape").textContent = t.etape || "…";
    const barre = R("barre");
    if (t.total) {
      barre.classList.remove("indetermine");
      barre.firstElementChild.style.width = Math.min(100, 100 * t.fait / t.total).toFixed(1) + "%";
      R("nombres").textContent = (t.total > 5e6 ? taille(t.fait) + " / " + taille(t.total) : nb(t.fait) + " / " + nb(t.total));
    } else { barre.classList.add("indetermine"); R("nombres").textContent = duree(t.duree); }
    if (options.partiel && t.partiel) options.partiel(t.partiel);
    if (t.etat === "encours") { setTimeout(tour, 450); return; }
    arret = true;
    R("stop").hidden = true;
    barre.classList.remove("indetermine");
    barre.firstElementChild.style.width = "100%";
    quandFini(t);
    rafraichir();
  }
  tour();
  return {stop: () => { arret = true; }};
}

// =============================================================================
//  NOUVELLE BIBLIOTHÈQUE
// =============================================================================
const ETAPES_N = ["Dossier", "Genre", "Analyse", "Réglages", "Installation"];

function vueNouvelle() {
  S.n = {};
  $("#vue").innerHTML = entete("Nouvelle bibliothèque", "Où construire la bibliothèque ?",
      "Choisissez un dossier qui contient déjà vos images ou vos rushes, ou créez-en un. Aucun fichier existant ne sera déplacé, renommé ni modifié : la bibliothèque s'installe à côté, et le prouve.") +
    etapes(ETAPES_N, 0) + `
    <div class="grille2">
      <button class="choix" id="c-existant">
        <span class="ico">${ico("dossier")}</span>
        <h2>Choisir un dossier existant</h2>
        <p>Un dossier de rushes, de rendus ou d'images, déjà rempli. On le lit ; on n'y écrit que le dossier technique de la bibliothèque.</p>
      </button>
      <button class="choix" id="c-nouveau">
        <span class="ico">${ico("dossier-plus")}</span>
        <h2>Créer un nouveau dossier</h2>
        <p>Un dossier vide, prêt à recevoir vos fichiers. Vous y déposerez ensuite vos images ou vos vidéos.</p>
      </button>
    </div>
    <div class="carte" id="f-nouveau" hidden style="margin-top:14px">
      <div class="reglages">
        <label class="champ large">Dans le dossier
          <span class="ligne-champ"><input type="text" id="n-parent" placeholder="K:\\Bibliotheques"><button class="btn" id="n-parcourir">${ico("dossier")} Parcourir…</button></span></label>
        <label class="champ large">Nom du nouveau dossier
          <input type="text" id="n-nom" placeholder="Ma-bibliotheque"></label>
      </div>
      <div class="actions"><button class="btn principal" id="n-creer">${ico("dossier-plus")} Créer le dossier</button></div>
    </div>
    <div class="carte" style="margin-top:14px">
      <label class="champ">Ou collez un chemin
        <span class="ligne-champ"><input type="text" id="n-chemin" placeholder="Y:\\project\\Projet-2026\\Mon-projet"><button class="btn" id="n-utiliser">Utiliser ${ico("fleche")}</button></span></label>
    </div>
    <div id="n-detecte"></div>`;
  $("#c-existant").onclick = e => essayer(async () => {
    const r = await api("/api/choisir", {titre: "Choisir le dossier de la bibliothèque"});
    if (r.chemin) await choisirDossier(r.chemin);
  }, e.currentTarget);
  $("#c-nouveau").onclick = () => { $("#f-nouveau").hidden = false; $("#c-nouveau").setAttribute("aria-pressed", "true"); $("#n-parent").focus(); };
  $("#n-parcourir").onclick = e => essayer(async () => {
    const r = await api("/api/choisir", {titre: "Dans quel dossier créer la bibliothèque ?"});
    if (r.chemin) $("#n-parent").value = r.chemin;
  }, e.currentTarget);
  $("#n-creer").onclick = e => essayer(async () => {
    const r = await api("/api/creer-dossier", {parent: $("#n-parent").value, nom: $("#n-nom").value});
    toast("Dossier créé : " + r.chemin);
    await choisirDossier(r.chemin);
  }, e.currentTarget);
  $("#n-utiliser").onclick = e => essayer(() => choisirDossier($("#n-chemin").value), e.currentTarget);
  $("#n-chemin").onkeydown = e => { if (e.key === "Enter") $("#n-utiliser").click(); };
}

async function choisirDossier(chemin) {
  const info = await api("/api/inspecter", {chemin});
  if (info.detection && !$("#n-detecte")) vueNouvelle();
  S.n = {info};
  if (info.detection) {
    const d = info.detection;
    $("#n-detecte").innerHTML = encart("info", `<p><b>Ce dossier est déjà une bibliothèque ${d.genre === "images" ? "d'images" : "de films"}</b> — « ${esc(d.titre)} ». Rien ne sera installé par-dessus.</p>
      <div class="actions"><button class="btn principal" id="d-ouvrir">${ico("lancer")} Ouvrir</button>
      <button class="btn" id="d-maj">${ico("refresh")} Mettre à jour</button><button class="btn" id="d-enligne">${ico("cloud")} Mettre en ligne</button></div>`);
    $("#d-ouvrir").onclick = e => essayer(async () => { await api("/api/ouvrir", {chemin: info.chemin}); toast("Bibliothèque lancée : sa fenêtre s'ouvre à part."); }, e.currentTarget);
    $("#d-maj").onclick = () => { aller("maj"); choisirMaj(info.chemin); };
    $("#d-enligne").onclick = () => { aller("enligne"); choisirEnligne(info.chemin); };
    $("#n-detecte").scrollIntoView({behavior: "smooth", block: "nearest"});
    return false;
  }
  if (!info.ecriture) throw new Error("Impossible d'écrire dans ce dossier : " + info.chemin);
  vueGenre();
  return true;
}

function vueGenre() {
  const info = S.n.info;
  $("#vue").innerHTML = entete("Nouvelle bibliothèque", "Quel genre de bibliothèque ?", "Les deux s'ouvrent d'un double-clic et marchent sans Internet.") +
    etapes(ETAPES_N, 1) +
    boiteDossier(info, `<span class="badge">${info.vide ? "vide" : nb(info.sous_dossiers) + " sous-dossier" + (info.sous_dossiers > 1 ? "s" : "")}</span>${info.reseau ? '<span class="badge alerte">disque réseau</span>' : ""}<button class="btn discret" id="g-changer">Changer</button>`) + `
    <div class="grille2">
      <button class="choix" data-genre="images">
        <span class="ico">${ico("image")}</span>
        <h2>Bibliothèque d'images</h2>
        <p>Pour des banques d'assets, de personnages, de décors, de références. Chaque sous-dossier devient une banque, rangée dans les onglets de la bibliothèque générale.</p>
        <ul><li>${ico("check")}Favoris et pastilles de couleur</li><li>${ico("check")}Recherche, tri et filtres par dossier</li>
            <li>${ico("check")}Fiche détaillée avec toutes les variantes</li><li>${ico("check")}Onglets, et « Préparer une bibliothèque » pour en ajouter</li></ul>
      </button>
      <button class="choix" data-genre="films">
        <span class="ico">${ico("film")}</span>
        <h2>Bibliothèque de films</h2>
        <p>Pour des rushes et des rendus vidéo, avec la table de montage intégrée.</p>
        <ul><li>${ico("check")}Catalogue des rushes avec vignettes</li><li>${ico("check")}Montage : pistes, fondus, vitesse, images-clés</li>
            <li>${ico("check")}Rendu MP4 et export XML pour Premiere</li><li>${ico("check")}Dossiers virtuels, lecture seule</li></ul>
      </button>
    </div>
    <div class="actions"><button class="btn discret" id="g-retour">${ico("retour")} Retour</button></div>`;
  $("#g-changer").onclick = $("#g-retour").onclick = () => vueNouvelle();
  $$(".choix[data-genre]").forEach(b => b.onclick = () => { S.n.genre = b.dataset.genre; vueAnalyse(); });
}

function vueAnalyse() {
  const info = S.n.info, films = S.n.genre === "films";
  $("#vue").innerHTML = entete("Nouvelle bibliothèque " + (films ? "de films" : "d'images"), "Analyse du dossier",
      films ? "Chaque sous-dossier qui contient des vidéos ou des sons devient un projet. Cochez ceux qui en sont." :
              "Comment faire une fiche : un asset par dossier (avec sa vignette), ou une fiche par image.") +
    etapes(ETAPES_N, 2) + boiteDossier(info, `<span class="badge accent">${films ? "films" : "images"}</span>`) +
    `<div id="a-suivi"></div><div id="a-resultat"></div>`;
  essayer(async () => {
    await api("/api/analyser", {chemin: info.chemin, genre: S.n.genre});
    suivre($("#a-suivi"), t => {
      if (t.etat !== "fini") {
        $("#a-resultat").innerHTML = encart("erreur", `<p>${esc(t.erreur || "Analyse interrompue.")}</p><div class="actions"><button class="btn" id="a-refaire">Recommencer</button></div>`);
        $("#a-refaire").onclick = () => vueAnalyse();
        return;
      }
      $("#a-suivi").innerHTML = "";
      S.n.analyse = t.resultat;
      films ? afficherAnalyseFilms() : afficherAnalyseImages();
    }, {partiel: p => { if (films) afficherLignesFilms(p, true); }});
  });
}

// ---- analyse : films ------------------------------------------------------
const LISIBLE = {oui: ["ok", "lisible"], selon: ["alerte", "selon la machine"], partiel: ["alerte", "en partie"], non: ["erreur", "illisible"], "?": ["", "—"]};
function afficherLignesFilms(a, provisoire) {
  const zone = $("#a-resultat");
  if (!a.lignes.length) { if (provisoire) zone.innerHTML = ""; return; }
  const coche = S.n.coches || (S.n.coches = {});
  zone.innerHTML = `<div class="tableau"><table><thead><tr><th></th><th>Dossier</th><th style="text-align:right">Vidéos</th><th style="text-align:right">Sons</th><th style="text-align:right">Poids</th><th>Codec</th><th>Image</th><th>Lecture</th></tr></thead><tbody>${
    a.lignes.map((l, i) => {
      if (!(l.nom in coche)) coche[l.nom] = l.coche;
      const [g, t] = LISIBLE[l.lisible] || LISIBLE["?"];
      return `<tr class="${coche[l.nom] ? "" : "coche-non"}"><td><input type="checkbox" data-nom="${esc(l.nom)}" ${coche[l.nom] ? "checked" : ""} ${provisoire ? "disabled" : ""} aria-label="Projet ${esc(l.nom)}"></td>
        <td class="nom" title="${esc(l.nom)}">${esc(l.nom)}${l.images && !l.videos && !l.sons ? ' <span class="badge">images</span>' : ""}</td>
        <td class="n">${nb(l.videos)}</td><td class="n">${nb(l.sons)}</td><td class="n">${l.octets ? taille(l.octets) : "—"}</td>
        <td>${esc(l.codec || "—")}</td><td>${esc(l.resolution || "—")}${l.fps ? ` <span class="faible">${l.fps} i/s</span>` : ""}</td>
        <td>${l.sondes ? `<span class="badge ${g}">${t}</span>` : '<span class="faible">—</span>'}</td></tr>`;
    }).join("")}</tbody></table></div>`;
  $$("input[data-nom]", zone).forEach(c => c.onchange = () => { coche[c.dataset.nom] = c.checked; c.closest("tr").classList.toggle("coche-non", !c.checked); majBoutonAnalyse(); });
}
function afficherAnalyseFilms() {
  const a = S.n.analyse, zone = $("#a-resultat");
  afficherLignesFilms(a, false);
  let notes = "";
  if (!a.ffprobe) notes += encart("alerte", "<p><b>ffprobe est introuvable.</b> Les fiches n'auront ni durée ni dimensions, et sans ffmpeg il n'y aura ni vignettes au premier scan ni rendu. Installez ffmpeg (avec ffprobe) dans le PATH.</p>");
  const illisibles = a.lignes.filter(l => (l.lisible === "non" || l.lisible === "partiel") && l.coche).map(l => l.nom);
  if (illisibles.length) notes += encart("alerte", `<p><b>Codec illisible dans le navigateur</b> dans ${illisibles.map(esc).join(", ")} (ProRes, DNxHD, H.264 10 bits…) : la vignette apparaîtra, la lecture non. Le rendu ffmpeg, lui, marche.</p>`);
  const selon = a.lignes.filter(l => l.lisible === "selon" && l.coche).map(l => l.nom);
  if (selon.length) notes += encart("info", `<p>HEVC dans ${selon.map(esc).join(", ")} : lisible selon la carte graphique de la machine.</p>`);
  const ignorees = a.lignes.reduce((s, l) => s + l.ignorees, 0);
  if (ignorees) notes += encart("info", `<p>${nb(ignorees)} fichier(s) .mkv, .avi, .mxf… ne seront pas listés : le scan ne connaît que .mp4, .mov, .m4v et .webm.</p>`);
  if (a.a_la_racine.videos || a.a_la_racine.sons) notes += encart("alerte", `<p><b>${nb(a.a_la_racine.videos + a.a_la_racine.sons)} média(s) directement dans ce dossier.</b> Un projet est un sous-dossier : ceux-là ne seraient vus par aucun. Si c'est votre dossier de rushes, construisez plutôt la bibliothèque dans le dossier parent — ce dossier-ci en deviendra un projet, et on n'y écrira rien.</p>
      <div class="actions"><button class="btn" id="a-parent">${ico("dossier")} Utiliser le dossier parent</button></div>`);
  const aucun = !a.lignes.some(l => l.videos || l.sons);
  if (aucun) notes += encart("info", `<p><b>Aucun dossier de rushes ici.</b> La bibliothèque sera créée vide, rangée comme aux Coulisses : un dossier <code>projets\\</code> (chaque sous-dossier y devient un projet) et <code>bibliotheques\\</code> pour la musique.</p>`);
  zone.insertAdjacentHTML("beforeend", notes + `<div class="actions"><button class="btn discret" id="a-retour">${ico("retour")} Retour</button><span class="ressort"></span><span class="petit" id="a-compte"></span><button class="btn principal" id="a-suite">Continuer ${ico("fleche")}</button></div>`);
  S.n.neuve = aucun;
  $("#a-retour").onclick = () => vueGenre();
  if ($("#a-parent")) $("#a-parent").onclick = e => essayer(async () => {
    if (await choisirDossier(a.parent)) { S.n.genre = "films"; vueAnalyse(); }
  }, e.currentTarget);
  $("#a-suite").onclick = () => vueReglages();
  majBoutonAnalyse();
}
function majBoutonAnalyse() {
  if (!$("#a-suite") || S.n.genre !== "films") return;
  const n = Object.values(S.n.coches || {}).filter(Boolean).length;
  $("#a-suite").disabled = !S.n.neuve && !n;
  $("#a-compte").textContent = S.n.neuve ? "bibliothèque vide" : n + " projet" + (n > 1 ? "s" : "") + " coché" + (n > 1 ? "s" : "");
}

// ---- analyse : images -----------------------------------------------------
// Le dossier choisi devient une bibliothèque générale à onglets : chaque
// sous-dossier coché y devient une banque. S'il n'y a rien à mettre dans des
// onglets (images en vrac), le dossier est lui-même une banque.
function afficherAnalyseImages() {
  const a = S.n.analyse;
  S.n.racine = a.conseil === "racine";
  if (!S.n.racine) { S.n.banque = a.banque || a; afficherAnalyseBanque(); return; }
  afficherAnalyseRacine();
}

function afficherAnalyseRacine() {
  const a = S.n.analyse, zone = $("#a-resultat");
  const R = S.n.rangs || (S.n.rangs = {});
  for (const l of a.lignes) {
    if (R[l.nom]) continue;
    R[l.nom] = {coche: !!l.coche, etat: l.etat,
      mode: (l.proposition || {}).mode || "image",
      vignette: (l.proposition || {}).vignette || "", verif: null};
  }
  const notes = [];
  if (a.ancienne_banque) notes.push(encart("alerte", `<p><b>Ce dossier est déjà une banque unique</b> (${nb(a.ancienne_banque.fiches)} fiches${a.ancienne_banque.marques ? `, ${nb(a.ancienne_banque.marques)} favoris ou pastilles` : ""}). En le transformant en bibliothèque à onglets, son <code>serveur\\</code> est <b>mis de côté</b> dans <code>serveur\\sauvegardes\\</code> — rien n'est supprimé — et chaque sous-dossier coché devient une banque${a.ancienne_banque.marques ? ". Les favoris et pastilles sont reportés dans la banque où se trouve chaque image" : ""}.</p>`));
  if (a.a_la_racine) notes.push(encart("info", `<p><b>${nb(a.a_la_racine)} image(s) directement dans ce dossier.</b> Une banque est un sous-dossier : celles-là ne seront dans aucun onglet. Rangez-les dans un sous-dossier si vous les voulez dans la bibliothèque.</p>`));
  zone.innerHTML = notes.join("") + `
    <h3>Les banques de la bibliothèque</h3>
    <p class="petit" style="margin:-6px 0 12px">Cochez les sous-dossiers à préparer maintenant. Les autres pourront l'être plus tard, sans Library Editor, avec <b>Préparer une bibliothèque</b> posé dans le dossier.</p>
    <div class="tableau"><table><thead><tr><th></th><th>Sous-dossier</th><th style="text-align:right">Images</th><th style="text-align:right">Dossiers</th><th style="text-align:right">Poids</th><th>Une fiche</th><th>Suffixe</th><th></th></tr></thead><tbody>${
      a.lignes.map((l, i) => ligneRacine(l, i)).join("")}</tbody></table></div>
    <div class="actions"><button class="btn discret" id="a-tout">Tout cocher</button><button class="btn discret" id="a-rien">Tout décocher</button>
      <button class="btn" id="a-verif-tout">Vérifier les cochées</button></div>
    <div class="actions"><button class="btn discret" id="a-retour">${ico("retour")} Retour</button><span class="ressort"></span>
      <span class="petit" id="a-compte"></span><button class="btn principal" id="a-suite">Continuer ${ico("fleche")}</button></div>`;
  brancherRangs();
  $("#a-retour").onclick = () => vueGenre();
  $("#a-tout").onclick = () => { a.lignes.forEach(l => { if (l.etat === "nouvelle") R[l.nom].coche = true; }); afficherAnalyseRacine(); };
  $("#a-rien").onclick = () => { a.lignes.forEach(l => R[l.nom].coche = false); afficherAnalyseRacine(); };
  $("#a-verif-tout").onclick = e => essayer(async () => {
    for (const l of a.lignes) if (R[l.nom].coche && R[l.nom].mode === "dossier") await verifierRang(l.nom);
  }, e.currentTarget);
  $("#a-suite").onclick = () => vueReglages();
  majCompteRacine();
}

function ligneRacine(l, i) {
  const r = S.n.rangs[l.nom];
  if (l.etat === "banque") return `<tr class="coche-non"><td></td><td class="nom" title="${esc(l.nom)}">${esc(l.nom)}</td>
    <td class="n" colspan="3"><span class="badge ok">déjà une banque</span> ${l.configuration ? `<span class="faible">${l.configuration.mode === "image" ? "une fiche par image" : "un asset par dossier"}</span>` : ""}</td>
    <td colspan="3" class="faible">elle est gardée telle quelle</td></tr>`;
  const vide = !l.images;
  const cands = (l.candidats || []).map(c => `<option value="${esc(c.suffixe)}">${esc(c.suffixe)} — ${nb(c.uniques)} dossier(s)${c.multiples ? ", " + nb(c.multiples) + " en double" : ""}</option>`).join("");
  return `<tr class="${r.coche ? "" : "coche-non"}" data-rang="${esc(l.nom)}">
    <td><input type="checkbox" data-nom="${esc(l.nom)}" ${r.coche ? "checked" : ""} ${vide ? "disabled" : ""} aria-label="Banque ${esc(l.nom)}"></td>
    <td class="nom" title="${esc(l.nom)}">${esc(l.nom)}${vide ? ' <span class="badge">aucune image</span>' : ""}</td>
    <td class="n">${nb(l.images)}</td><td class="n">${nb(l.dossiers)}</td><td class="n">${l.octets ? taille(l.octets) : "—"}</td>
    <td><select data-mode="${esc(l.nom)}" ${vide ? "disabled" : ""}>
      <option value="dossier" ${r.mode === "dossier" ? "selected" : ""}>un asset par dossier</option>
      <option value="image" ${r.mode === "image" ? "selected" : ""}>une fiche par image</option></select></td>
    <td>${r.mode === "dossier" ? `<input type="text" data-vig="${esc(l.nom)}" value="${esc(r.vignette)}" list="dl-${i}" placeholder="_clean" style="width:120px"><datalist id="dl-${i}">${cands}</datalist>` : '<span class="faible">—</span>'}</td>
    <td>${vide ? "" : `<button class="btn discret" data-verif="${esc(l.nom)}">Vérifier</button>`} <span data-etat="${esc(l.nom)}">${etatRang(r)}</span></td></tr>
    <tr class="detail" data-detail="${esc(l.nom)}" hidden><td colspan="8"></td></tr>`;
}

function etatRang(r) {
  if (!r.verif) return r.mode === "dossier" ? '<span class="faible">non vérifié</span>' : "";
  const v = r.verif;
  if (v.creable) return `<span class="badge ok">${nb(v.assets)} fiches</span>`;
  if (v.multiples) return `<span class="badge erreur">${nb(v.multiples)} dossier(s) en double</span>`;
  return '<span class="badge erreur">aucune correspondance</span>';
}

function brancherRangs() {
  const R = S.n.rangs;
  $$("input[data-nom]").forEach(c => c.onchange = () => {
    R[c.dataset.nom].coche = c.checked;
    c.closest("tr").classList.toggle("coche-non", !c.checked);
    majCompteRacine();
  });
  $$("select[data-mode]").forEach(s => s.onchange = () => {
    const r = R[s.dataset.mode];
    r.mode = s.value; r.verif = null;
    afficherAnalyseRacine();
  });
  $$("input[data-vig]").forEach(i => {
    i.onchange = i.onblur = () => { const r = R[i.dataset.vig]; if (r.vignette !== i.value.trim()) { r.vignette = i.value.trim(); r.verif = null; $(`[data-etat="${CSS.escape(i.dataset.vig)}"]`).innerHTML = etatRang(r); } };
    i.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); i.blur(); verifierRang(i.dataset.vig); } };
  });
  $$("button[data-verif]").forEach(b => b.onclick = e => essayer(() => verifierRang(b.dataset.verif), e.currentTarget));
}

function majCompteRacine() {
  const R = S.n.rangs, noms = Object.keys(R).filter(n => R[n].coche);
  const deja = S.n.analyse.lignes.filter(l => l.etat === "banque").length;
  $("#a-compte").textContent = noms.length + " banque" + (noms.length > 1 ? "s" : "") + " à préparer" + (deja ? `, ${deja} déjà prête${deja > 1 ? "s" : ""}` : "");
  $("#a-suite").disabled = !noms.length && !deja;
}

async function verifierRang(nom) {
  const r = S.n.rangs[nom], marque = $(`[data-etat="${CSS.escape(nom)}"]`), detail = $(`[data-detail="${CSS.escape(nom)}"]`);
  if (!marque) return;
  marque.innerHTML = '<span class="faible">vérification…</span>';
  const chemin = S.n.analyse.racine + "\\" + nom;
  try {
    r.verif = await api("/api/images/verifier", {chemin, reglage: {mode: r.mode, vignette: r.vignette}});
  } catch (e) {
    marque.innerHTML = `<span class="badge erreur">${esc(e.message)}</span>`;
    return;
  }
  marque.innerHTML = etatRang(r);
  if (detail) {
    detail.hidden = false;
    detail.firstElementChild.innerHTML = detailVerif(r.verif, chemin);
  }
}

function detailVerif(v, chemin) {
  let h = "";
  if (v.diag_multiples.length) h += `<details class="diag" open><summary>Plusieurs vignettes possibles (${nb(v.multiples)}) — à régler avant de créer</summary><div class="corps">${v.diag_multiples.map(d => `<div><b>${esc(d.dossier === "." ? "(racine)" : d.dossier)}</b><br><code>${d.fichiers.map(esc).join("<br>")}</code></div>`).join("")}</div></details>`;
  if (v.diag_absents.length) h += `<details class="diag"><summary>Dossiers sans vignette (${nb(v.sans_vignette)}) — laissés de côté</summary><div class="corps">${v.diag_absents.map(d => `<div><b>${esc(d.dossier === "." ? "(racine)" : d.dossier)}</b><br><code>${d.fichiers.map(esc).join("<br>") || "—"}</code></div>`).join("")}</div></details>`;
  if (v.exemples.length) h += `<p class="petit" style="margin:10px 0 4px">Aperçu des premières fiches</p><div class="vignettes">${v.exemples.slice(0, 12).map(x => `<figure><img loading="lazy" alt="" src="/api/apercu?${new URLSearchParams({j: JETON, racine: chemin, p: x.vignette})}"><figcaption title="${esc(x.nom)}">${esc(x.nom)}${x.images > 1 ? ` · ${x.images}` : ""}</figcaption></figure>`).join("")}</div>`;
  return h || '<p class="petit" style="margin:0">Rien à signaler.</p>';
}

// ---- analyse : une banque seule (images en vrac dans le dossier choisi) ----
function afficherAnalyseBanque() {
  const a = S.n.banque, zone = $("#a-resultat");
  S.n.mode = S.n.mode || a.proposition.mode;
  S.n.vignette = S.n.vignette ?? a.proposition.vignette;
  if (!a.images) {
    zone.innerHTML = encart("alerte", `<p><b>Aucune image dans ce dossier.</b> Déposez-y vos images (JPG, PNG, WebP…) puis recommencez l'analyse — ou choisissez un autre dossier.</p>
      <div class="actions"><button class="btn" id="a-refaire">Recommencer l'analyse</button><button class="btn discret" id="a-retour">${ico("retour")} Retour</button></div>`);
    $("#a-refaire").onclick = () => vueAnalyse(); $("#a-retour").onclick = () => vueNouvelle();
    return;
  }
  zone.innerHTML = encart("info", "<p><b>Les images sont en vrac dans ce dossier</b> (aucun sous-dossier n'en contient) : il devient lui-même une banque, sans onglets.</p>") + `
    <div class="chiffres">
      <div class="chiffre"><b>${nb(a.images)}</b><span>images</span></div>
      <div class="chiffre"><b>${nb(a.dossiers)}</b><span>dossier${a.dossiers > 1 ? "s" : ""} d'images</span></div>
      <div class="chiffre"><b>${esc(a.taille)}</b><span>au total</span></div>
    </div>
    <h3>Une fiche, c'est…</h3>
    <div class="grille2">
      <button class="choix" data-mode="dossier" aria-pressed="${S.n.mode === "dossier"}">
        <h2>Un asset par dossier</h2>
        <p>Chaque sous-dossier est une fiche. Sa vignette est l'image dont le nom finit par un suffixe (<code>_clean</code>, <code>_def</code>…) ; un clic montre toutes les autres.</p>
        ${a.proposition.mode === "dossier" ? '<span class="badge accent coin">recommandé</span>' : ""}
      </button>
      <button class="choix" data-mode="image" aria-pressed="${S.n.mode === "image"}">
        <h2>Une fiche par image</h2>
        <p>Chaque image est une fiche. Pour un dossier d'images en vrac, sans convention de nom.</p>
        ${a.proposition.mode === "image" ? '<span class="badge accent coin">recommandé</span>' : ""}
      </button>
    </div>
    <div id="i-suffixe" ${S.n.mode === "dossier" ? "" : "hidden"}>
      <h3>Suffixe de la vignette</h3>
      <div class="carte">
        ${a.candidats.length ? `<p class="petit" style="margin:0 0 10px">Trouvés dans les noms de fichiers — le nombre de dossiers où le suffixe désigne une seule image :</p>
        <div class="puces">${a.candidats.slice(0, 6).map(c => `<button class="puce" data-s="${esc(c.suffixe)}" aria-pressed="${c.suffixe === S.n.vignette}"><code>${esc(c.suffixe)}</code><small>${nb(c.uniques)} dossier${c.uniques > 1 ? "s" : ""}${c.multiples ? " · " + nb(c.multiples) + " en double" : ""}</small></button>`).join("")}</div>` : '<p class="petit" style="margin:0">Aucun suffixe commun trouvé : tapez-le.</p>'}
        <label class="champ" style="margin-top:16px">Suffixe, sans l'extension
          <span class="ligne-champ"><input type="text" id="i-s" value="${esc(S.n.vignette)}" placeholder="_clean" style="max-width:260px"><button class="btn" id="i-verifier">Vérifier les correspondances</button></span></label>
      </div>
    </div>
    <div id="i-verif"></div>
    <div class="actions"><button class="btn discret" id="a-retour">${ico("retour")} Retour</button><span class="ressort"></span><button class="btn principal" id="a-suite" disabled>Continuer ${ico("fleche")}</button></div>`;
  $("#a-retour").onclick = () => vueGenre();
  $$(".choix[data-mode]", zone).forEach(b => b.onclick = () => {
    S.n.mode = b.dataset.mode;
    $$(".choix[data-mode]", zone).forEach(x => x.setAttribute("aria-pressed", x === b));
    $("#i-suffixe").hidden = S.n.mode !== "dossier";
    verifierImages();
  });
  $$(".puce", zone).forEach(p => p.onclick = () => { $("#i-s").value = p.dataset.s; verifierImages(); });
  $("#i-verifier").onclick = () => verifierImages();
  $("#i-s").onkeydown = e => { if (e.key === "Enter") verifierImages(); };
  $("#a-suite").onclick = () => vueReglages();
  verifierImages();
}
async function verifierImages() {
  const a = S.n.banque;
  S.n.vignette = $("#i-s") ? $("#i-s").value.trim() : "";
  $$(".puce").forEach(p => p.setAttribute("aria-pressed", p.dataset.s === S.n.vignette));
  const zone = $("#i-verif");
  $("#a-suite").disabled = true;
  if (S.n.mode === "dossier" && !S.n.vignette) { zone.innerHTML = encart("info", "<p>Choisissez ou tapez un suffixe, puis <b>Vérifier les correspondances</b>.</p>"); return; }
  zone.innerHTML = `<div class="carte" style="margin-top:14px"><div class="progres indetermine"><i></i></div><p class="petit" style="margin:10px 0 0">Vérification…</p></div>`;
  try {
    const v = await api("/api/images/verifier", {chemin: a.racine, reglage: {mode: S.n.mode, vignette: S.n.vignette}});
    S.n.verif = v;
    let h = "";
    if (v.creable) h += encart("ok", `<p><b>${nb(v.assets)} fiche${v.assets > 1 ? "s" : ""}</b> à partir de ${nb(v.images)} images.${v.sans_vignette ? ` ${nb(v.sans_vignette)} dossier(s) sans vignette seront laissés de côté.` : ""}</p>`);
    else if (v.multiples) h += encart("erreur", `<p><b>${nb(v.multiples)} dossier(s) ont plusieurs images qui finissent par « ${esc(S.n.vignette)} ».</b> La création est bloquée : précisez le suffixe, ou renommez les fichiers en cause (liste ci-dessous).</p>`);
    else h += encart("erreur", `<p><b>Aucune image ne correspond.</b> Essayez un autre suffixe.</p>`);
    h += detailVerif(v, a.racine);
    zone.innerHTML = h;
    $("#a-suite").disabled = !v.creable;
  } catch (e) { zone.innerHTML = encart("erreur", `<p>${esc(e.message)}</p>`); }
}
// ---- réglages -------------------------------------------------------------
const FORMATS = [[1920,1080],[3840,2160],[1280,720],[2048,858],[1920,1440],[1440,1080],[1080,1920],[1080,1350],[1080,1080]];
function vueReglages() {
  const info = S.n.info, a = S.n.analyse, films = S.n.genre === "films";
  const p = a.proposition || {};
  let corps = "";
  if (films) {
    const fmt = p.format ? p.format.join("x") : "";
    const liste = FORMATS.map(f => f.join("x"));
    if (fmt && !liste.includes(fmt)) liste.unshift(fmt);
    corps = `<div class="carte"><div class="reglages">
      <label class="champ large">Titre affiché dans l'application<input type="text" id="r-titre" value="${esc(S.n.titre ?? p.titre)}"></label>
      <label class="champ">Format des séquences
        <select id="r-format">${liste.map(f => `<option value="${f}" ${f === (S.n.format || fmt || "1920x1080") ? "selected" : ""}>${f.replace("x", " × ")}${f === fmt ? " — celui des rushes" : ""}</option>`).join("")}</select></label>
      <label class="champ">Port local<input type="number" id="r-port" value="${esc(S.n.port ?? p.port ?? "")}" min="1024" max="65000"></label>
      ${S.n.neuve ? `<label class="champ large">Premier projet (créé dans projets\\)<input type="text" id="r-premier" value="${esc(S.n.premier || "Rushes")}"></label>` : ""}
    </div>
    <p class="petit" style="margin:12px 0 0">Un port par bibliothèque : les préférences et la dernière séquence du navigateur y sont attachées. 8779 et 8780 sont déjà pris (Coulisses, Mode Cringe).</p></div>
    <h3>Options</h3>
    <div class="reglages">
      <label class="coche"><input type="checkbox" id="r-ls" ${S.n.ls === false ? "" : "checked"}><div><b>Lecture seule</b><span>L'application ne renomme, ne déplace et n'efface rien dans les dossiers de rushes. Vous rangez avec des dossiers virtuels.</span></div></label>
      <label class="coche"><input type="checkbox" id="r-moteur" ${S.etat.moteur ? "checked" : "disabled"}><div><b>Moteur Python embarqué</b><span>La bibliothèque marchera sur un PC sans Python (37 Mo, dans <code>_app\\_python</code>).</span></div></label>
      <label class="coche"><input type="checkbox" id="r-raccourci" checked><div><b>Raccourci sur le Bureau</b><span>Vers le lanceur de la bibliothèque.</span></div></label>
    </div>`;
  } else if (S.n.racine) {
    const cochees = Object.keys(S.n.rangs).filter(n => S.n.rangs[n].coche);
    const deja = a.lignes.filter(l => l.etat === "banque").length;
    corps = `<div class="carte"><dl class="infos" style="margin:0">
      <dt>Titre</dt><dd>${esc(info.nom)} <span class="faible">— le nom du dossier, en tête de la bibliothèque générale</span></dd>
      <dt>Banques à préparer</dt><dd>${cochees.length ? cochees.map(esc).join(", ") : "aucune"}${deja ? ` <span class="faible">— ${nb(deja)} déjà prête(s), gardée(s) telle(s) quelle(s)</span>` : ""}</dd>
      <dt>Onglets</dt><dd>À ranger quand vous voudrez, avec <b>Préparer une bibliothèque</b> posé dans le dossier</dd>
    </dl></div>
    <h3>Options</h3>
    <div class="reglages">
      <label class="coche"><input type="checkbox" id="r-moteur" ${S.etat.moteur ? "checked" : "disabled"}><div><b>Moteur Python embarqué</b><span>La bibliothèque marchera sur un PC sans Python (37 Mo, dans <code>serveur\\_python</code>). Il sert à la bibliothèque générale et à toutes ses banques.</span></div></label>
      <label class="coche"><input type="checkbox" id="r-raccourci" checked><div><b>Raccourci sur le Bureau</b><span>Vers la bibliothèque générale.</span></div></label>
    </div>`;
  } else {
    corps = `<div class="carte"><dl class="infos" style="margin:0">
      <dt>Titre</dt><dd>${esc(info.nom)} <span class="faible">— le nom du dossier, comme dans la bibliothèque générale</span></dd>
      <dt>Fiches</dt><dd>${nb(S.n.verif.assets)} ${S.n.mode === "dossier" ? `(un asset par dossier, vignette <code>${esc(S.n.vignette)}</code>)` : "(une par image)"}</dd>
    </dl></div>
    <h3>Options</h3>
    <div class="reglages">
      <label class="coche"><input type="checkbox" id="r-moteur" ${S.etat.moteur ? "checked" : "disabled"}><div><b>Moteur Python embarqué</b><span>La bibliothèque marchera sur un PC sans Python (37 Mo, dans <code>serveur\\_python</code>).</span></div></label>
      <label class="coche"><input type="checkbox" id="r-raccourci" checked><div><b>Raccourci sur le Bureau</b><span>Vers le lanceur de la bibliothèque.</span></div></label>
    </div>`;
  }
  const projets = films ? Object.entries(S.n.coches || {}).filter(([, v]) => v).map(([k]) => k) : [];
  const faire = films ? [
    S.n.neuve ? "créer <code>projets\\</code> et <code>bibliotheques\\</code>" : `relever l'empreinte de ${projets.length} dossier(s) de rushes (nom, taille, date de chaque fichier)`,
    "déposer <code>_app\\</code> (serveur, application, réglages) et <code>LANCER-LA-BIBLIOTHEQUE.bat</code>",
    "premier scan : sondage de chaque média, puis vignettes",
    S.n.neuve ? "" : "relever l'empreinte à nouveau et vous montrer qu'elle n'a pas bougé",
  ].filter(Boolean) : S.n.racine ? [
    "relever l'empreinte de toutes les images (nom, taille, date)",
    `préparer ${nb(Object.keys(S.n.rangs).filter(n => S.n.rangs[n].coche).length)} banque(s) : un dossier <code>serveur\\</code> dans chacune, index et vignettes`,
    "déposer <code>serveur\\</code> (bibliothèque générale à onglets + préparateur) et les deux lanceurs",
    a.ancienne_banque ? "mettre l'ancienne banque de côté dans <code>serveur\\sauvegardes\\</code> et y reporter favoris et pastilles" : "",
    "relever l'empreinte à nouveau et vous montrer qu'elle n'a pas bougé",
  ].filter(Boolean) : [
    "relever l'empreinte de toutes les images (nom, taille, date)",
    "déposer <code>serveur\\</code> (serveur, indexeur, navigateur) et <code>LANCER-LA-BIBLIOTHEQUE.bat</code>",
    "indexer et fabriquer les vignettes",
    "relever l'empreinte à nouveau et vous montrer qu'elle n'a pas bougé",
  ];
  $("#vue").innerHTML = entete("Nouvelle bibliothèque " + (films ? "de films" : "d'images"), "Réglages", "") +
    etapes(ETAPES_N, 3) + boiteDossier(info, `<span class="badge accent">${films ? "films" : "images"}</span>`) + corps +
    `<h3>Ce qui va être fait</h3><div class="carte"><ol style="margin:0;padding-left:20px;color:var(--doux)">${faire.map(f => `<li style="margin:4px 0">${f}</li>`).join("")}</ol></div>
     <div class="actions"><button class="btn discret" id="r-retour">${ico("retour")} Retour</button><span class="ressort"></span><button class="btn principal" id="r-installer">${ico("check")} Installer la bibliothèque</button></div>`;
  $("#r-retour").onclick = () => { memoriserReglages(); vueAnalyse(); };
  $("#r-installer").onclick = e => essayer(() => installer(), e.currentTarget);
}
function memoriserReglages() {
  if ($("#r-titre")) S.n.titre = $("#r-titre").value;
  if ($("#r-format")) S.n.format = $("#r-format").value;
  if ($("#r-port")) S.n.port = $("#r-port").value;
  if ($("#r-ls")) S.n.ls = $("#r-ls").checked;
  if ($("#r-premier")) S.n.premier = $("#r-premier").value;
}
async function installer() {
  memoriserReglages();
  const films = S.n.genre === "films";
  let reglages;
  if (films) {
    reglages = {titre: S.n.titre, format: (S.n.format || "").split("x").map(Number), port: +S.n.port || null,
      lecture_seule: S.n.ls !== false, moteur: $("#r-moteur").checked, raccourci: $("#r-raccourci").checked,
      disposition: S.n.neuve ? "neuve" : "existante",
      projets: Object.entries(S.n.coches || {}).filter(([, v]) => v).map(([k]) => k), premier_projet: S.n.premier || "Rushes"};
  } else if (S.n.racine) {
    reglages = {racine: true, moteur: $("#r-moteur").checked, raccourci: $("#r-raccourci").checked,
      lignes: Object.entries(S.n.rangs).map(([nom, r]) => ({nom, coche: r.coche, mode: r.mode, vignette: r.vignette}))};
  } else {
    reglages = {mode: S.n.mode, vignette: S.n.vignette, moteur: $("#r-moteur").checked, raccourci: $("#r-raccourci").checked};
  }
  await api("/api/installer", {chemin: S.n.info.chemin, genre: S.n.genre, reglages});
  vueInstallation();
}

// ---- installation -----------------------------------------------------------
function vueInstallation() {
  const info = S.n.info, films = S.n.genre === "films";
  $("#vue").innerHTML = entete("Nouvelle bibliothèque " + (films ? "de films" : "d'images"), "Installation",
      "Vous pouvez fermer cette fenêtre : le travail continue, et relancer Library Editor le retrouve.") +
    etapes(ETAPES_N, 4) + boiteDossier(info) + `<div id="i-suivi"></div><div id="i-fin"></div>`;
  suivre($("#i-suivi"), t => afficherFin(t, $("#i-fin")));
}
function blocPreuve(preuve) {
  if (!preuve || !preuve.length) return "";
  return `<h3>La preuve</h3>` + preuve.map(p => p.identiques
    ? `<div class="preuve">${ico("bouclier")}<div><b>${esc(p.projet)}</b> — ${nb(p.entrees)} entrées, <b>identiques</b> avant et après (nom, taille, date).</div></div>`
    : `<div class="preuve rate">${ico("alerte")}<div><b>${esc(p.projet)}</b> — des différences : ${esc([...p.disparues, ...p.nouvelles].slice(0, 6).join(", "))}</div></div>`).join("");
}
function afficherFin(t, zone) {
  if (t.etat !== "fini") {
    zone.innerHTML = `<div class="carte resultat rate" style="margin-top:14px"><span class="grand">${ico("x")}</span><div><h2>${t.etat === "annule" ? "Arrêté" : "L'installation n'a pas abouti"}</h2>
      <p class="petit">${esc(t.erreur || "Arrêté à la demande.")}</p><p class="petit">Aucun fichier existant n'a été modifié. Le détail est au-dessus.</p>
      <div class="actions"><button class="btn" id="f-nouvelle">Recommencer</button></div></div></div>`;
    $("#f-nouvelle").onclick = () => aller("nouvelle");
    return;
  }
  const r = t.resultat, films = r.genre === "films", racine = r.genre === "racine";
  const chiffres = films
    ? r.projets.map(p => `<div class="chiffre"><b>${nb(p.fiches)}</b><span>fiches · ${esc(p.projet)}</span></div>`).join("") + `<div class="chiffre"><b>${r.port}</b><span>port local</span></div><div class="chiffre"><b>${duree(r.duree)}</b><span>d'installation</span></div>`
    : racine
    ? `<div class="chiffre"><b>${nb(r.banques.length)}</b><span>banque${r.banques.length > 1 ? "s" : ""} préparée${r.banques.length > 1 ? "s" : ""}</span></div><div class="chiffre"><b>${nb(r.fiches)}</b><span>fiches</span></div><div class="chiffre"><b>${duree(r.duree)}</b><span>d'installation</span></div>`
    : `<div class="chiffre"><b>${nb(r.fiches)}</b><span>fiches</span></div><div class="chiffre"><b>${nb(r.vignettes)}</b><span>vignettes</span></div><div class="chiffre"><b>${duree(r.duree)}</b><span>d'installation</span></div>`;
  zone.innerHTML = `<div class="carte" style="margin-top:14px"><div class="resultat"><span class="grand">${ico("check")}</span><div style="flex:1;min-width:0">
      <h2>« ${esc(r.titre)} » est prête</h2>
      <p class="petit" style="margin:2px 0 0">Elle s'ouvre avec <code>${racine ? "Bibliotheque generale" : "LANCER-LA-BIBLIOTHEQUE"}</code>${r.raccourci ? ", ou le raccourci posé sur le Bureau" : ""}.${r.moteur ? " Elle embarque son moteur Python." : ""}</p>
      <div class="chiffres">${chiffres}</div>
      ${racine ? blocRacine(r) : ""}
      ${blocPreuve(r.preuve)}
      ${films && !r.ffmpeg ? encart("alerte", "<p>ffmpeg est introuvable : les vignettes seront faites par le navigateur à la première ouverture, et le rendu ne marchera pas.</p>") : ""}
      <div class="actions"><button class="btn principal" id="f-ouvrir">${ico("lancer")} Ouvrir la bibliothèque</button>
        ${racine ? `<button class="btn" id="f-preparer">${ico("plus")} Préparer une bibliothèque</button>` : ""}
        <button class="btn" id="f-dossier">${ico("dossier")} Ouvrir le dossier</button>
        ${r.raccourci ? "" : `<button class="btn" id="f-raccourci">${ico("raccourci")} Raccourci sur le Bureau</button>`}
        <span class="ressort"></span><button class="btn discret" id="f-enligne">${ico("cloud")} Mettre en ligne…</button></div>
    </div></div></div>`;
  $("#f-ouvrir").onclick = e => essayer(async () => { await api("/api/ouvrir", {chemin: r.racine}); toast("La bibliothèque démarre dans sa propre fenêtre."); }, e.currentTarget);
  $("#f-dossier").onclick = () => essayer(() => api("/api/explorer", {chemin: r.racine}));
  if ($("#f-raccourci")) $("#f-raccourci").onclick = e => essayer(async () => { const x = await api("/api/raccourci", {chemin: r.racine}); toast("Raccourci créé : " + x.raccourci); e.target.closest("button").remove(); }, e.currentTarget);
  if ($("#f-preparer")) $("#f-preparer").onclick = e => essayer(async () => { await api("/api/preparer", {chemin: r.racine}); toast("Le préparateur s'ouvre dans sa propre fenêtre."); }, e.currentTarget);
  $("#f-enligne").onclick = () => { aller("enligne"); choisirEnligne(r.racine); };
}

// Ce que la racine a donné : ses banques, les ratées, l'ancienne mise de côté.
function blocRacine(r) {
  let h = `<div class="tableau"><table><thead><tr><th>Banque</th><th>Fiches</th><th>Une fiche</th></tr></thead><tbody>${
    r.banques.map(b => `<tr><td class="nom">${esc(b.nom)}</td><td class="n">${nb(b.fiches)}</td><td>${b.mode === "image" ? "une fiche par image" : "un asset par dossier"}${b.sans_vignette ? ` <span class="faible">· ${nb(b.sans_vignette)} dossier(s) sans vignette</span>` : ""}</td></tr>`).join("")}
    ${(r.deja || []).map(n => `<tr class="coche-non"><td class="nom">${esc(n)}</td><td class="n">—</td><td class="faible">déjà prête, gardée telle quelle</td></tr>`).join("")}</tbody></table></div>`;
  if (r.echecs && r.echecs.length) h += encart("alerte", `<p><b>${nb(r.echecs.length)} dossier(s) n'ont pas pu être préparés</b> — rien n'y a été écrit :</p><ul style="margin:6px 0 0;padding-left:18px">${r.echecs.map(e => `<li><b>${esc(e.nom)}</b> — ${esc(e.erreur)}</li>`).join("")}</ul><p class="petit" style="margin:8px 0 0">Corrigez (suffixe, doublons) puis reprenez-les avec <b>Préparer une bibliothèque</b>.</p>`);
  if (r.sauvegarde) h += encart("info", `<p>L'ancienne banque unique a été mise de côté dans <code>${esc(r.sauvegarde)}</code> — rien n'a été supprimé.${r.marques_reportees ? ` ${nb(r.marques_reportees)} favori(s) et pastille(s) ont été reportés dans les nouvelles banques.` : ""} Vous pourrez supprimer ce dossier quand tout ira bien.</p>`);
  return h;
}

// =============================================================================
//  FICHE D'UNE BIBLIOTHÈQUE
