async function montrerFiche(chemin) {
  S.vue = "fiche"; S.fiche = chemin;
  $$(".nav").forEach(b => b.removeAttribute("aria-current"));
  rafraichir();
  let info;
  try { info = await api("/api/inspecter", {chemin}); } catch (e) {
    $("#vue").innerHTML = entete("Bibliothèque", chemin.split("\\").pop(), "") + encart("alerte", `<p>${esc(e.message)}</p><div class="actions"><button class="btn danger" id="x-oublier">${ico("x")} Retirer de la liste</button></div>`);
    $("#x-oublier").onclick = async () => { await api("/api/oublier", {chemin}); aller("nouvelle"); };
    return;
  }
  const d = info.detection;
  if (!d) { $("#vue").innerHTML = entete("Bibliothèque", info.nom, "") + encart("alerte", "<p>Ce dossier ne contient plus de bibliothèque.</p>"); return; }
  const films = d.genre === "films", racine = d.genre === "racine";
  const sorte = films ? "de films" : racine ? "d'images à onglets" : "d'images";
  $("#vue").innerHTML = `<div class="fiche-tete"><span class="ico">${ico(films ? "film" : "image")}</span><div><div class="entete" style="margin:0"><div class="sur">Bibliothèque ${sorte}</div><h1>${esc(d.titre)}</h1></div></div></div>
    <div class="carte" style="margin-top:22px"><dl class="infos" style="margin:0">
      <dt>Dossier</dt><dd><code>${esc(info.chemin)}</code></dd>
      ${films ? `<dt>Adresse locale</dt><dd>${d.port ? `<code>http://127.0.0.1:${d.port}/</code>` : "—"}</dd>
        <dt>Lecture seule</dt><dd>${d.reglages ? (d.reglages.lecture_seule ? "oui" : "non") : "ancienne variante, sans réglages"}</dd>
        <dt>Projets</dt><dd>${d.reglages && d.reglages.projets ? esc(d.reglages.projets.join(", ")) : (d.reglages && d.reglages.projets_dans === "projets" ? "tous les dossiers de <code>projets\\</code>" : "—")}</dd>`
      : racine ? `<dt>Banques</dt><dd>${d.banques.length ? d.banques.map(b => `<code>${esc(b.nom)}</code>`).join(" ") : "aucune pour l'instant — <b>Préparer une bibliothèque</b> en ajoute une"}</dd>
        <dt>Onglets</dt><dd>À ranger avec <b>Préparer une bibliothèque</b></dd>`
      : `<dt>Fiches</dt><dd>${d.configuration ? (d.configuration.mode === "image" ? "une par image" : `un asset par dossier, vignette <code>${esc(d.configuration.vignette)}</code>`) : "ancienne banque"}</dd>`}
      <dt>Moteur Python</dt><dd>${d.moteur ? "embarqué" : "celui de la machine"}</dd>
    </dl>
    <div class="actions"><button class="btn principal" id="x-ouvrir">${ico("lancer")} Ouvrir</button>
      ${racine ? `<button class="btn" id="x-preparer">${ico("plus")} Préparer une bibliothèque</button>` : ""}
      <button class="btn" id="x-dossier">${ico("dossier")} Dossier</button>
      <button class="btn" id="x-raccourci">${ico("raccourci")} Raccourci</button><span class="ressort"></span>
      <button class="btn" id="x-maj">${ico("refresh")} Mettre à jour</button><button class="btn" id="x-enligne">${ico("cloud")} Mettre en ligne</button></div></div>
    <div class="actions"><span class="ressort"></span><button class="btn discret" id="x-oublier">Retirer de la liste</button></div>`;
  if ($("#x-preparer")) $("#x-preparer").onclick = e => essayer(async () => { await api("/api/preparer", {chemin: info.chemin}); toast("Le préparateur s'ouvre dans sa propre fenêtre."); }, e.currentTarget);
  $("#x-ouvrir").onclick = e => essayer(async () => { await api("/api/ouvrir", {chemin: info.chemin}); toast("La bibliothèque démarre dans sa propre fenêtre."); }, e.currentTarget);
  $("#x-dossier").onclick = () => essayer(() => api("/api/explorer", {chemin: info.chemin}));
  $("#x-raccourci").onclick = e => essayer(async () => { const x = await api("/api/raccourci", {chemin: info.chemin}); toast("Raccourci créé : " + x.raccourci); }, e.currentTarget);
  $("#x-maj").onclick = () => { aller("maj"); choisirMaj(info.chemin); };
  $("#x-enligne").onclick = () => { aller("enligne"); choisirEnligne(info.chemin); };
  $("#x-oublier").onclick = async () => { await api("/api/oublier", {chemin: info.chemin}); toast("Retirée de la liste (le dossier n'est pas touché)."); aller("nouvelle"); };
}

// =============================================================================
//  CHOISIR UNE BIBLIOTHÈQUE EXISTANTE (mise à jour, mise en ligne)
// =============================================================================
function selecteurBibliotheque(quand) {
  const recents = (S.etat?.recents || []).filter(r => r.existe);
  return `<div class="carte">
    ${recents.length ? `<div class="puces" style="margin-bottom:14px">${recents.map((r, i) => `<button class="puce" data-r="${i}">${ico(r.genre === "films" ? "film" : "image")}<span>${esc(r.titre)}</span></button>`).join("")}</div>` : ""}
    <span class="ligne-champ"><input type="text" id="s-chemin" placeholder="Chemin du dossier de la bibliothèque"><button class="btn" id="s-parcourir">${ico("dossier")} Parcourir…</button><button class="btn principal" id="s-ok">Choisir</button></span>
  </div>`;
}
function brancherSelecteur(quand) {
  const recents = (S.etat?.recents || []).filter(r => r.existe);
  $$(".puce[data-r]").forEach(b => b.onclick = () => quand(recents[+b.dataset.r].chemin));
  $("#s-parcourir").onclick = e => essayer(async () => { const r = await api("/api/choisir", {titre: "Choisir une bibliothèque"}); if (r.chemin) quand(r.chemin); }, e.currentTarget);
  $("#s-ok").onclick = () => quand($("#s-chemin").value);
  $("#s-chemin").onkeydown = e => { if (e.key === "Enter") quand($("#s-chemin").value); };
}

// =============================================================================
//  METTRE À JOUR
// =============================================================================
function vueMaj() {
  $("#vue").innerHTML = entete("Mettre à jour", "Mettre à jour une bibliothèque",
    "Remplace le code (serveur, application, lanceur) par la version de ce Library Editor, avec une sauvegarde <code>.avant-maj-…</code> de chaque fichier. Les données — catalogue, vignettes, séquences, rangement, favoris, pastilles, polices — ne sont jamais touchées.") +
    selecteurBibliotheque() + `<div id="m-etat"></div>`;
  brancherSelecteur(chemin => essayer(() => choisirMaj(chemin)));
}
async function choisirMaj(chemin) {
  if (S.vue !== "maj") aller("maj");
  const zone = $("#m-etat");
  zone.innerHTML = `<div class="carte" style="margin-top:14px"><div class="progres indetermine"><i></i></div></div>`;
  try {
    const e = await api("/api/maj/etat", {chemin});
    S.maj = e;
    const d = e.detection || {}, films = e.genre === "films", racine = e.genre === "racine";
    const sorte = films ? "bibliothèque de films" : racine ? "bibliothèque d'images à onglets" : "banque d'images";
    let h = `<h3>${esc(d.titre || chemin)} — ${sorte}</h3>
      <p class="petit" style="margin:-6px 0 12px">Version installée : <b>${esc(e.version_locale)}</b> · version de ce Library Editor : <b>${esc(e.version_distante)}</b></p>`;
    if (films && d.ancienne_variante) h += encart("info", "<p>Bibliothèque sans <code>bibliotheque.json</code> (variante des Coulisses) : le nouveau serveur garde exactement ses emplacements et son port 8779. Les outils à côté (<code>publier.py</code>, <code>ajouter.py</code>…) ne sont pas touchés.</p>");
    if (e.ouverte) h += encart("alerte", "<p><b>Cette bibliothèque est ouverte.</b> Ses lanceurs (<code>.bat</code>) ne seront pas remplacés : une console est en train de les lire, et Windows en ferait n'importe quoi. Tout le reste est mis à jour. Fermez-la et relancez la mise à jour si les lanceurs ont changé.</p>");
    const ETATS = {
      a_jour: ['<span class="badge ok">à jour</span>', 0],
      a_installer: ['<span class="badge accent">sera ajouté</span>', 1],
      a_remplacer: ['<span class="badge accent">sera remplacé (sauvegardé avant)</span>', 1],
      modifie: ['<span class="badge alerte">modifié à la main — gardé tel quel</span>', 0],
      sans_objet: ['<span class="faible">—</span>', 0],
    };
    const lignes = e.fichiers.filter(f => f.etat !== "sans_objet");
    h += `<div class="tableau"><table><thead><tr><th>Fichier</th><th>État</th></tr></thead><tbody>${
      lignes.map(f => `<tr><td><code>${esc(f.fichier)}</code></td><td>${(ETATS[f.etat] || ETATS.sans_objet)[0]}${f.lanceur && e.ouverte && f.etat !== "a_jour" ? ' <span class="faible">lanceur : attendra la fermeture</span>' : ""}</td></tr>`).join("")}</tbody></table></div>`;
    if (e.modifies.length) h += encart("alerte", `<p><b>${nb(e.modifies.length)} fichier(s) ne viennent d'aucune version connue</b> — ils ont été retouchés à la main (les banques « 3d » de LDR, par exemple). Ils sont gardés tels quels. Cochez l'option ci-dessous pour les remplacer quand même : une sauvegarde <code>.avant-maj-…</code> est faite d'abord.</p>`);
    if (e.candidats.length) h += `<h3>Dossiers de rushes</h3><p class="petit" style="margin:-4px 0 10px">Cochez un dossier pour l'ajouter comme projet : il sera scanné, et son empreinte vérifiée avant et après.</p>
      <div class="tableau"><table><tbody>${e.candidats.map(c => `<tr class="${c.coche ? "" : "coche-non"}"><td style="width:36px"><input type="checkbox" data-p="${esc(c.nom)}" ${c.coche ? "checked disabled" : ""}></td><td class="nom">${esc(c.nom)}</td><td>${c.coche ? '<span class="badge">déjà projet</span>' : ""}</td></tr>`).join("")}</tbody></table></div>`;
    h += `<div class="reglages" style="margin-top:14px">
      <label class="coche"><input type="checkbox" id="m-moteur" ${e.moteur_disponible ? (d.moteur ? "" : "checked") : "disabled"}><div><b>${d.moteur ? "Renouveler" : "Ajouter"} le moteur Python embarqué</b><span>${d.moteur ? "Il est déjà là : le recopier n'est utile qu'après une nouvelle version." : "La bibliothèque marchera sur un PC sans Python."}</span></div></label>
      ${e.modifies.length ? `<label class="coche"><input type="checkbox" id="m-forcer"><div><b>Remplacer aussi les fichiers modifiés à la main</b><span>${e.modifies.map(esc).join(", ")}</span></div></label>` : ""}
    </div>
      <div class="actions"><span class="ressort"></span><button class="btn principal" id="m-lancer">${ico("refresh")} Mettre à jour</button></div><div id="m-suivi"></div>`;
    zone.innerHTML = h;
    $$("input[data-p]").forEach(c => c.onchange = () => c.closest("tr").classList.toggle("coche-non", !c.checked));
    $("#m-lancer").onclick = ev => essayer(async () => {
      const projets = $$("input[data-p]").filter(c => c.checked && !c.disabled).map(c => c.dataset.p);
      const forcer = !!($("#m-forcer") || {}).checked;
      if (e.a_jour && !projets.length && !forcer && !$("#m-moteur").checked) { toast("Tout est déjà à jour.", "info"); return; }
      await api("/api/maj/lancer", {chemin: e.racine, options: {projets, moteur: $("#m-moteur").checked, forcer}});
      $("#m-lancer").disabled = true;
      suivre($("#m-suivi"), t => {
        if (t.etat !== "fini") { $("#m-suivi").insertAdjacentHTML("beforeend", encart("erreur", `<p>${esc(t.erreur || "Arrêté.")}</p>`)); $("#m-lancer").disabled = false; return; }
        const r = t.resultat;
        $("#m-suivi").insertAdjacentHTML("beforeend", `<div class="carte" style="margin-top:14px"><div class="resultat"><span class="grand">${ico("check")}</span><div style="flex:1;min-width:0"><h2>Mise à jour faite — version ${esc(r.version)}</h2>
          <p class="petit">${r.remplaces.length ? nb(r.remplaces.length) + " fichier(s) mis à jour : " + r.remplaces.slice(0, 8).map(esc).join(", ") + (r.remplaces.length > 8 ? "…" : "") + "." : "Programme déjà à jour."}${r.ajoutes && r.ajoutes.length ? " Projets ajoutés : " + r.ajoutes.map(esc).join(", ") + "." : ""}</p>
          ${r.modifies && r.modifies.length ? encart("info", `<p>Gardés tels quels (modifiés à la main) : ${r.modifies.map(esc).join(", ")}.</p>`) : ""}
          ${r.lanceurs_en_attente && r.lanceurs_en_attente.length ? encart("alerte", `<p>Lanceurs non remplacés, la bibliothèque étant ouverte : ${r.lanceurs_en_attente.map(esc).join(", ")}. Fermez-la et relancez la mise à jour.</p>`) : ""}
          ${blocPreuve(r.preuve)}
          <div class="actions"><button class="btn principal" id="m-ouvrir">${ico("lancer")} Ouvrir la bibliothèque</button></div></div></div></div>`);
        $("#m-ouvrir").onclick = () => essayer(() => api("/api/ouvrir", {chemin: r.racine}));
      });
    }, ev.currentTarget);
  } catch (err) { zone.innerHTML = encart("erreur", `<p>${esc(err.message)}</p>`); }
}

// =============================================================================
//  METTRE EN LIGNE — module à part
// =============================================================================
function vueEnligne() {
  $("#vue").innerHTML = entete("Mettre en ligne", "Mettre une bibliothèque en ligne",
    "Pour que des collègues la consultent sans passer par votre ordinateur. Library Editor prépare un paquet prêt à envoyer, et vous guide pas à pas sur Hostinger. Il ne demande, ne reçoit et ne garde aucun mot de passe.") +
    selecteurBibliotheque() + `<div id="e-contenu"></div>`;
  brancherSelecteur(chemin => essayer(() => choisirEnligne(chemin)));
}
async function choisirEnligne(chemin) {
  if (S.vue !== "enligne") aller("enligne");
  const zone = $("#e-contenu");
  zone.innerHTML = `<div class="carte" style="margin-top:14px"><div class="progres indetermine"><i></i></div></div>`;
  try {
    const e = await api("/api/enligne/etat", {chemin});
    if (e.genre === "racine") {
      zone.innerHTML = `<h3>${esc(e.titre)} — bibliothèque à onglets</h3>` +
        encart("info", "<p>Une bibliothèque à onglets se met en ligne <b>banque par banque</b> : chacune devient un site à elle seule. Choisissez celle à publier.</p>") +
        (e.banques.length ? `<div class="tableau"><table><tbody>${e.banques.map((b, i) => `<tr><td class="nom">${esc(b.nom)}</td><td class="n">${nb(b.fiches)} fiches</td><td style="text-align:right"><button class="btn" data-b="${i}">Choisir ${ico("fleche")}</button></td></tr>`).join("")}</tbody></table></div>`
          : encart("alerte", "<p>Cette bibliothèque n'a encore aucune banque.</p>"));
      $$("button[data-b]", zone).forEach(b => b.onclick = () => essayer(() => choisirEnligne(e.banques[+b.dataset.b].chemin)));
      return;
    }
    S.en = {etat: e, site: S.en.site || e.paquet_precedent.site || ""};
    await dessinerGuide();
  } catch (err) { zone.innerHTML = encart("erreur", `<p>${esc(err.message)}</p>`); }
}
async function dessinerGuide(paquet) {
  const e = S.en.etat, films = e.genre === "films", zone = $("#e-contenu");
  const g = await api("/api/enligne/guide", {genre: e.genre, site: S.en.site, url: paquet ? paquet.url_deballer : (S.en.paquet?.url_deballer || ""), taille: paquet ? paquet.total : e.estimation});
  if (paquet) S.en.paquet = paquet;
  const resume = films
    ? `${e.projets.length} projet(s) scanné(s) · ${nb(e.projets.reduce((s, p) => s + p.fiches, 0))} fiches · proxys faits : ${nb(e.proxys_faits)}`
    : `${nb(e.fiches)} fiches · ${nb(e.images)} images`;
  const outils = {
    1: `<div class="outil"><label class="champ">Adresse du site (elle sert à vous donner les bons liens ; rien n'est envoyé)
          <span class="ligne-champ"><input type="text" id="e-site" value="${esc(S.en.site)}" placeholder="https://${films ? "montage" : "images"}.votre-domaine.fr"><button class="btn" id="e-site-ok">Retenir</button></span></label>
          <div class="actions" style="margin-top:12px"><button class="btn discret" data-url="https://hpanel.hostinger.com/">${ico("sortie")} Ouvrir hPanel</button></div></div>`,
    2: `<div class="outil">
          <div class="reglages"><label class="coche"><input type="radio" name="e-mode" value="tout" ${e.paquet_precedent.date ? "" : "checked"}><div><b>Tout</b><span>La première fois, ou pour tout renvoyer.</span></div></label>
          <label class="coche"><input type="radio" name="e-mode" value="changes" ${e.paquet_precedent.date ? "checked" : "disabled"}><div><b>Seulement ce qui a changé</b><span>${e.paquet_precedent.date ? "Depuis le paquet du " + esc(e.paquet_precedent.date) + "." : "Pas encore de paquet précédent."}</span></div></label></div>
          ${films && !e.ffmpeg ? encart("erreur", "<p>ffmpeg est introuvable : les proxys ne peuvent pas être fabriqués.</p>") : ""}
          <div class="actions"><button class="btn principal" id="e-preparer" ${films && !e.ffmpeg ? "disabled" : ""}>${ico("cloud")} Préparer le paquet</button>
          ${S.en.paquet ? `<button class="btn" id="e-voir">${ico("dossier")} Ouvrir le dossier du paquet</button>` : ""}</div>
          <div id="e-suivi"></div><div id="e-fin">${S.en.paquet ? finPaquet(S.en.paquet) : ""}</div></div>`,
    4: S.en.paquet ? `<div class="outil"><div class="actions" style="margin:0"><button class="btn" id="e-copier">${ico("copier")} Copier l'adresse</button>${S.en.site ? `<button class="btn principal" data-url="${esc(S.en.paquet.url_deballer)}">${ico("sortie")} Ouvrir la page de déballage</button>` : '<span class="petit">Indiquez l\'adresse du site à l\'étape 2 pour avoir le lien complet.</span>'}</div></div>` : "",
    6: S.en.site ? `<div class="outil"><div class="actions" style="margin:0"><button class="btn" data-url="${esc(S.en.site)}">${ico("sortie")} Ouvrir le site</button></div></div>` : "",
  };
  zone.innerHTML = `<div class="carte" style="margin:14px 0 26px"><div class="fiche-tete"><span class="ico">${ico(films ? "film" : "image")}</span><div><h2>${esc(e.titre)}</h2><p class="petit" style="margin:0">${resume} · paquet estimé à <b>${esc(e.estimation)}</b></p></div></div></div>
    <ol class="guide">${g.etapes.map((x, i) => `<li><h2>${esc(x.titre)}</h2>${x.html}${outils[i] || ""}</li>`).join("")}</ol>`;
  $$("[data-url]", zone).forEach(b => b.onclick = () => essayer(() => api("/api/navigateur", {url: b.dataset.url})));
  $("#e-site-ok").onclick = () => { let v = $("#e-site").value.trim(); if (v && !/^https?:\/\//.test(v)) v = "https://" + v; S.en.site = v.replace(/\/+$/, ""); if (S.en.paquet && S.en.paquet.cle) S.en.paquet.url_deballer = (S.en.site || "https://<votre-site>") + "/_deballer.php?cle=" + S.en.paquet.cle; dessinerGuide(); toast("Adresse retenue."); };
  $("#e-preparer").onclick = ev => essayer(async () => {
    const changes = ($("input[name=e-mode]:checked") || {}).value === "changes";
    await api("/api/enligne/preparer", {chemin: e.racine, options: {site: S.en.site, seulement_changes: changes}});
    $("#e-preparer").disabled = true; $("#e-fin").innerHTML = "";
    suivre($("#e-suivi"), t => {
      if (t.etat !== "fini") { $("#e-fin").innerHTML = encart("erreur", `<p>${esc(t.erreur || "Arrêté. Relancer reprend là où c'était : les proxys faits ne sont jamais refaits.")}</p>`); $("#e-preparer").disabled = false; return; }
      $("#e-suivi").innerHTML = "";
      // L'état a bougé (proxys faits, paquet précédent) : on le relit.
      api("/api/enligne/etat", {chemin: e.racine}).then(n => { S.en.etat = n; }).catch(() => {})
        .then(() => dessinerGuide(t.resultat))
        .then(() => document.getElementById("e-fin")?.scrollIntoView({behavior: "smooth", block: "center"}));
    }, {journalOuvert: false});
  }, ev.currentTarget);
  if ($("#e-voir")) $("#e-voir").onclick = () => essayer(() => api("/api/explorer", {chemin: S.en.paquet.paquet}));
  if ($("#e-copier")) $("#e-copier").onclick = async () => { await navigator.clipboard.writeText(S.en.paquet.url_deballer); toast("Adresse copiée."); };
}
function finPaquet(p) {
  return `<div class="carte" style="margin-top:12px;background:var(--carte2)"><div class="resultat"><span class="grand">${ico("check")}</span><div style="min-width:0">
    <h2>Paquet prêt — ${esc(p.total)}</h2>
    <p class="petit" style="margin:2px 0 8px">Dans <code>${esc(p.paquet)}</code>${p.echecs ? ` · <span style="color:var(--erreur)">${p.echecs} proxy(s) en échec, voir le détail</span>` : ""}</p>
    <div class="tableau"><table><tbody>${p.zips.map(z => `<tr><td><code>${esc(z.nom)}</code></td><td class="n">${nb(z.fichiers)} fichiers</td><td class="n">${taille(z.octets)}</td></tr>`).join("")}
      <tr><td><code>_deballer.php</code></td><td class="n" colspan="2"><span class="faible">clé ${esc(p.cle.slice(0, 6))}…</span></td></tr></tbody></table></div></div></div></div>`;
}

// ---- mise à jour de Library Editor lui-même ---------------------------------
async function verifierMajEditeur() {
  let e;
  try { e = await api("/api/editeur/maj/etat"); } catch (err) { return; }   // hors ligne : rien
  S.majEditeur = e;
  if (!e.disponible) return;
  const b = $("#b-maj-editeur");
  b.hidden = false;
  b.innerHTML = `${ico("refresh")} Library Editor ${esc(e.version_distante)}`;
  b.onclick = () => vueMajEditeur();
}

function vueMajEditeur() {
  const e = S.majEditeur || {};
  S.vue = "majediteur";
  $$(".nav").forEach(x => x.removeAttribute("aria-current"));
  $("#vue").innerHTML = entete("Library Editor", "Mettre à jour l'application",
      "La nouvelle version est téléchargée depuis GitHub, vérifiée par son empreinte, puis mise en place quand cette application se ferme — elle se rouvre toute seule ensuite.") +
    `<div class="carte"><dl class="infos" style="margin:0">
      <dt>Version installée</dt><dd>${esc(e.version_locale || "")}</dd>
      <dt>Nouvelle version</dt><dd><b>${esc(e.version_distante || "")}</b>${e.octets ? ` <span class="faible">— ${taille(e.octets)}</span>` : ""}</dd>
      <dt>Dépôt</dt><dd><code>${esc(e.depot || "")}</code></dd>
      ${e.notes ? `<dt>Nouveautés</dt><dd>${esc(e.notes)}</dd>` : ""}
    </dl></div>
    ${e.gele === false ? encart("info", "<p>Library Editor tourne depuis ses sources : mettez-les à jour avec <code>git pull</code>.</p>") : ""}
    <div class="actions"><button class="btn discret" id="me-retour">${ico("retour")} Retour</button><span class="ressort"></span>
      <button class="btn principal" id="me-lancer" ${e.gele === false ? "disabled" : ""}>${ico("refresh")} Télécharger et installer</button></div>
    <div id="me-suivi"></div><div id="me-fin"></div>`;
  $("#me-retour").onclick = () => aller("nouvelle");
  $("#me-lancer").onclick = ev => essayer(async () => {
    await api("/api/editeur/maj/lancer");
    $("#me-lancer").disabled = true;
    suivre($("#me-suivi"), t => {
      if (t.etat !== "fini") { $("#me-fin").innerHTML = encart("erreur", `<p>${esc(t.erreur || "Arrêté.")}</p><p class="petit">Rien n'a été remplacé : la version en place continue de marcher.</p>`); $("#me-lancer").disabled = false; return; }
      $("#me-fin").innerHTML = encart("ok", `<p><b>Version ${esc(t.resultat.version)} prête.</b> Elle se mettra en place dès que cette application sera fermée, puis se rouvrira toute seule.</p>
        <div class="actions"><button class="btn principal" id="me-fermer">Fermer maintenant</button></div>`);
      $("#me-fin").querySelector("#me-fermer").onclick = () => {
        navigator.sendBeacon("/api/adieu?j=" + JETON, JETON);
        $("#me-fin").innerHTML = encart("info", "<p>Library Editor se ferme, se remplace et se rouvre. Vous pouvez fermer cette fenêtre.</p>");
      };
    });
  }, ev.currentTarget);
}

// ---- démarrage --------------------------------------------------------------
(async () => {
  await rafraichir();
  verifierMajEditeur();
  vueNouvelle();
  // Un travail tournait quand la fenêtre a été fermée : on le reprend à l'écran.
  const t = S.etat && S.etat.tache;
  if (t && t.etat === "encours") {
    $("#vue").innerHTML = entete("Travail en cours", t.titre, "Il a continué pendant que la fenêtre était fermée.") + `<div id="i-suivi"></div><div id="i-fin"></div>`;
    suivre($("#i-suivi"), x => { if (x.genre === "installation") afficherFin(x, $("#i-fin")); else $("#i-fin").innerHTML = encart(x.etat === "fini" ? "ok" : "erreur", `<p>${x.etat === "fini" ? "Terminé." : esc(x.erreur || "Arrêté.")}</p>`); });
  }
})();
</script>
